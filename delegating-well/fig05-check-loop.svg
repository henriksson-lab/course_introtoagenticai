<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <!-- criteria card -->
  <rect x="20" y="40" width="330" height="300" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="40" y="76" font-size="20" font-weight="bold" fill="#a8324a">Done when (in the brief)</text>
  <g font-size="17" fill="#333">
    <text x="40" y="116">☐ 12 participants</text>
    <text x="40" y="148">☐ 3 conditions each</text>
    <text x="40" y="180">☐ all values 150 to 1000 ms</text>
    <text x="40" y="212">☐ removed rows listed,</text>
    <text x="64" y="236">with a reason each</text>
    <text x="40" y="268">☐ table of means saved</text>
    <text x="40" y="300">☐ CSV unchanged</text>
  </g>
  <!-- loop -->
  <rect x="420" y="40" width="200" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="520" y="82" text-anchor="middle" font-size="19" fill="#333">Agent works</text>
  <rect x="420" y="170" width="200" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="520" y="200" text-anchor="middle" font-size="18" fill="#333">Agent runs</text>
  <text x="520" y="224" text-anchor="middle" font-size="18" fill="#333">your checks</text>
  <rect x="690" y="170" width="160" height="70" rx="10" fill="#f6efdc" stroke="#8a6a12" stroke-width="2"/>
  <text x="770" y="212" text-anchor="middle" font-size="18" fill="#333">Fixes, retries</text>
  <rect x="420" y="300" width="200" height="70" rx="10" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="520" y="342" text-anchor="middle" font-size="19" fill="#333">"Done"</text>
  <rect x="690" y="300" width="290" height="70" rx="10" fill="#f0ecf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="835" y="330" text-anchor="middle" font-size="18" fill="#333">You spot-check</text>
  <text x="835" y="354" text-anchor="middle" font-size="18" fill="#333">(always, still)</text>
  <line x1="520" y1="110" x2="520" y2="166" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="620" y1="205" x2="686" y2="205" stroke="#a8324a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="653" y="195" text-anchor="middle" font-size="15" fill="#a8324a">fail</text>
  <path d="M770,170 C770,90 700,75 624,75" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="520" y1="240" x2="520" y2="296" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="535" y="275" font-size="15" fill="#2a7f8f">pass</text>
  <line x1="620" y1="335" x2="686" y2="335" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="350" y1="205" x2="416" y2="205" stroke="#a8324a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a)"/>
  <text x="500" y="430" text-anchor="middle" font-size="19" fill="#333">Without criteria, the agent stops when it looks done. With them, when it passes.</text>
</svg>
