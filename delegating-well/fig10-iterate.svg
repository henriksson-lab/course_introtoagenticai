<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <g font-size="19" text-anchor="middle">
    <rect x="20" y="60" width="150" height="70" rx="10" fill="#f0ecf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="95" y="102" fill="#333">Brief</text>
    <rect x="220" y="60" width="150" height="70" rx="10" fill="#f0ecf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="295" y="102" fill="#333">Plan</text>
    <rect x="420" y="60" width="150" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="495" y="102" fill="#333">Result</text>
    <rect x="620" y="60" width="190" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="715" y="90" fill="#333">Check against</text>
    <text x="715" y="114" fill="#333">the criteria</text>
    <rect x="840" y="60" width="140" height="70" rx="10" fill="#ffffff" stroke="#2a7f8f" stroke-width="3"/>
    <text x="910" y="102" fill="#2a7f8f" font-weight="bold">Keep</text>
    <rect x="420" y="250" width="390" height="90" rx="10" fill="#f6efdc" stroke="#8a6a12" stroke-width="2"/>
    <text x="615" y="285" fill="#333">Specific correction</text>
    <text x="615" y="315" fill="#555" font-size="17">where, what, why; what to keep</text>
  </g>
  <line x1="170" y1="95" x2="216" y2="95" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="370" y1="95" x2="416" y2="95" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="570" y1="95" x2="616" y2="95" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="810" y1="95" x2="836" y2="95" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="823" y="50" text-anchor="middle" font-size="15" fill="#2a7f8f">pass</text>
  <path d="M715,130 L715,246" fill="none" stroke="#a8324a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="728" y="195" font-size="15" fill="#a8324a">fail</text>
  <path d="M495,250 L495,134" fill="none" stroke="#666" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="500" y="400" text-anchor="middle" font-size="19" fill="#333">Two or three rounds is normal. Each round should change less.</text>
</svg>
