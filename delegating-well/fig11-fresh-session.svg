<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <text x="250" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#333">Start fresh when ...</text>
  <g font-size="18" fill="#333">
    <rect x="20" y="56" width="460" height="74" rx="10" fill="#f0ecf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="40" y="88" font-weight="bold">a new, unrelated task begins</text>
    <text x="40" y="114" fill="#555">the old chat is noise for the new job</text>
    <rect x="20" y="146" width="460" height="74" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="40" y="178" font-weight="bold">two corrections have failed</text>
    <text x="40" y="204" fill="#555">a third adds to two failed attempts</text>
    <rect x="20" y="236" width="460" height="74" rx="10" fill="#f6efdc" stroke="#8a6a12" stroke-width="2"/>
    <text x="40" y="268" font-weight="bold">the session is long and forgetful</text>
    <text x="40" y="294" fill="#555">early rules lost after compaction</text>
    <rect x="20" y="326" width="460" height="74" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="40" y="358" font-weight="bold">a brief or plan is written to a file</text>
    <text x="40" y="384" fill="#555">build from the file with a clean context</text>
  </g>
  <line x1="490" y1="228" x2="560" y2="228" stroke="#666" stroke-width="3" marker-end="url(#a)"/>
  <rect x="570" y="56" width="410" height="160" rx="10" fill="#1f2933"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17">
    <text x="590" y="94" fill="#8fb3bd">Before: save what you learnt</text>
    <text x="590" y="128" fill="#ffffff">&gt; Write what we learnt and</text>
    <text x="590" y="152" fill="#ffffff">  what is still open to</text>
    <text x="590" y="176" fill="#ffffff">  notes.md.</text>
  </g>
  <g font-size="18" fill="#333">
    <rect x="570" y="236" width="410" height="80" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
    <text x="590" y="268"><tspan font-weight="bold">Claude Code:</tspan> /clear</text>
    <text x="590" y="298"><tspan font-weight="bold">Codex:</tspan> /new</text>
  </g>
  <rect x="570" y="336" width="410" height="64" rx="10" fill="#1f2933"/>
  <text x="590" y="375" font-family="Menlo, Consolas, monospace" font-size="17" fill="#ffffff">&gt; Read brief.md and notes.md ...</text>
  <text x="500" y="450" text-anchor="middle" font-size="19" fill="#333">A fresh session with a better brief beats a long one with many corrections.</text>
</svg>
