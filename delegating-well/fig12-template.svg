<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect width="700" height="600" fill="#ffffff"/>
  <rect x="20" y="20" width="660" height="560" rx="12" fill="#fbfaf6" stroke="#999" stroke-width="2"/>
  <text x="45" y="62" font-size="24" font-weight="bold" fill="#333">Brief: ______________________</text>
  <g font-size="19">
    <rect x="40" y="86" width="8" height="78" fill="#2a7f8f"/>
    <text x="62" y="108" font-weight="bold" fill="#2a7f8f">Goal</text>
    <text x="62" y="134" fill="#333">What is the result? What is it for?</text>
    <text x="62" y="158" fill="#777" font-size="17">Who will use it?</text>
    <rect x="40" y="186" width="8" height="104" fill="#6b4fa0"/>
    <text x="62" y="208" font-weight="bold" fill="#6b4fa0">Context</text>
    <text x="62" y="234" fill="#333">What can the agent not see in the files?</text>
    <text x="62" y="258" fill="#777" font-size="17">Which files to read first? What is normal?</text>
    <text x="62" y="282" fill="#777" font-size="17">Known problems?</text>
    <rect x="40" y="312" width="8" height="104" fill="#8a6a12"/>
    <text x="62" y="334" font-weight="bold" fill="#8a6a12">Constraints</text>
    <text x="62" y="360" fill="#333">Keep / tools / format / scope</text>
    <text x="62" y="384" fill="#777" font-size="17">If in doubt: list it and ask me.</text>
    <text x="62" y="408" fill="#777" font-size="17">What must never happen?</text>
    <rect x="40" y="438" width="8" height="80" fill="#a8324a"/>
    <text x="62" y="460" font-weight="bold" fill="#a8324a">Done when</text>
    <text x="62" y="486" fill="#333">Checks I can count or look at</text>
    <text x="62" y="510" fill="#777" font-size="17">Which files exist at the end?</text>
    <text x="45" y="556" fill="#333">Start: plan mode / interview me first</text>
  </g>
</svg>
