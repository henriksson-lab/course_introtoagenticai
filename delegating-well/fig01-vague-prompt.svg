<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <!-- prompt -->
  <rect x="20" y="40" width="270" height="110" rx="10" fill="#1f2933"/>
  <text x="38" y="82" font-family="Menlo, Consolas, monospace" font-size="17" fill="#ffffff">&gt; Make a nice plot</text>
  <text x="38" y="110" font-family="Menlo, Consolas, monospace" font-size="17" fill="#ffffff">  of this data.</text>
  <text x="155" y="185" text-anchor="middle" font-size="17" fill="#555">+ reaction-times.csv</text>
  <text x="155" y="210" text-anchor="middle" font-size="17" fill="#555">(12 students, 180 rows)</text>
  <!-- arrow -->
  <line x1="295" y1="120" x2="345" y2="120" stroke="#888" stroke-width="3"/>
  <polygon points="345,112 360,120 345,128" fill="#888"/>
  <!-- chart -->
  <text x="530" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a2a2a">What you get: a tidy bar chart</text>
  <line x1="400" y1="360" x2="680" y2="360" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="360" x2="400" y2="60" stroke="#333" stroke-width="2"/>
  <g font-size="15" fill="#555" text-anchor="end">
    <text x="392" y="365">0</text>
    <text x="392" y="290">100</text>
    <text x="392" y="215">200</text>
    <text x="392" y="140">300</text>
    <text x="392" y="65">400</text>
  </g>
  <!-- naive bars: scale 0.75 px per ms; base 360 -->
  <rect x="425" y="147.75" width="60" height="212.25" fill="#2a7f8f"/>
  <rect x="510" y="135" width="60" height="225" fill="#2a7f8f"/>
  <rect x="595" y="109.5" width="60" height="250.5" fill="#2a7f8f"/>
  <!-- true means dashed -->
  <rect x="425" y="131.25" width="60" height="228.75" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7,5"/>
  <rect x="510" y="117" width="60" height="243" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7,5"/>
  <rect x="595" y="85.5" width="60" height="274.5" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7,5"/>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="455" y="385">quiet</text>
    <text x="540" y="385">music</text>
    <text x="625" y="385">notification</text>
  </g>
  <text x="540" y="415" text-anchor="middle" font-size="16" fill="#555">mean reaction time (ms)</text>
  <!-- legend -->
  <rect x="405" y="430" width="18" height="14" fill="#2a7f8f"/>
  <text x="430" y="443" font-size="15" fill="#333">plotted</text>
  <rect x="505" y="430" width="18" height="14" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="530" y="443" font-size="15" fill="#333">correct</text>
  <!-- hidden problems -->
  <rect x="715" y="60" width="270" height="300" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="850" y="92" text-anchor="middle" font-size="19" font-weight="bold" fill="#a8324a">Not mentioned</text>
  <g font-size="16" fill="#333">
    <text x="732" y="130">• P07 typed seconds:</text>
    <text x="748" y="152">0.24 averaged with 300</text>
    <text x="732" y="192">• A false start (92 ms)</text>
    <text x="748" y="214">was kept</text>
    <text x="732" y="254">• A missing value was</text>
    <text x="748" y="276">dropped silently</text>
    <text x="732" y="316">• Every bar is too low</text>
  </g>
</svg>
