<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="300" y="20" width="330" height="60" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="465" y="58" font-size="21" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Claude Code checkpoints</text>
  <rect x="650" y="20" width="330" height="60" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="815" y="58" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">git</text>
  <g font-size="18" fill="#333">
    <text x="20" y="125" font-weight="bold">Made</text>
    <text x="315" y="125">automatically, every prompt</text><text x="665" y="125">when you (or the agent) commit</text>
    <text x="20" y="180" font-weight="bold">Covers</text>
    <text x="315" y="170">files Claude edited</text><text x="315" y="194" font-size="16" fill="#777">(not what other commands changed)</text>
    <text x="665" y="180">every file in the folder</text>
    <text x="20" y="245" font-weight="bold">Lasts</text>
    <text x="315" y="245">the session; cleared after ~30 days</text><text x="665" y="245">for the life of the project</text>
    <text x="20" y="305" font-weight="bold">Explains why</text>
    <text x="315" y="305">no: just your prompts</text><text x="665" y="305">yes: a message per snapshot</text>
    <text x="20" y="365" font-weight="bold">Works with</text>
    <text x="315" y="365">Claude Code only</text><text x="665" y="365">any tool, any person, GitHub</text>
    <text x="20" y="425" font-weight="bold">Best for</text>
    <text x="315" y="425" fill="#6b4fa0" font-weight="bold">"oops, go back a step"</text><text x="665" y="425" fill="#2a7f8f" font-weight="bold">the lab notebook</text>
  </g>
  <g stroke="#ddd" stroke-width="1.5">
    <line x1="20" y1="145" x2="980" y2="145"/><line x1="20" y1="210" x2="980" y2="210"/><line x1="20" y1="270" x2="980" y2="270"/><line x1="20" y1="330" x2="980" y2="330"/><line x1="20" y1="390" x2="980" y2="390"/>
  </g>
</svg>
