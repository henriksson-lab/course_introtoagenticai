<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="400" fill="#fff"/>
  <g font-size="19" text-anchor="middle">
    <rect x="30" y="140" width="170" height="100" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="115" y="183" font-weight="bold" fill="#2a7f8f">1. Commit</text><text x="115" y="212" font-size="16" fill="#333">a clean start</text>
    <rect x="270" y="140" width="190" height="100" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="365" y="183" font-weight="bold" fill="#6b4fa0">2. Agent task</text><text x="365" y="212" font-size="16" fill="#333">one job at a time</text>
    <rect x="530" y="140" width="190" height="100" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="625" y="183" font-weight="bold" fill="#8a6a12">3. Check</text><text x="625" y="212" font-size="16" fill="#333">diff + result</text>
    <rect x="790" y="60" width="180" height="100" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="880" y="103" font-weight="bold" fill="#2a7f8f">good: commit</text><text x="880" y="132" font-size="16" fill="#333">with a message</text>
    <rect x="790" y="220" width="180" height="100" rx="12" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="880" y="263" font-weight="bold" fill="#a8324a">bad: undo</text><text x="880" y="292" font-size="16" fill="#333">back to step 1</text>
  </g>
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="203" y1="190" x2="265" y2="190"/>
    <line x1="463" y1="190" x2="525" y2="190"/>
    <line x1="723" y1="175" x2="785" y2="120"/>
    <line x1="723" y1="205" x2="785" y2="260"/>
    <path d="M880,325 C880,385 115,385 115,245"/>
    <path d="M880,55 C880,10 115,10 115,135"/>
  </g>
  <text x="480" y="62" font-size="16" fill="#555" text-anchor="middle">next task starts from a known good state</text>
  <text x="560" y="318" font-size="16" fill="#555" text-anchor="middle">nothing lost: you are back where you started</text>
</svg>
