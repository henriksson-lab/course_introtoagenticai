<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="200" y="20" width="600" height="430" rx="14" fill="#fffbe9" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="62" font-size="24" font-weight="bold" fill="#8a6a12" text-anchor="middle">Every session</text>
  <g font-size="20" fill="#333">
    <rect x="235" y="90" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="111">"Is everything committed?"  (clean start)</text>
    <rect x="235" y="145" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="166">One task for the agent</text>
    <rect x="235" y="200" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="221">"What changed?"  Read the diff</text>
    <rect x="235" y="255" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="276">Check the result itself, not only the diff</text>
    <rect x="235" y="310" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="331">Good: commit with a what-and-why message</text>
    <rect x="235" y="365" width="26" height="26" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="280" y="386">Bad: undo, then say what was wrong</text>
  </g>
  <text x="500" y="432" font-size="17" fill="#777" text-anchor="middle">Repeat. The history becomes your lab notebook.</text>
</svg>
