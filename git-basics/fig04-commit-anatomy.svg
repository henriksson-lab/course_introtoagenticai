    <text x="85" y="130"><tspan font-family="Menlo, Consolas, monospace" fill="#8a6a12">3f9c2a1</tspan></text>
    <text x="85" y="175">Anna Berg  &lt;anna.berg@uni.example&gt;</text>
    <text x="85" y="220">21 Nov 2026, 14:05</text>
    <text x="85" y="268" font-weight="bold">Remove plate 7 from the growth analysis</text>
