    <line x1="625" y1="169" x2="680" y2="169" stroke="#bbb" stroke-width="1.5"/><text x="690" y="175">who</text>
    <line x1="625" y1="214" x2="680" y2="214" stroke="#bbb" stroke-width="1.5"/><text x="690" y="220">when</text>
    <line x1="625" y1="262" x2="680" y2="262" stroke="#bbb" stroke-width="1.5"/><text x="690" y="268">what, in one line</text>
    <line x1="625" y1="318" x2="680" y2="318" stroke="#bbb" stroke-width="1.5"/><text x="690" y="324">why, and what it affects</text>
    <line x1="625" y1="369" x2="680" y2="369" stroke="#bbb" stroke-width="1.5"/><text x="690" y="375">the snapshot itself</text>
