<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <rect x="60" y="40" width="560" height="360" rx="12" fill="#fafafa" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="85" y="80" font-size="22" font-weight="bold" fill="#2a7f8f">One commit</text>
