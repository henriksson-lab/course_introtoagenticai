<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="420" fill="#fff"/>
  <line x1="40" y1="330" x2="960" y2="330" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="950" y="365" font-size="18" fill="#555" text-anchor="end">time</text>
  <g font-size="17" text-anchor="middle">
    <!-- snapshot 1 -->
    <rect x="50" y="60" width="190" height="220" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="145" y="92" font-weight="bold" fill="#2a7f8f">snapshot 1</text>
    <text x="145" y="130" fill="#333">README.md</text>
    <circle cx="145" cy="330" r="11" fill="#2a7f8f"/>
    <text x="145" y="395" fill="#333">"Start project"</text>
    <!-- snapshot 2 -->
    <rect x="280" y="60" width="190" height="220" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="375" y="92" font-weight="bold" fill="#2a7f8f">snapshot 2</text>
    <text x="375" y="130" fill="#333">README.md</text>
    <text x="375" y="160" fill="#6b4fa0" font-weight="bold">clean.py</text>
    <text x="375" y="190" fill="#6b4fa0" font-weight="bold">clean.csv</text>
    <circle cx="375" cy="330" r="11" fill="#2a7f8f"/>
    <text x="375" y="395" fill="#333">"Clean the plate data"</text>
    <!-- snapshot 3 -->
    <rect x="510" y="60" width="190" height="220" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="605" y="92" font-weight="bold" fill="#2a7f8f">snapshot 3</text>
    <text x="605" y="130" fill="#333">README.md</text>
    <text x="605" y="160" fill="#6b4fa0" font-weight="bold">clean.py *</text>
    <text x="605" y="190" fill="#333">clean.csv</text>
    <text x="605" y="220" fill="#6b4fa0" font-weight="bold">plot.R</text>
    <circle cx="605" cy="330" r="11" fill="#2a7f8f"/>
    <text x="605" y="395" fill="#333">"First growth plot"</text>
    <!-- snapshot 4 -->
    <rect x="740" y="60" width="190" height="220" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="835" y="92" font-weight="bold" fill="#2a7f8f">snapshot 4</text>
    <text x="835" y="130" fill="#333">README.md *</text>
    <text x="835" y="160" fill="#333">clean.py</text>
    <text x="835" y="190" fill="#333">clean.csv</text>
    <text x="835" y="220" fill="#333">plot.R</text>
    <text x="835" y="250" fill="#6b4fa0" font-weight="bold">fig1.pdf</text>
    <circle cx="835" cy="330" r="11" fill="#2a7f8f"/>
    <text x="835" y="395" fill="#333">"Figure 1, log scale"</text>
  </g>
  <text x="40" y="30" font-size="17" fill="#777">Each commit records the whole folder.  Purple: new or changed (*) since the snapshot before.</text>
</svg>
