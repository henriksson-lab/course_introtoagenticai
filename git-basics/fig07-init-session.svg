<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="20" y="15" width="960" height="455" rx="10" fill="#1f2430"/>
  <circle cx="45" cy="37" r="7" fill="#a8324a"/><circle cx="68" cy="37" r="7" fill="#8a6a12"/><circle cx="91" cy="37" r="7" fill="#2a7f8f"/>
  <text x="500" y="43" font-size="16" fill="#aab" text-anchor="middle">terminal: soil-funding-map</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="45" y="82" fill="#8fd3df">&gt; Make this folder a git repository. First add a .gitignore</text>
    <text x="45" y="106" fill="#8fd3df">  for secrets, large data and system files. Then commit</text>
    <text x="45" y="130" fill="#8fd3df">  everything else with a message saying what is in the project.</text>
    <text x="45" y="168" fill="#9a9aa8">• git --version   →  git version 2.4x.x</text>
    <text x="45" y="194" fill="#9a9aa8">• Listed 9 files. data/raw/ holds 2 CSV files (1.2 MB).</text>
    <text x="45" y="226" fill="#e8e8e8">Plan:</text>
    <text x="45" y="252" fill="#e8e8e8">  1. git init</text>
    <text x="45" y="278" fill="#e8e8e8">  2. write .gitignore  (.env, *.key, .DS_Store, Thumbs.db, *.zip)</text>
    <text x="45" y="304" fill="#e8e8e8">  3. git add .  and check the list with git status</text>
    <text x="45" y="330" fill="#e8e8e8">  4. git commit -m "Start project: README, brief, raw data"</text>
  </g>
  <rect x="40" y="350" width="920" height="105" rx="6" fill="none" stroke="#e0b84a" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="60" y="380" fill="#e0b84a">Run this command?</text>
    <text x="60" y="408" fill="#e8e8e8">  git init</text>
    <text x="60" y="440" fill="#8fd3df">  1. Yes      2. Yes, and don't ask again      3. No</text>
  </g>
  <text x="975" y="492" font-size="14" fill="#999" text-anchor="end">illustrative; wording differs between tools and versions</text>
</svg>
