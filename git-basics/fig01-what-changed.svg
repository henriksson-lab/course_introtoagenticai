  <rect x="395" y="150" width="210" height="110" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="500" y="195" font-size="20" fill="#6b4fa0" font-weight="bold" text-anchor="middle">agent session</text>
  <text x="500" y="228" font-size="17" fill="#333" text-anchor="middle">"fix the axis label"</text>
  <line x1="345" y1="205" x2="390" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="610" y1="205" x2="655" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- right: folder after -->
  <text x="810" y="40" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">Tuesday: fig1 is wrong</text>
  <rect x="660" y="60" width="300" height="300" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <g font-size="19" fill="#333" font-family="Menlo, Consolas, monospace">
    <text x="685" y="105">README.md</text><text x="905" y="105" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
    <text x="685" y="145">clean.py</text><text x="905" y="145" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
    <text x="685" y="185">plot_growth.R</text><text x="905" y="185" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
    <text x="685" y="225">data/raw/plates.csv</text><text x="935" y="225" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
    <text x="685" y="265">results/clean.csv</text><text x="935" y="265" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
    <text x="685" y="305">results/fig1.pdf</text><text x="935" y="305" fill="#a8324a" font-family="Helvetica, Arial, sans-serif">?</text>
  </g>
  <text x="500" y="410" font-size="21" fill="#333" text-anchor="middle">Which files changed? Which lines? What did they say before?</text>
  <text x="500" y="445" font-size="19" fill="#777" text-anchor="middle">Without a record, you can only guess, or start again from a copy.</text>
