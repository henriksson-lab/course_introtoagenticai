<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="480" fill="#fff"/>
  <!-- left: folder before -->
  <text x="190" y="40" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Monday: it worked</text>
  <rect x="40" y="60" width="300" height="300" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <g font-size="19" fill="#333" font-family="Menlo, Consolas, monospace">
    <text x="65" y="105">README.md</text>
    <text x="65" y="145">clean.py</text>
    <text x="65" y="185">plot_growth.R</text>
    <text x="65" y="225">data/raw/plates.csv</text>
    <text x="65" y="265">results/clean.csv</text>
    <text x="65" y="305">results/fig1.pdf</text>
  </g>
