<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="30" y="20" width="940" height="420" rx="10" fill="#1f2328" stroke="#555" stroke-width="2"/>
  <rect x="30" y="20" width="940" height="36" rx="10" fill="#3a3f45"/>
  <circle cx="58" cy="38" r="7" fill="#a8324a"/><circle cx="82" cy="38" r="7" fill="#8a6a12"/><circle cx="106" cy="38" r="7" fill="#2a7f8f"/>
  <text x="500" y="44" font-size="16" fill="#ddd" text-anchor="middle">Terminal (a second window, not the agent)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17">
    <text x="55" y="92" fill="#ddd">$ gh auth login</text>
    <text x="55" y="126" fill="#7fd1de">? Where do you use GitHub?</text><text x="315" y="126" fill="#fff" font-weight="bold">GitHub.com</text>
    <text x="55" y="158" fill="#7fd1de">? What is your preferred protocol for Git operations?</text><text x="515" y="158" fill="#fff" font-weight="bold">HTTPS</text>
    <text x="55" y="190" fill="#7fd1de">? Authenticate Git with your GitHub credentials?</text><text x="485" y="190" fill="#fff" font-weight="bold">Yes</text>
    <text x="55" y="222" fill="#7fd1de">? How would you like to authenticate GitHub CLI?</text>
    <text x="85" y="250" fill="#fff" font-weight="bold">&gt; Login with a web browser</text>
    <text x="85" y="276" fill="#999">  Paste an authentication token</text>
    <text x="55" y="312" fill="#e8c76a">! First copy your one-time code: 4F2A-91C7</text>
    <text x="55" y="340" fill="#ddd">Press Enter to open https://github.com/login/device ...</text>
    <text x="55" y="376" fill="#7fd1a0">✓ Authentication complete.</text>
    <text x="55" y="404" fill="#7fd1a0">✓ Logged in as your-username</text>
  </g>
  <!-- annotation -->
  <rect x="770" y="225" width="190" height="60" rx="8" fill="#fff" stroke="#a8324a" stroke-width="2"/>
  <text x="865" y="250" font-size="16" fill="#a8324a" text-anchor="middle">choose the</text>
  <text x="865" y="272" font-size="16" fill="#a8324a" text-anchor="middle">browser option</text>
  <text x="965" y="462" font-size="14" fill="#999" text-anchor="end">illustrative: wording varies by gh version</text>
</svg>
