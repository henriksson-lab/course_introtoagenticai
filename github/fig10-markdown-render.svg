  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#333">
    <text x="40" y="90"># Plant growth</text>
    <text x="40" y="130">A greenhouse trial, spring 2026.</text>
    <text x="40" y="170">## Data</text>
    <text x="40" y="208">| Column    | Meaning      |</text>
    <text x="40" y="232">|-----------|--------------|</text>
    <text x="40" y="256">| plant_id  | C01 to H08   |</text>
    <text x="40" y="280">| height_cm | height in cm |</text>
    <text x="40" y="320">## How to make the figure</text>
    <text x="40" y="358">Run `scripts/plot_growth.py`.</text>
    <text x="40" y="396">**Do not** edit data/raw.</text>
  </g>
  <line x1="460" y1="245" x2="540" y2="245" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="550" y="55" width="430" height="380" rx="8" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <g fill="#333">
