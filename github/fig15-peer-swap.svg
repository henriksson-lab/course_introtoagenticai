<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#fff"/>
  <!-- A -->
  <rect x="40" y="40" width="300" height="120" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="190" y="80" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Anna's repository</text>
  <text x="190" y="110" font-size="17" fill="#333" text-anchor="middle">soil-funding-map</text>
  <text x="190" y="136" font-size="16" fill="#555" text-anchor="middle">private, Ben added</text>
  <!-- B -->
  <rect x="660" y="40" width="300" height="120" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="810" y="80" font-size="20" font-weight="bold" fill="#8a6a12" text-anchor="middle">Ben's repository</text>
  <text x="810" y="110" font-size="17" fill="#333" text-anchor="middle">course-page-cellbio</text>
  <text x="810" y="136" font-size="16" fill="#555" text-anchor="middle">private, Anna added</text>
  <!-- reviewers: each under the repository they review -->
  <rect x="40" y="290" width="300" height="120" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="190" y="328" font-size="19" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Ben + his agent</text>
  <text x="190" y="356" font-size="16" fill="#333" text-anchor="middle">a clone of Anna's repo, read only:</text>
  <text x="190" y="380" font-size="16" fill="#333" text-anchor="middle">"what is this, can I rerun it?"</text>
  <rect x="660" y="290" width="300" height="120" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="810" y="328" font-size="19" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Anna + her agent</text>
  <text x="810" y="356" font-size="16" fill="#333" text-anchor="middle">a clone of Ben's repo, read only:</text>
  <text x="810" y="380" font-size="16" fill="#333" text-anchor="middle">"what is this, can I rerun it?"</text>
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="140" y1="165" x2="140" y2="282"/>
    <line x1="760" y1="165" x2="760" y2="282"/>
  </g>
  <g font-size="17" fill="#555"><text x="60" y="230">clone</text><text x="680" y="230">clone</text></g>
  <g stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="7,5" marker-end="url(#arP)">
    <line x1="240" y1="285" x2="240" y2="168"/>
    <line x1="860" y1="285" x2="860" y2="168"/>
  </g>
  <g font-size="17" fill="#a8324a"><text x="252" y="222">one issue</text><text x="872" y="222">one issue</text></g>
  <text x="500" y="215" font-size="18" fill="#333" text-anchor="middle">swap partners:</text><text x="500" y="242" font-size="18" fill="#333" text-anchor="middle">each reviews the other</text>
  <text x="500" y="455" font-size="17" fill="#a8324a" text-anchor="middle">each reviewer files one issue: the most useful thing to fix</text>
</svg>
