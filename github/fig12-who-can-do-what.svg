<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="530" y="45" fill="#2a7f8f">You (owner)</text>
    <text x="710" y="45" fill="#6b4fa0">Collaborator</text>
    <text x="890" y="35" fill="#8a6a12">Anyone</text>
    <text x="890" y="58" font-size="15" font-weight="normal" fill="#8a6a12">(public repo only)</text>
  </g>
  <line x1="30" y1="72" x2="970" y2="72" stroke="#999" stroke-width="2"/>
  <g font-size="19" fill="#333">
    <text x="40" y="112">Read files and history, clone</text>
    <text x="40" y="167">Open and comment on issues</text>
    <text x="40" y="222">Push changes</text>
    <text x="40" y="277">Propose changes (pull request)</text>
    <text x="40" y="332">Change settings, add people</text>
    <text x="40" y="387">Delete the repository</text>
  </g>
  <g stroke="#eee" stroke-width="1.5"><line x1="30" y1="135" x2="970" y2="135"/><line x1="30" y1="190" x2="970" y2="190"/><line x1="30" y1="245" x2="970" y2="245"/><line x1="30" y1="300" x2="970" y2="300"/><line x1="30" y1="355" x2="970" y2="355"/></g>
  <g font-size="26" text-anchor="middle" font-weight="bold">
    <text x="530" y="115" fill="#2a7f8f">✓</text><text x="710" y="115" fill="#2a7f8f">✓</text><text x="890" y="115" fill="#2a7f8f">✓</text>
    <text x="530" y="170" fill="#2a7f8f">✓</text><text x="710" y="170" fill="#2a7f8f">✓</text><text x="890" y="170" fill="#2a7f8f">✓</text>
    <text x="530" y="225" fill="#2a7f8f">✓</text><text x="710" y="225" fill="#a8324a">✓</text><text x="890" y="225" fill="#999">–</text>
    <text x="530" y="280" fill="#2a7f8f">✓</text><text x="710" y="280" fill="#2a7f8f">✓</text><text x="890" y="280" fill="#2a7f8f">✓</text>
    <text x="530" y="335" fill="#2a7f8f">✓</text><text x="710" y="335" fill="#999">–</text><text x="890" y="335" fill="#999">–</text>
    <text x="530" y="390" fill="#2a7f8f">✓</text><text x="710" y="390" fill="#999">–</text><text x="890" y="390" fill="#999">–</text>
  </g>
  <rect x="655" y="195" width="110" height="45" rx="8" fill="none" stroke="#a8324a" stroke-width="2.5"/>
  <text x="500" y="428" font-size="16" fill="#a8324a" text-anchor="middle">On a personal account, a collaborator can always push: there is no read-only collaborator.</text>
</svg>
