  <!-- repo header -->
  <text x="45" y="88" font-size="22" fill="#2a7f8f">your-username / <tspan font-weight="bold">plant-growth</tspan></text>
  <rect x="420" y="68" width="80" height="28" rx="14" fill="#fff" stroke="#888"/>
  <text x="460" y="88" font-size="15" fill="#555" text-anchor="middle">Private</text>
  <g font-size="16" fill="#333">
