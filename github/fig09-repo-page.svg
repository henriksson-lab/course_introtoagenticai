  </g>
  <line x1="40" y1="138" x2="960" y2="138" stroke="#ddd" stroke-width="2"/>
  <line x1="45" y1="138" x2="122" y2="138" stroke="#a8324a" stroke-width="3"/>
  <!-- file list -->
  <rect x="45" y="155" width="620" height="210" rx="6" fill="#fff" stroke="#ccc"/>
  <rect x="45" y="155" width="620" height="34" rx="6" fill="#f4f4f4"/>
  <text x="60" y="178" font-size="15" fill="#555">your-username: Add example project</text><text x="650" y="178" font-size="15" fill="#555" text-anchor="end">1 commit</text>
  <g font-size="16" fill="#333">
    <rect x="65" y="201" width="18" height="14" rx="2" fill="#7fb3bd" stroke="#2a7f8f"/><text x="92" y="215">data</text><rect x="65" y="229" width="18" height="14" rx="2" fill="#7fb3bd" stroke="#2a7f8f"/><text x="92" y="243">notes</text><rect x="65" y="257" width="18" height="14" rx="2" fill="#7fb3bd" stroke="#2a7f8f"/><text x="92" y="271">results</text><rect x="65" y="285" width="18" height="14" rx="2" fill="#7fb3bd" stroke="#2a7f8f"/><text x="92" y="299">scripts</text><rect x="65" y="313" width="18" height="14" rx="2" fill="#fff" stroke="#2a7f8f"/><text x="92" y="327">AGENTS.md</text><rect x="65" y="341" width="18" height="14" rx="2" fill="#fff" stroke="#2a7f8f"/><text x="92" y="355">README.md</text>
  </g>
  <!-- sidebar -->
  <text x="700" y="178" font-size="17" font-weight="bold" fill="#333">About</text>
  <text x="700" y="206" font-size="15" fill="#555">No description provided</text>
  <text x="700" y="240" font-size="15" fill="#555">No licence</text>
  <!-- README -->
  <rect x="45" y="380" width="620" height="140" rx="6" fill="#fff" stroke="#ccc"/>
  <text x="60" y="404" font-size="15" fill="#555">README</text>
  <text x="60" y="440" font-size="22" font-weight="bold" fill="#333">Plant growth under three fertiliser levels</text>
  <text x="60" y="472" font-size="15" fill="#333">A small greenhouse trial (spring 2026). Does nitrogen</text>
  <text x="60" y="494" font-size="15" fill="#333">fertiliser change how fast young bean plants grow?</text>
  <!-- annotations -->
  <g font-size="16" fill="#a8324a">
    <rect x="410" y="62" width="100" height="40" rx="8" fill="none" stroke="#a8324a" stroke-width="2.5"/>
    <text x="700" y="300">files, as in your folder</text>
    <line x1="695" y1="295" x2="672" y2="270" stroke="#a8324a" stroke-width="2"/>
    <text x="700" y="440">README.md, shown as</text>
    <text x="700" y="462">a formatted page</text>
    <line x1="695" y1="448" x2="668" y2="448" stroke="#a8324a" stroke-width="2"/>
