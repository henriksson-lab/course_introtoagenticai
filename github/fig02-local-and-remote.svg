<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="480" fill="#fff"/>
  <!-- cloud box -->
  <rect x="330" y="30" width="340" height="150" rx="20" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="500" y="70" font-size="22" font-weight="bold" fill="#6b4fa0" text-anchor="middle">GitHub</text>
  <text x="500" y="102" font-size="18" fill="#333" text-anchor="middle">github.com/you/plant-growth</text>
  <text x="500" y="132" font-size="17" fill="#555" text-anchor="middle">a copy of the repository,</text>
  <text x="500" y="156" font-size="17" fill="#555" text-anchor="middle">with the whole history</text>
  <!-- your computer -->
  <rect x="60" y="300" width="300" height="130" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="210" y="340" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">your computer</text>
  <text x="210" y="372" font-size="17" fill="#333" text-anchor="middle">plant-growth/ (git repository)</text>
  <text x="210" y="400" font-size="17" fill="#555" text-anchor="middle">you and your agent work here</text>
  <!-- other computer -->
  <rect x="640" y="300" width="300" height="130" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="790" y="340" font-size="20" font-weight="bold" fill="#8a6a12" text-anchor="middle">another computer</text>
  <text x="790" y="372" font-size="17" fill="#333" text-anchor="middle">your laptop at home, or</text>
  <text x="790" y="400" font-size="17" fill="#333" text-anchor="middle">a colleague's (a clone)</text>
  <!-- arrows -->
  <g stroke-width="3" fill="none">
    <line x1="230" y1="292" x2="370" y2="190" stroke="#2a7f8f" marker-end="url(#ar)"/>
    <line x1="400" y1="190" x2="270" y2="290" stroke="#555" stroke-dasharray="7,5" marker-end="url(#ar)"/>
    <line x1="630" y1="190" x2="760" y2="292" stroke="#555" stroke-dasharray="7,5" marker-end="url(#ar)"/>
    <line x1="730" y1="290" x2="600" y2="190" stroke="#8a6a12" marker-end="url(#ar)"/>
  </g>
  <text x="235" y="225" font-size="19" font-weight="bold" fill="#2a7f8f">push</text>
  <text x="330" y="270" font-size="19" fill="#555">pull</text>
  <text x="590" y="270" font-size="19" fill="#555">pull / clone</text>
  <text x="720" y="225" font-size="19" font-weight="bold" fill="#8a6a12">push</text>
</svg>
