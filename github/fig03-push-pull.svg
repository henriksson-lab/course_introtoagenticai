<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#fff"/>
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#333">Before push</text>
  <text x="40" y="95" font-size="18" fill="#2a7f8f">your computer</text>
  <text x="40" y="165" font-size="18" fill="#6b4fa0">GitHub</text>
  <g stroke="#999" stroke-width="3"><line x1="200" y1="90" x2="560" y2="90"/><line x1="200" y1="160" x2="380" y2="160"/></g>
  <g stroke-width="2.5">
    <circle cx="200" cy="90" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="290" cy="90" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="380" cy="90" r="16" fill="#e3f0f2" stroke="#2a7f8f"/>
    <circle cx="470" cy="90" r="16" fill="#2a7f8f" stroke="#2a7f8f"/><circle cx="560" cy="90" r="16" fill="#2a7f8f" stroke="#2a7f8f"/>
    <circle cx="200" cy="160" r="16" fill="#f1edf7" stroke="#6b4fa0"/><circle cx="290" cy="160" r="16" fill="#f1edf7" stroke="#6b4fa0"/><circle cx="380" cy="160" r="16" fill="#f1edf7" stroke="#6b4fa0"/>
  </g>
  <text x="600" y="96" font-size="17" fill="#2a7f8f">2 new commits, only on your computer</text>
  <text x="420" y="166" font-size="17" fill="#6b4fa0">GitHub does not know about them yet</text>

  <line x1="40" y1="215" x2="960" y2="215" stroke="#ddd" stroke-width="2"/>
  <text x="40" y="260" font-size="20" font-weight="bold" fill="#333">After git push</text>
  <text x="40" y="310" font-size="18" fill="#2a7f8f">your computer</text>
  <text x="40" y="380" font-size="18" fill="#6b4fa0">GitHub</text>
  <g stroke="#999" stroke-width="3"><line x1="200" y1="305" x2="560" y2="305"/><line x1="200" y1="375" x2="560" y2="375"/></g>
  <g stroke-width="2.5">
    <circle cx="200" cy="305" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="290" cy="305" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="380" cy="305" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="470" cy="305" r="16" fill="#e3f0f2" stroke="#2a7f8f"/><circle cx="560" cy="305" r="16" fill="#e3f0f2" stroke="#2a7f8f"/>
    <circle cx="200" cy="375" r="16" fill="#f1edf7" stroke="#6b4fa0"/><circle cx="290" cy="375" r="16" fill="#f1edf7" stroke="#6b4fa0"/><circle cx="380" cy="375" r="16" fill="#f1edf7" stroke="#6b4fa0"/><circle cx="470" cy="375" r="16" fill="#6b4fa0" stroke="#6b4fa0"/><circle cx="560" cy="375" r="16" fill="#6b4fa0" stroke="#6b4fa0"/>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)"><line x1="470" y1="325" x2="470" y2="352"/><line x1="560" y1="325" x2="560" y2="352"/></g>
  <text x="600" y="345" font-size="17" fill="#333">same history in both places.</text>
  <text x="600" y="372" font-size="17" fill="#333">git pull does the same in the other direction.</text>
</svg>
