<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <line x1="100" y1="120" x2="880" y2="120" stroke="#999" stroke-width="3"/>
  <g stroke-width="2.5">
    <circle cx="100" cy="120" r="18" fill="#e3f0f2" stroke="#2a7f8f"/>
    <circle cx="360" cy="120" r="18" fill="#f8e9ec" stroke="#a8324a"/>
    <circle cx="620" cy="120" r="18" fill="#e3f0f2" stroke="#2a7f8f"/>
    <circle cx="880" cy="120" r="18" fill="#e3f0f2" stroke="#2a7f8f"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#333">
    <text x="100" y="70">1  first snapshot</text>
    <text x="360" y="60" fill="#a8324a" font-weight="bold">2  add notes/</text>
    <text x="360" y="84" fill="#a8324a">(contacts.txt inside)</text>
    <text x="620" y="70">3  new figure</text>
    <text x="880" y="60">4  delete</text>
    <text x="880" y="84">contacts.txt</text>
  </g>
  <rect x="250" y="180" width="220" height="80" rx="8" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="360" y="212" font-size="17" fill="#a8324a" text-anchor="middle" font-weight="bold">contacts.txt</text>
  <text x="360" y="240" font-size="16" fill="#333" text-anchor="middle">names, e-mails, phones</text>
  <line x1="360" y1="140" x2="360" y2="178" stroke="#a8324a" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="720" y="180" width="240" height="80" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
  <text x="840" y="212" font-size="17" fill="#555" text-anchor="middle">today's files:</text>
  <text x="840" y="240" font-size="16" fill="#555" text-anchor="middle">no contacts.txt</text>
  <text x="500" y="330" font-size="21" fill="#333" text-anchor="middle">Deleting a file removes it from the newest snapshot only.</text>
  <text x="500" y="365" font-size="21" fill="#a8324a" text-anchor="middle" font-weight="bold">Make the repository public, and snapshot 2 is public too.</text>
</svg>
