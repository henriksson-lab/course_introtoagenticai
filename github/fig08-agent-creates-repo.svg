<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="30" y="20" width="940" height="450" rx="10" fill="#1f2328" stroke="#555" stroke-width="2"/>
  <rect x="30" y="20" width="940" height="36" rx="10" fill="#3a3f45"/>
  <circle cx="58" cy="38" r="7" fill="#a8324a"/><circle cx="82" cy="38" r="7" fill="#8a6a12"/><circle cx="106" cy="38" r="7" fill="#2a7f8f"/>
  <text x="500" y="44" font-size="16" fill="#ddd" text-anchor="middle">agent session in ~/agentic-course/plant-growth</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17">
    <text x="55" y="92" fill="#fff">&gt; Put this project on GitHub as a private repository</text>
    <text x="55" y="116" fill="#fff">  called plant-growth, and push all commits.</text>
    <text x="55" y="156" fill="#ccc">● I checked: gh is logged in, the folder is a git</text>
    <text x="55" y="180" fill="#ccc">  repository with 1 commit and nothing uncommitted.</text>
    <rect x="50" y="205" width="900" height="200" rx="6" fill="none" stroke="#e8c76a" stroke-width="2"/>
    <text x="70" y="235" fill="#e8c76a">Bash command</text>
    <text x="70" y="268" fill="#fff">gh repo create plant-growth --private --source=. --push</text>
    <text x="70" y="296" fill="#999">Create a private GitHub repository and push the commits</text>
    <text x="70" y="334" fill="#fff">Do you want to proceed?</text>
    <text x="70" y="362" fill="#7fd1de">&gt; 1. Yes</text>
    <text x="300" y="362" fill="#ccc">2. Yes, and don't ask again</text>
    <text x="680" y="362" fill="#ccc">3. No</text>
  </g>
  
  <g font-size="16">
    <rect x="600" y="418" width="350" height="40" rx="6" fill="#fff" stroke="#a8324a" stroke-width="2"/>
    <text x="775" y="444" fill="#a8324a" text-anchor="middle">check: --private, and the right name</text>
  </g>
  <text x="965" y="492" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
