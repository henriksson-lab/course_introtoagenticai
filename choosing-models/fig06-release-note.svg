<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="20" y="15" width="600" height="430" rx="8" fill="#fff" stroke="#999" stroke-width="2"/>
  <rect x="20" y="15" width="600" height="34" rx="8" fill="#e6e6e6"/><rect x="20" y="38" width="600" height="11" fill="#e6e6e6"/>
  <text x="40" y="38" font-size="15" fill="#555">Release notes: a new model (example)</text>
  <g font-size="16" fill="#333">
    <text x="40" y="82" font-size="21" font-weight="bold">Introducing Model X 3</text>
    <text x="40" y="108" fill="#666">Our most capable model yet, available today.</text>
    <text x="40" y="146">Context window: 1M tokens. Max output: 128K.</text>
    <text x="40" y="176">Training data up to: March 2026.</text>
    <text x="40" y="206">Effort levels: low, medium, high, max.</text>
    <rect x="40" y="226" width="560" height="120" fill="#f5f5f5"/>
    <text x="56" y="252" font-weight="bold">Benchmark</text><text x="250" y="252" font-weight="bold">X 3 (max)</text><text x="380" y="252" font-weight="bold">X 2.5</text><text x="480" y="252" font-weight="bold">Rival Y</text>
    <text x="56" y="280">Test A</text><text x="250" y="280">96.8 %</text><text x="380" y="280">94.1 %</text><text x="480" y="280">95.0 %</text>
    <text x="56" y="306">Test B</text><text x="250" y="306">71.2 %</text><text x="380" y="306">63.0 %</text><text x="480" y="306">69.5 %</text>
    <text x="56" y="332">Test C</text><text x="250" y="332">48.3 %</text><text x="380" y="332">39.9 %</text><text x="480" y="332">44.1 %</text>
    <text x="40" y="380">Model X 2 retires: not sooner than 1 March 2027.</text>
    <text x="40" y="410" fill="#666">Available in the app, the API and the coding tool.</text>
  </g>
  <g font-size="16">
    <rect x="640" y="125" width="345" height="60" rx="8" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="655" y="150" fill="#2a7f8f" font-weight="bold">how much fits; how recent</text>
    <text x="655" y="172" fill="#333">its knowledge is (cut-off)</text>
    <rect x="640" y="200" width="345" height="60" rx="8" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="655" y="225" fill="#a8324a" font-weight="bold">scores at "max" effort</text>
    <text x="655" y="247" fill="#333">you may run it at medium</text>
    <rect x="640" y="275" width="345" height="78" rx="8" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="655" y="300" fill="#a8324a" font-weight="bold">which tests, which rival?</text>
    <text x="655" y="322" fill="#333">chosen by the provider; test A</text>
    <text x="655" y="344" fill="#333">is saturated (all near 95 %)</text>
    <rect x="640" y="365" width="345" height="50" rx="8" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="655" y="396" fill="#8a6a12" font-weight="bold">plan your switch</text>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <line x1="460" y1="160" x2="638" y2="155"/><line x1="600" y1="262" x2="638" y2="232"/>
    <line x1="602" y1="300" x2="638" y2="310"/><line x1="470" y1="376" x2="638" y2="390"/>
  </g>
  <text x="985" y="462" font-size="14" fill="#999" text-anchor="end">illustrative: a made-up model and made-up numbers</text>
</svg>
