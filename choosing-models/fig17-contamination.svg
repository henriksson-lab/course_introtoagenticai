<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#a8324a"/></marker></defs>
  <g font-size="17">
    <rect x="20" y="20" width="300" height="300" rx="12" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
    <text x="40" y="56" font-size="20" font-weight="bold" fill="#a8324a">1. Leakage</text>
    <rect x="45" y="80" width="110" height="60" rx="6" fill="#fff" stroke="#888"/><text x="100" y="106" text-anchor="middle" fill="#333">test</text><text x="100" y="128" text-anchor="middle" fill="#333">questions</text>
    <rect x="185" y="80" width="110" height="60" rx="6" fill="#fff" stroke="#888"/><text x="240" y="106" text-anchor="middle" fill="#333">training</text><text x="240" y="128" text-anchor="middle" fill="#333">data</text>
    <line x1="157" y1="110" x2="181" y2="110" stroke="#a8324a" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="40" y="180" fill="#333">If the questions or answers</text>
    <text x="40" y="204" fill="#333">are online, a high score may</text>
    <text x="40" y="228" fill="#333">partly be memory.</text>
    <text x="40" y="270" fill="#666">Defence: hidden or fresh</text>
    <text x="40" y="294" fill="#666">questions; independent runs</text>
    <rect x="350" y="20" width="300" height="300" rx="12" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
    <text x="370" y="56" font-size="20" font-weight="bold" fill="#8a6a12">2. Selection</text>
    <g fill="#333"><text x="375" y="96">Test A</text><text x="375" y="122">Test B</text><text x="375" y="148" fill="#bbb">Test C</text><text x="375" y="174" fill="#bbb">Test D</text></g>
    <g fill="#8a6a12"><text x="520" y="96">shown</text><text x="520" y="122">shown</text></g>
    <g fill="#bbb"><text x="520" y="148">not shown</text><text x="520" y="174">not shown</text></g>
    <text x="370" y="220" fill="#333">Launch posts show the tests,</text>
    <text x="370" y="244" fill="#333">settings and rivals where the</text>
    <text x="370" y="268" fill="#333">new model looks best.</text>
    <text x="370" y="300" fill="#666">Defence: independent sources</text>
    <rect x="680" y="20" width="300" height="300" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
    <text x="700" y="56" font-size="20" font-weight="bold" fill="#2a7f8f">3. Not your task</text>
    <text x="700" y="96" fill="#333">Benchmarks: clear answers,</text>
    <text x="700" y="120" fill="#333">tidy inputs, someone else's</text>
    <text x="700" y="144" fill="#333">field.</text>
    <text x="700" y="184" fill="#333">Your task: your data, your</text>
    <text x="700" y="208" fill="#333">criteria, your traps.</text>
    <text x="700" y="270" fill="#666">Defence: a small test on</text>
    <text x="700" y="294" fill="#666">your own task</text>
  </g>
  <text x="500" y="370" font-size="19" text-anchor="middle" fill="#333">A score is evidence about one test under one set of conditions, not about "intelligence".</text>
</svg>
