    <text x="680" y="80" font-weight="bold">How METR does it</text>
    <text x="680" y="112">1. Time skilled people on each task.</text>
    <text x="680" y="140">2. Run the model on every task:</text>
    <text x="700" y="166"><tspan fill="#2a7f8f">●</tspan> success  <tspan fill="#a8324a">●</tspan> failure</text>
    <text x="680" y="194">3. Fit a curve of success</text>
    <text x="700" y="218">against task length.</text>
