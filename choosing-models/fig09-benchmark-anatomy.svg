<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <g font-size="17">
    <rect x="20" y="40" width="250" height="200" rx="10" fill="#f5f5f5" stroke="#888"/>
    <text x="40" y="72" font-weight="bold" fill="#333">fixed test set</text>
    <text x="40" y="104" fill="#333">Q1 … answer B</text>
    <text x="40" y="130" fill="#333">Q2 … answer 42</text>
    <text x="40" y="156" fill="#333">Q3 … bug fixed?</text>
    <text x="40" y="182" fill="#333">…</text>
    <text x="40" y="214" fill="#333">Q198 … answer D</text>
    <rect x="370" y="80" width="220" height="120" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
    <text x="480" y="125" text-anchor="middle" font-weight="bold" fill="#2a7f8f">model</text>
    <text x="480" y="155" text-anchor="middle" fill="#333">answers each</text>
    <text x="480" y="178" text-anchor="middle" fill="#333">question</text>
    <rect x="690" y="80" width="280" height="120" rx="10" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
    <text x="830" y="125" text-anchor="middle" font-weight="bold" fill="#8a6a12">graded automatically</text>
    <text x="830" y="168" text-anchor="middle" font-size="30" fill="#333">83 %</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#a)"><line x1="272" y1="140" x2="366" y2="140"/><line x1="592" y1="140" x2="686" y2="140"/></g>
  <text x="20" y="290" font-size="18" font-weight="bold" fill="#a8324a">The small print that changes the number:</text>
  <g font-size="17" fill="#333">
    <text x="20" y="322">• which version of the test, and which subset</text>
    <text x="20" y="350">• thinking effort; tools allowed; number of attempts</text>
    <text x="520" y="322">• who ran it: the provider, or an independent group</text>
    <text x="520" y="350">• whether the questions are public (and maybe learnt)</text>
  </g>
</svg>
