<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e3f1f3"/><stop offset="1" stop-color="#6b4fa0"/></linearGradient></defs>
  <rect x="60" y="60" width="880" height="34" rx="17" fill="url(#g)"/>
  <g font-size="18" text-anchor="middle" fill="#333">
    <text x="100" y="125">low</text><text x="300" y="125">medium</text><text x="500" y="125">high</text><text x="700" y="125">extra high</text><text x="900" y="125">max</text>
  </g>
  <text x="60" y="40" font-size="18" fill="#666">thinking effort (names differ between tools and models)</text>
  <g font-size="17">
    <rect x="60" y="160" width="400" height="150" rx="10" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="80" y="192" font-weight="bold" fill="#2a7f8f">Low effort is enough for</text>
    <text x="80" y="222" fill="#333">renaming, reformatting, moving files</text>
    <text x="80" y="250" fill="#333">extracting the same field many times</text>
    <text x="80" y="278" fill="#333">short questions with an obvious answer</text>
    <rect x="540" y="160" width="400" height="150" rx="10" fill="#eeeaf5" stroke="#6b4fa0"/>
    <text x="560" y="192" font-weight="bold" fill="#6b4fa0">High effort pays off for</text>
    <text x="560" y="222" fill="#333">study design and analysis plans</text>
    <text x="560" y="250" fill="#333">debugging with several possible causes</text>
    <text x="560" y="278" fill="#333">reviewing code or a manuscript for errors</text>
  </g>
  <text x="500" y="355" font-size="18" text-anchor="middle" fill="#333">More effort: slower, uses more of your limits, fewer mistakes on hard problems. Not zero mistakes.</text>
</svg>
