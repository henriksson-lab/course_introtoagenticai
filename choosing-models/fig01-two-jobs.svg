<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <rect x="20" y="20" width="460" height="300" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="45" y="60" font-size="22" font-weight="bold" fill="#2a7f8f">Job A: a bulk chore</text>
  <g font-size="18" fill="#333">
    <text x="45" y="98">Rename 400 microscope images</text>
    <text x="45" y="124">from a metadata sheet; log every rename.</text>
    <text x="45" y="168">• the same simple step, 400 times</text>
    <text x="45" y="196">• easy to check: count, sample 10</text>
    <text x="45" y="224">• a mistake is visible and undoable</text>
  </g>
  <g fill="#2a7f8f" opacity="0.8">
    <rect x="45" y="250" width="22" height="28" rx="2"/><rect x="72" y="250" width="22" height="28" rx="2"/><rect x="99" y="250" width="22" height="28" rx="2"/><rect x="126" y="250" width="22" height="28" rx="2"/><rect x="153" y="250" width="22" height="28" rx="2"/><rect x="180" y="250" width="22" height="28" rx="2"/><rect x="207" y="250" width="22" height="28" rx="2"/><rect x="234" y="250" width="22" height="28" rx="2"/>
  </g>
  <text x="268" y="271" font-size="18" fill="#2a7f8f">… × 400</text>
  <rect x="520" y="20" width="460" height="300" rx="12" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <text x="545" y="60" font-size="22" font-weight="bold" fill="#6b4fa0">Job B: hard thinking</text>
  <g font-size="18" fill="#333">
    <text x="545" y="98">Design the analysis plan for a grant:</text>
    <text x="545" y="124">mixed model, power, missing data.</text>
    <text x="545" y="168">• many steps and traps</text>
    <text x="545" y="196">• hard to check: wrong ideas look fine</text>
    <text x="545" y="224">• a mistake is costly and found late</text>
  </g>
  <text x="545" y="275" font-size="30" fill="#6b4fa0">y ~ treatment + (1 | site)</text>
  <text x="500" y="365" font-size="21" text-anchor="middle" fill="#333">Largest model at maximum effort for both? Smallest for both? Or different models?</text>
</svg>
