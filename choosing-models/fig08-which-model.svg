<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <line x1="80" y1="370" x2="940" y2="370" stroke="#555" stroke-width="2"/><path d="M940,362 L954,370 L940,378 Z" fill="#555"/>
  <line x1="80" y1="370" x2="80" y2="30" stroke="#555" stroke-width="2"/><path d="M72,30 L80,16 L88,30 Z" fill="#555"/>
  <text x="510" y="405" font-size="18" text-anchor="middle" fill="#333">how hard is it to check the result? (easy → hard)</text>
  <text x="40" y="200" font-size="18" text-anchor="middle" fill="#333" transform="rotate(-90 40 200)">how many steps, how many traps?</text>
  <rect x="100" y="210" width="380" height="145" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="120" y="244" font-size="19" font-weight="bold" fill="#2a7f8f">smaller tier, low effort</text>
  <text x="120" y="274" font-size="17" fill="#333">rename 400 files, convert formats,</text>
  <text x="120" y="298" font-size="17" fill="#333">extract one field from many files</text>
  <text x="120" y="330" font-size="16" fill="#666">check: counts and a random sample</text>
  <rect x="540" y="40" width="390" height="150" rx="12" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <text x="560" y="74" font-size="19" font-weight="bold" fill="#6b4fa0">largest tier, high effort</text>
  <text x="560" y="104" font-size="17" fill="#333">analysis plan, subtle debugging,</text>
  <text x="560" y="128" font-size="17" fill="#333">review of code or a manuscript</text>
  <text x="560" y="160" font-size="16" fill="#666">plus: a second model as reviewer</text>
  <rect x="100" y="40" width="380" height="150" rx="12" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="120" y="74" font-size="19" font-weight="bold" fill="#8a6a12">plan big, execute small</text>
  <text x="120" y="104" font-size="17" fill="#333">large model writes the plan,</text>
  <text x="120" y="128" font-size="17" fill="#333">smaller model carries it out</text>
  <text x="120" y="160" font-size="16" fill="#666">e.g. Claude Code's opusplan</text>
  <rect x="540" y="210" width="390" height="145" rx="12" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="560" y="244" font-size="19" font-weight="bold" fill="#333">default model, default effort</text>
  <text x="560" y="274" font-size="17" fill="#333">most everyday work;</text>
  <text x="560" y="298" font-size="17" fill="#333">change only with a reason</text>
  <text x="560" y="330" font-size="16" fill="#666">and write the change in your log</text>
</svg>
