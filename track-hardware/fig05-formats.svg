<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<rect x="30" y="30" width="440" height="410" rx="10" fill="#f8e6ea" stroke="#a8324a" stroke-width="2"/>
<text x="250.0" y="240.7" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold"></text>
<text x="250" y="70" font-size="21" fill="#a8324a" text-anchor="middle" font-weight="bold">Closed vendor format</text>
<rect x="170" y="95" width="160" height="70" rx="6" fill="#fff" stroke="#a8324a" stroke-width="2"/>
<text x="250" y="137" font-size="18" fill="#a8324a" text-anchor="middle" font-weight="bold">image.xyz</text>
<text x="60" y="210" font-size="18" fill="#1b2a3a" text-anchor="start">- only the vendor app opens it fully</text>
<text x="60" y="242" font-size="18" fill="#1b2a3a" text-anchor="start">- undocumented; may change with</text>
<text x="72" y="274" font-size="18" fill="#1b2a3a" text-anchor="start">the next software version</text>
<text x="60" y="306" font-size="18" fill="#1b2a3a" text-anchor="start">- metadata lost on export</text>
<text x="60" y="338" font-size="18" fill="#1b2a3a" text-anchor="start">- in 15 years: can anyone read it?</text>
<rect x="530" y="30" width="440" height="410" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="750.0" y="240.7" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold"></text>
<text x="750" y="70" font-size="21" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Open, documented format</text>
<rect x="670" y="95" width="160" height="70" rx="6" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
<text x="750" y="137" font-size="18" fill="#2a7f8f" text-anchor="middle" font-weight="bold">image.ome.zarr</text>
<text x="560" y="210" font-size="18" fill="#1b2a3a" text-anchor="start">- public specification (OME-NGFF)</text>
<text x="560" y="242" font-size="18" fill="#1b2a3a" text-anchor="start">- many tools: Fiji, napari, Python, R</text>
<text x="560" y="274" font-size="18" fill="#1b2a3a" text-anchor="start">- chunked: works for terabytes</text>
<text x="572" y="306" font-size="18" fill="#1b2a3a" text-anchor="start">and in cloud storage</text>
<text x="560" y="338" font-size="18" fill="#1b2a3a" text-anchor="start">- metadata travels with the data</text>
</svg>
