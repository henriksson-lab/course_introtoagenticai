<line x1="205" y1="130" x2="295" y2="130" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#a9037)" marker-start="url(#a9037)"/>
<rect x="70" y="300" width="380" height="120" rx="10" fill="#fff" stroke="#8a6a12" stroke-width="2"/>
<text x="260" y="332" font-size="18" fill="#8a6a12" text-anchor="middle" font-weight="bold">Vendor cloud, EU data centre</text>
<text x="260" y="360" font-size="17" fill="#1b2a3a" text-anchor="middle">run by a US company</text>
<text x="260" y="386" font-size="16" fill="#1b2a3a" text-anchor="middle">(licence check, remote service,</text>
<text x="260" y="408" font-size="16" fill="#1b2a3a" text-anchor="middle">"analysis in the cloud")</text>
<defs><marker id="a5258" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a12"/></marker></defs>
<line x1="370" y1="205" x2="300" y2="295" stroke="#8a6a12" stroke-width="2.5" marker-end="url(#a5258)"/>
<text x="345" y="255" font-size="16" fill="#8a6a12" text-anchor="start">uploads</text>
<rect x="560" y="300" width="400" height="120" rx="10" fill="#f8e6ea" stroke="#a8324a" stroke-width="2"/>
<text x="760" y="334" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold">US authorities</text>
<text x="760" y="362" font-size="16" fill="#1b2a3a" text-anchor="middle">CLOUD Act (2018): a US provider</text>
<text x="760" y="384" font-size="16" fill="#1b2a3a" text-anchor="middle">must disclose data in its control,</text>
<text x="760" y="406" font-size="16" fill="#1b2a3a" text-anchor="middle">wherever it is stored</text>
<defs><marker id="a3198" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker></defs>
<line x1="555" y1="360" x2="456" y2="360" stroke="#a8324a" stroke-width="3" marker-end="url(#a3198)"/>
<text x="508" y="340" font-size="16" fill="#a8324a" text-anchor="middle">order</text>
<rect x="560" y="90" width="400" height="150" rx="10" fill="#fff" stroke="#8a97a5" stroke-width="2"/>
<text x="580" y="122" font-size="17" fill="#1b2a3a" text-anchor="start">Also on the instrument PC:</text>
<text x="580" y="144" font-size="17" fill="#1b2a3a" text-anchor="start">- vendor remote-access tools</text>
<text x="580" y="166" font-size="17" fill="#1b2a3a" text-anchor="start">- old operating system, no updates</text>
<text x="580" y="188" font-size="17" fill="#1b2a3a" text-anchor="start">- telemetry you cannot inspect</text>
