<circle cx="158" cy="114" r="7" fill="#2a7f8f" stroke="none" stroke-width="2"/>
<text x="120.0" y="194" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Instrument</text>
<rect x="300" y="90" width="140" height="80" rx="6" fill="#eef1f4" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="358.0" y="170" width="24" height="14" rx="0" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
