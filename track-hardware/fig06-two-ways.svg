<rect x="119.0" y="154" width="72" height="6" rx="2" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<text x="155.0" y="96.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">vendor app</text>
