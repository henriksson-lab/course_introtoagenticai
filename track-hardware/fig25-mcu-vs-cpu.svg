<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="440" fill="#ffffff"/>
<rect x="30" y="30" width="450" height="380" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="255.0" y="225.7" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold"></text>
<text x="255" y="68" font-size="20" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Your computer's processor</text>
<text x="55" y="110" font-size="18" fill="#1b2a3a" text-anchor="start">- x86-64 or ARM64, 64-bit</text>
<text x="55" y="150" font-size="18" fill="#1b2a3a" text-anchor="start">- gigabytes of memory</text>
<text x="55" y="190" font-size="18" fill="#1b2a3a" text-anchor="start">- an operating system</text>
<text x="55" y="230" font-size="18" fill="#1b2a3a" text-anchor="start">- any language: Python, Rust, ...</text>
<text x="55" y="270" font-size="18" fill="#1b2a3a" text-anchor="start">- the agent knows it very well</text>
<rect x="520" y="30" width="450" height="380" rx="10" fill="#f8e6ea" stroke="#a8324a" stroke-width="2"/>
<text x="745.0" y="225.7" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold"></text>
<text x="745" y="68" font-size="20" fill="#a8324a" text-anchor="middle" font-weight="bold">The instrument's microcontroller</text>
<text x="545" y="110" font-size="18" fill="#1b2a3a" text-anchor="start">- many instruction sets (8051, AVR,</text>
<text x="557" y="150" font-size="18" fill="#1b2a3a" text-anchor="start">ARM Cortex-M, ...), 8/16/32-bit</text>
<text x="545" y="190" font-size="18" fill="#1b2a3a" text-anchor="start">- a few kilobytes of memory</text>
<text x="545" y="230" font-size="18" fill="#1b2a3a" text-anchor="start">- often no operating system</text>
<text x="545" y="270" font-size="18" fill="#1b2a3a" text-anchor="start">- special C dialects and toolchains</text>
<text x="545" y="310" font-size="18" fill="#1b2a3a" text-anchor="start">- the agent knows it less well, and</text>
<text x="557" y="350" font-size="18" fill="#1b2a3a" text-anchor="start">a mistake can brick the device</text>
</svg>
