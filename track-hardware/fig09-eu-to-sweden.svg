<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<rect x="60" y="30" width="380" height="100" rx="10" fill="#eef2fb" stroke="#3355aa" stroke-width="2"/>
<text x="250.0" y="74.2" font-size="19" fill="#3355aa" text-anchor="middle" font-weight="bold">Software Directive</text>
<text x="250.0" y="97.2" font-size="18" fill="#1b2a3a" text-anchor="middle">2009/24/EC, Art. 5(3), 6, 8</text>
<rect x="560" y="30" width="380" height="100" rx="10" fill="#eef2fb" stroke="#3355aa" stroke-width="2"/>
<text x="750.0" y="74.2" font-size="19" fill="#3355aa" text-anchor="middle" font-weight="bold">Trade Secrets Directive</text>
<text x="750.0" y="97.2" font-size="18" fill="#1b2a3a" text-anchor="middle">(EU) 2016/943, Art. 3(1)(b)</text>
<defs><marker id="a1607" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3355aa"/></marker></defs>
<line x1="250" y1="135" x2="250" y2="200" stroke="#3355aa" stroke-width="2.5" marker-end="url(#a1607)"/>
<defs><marker id="a1607" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3355aa"/></marker></defs>
<line x1="750" y1="135" x2="750" y2="200" stroke="#3355aa" stroke-width="2.5" marker-end="url(#a1607)"/>
<text x="500" y="175" font-size="17" fill="#3355aa" text-anchor="middle">implemented in Swedish law</text>
<rect x="30" y="205" width="440" height="140" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="250.0" y="247.7" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Upphovsrättslagen (1960:729)</text>
<text x="250.0" y="269.7" font-size="17" fill="#1b2a3a" text-anchor="middle">26 g § 4 st: observe, study, test</text>
<text x="250.0" y="291.7" font-size="17" fill="#1b2a3a" text-anchor="middle">26 h §: decompile for interoperability</text>
<text x="250.0" y="313.7" font-size="17" fill="#1b2a3a" text-anchor="middle">contract terms limiting these are void</text>
<rect x="530" y="205" width="440" height="140" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="750.0" y="247.7" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Lagen om företagshemligheter</text>
<text x="750.0" y="269.7" font-size="17" fill="#1b2a3a" text-anchor="middle">(2018:558), 4 §: only unauthorised</text>
<text x="750.0" y="291.7" font-size="17" fill="#1b2a3a" text-anchor="middle">acts are covered; the bill says reverse</text>
<text x="750.0" y="313.7" font-size="17" fill="#1b2a3a" text-anchor="middle">engineering a lawful product is not one</text>
<rect x="150" y="380" width="700" height="66" rx="10" fill="#fff" stroke="#1b2a3a" stroke-width="2"/>
<text x="500" y="408" font-size="17" fill="#1b2a3a" text-anchor="middle">Swedish courts read these in line with the directives;</text>
<text x="500" y="432" font-size="17" fill="#1b2a3a" text-anchor="middle">the EU Court of Justice interprets the directives</text>
</svg>
