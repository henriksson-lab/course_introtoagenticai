<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="500" fill="#ffffff"/>
<rect x="30" y="30" width="450" height="440" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="255.0" y="255.7" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold"></text>
<text x="255" y="70" font-size="22" fill="#2a7f8f" text-anchor="middle" font-weight="bold">You</text>
<text x="55" y="112" font-size="18" fill="#1b2a3a" text-anchor="start">- decide it is lawful, and say why</text>
<text x="55" y="150" font-size="18" fill="#1b2a3a" text-anchor="start">- ask the vendor first</text>
<text x="55" y="188" font-size="18" fill="#1b2a3a" text-anchor="start">- run the instrument and say what</text>
<text x="67" y="226" font-size="18" fill="#1b2a3a" text-anchor="start">you are doing</text>
<text x="55" y="264" font-size="18" fill="#1b2a3a" text-anchor="start">- choose what is safe to test</text>
<text x="55" y="302" font-size="18" fill="#1b2a3a" text-anchor="start">- sit at the hardware for the tests</text>
<text x="55" y="340" font-size="18" fill="#1b2a3a" text-anchor="start">- judge: does the instrument do</text>
<text x="67" y="378" font-size="18" fill="#1b2a3a" text-anchor="start">what the driver says?</text>
<rect x="520" y="30" width="450" height="440" rx="10" fill="#efe9f7" stroke="#6b4fa0" stroke-width="2"/>
<text x="745.0" y="255.7" font-size="19" fill="#6b4fa0" text-anchor="middle" font-weight="bold"></text>
<text x="745" y="70" font-size="22" fill="#6b4fa0" text-anchor="middle" font-weight="bold">The agent</text>
<text x="545" y="112" font-size="18" fill="#1b2a3a" text-anchor="start">- installs and drives the tools</text>
<text x="557" y="150" font-size="18" fill="#1b2a3a" text-anchor="start">(recorder, Ghidra, Wireshark)</text>
<text x="545" y="188" font-size="18" fill="#1b2a3a" text-anchor="start">- sorts thousands of packets</text>
<text x="545" y="226" font-size="18" fill="#1b2a3a" text-anchor="start">- writes helper code to find patterns</text>
<text x="545" y="264" font-size="18" fill="#1b2a3a" text-anchor="start">- proposes a protocol spec</text>
<text x="545" y="302" font-size="18" fill="#1b2a3a" text-anchor="start">- writes the driver and tests</text>
<text x="545" y="340" font-size="18" fill="#1b2a3a" text-anchor="start">- checks the driver against the logs</text>
<text x="545" y="378" font-size="18" fill="#1b2a3a" text-anchor="start">- documents what is known and not</text>
</svg>
