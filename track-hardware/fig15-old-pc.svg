<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="470" fill="#ffffff"/>
<rect x="60" y="120" width="170" height="110" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2.5"/>
<rect x="72" y="132" width="76.5" height="35.2" rx="3" fill="#eef1f4" stroke="#6b4fa0" stroke-width="1.5"/>
<rect x="72" y="204" width="146" height="12" rx="3" fill="#eef1f4" stroke="#6b4fa0" stroke-width="1.5"/>
<circle cx="208" cy="144" r="7" fill="#6b4fa0" stroke="none" stroke-width="2"/>
<text x="145.0" y="254" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Plate reader (2012)</text>
<rect x="380" y="110" width="200" height="120" rx="6" fill="#eef1f4" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="468.0" y="230" width="24" height="14" rx="0" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<rect x="444.0" y="244" width="72" height="6" rx="2" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<text x="480" y="160" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold">vendor app</text>
<text x="480" y="186" font-size="16" fill="#a8324a" text-anchor="middle" font-weight="bold">Windows 7 only</text>
<defs><marker id="a994" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker></defs>
<line x1="240" y1="170" x2="372" y2="170" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#a994)" marker-start="url(#a994)"/>
<text x="306" y="158" font-size="16" fill="#6b4fa0" text-anchor="middle" font-weight="bold">USB</text>
<rect x="660" y="40" width="310" height="380" rx="10" fill="#f8e6ea" stroke="#a8324a" stroke-width="2"/>
<text x="815.0" y="235.7" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold"></text>
<text x="680" y="76" font-size="20" fill="#a8324a" text-anchor="start" font-weight="bold">The problems</text>
<text x="680" y="112" font-size="18" fill="#1b2a3a" text-anchor="start">- PC has no security updates</text>
<text x="680" y="146" font-size="18" fill="#1b2a3a" text-anchor="start">- not allowed on the network</text>
<text x="680" y="180" font-size="18" fill="#1b2a3a" text-anchor="start">- results leave on a USB stick</text>
<text x="680" y="214" font-size="18" fill="#1b2a3a" text-anchor="start">- cannot be run from a script</text>
<text x="692" y="248" font-size="18" fill="#1b2a3a" text-anchor="start">or combined with the robot</text>
<text x="680" y="282" font-size="18" fill="#1b2a3a" text-anchor="start">- vendor: no new software for</text>
<text x="692" y="316" font-size="18" fill="#1b2a3a" text-anchor="start">this model; no protocol</text>
<text x="692" y="350" font-size="18" fill="#1b2a3a" text-anchor="start">documentation</text>
<text x="320" y="330" font-size="18" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Goal: an open driver, so the</text>
<text x="320" y="356" font-size="18" fill="#2a7f8f" text-anchor="middle" font-weight="bold">reader runs from a script on</text>
<text x="320" y="382" font-size="18" fill="#2a7f8f" text-anchor="middle" font-weight="bold">any computer</text>
</svg>
