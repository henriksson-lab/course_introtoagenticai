<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="480" fill="#ffffff"/>
<rect x="30" y="20" width="450" height="440" rx="14" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
<text x="255" y="56" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Case 1: firmware stays in the device</text>
<rect x="60" y="90" width="130" height="70" rx="6" fill="#eef1f4" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="113.0" y="160" width="24" height="14" rx="0" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<rect x="89.0" y="174" width="72" height="6" rx="2" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<text x="125.0" y="131.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">computer</text>
<rect x="320" y="85" width="130" height="85" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
<rect x="340" y="125" width="90" height="34" rx="4" fill="#eef1f4" stroke="#2a7f8f" stroke-width="1.5"/>
<text x="385" y="147" font-size="15" fill="#2a7f8f" text-anchor="middle" font-weight="bold">chip</text>
<text x="385" y="112" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">device</text>
<defs><marker id="a9162" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<line x1="200" y1="125" x2="315" y2="125" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a9162)"/>
<text x="258" y="115" font-size="15" fill="#1b2a3a" text-anchor="middle">commands</text>
<text x="60" y="250" font-size="18" fill="#1b2a3a" text-anchor="start">Firmware is stored in flash</text>
<text x="60" y="280" font-size="18" fill="#1b2a3a" text-anchor="start">memory inside the instrument</text>
<text x="60" y="310" font-size="18" fill="#1b2a3a" text-anchor="start"></text>
<text x="60" y="340" font-size="18" fill="#1b2a3a" text-anchor="start">Your driver only sends commands</text>
<text x="255" y="420" font-size="20" fill="#2a7f8f" text-anchor="middle" font-weight="bold">No firmware problem</text>
<rect x="520" y="20" width="450" height="440" rx="14" fill="#f8e6ea" stroke="#a8324a" stroke-width="2"/>
<text x="745" y="56" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold">Case 2: firmware is uploaded at start</text>
<rect x="550" y="90" width="130" height="70" rx="6" fill="#eef1f4" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="603.0" y="160" width="24" height="14" rx="0" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<rect x="579.0" y="174" width="72" height="6" rx="2" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="0"/>
<text x="615.0" y="131.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">computer</text>
<rect x="810" y="85" width="130" height="85" rx="8" fill="#fff" stroke="#a8324a" stroke-width="2.5"/>
<rect x="830" y="125" width="90" height="34" rx="4" fill="#eef1f4" stroke="#a8324a" stroke-width="1.5"/>
<text x="875" y="147" font-size="15" fill="#a8324a" text-anchor="middle" font-weight="bold">chip</text>
<text x="875" y="112" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">device</text>
<defs><marker id="a3198" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker></defs>
<line x1="690" y1="115" x2="805" y2="115" stroke="#a8324a" stroke-width="2.5" marker-end="url(#a3198)"/>
<text x="748" y="105" font-size="15" fill="#a8324a" text-anchor="middle" font-weight="bold">firmware</text>
<defs><marker id="a9162" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<line x1="690" y1="145" x2="805" y2="145" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a9162)"/>
<text x="748" y="168" font-size="15" fill="#1b2a3a" text-anchor="middle">commands</text>
<text x="550" y="250" font-size="18" fill="#1b2a3a" text-anchor="start">1. The vendor driver loads</text>
<text x="550" y="280" font-size="18" fill="#1b2a3a" text-anchor="start">2. It uploads firmware to the device</text>
<text x="550" y="310" font-size="18" fill="#1b2a3a" text-anchor="start">3. Only then can the device be used</text>
<text x="550" y="340" font-size="18" fill="#1b2a3a" text-anchor="start">Your driver must upload firmware too</text>
<text x="745" y="420" font-size="20" fill="#a8324a" text-anchor="middle" font-weight="bold">Copyright problem</text>
</svg>
