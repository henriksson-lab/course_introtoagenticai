<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 464" width="1000" height="464" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="464" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="428" rx="16" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
  <text x="44" y="56" font-size="20" font-weight="bold" fill="#a8324a">Your whole user account</text>
  <text x="44" y="82" font-size="16" fill="#1b2a3a">email, browser passwords, SSH keys, cloud-synced drives, every other project</text>
  <rect x="80" y="104" width="860" height="320" rx="14" fill="#faf5e8" stroke="#8a6a12" stroke-width="2"/>
  <text x="104" y="138" font-size="20" font-weight="bold" fill="#8a6a12">Home folder</text>
  <text x="104" y="162" font-size="16" fill="#1b2a3a">Documents, Downloads, Desktop</text>
  <text x="916" y="138" text-anchor="end" font-size="17" font-weight="bold" fill="#a8324a">never start the agent here</text>
  <rect x="140" y="186" width="760" height="214" rx="12" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/>
  <text x="164" y="218" font-size="19" font-weight="bold" fill="#3a4a5a">Course folder</text>
  <rect x="220" y="240" width="600" height="142" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="3"/>
  <text x="520" y="284" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7f8f">One project folder</text>
  <text x="520" y="316" text-anchor="middle" font-size="18" fill="#1b2a3a">start the agent here, with copies of the data</text>
  <text x="520" y="344" text-anchor="middle" font-size="16" fill="#3a4a5a">its file tools ask before going outside;</text>
  <text x="520" y="366" text-anchor="middle" font-size="16" fill="#3a4a5a">a command you approve can reach anywhere</text>
</svg>
