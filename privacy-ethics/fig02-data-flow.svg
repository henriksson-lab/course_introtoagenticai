<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- local computer -->
  <rect x="20" y="30" width="390" height="330" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="215" y="62" text-anchor="middle" font-size="21" font-weight="bold" fill="#2a7f8f">Your computer</text>
  <rect x="45" y="85" width="160" height="200" rx="8" fill="#ffffff" stroke="#9aa8b5"/>
  <text x="125" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">project/</text>
  <g font-size="16" fill="#3a4a5a">
    <text x="60" y="146">data.csv</text>
    <text x="60" y="176">notes.docx</text>
    <text x="60" y="206">paper.pdf</text>
    <text x="60" y="236">plot.R</text>
  </g>
  <rect x="230" y="120" width="160" height="110" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <text x="310" y="152" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">The agent</text>
  <text x="310" y="178" text-anchor="middle" font-size="16" fill="#3a4a5a">Claude Code</text>
  <text x="310" y="200" text-anchor="middle" font-size="16" fill="#3a4a5a">or Codex</text>
  <line x1="207" y1="175" x2="226" y2="175" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="215" y="325" text-anchor="middle" font-size="16" fill="#2a7f8f">Files the agent never reads stay here.</text>
  <!-- cloud -->
  <rect x="610" y="30" width="370" height="330" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="795" y="62" text-anchor="middle" font-size="21" font-weight="bold" fill="#6b4fa0">Provider's servers</text>
  <text x="795" y="88" text-anchor="middle" font-size="16" fill="#3a4a5a">(Anthropic or OpenAI)</text>
  <rect x="680" y="120" width="230" height="110" rx="8" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="795" y="165" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">The model</text>
  <text x="795" y="192" text-anchor="middle" font-size="16" fill="#3a4a5a">reads, decides the</text>
  <text x="795" y="212" text-anchor="middle" font-size="16" fill="#3a4a5a">next step</text>
  <text x="795" y="282" text-anchor="middle" font-size="16" fill="#3a4a5a">Kept for a period; may be used</text>
  <text x="795" y="304" text-anchor="middle" font-size="16" fill="#3a4a5a">for training, depending on</text>
  <text x="795" y="326" text-anchor="middle" font-size="16" fill="#3a4a5a">your plan and settings</text>
  <!-- arrows -->
  <line x1="392" y1="150" x2="674" y2="150" stroke="#a8324a" stroke-width="3" marker-end="url(#a)"/>
  <text x="533" y="92" text-anchor="middle" font-size="16" fill="#a8324a" font-weight="bold">your prompt</text>
  <text x="533" y="114" text-anchor="middle" font-size="16" fill="#a8324a" font-weight="bold">+ every file it reads</text>
    <line x1="676" y1="205" x2="396" y2="205" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="533" y="232" text-anchor="middle" font-size="16" fill="#1b2a3a">reply and next action</text>
  <text x="533" y="136" text-anchor="middle" font-size="16" fill="#a8324a" font-weight="bold">+ command output</text>
  <text x="500" y="405" text-anchor="middle" font-size="19" fill="#1b2a3a">The program runs locally. The thinking happens on someone else's computer.</text>
</svg>
