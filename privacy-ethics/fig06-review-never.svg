<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#9aa8b5"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- document -->
  <path d="M60,40 L230,40 L270,80 L270,300 L60,300 Z" fill="#ffffff" stroke="#6b4fa0" stroke-width="2.5"/>
  <path d="M230,40 L230,80 L270,80" fill="none" stroke="#6b4fa0" stroke-width="2"/>
  <text x="165" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Proposal</text>
  <text x="165" y="134" text-anchor="middle" font-size="15" fill="#3a4a5a">sent to you</text>
  <text x="165" y="154" text-anchor="middle" font-size="15" fill="#3a4a5a">for review</text>
  <g stroke="#dfe6ec" stroke-width="6"><line x1="85" y1="185" x2="245" y2="185"/><line x1="85" y1="205" x2="245" y2="205"/><line x1="85" y1="225" x2="220" y2="225"/></g>
  <rect x="88" y="248" width="154" height="32" rx="4" fill="none" stroke="#a8324a" stroke-width="2"/>
  <text x="165" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#a8324a">CONFIDENTIAL</text>
  <!-- arrow and X -->
  <line x1="290" y1="170" x2="470" y2="170" stroke="#9aa8b5" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <g stroke="#a8324a" stroke-width="9" stroke-linecap="round"><line x1="355" y1="135" x2="405" y2="205"/><line x1="405" y1="135" x2="355" y2="205"/></g>
  <!-- cloud -->
  <path d="M520,215 C480,215 480,160 520,158 C520,118 580,108 600,140 C620,105 690,115 685,160 C725,160 725,215 685,215 Z" fill="#f3f0f8" stroke="#9aa8b5" stroke-width="2"/>
  <text x="600" y="190" text-anchor="middle" font-size="17" fill="#3a4a5a">any AI service</text>
  <!-- rules -->
  <g font-size="17" fill="#1b2a3a">
    <text x="760" y="70" font-weight="bold">NIH</text>
    <text x="760" y="94">prohibits generative AI</text>
    <text x="760" y="116">in peer review</text>
    <text x="760" y="166" font-weight="bold">ERC</text>
    <text x="760" y="190">no part of a proposal</text>
    <text x="760" y="212">into an external AI system</text>
    <text x="760" y="262" font-weight="bold">Swedish Research Council</text>
    <text x="760" y="286">no generative AI in the</text>
    <text x="760" y="308">scientific assessment</text>
  </g>
  <text x="500" y="370" text-anchor="middle" font-size="19" fill="#a8324a" font-weight="bold">The same holds for manuscripts you review for a journal: check its reviewer policy.</text>
</svg>
