<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- Claude panel -->
  <rect x="20" y="20" width="470" height="320" rx="10" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="44" y="58" font-size="20" font-weight="bold" fill="#1b2a3a">Claude account</text>
  <text x="44" y="88" font-size="16" fill="#3a4a5a">Settings › Privacy</text>
  <rect x="44" y="110" width="422" height="96" rx="8" fill="#ffffff" stroke="#dfe6ec"/>
  <text x="62" y="142" font-size="17" fill="#1b2a3a">Allow your chats and coding</text>
  <text x="62" y="166" font-size="17" fill="#1b2a3a">sessions to train models</text>
  <rect x="384" y="138" width="62" height="32" rx="16" fill="#c9d3dd"/>
  <circle cx="402" cy="154" r="13" fill="#ffffff"/>
  <text x="415" y="194" text-anchor="middle" font-size="14" fill="#3a4a5a">off</text>
  <text x="44" y="246" font-size="16" fill="#3a4a5a">Direct link:</text>
  <text x="44" y="270" font-size="16" fill="#2a7f8f">claude.ai/settings/data-privacy-controls</text>
  <text x="44" y="310" font-size="15" fill="#8a97a5">Covers Claude Code on Pro and Max too.</text>
  <!-- ChatGPT panel -->
  <rect x="510" y="20" width="470" height="320" rx="10" fill="#f4f7fa" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="534" y="58" font-size="20" font-weight="bold" fill="#1b2a3a">ChatGPT account</text>
  <text x="534" y="88" font-size="16" fill="#3a4a5a">Settings › Data controls</text>
  <rect x="534" y="110" width="422" height="96" rx="8" fill="#ffffff" stroke="#dfe6ec"/>
  <text x="552" y="142" font-size="17" fill="#1b2a3a">Improve the model</text>
  <text x="552" y="166" font-size="17" fill="#1b2a3a">for everyone</text>
  <rect x="874" y="138" width="62" height="32" rx="16" fill="#c9d3dd"/>
  <circle cx="892" cy="154" r="13" fill="#ffffff"/>
  <text x="905" y="194" text-anchor="middle" font-size="14" fill="#3a4a5a">off</text>
  <text x="534" y="246" font-size="16" fill="#3a4a5a">Same switch covers Codex on</text>
  <text x="534" y="270" font-size="16" fill="#3a4a5a">personal plans.</text>
  <text x="534" y="310" font-size="15" fill="#8a97a5">On by default for Free, Plus and Pro.</text>
  <text x="500" y="378" text-anchor="middle" font-size="18" fill="#1b2a3a">Turning training off is good practice. It does not make personal data allowed.</text>
  <text x="980" y="396" text-anchor="end" font-size="13" fill="#8a97a5">illustrative: labels and menus change</text>
</svg>
