<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="60" y="20" width="760" height="76" rx="10" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="84" y="54" font-size="20" font-weight="bold" fill="#6b4fa0">The law</text>
  <text x="84" y="80" font-size="17" fill="#1b2a3a">GDPR, national data protection and archive law, the EU AI Act</text>
  <rect x="110" y="110" width="710" height="76" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="134" y="144" font-size="20" font-weight="bold" fill="#2a7f8f">Your university</text>
  <text x="134" y="170" font-size="17" fill="#1b2a3a">AI policy, list of approved tools, contracts with providers</text>
  <rect x="160" y="200" width="660" height="76" rx="10" fill="#faf5e8" stroke="#8a6a12" stroke-width="2"/>
  <text x="184" y="234" font-size="20" font-weight="bold" fill="#8a6a12">Agreements for this data</text>
  <text x="184" y="260" font-size="17" fill="#1b2a3a">Ethics approval, consent forms, data use agreements, NDAs, funder rules</text>
  <rect x="210" y="290" width="610" height="76" rx="10" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
  <text x="234" y="324" font-size="20" font-weight="bold" fill="#1b2a3a">You, for this file, today</text>
  <text x="234" y="350" font-size="17" fill="#1b2a3a">Do I need the data? Is less enough? Would the people in it be surprised?</text>
  <line x1="880" y1="30" x2="880" y2="356" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="905" y="180" font-size="17" fill="#1b2a3a">each</text>
  <text x="905" y="202" font-size="17" fill="#1b2a3a">layer</text>
  <text x="905" y="224" font-size="17" fill="#1b2a3a">may only</text>
  <text x="905" y="246" font-size="17" fill="#1b2a3a">be stricter</text>
  <text x="500" y="405" text-anchor="middle" font-size="17" fill="#3a4a5a">Unsure at any layer? Ask your data protection officer or IT before, not after.</text>
</svg>
