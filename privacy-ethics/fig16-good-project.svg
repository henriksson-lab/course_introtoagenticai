<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="280" fill="#ffffff"/>
  <g>
    <rect x="20" y="30" width="180" height="190" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
    <text x="110" y="76" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a7f8f">Real</text>
    <text x="110" y="118" text-anchor="middle" font-size="16" fill="#1b2a3a">something your</text>
    <text x="110" y="140" text-anchor="middle" font-size="16" fill="#1b2a3a">job needs, not</text>
    <text x="110" y="162" text-anchor="middle" font-size="16" fill="#1b2a3a">a toy</text>
  </g>
  <g>
    <rect x="215" y="30" width="180" height="190" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
    <text x="305" y="76" text-anchor="middle" font-size="24" font-weight="bold" fill="#6b4fa0">Small</text>
    <text x="305" y="118" text-anchor="middle" font-size="16" fill="#1b2a3a">a first useful</text>
    <text x="305" y="140" text-anchor="middle" font-size="16" fill="#1b2a3a">result within a</text>
    <text x="305" y="162" text-anchor="middle" font-size="16" fill="#1b2a3a">few sessions</text>
  </g>
  <g>
    <rect x="410" y="30" width="180" height="190" rx="12" fill="#faf5e8" stroke="#8a6a12" stroke-width="2"/>
    <text x="500" y="76" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a6a12">Yours</text>
    <text x="500" y="118" text-anchor="middle" font-size="16" fill="#1b2a3a">your field, so you</text>
    <text x="500" y="140" text-anchor="middle" font-size="16" fill="#1b2a3a">can tell a right</text>
    <text x="500" y="162" text-anchor="middle" font-size="16" fill="#1b2a3a">answer from a</text>
    <text x="500" y="184" text-anchor="middle" font-size="16" fill="#1b2a3a">wrong one</text>
  </g>
  <g>
    <rect x="605" y="30" width="180" height="190" rx="12" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
    <text x="695" y="76" text-anchor="middle" font-size="24" font-weight="bold" fill="#a8324a">Safe</text>
    <text x="695" y="118" text-anchor="middle" font-size="16" fill="#1b2a3a">data you may</text>
    <text x="695" y="140" text-anchor="middle" font-size="16" fill="#1b2a3a">give to the agent,</text>
    <text x="695" y="162" text-anchor="middle" font-size="16" fill="#1b2a3a">or a stand-in</text>
  </g>
  <g>
    <rect x="800" y="30" width="180" height="190" rx="12" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
    <text x="890" y="76" text-anchor="middle" font-size="24" font-weight="bold" fill="#1b2a3a">Checkable</text>
    <text x="890" y="118" text-anchor="middle" font-size="16" fill="#1b2a3a">you know how</text>
    <text x="890" y="140" text-anchor="middle" font-size="16" fill="#1b2a3a">you would verify</text>
    <text x="890" y="162" text-anchor="middle" font-size="16" fill="#1b2a3a">the result</text>
  </g>
  <text x="500" y="258" text-anchor="middle" font-size="19" fill="#1b2a3a">You can change project later. Pick one that passes all five today.</text>
</svg>
