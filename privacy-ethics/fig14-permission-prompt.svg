<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <rect x="20" y="16" width="700" height="380" rx="10" fill="#1f2933"/>
  <g font-family="Courier New, monospace" font-size="18">
    <rect x="44" y="40" width="652" height="332" rx="8" fill="#26333f" stroke="#e0c27a" stroke-width="2"/>
    <text x="66" y="78" fill="#e0c27a" font-weight="bold">Bash command</text>
    <rect x="66" y="96" width="520" height="40" rx="4" fill="#1f2933"/>
    <text x="80" y="123" fill="#ffffff">rm -rf results/old</text>
    <text x="66" y="168" fill="#cfd6dc">Remove the old results folder</text>
    <text x="66" y="210" fill="#ffffff">Do you want to proceed?</text>
    <text x="66" y="248" fill="#ffffff">❯ 1. Yes</text>
    <text x="90" y="284" fill="#cfd6dc">2. Yes, and don't ask again for: rm *</text>
    <text x="90" y="320" fill="#cfd6dc">3. No</text>
  </g>
  <rect x="80" y="262" width="560" height="32" rx="4" fill="none" stroke="#a8324a" stroke-width="3"/>
  <text x="710" y="386" text-anchor="end" font-size="14" fill="#8a97a5">illustrative; wording varies by version</text>
  <!-- notes -->
  <g font-size="17" fill="#1b2a3a">
    <text x="745" y="70" font-weight="bold" fill="#2a7f8f">Option 1</text>
    <text x="745" y="94">this command, once</text>
    <text x="745" y="150" font-weight="bold" fill="#a8324a">Option 2</text>
    <text x="745" y="174">every future rm in</text>
    <text x="745" y="196">this project, in every</text>
    <text x="745" y="218">future session, without</text>
    <text x="745" y="240">asking again</text>
    <text x="745" y="296" font-weight="bold" fill="#1b2a3a">Option 3</text>
    <text x="745" y="320">then tell it what to</text>
    <text x="745" y="342">do instead</text>
  </g>
  <text x="500" y="440" text-anchor="middle" font-size="19" fill="#a8324a" font-weight="bold">"Don't ask again" is fine for harmless commands. Never for rm, never for everything.</text>
</svg>
