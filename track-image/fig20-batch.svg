    <rect x="45" y="149" width="44" height="44" fill="#222"/><rect x="99" y="149" width="44" height="44" fill="#222"/><rect x="153" y="149" width="44" height="44" fill="#222"/><rect x="207" y="149" width="44" height="44" fill="#222"/>
