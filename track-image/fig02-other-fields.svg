<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <!-- plate with colonies -->
  <circle cx="165" cy="160" r="120" fill="#f3ead2" stroke="#999" stroke-width="3"/>
  <g fill="#e8d9a8" stroke="#b39a52" stroke-width="1.5">
    <circle cx="120" cy="110" r="12"/><circle cx="180" cy="95" r="9"/><circle cx="215" cy="140" r="14"/><circle cx="140" cy="170" r="10"/>
    <circle cx="100" cy="200" r="13"/><circle cx="190" cy="210" r="11"/><circle cx="230" cy="190" r="8"/><circle cx="160" cy="240" r="12"/>
    <circle cx="85" cy="140" r="7"/><circle cx="250" cy="120" r="9"/><circle cx="125" cy="235" r="9"/><circle cx="212" cy="235" r="10"/><circle cx="222" cy="226" r="9"/>
  </g>
  <!-- particles -->
  <rect x="375" y="40" width="240" height="240" fill="#4a4a4a"/>
  <g fill="#cfcfcf">
    <polygon points="400,70 430,60 445,85 420,100"/><polygon points="480,75 520,70 515,110 485,105"/><polygon points="560,60 590,80 575,110 550,95"/>
    <polygon points="395,150 425,140 440,170 410,185"/><polygon points="470,140 500,150 495,180 465,175"/><polygon points="540,150 585,140 595,175 550,185"/>
    <polygon points="410,220 450,215 455,255 415,260"/><polygon points="490,225 525,215 535,250 500,260"/><polygon points="565,220 600,230 590,265 560,255"/>
    <circle cx="455" cy="120" r="6"/><circle cx="530" cy="200" r="5"/>
  </g>
  <!-- nuclei -->
  <rect x="705" y="40" width="240" height="240" fill="#151515"/>
  <g fill="#9fd3dc">
    <ellipse cx="750" cy="80" rx="18" ry="14"/><ellipse cx="820" cy="95" rx="16" ry="13"/><ellipse cx="900" cy="75" rx="15" ry="15"/>
    <ellipse cx="760" cy="160" rx="17" ry="13"/><ellipse cx="788" cy="168" rx="15" ry="13"/><ellipse cx="870" cy="160" rx="18" ry="14"/>
    <ellipse cx="740" cy="240" rx="15" ry="12"/><ellipse cx="830" cy="235" rx="17" ry="15"/><ellipse cx="910" cy="230" rx="14" ry="13"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="165" y="320">colonies on a plate</text><text x="495" y="320">particles in a material</text><text x="825" y="320">nuclei in cells</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#555">
    <text x="165" y="350">microbiology, food science</text><text x="495" y="350">materials, geology, soil</text><text x="825" y="350">cell biology, pathology</text>
  </g>
  <text x="500" y="390" font-size="18" text-anchor="middle" fill="#2a7f8f">same steps: find the objects, count them, measure size and brightness</text>
</svg>
