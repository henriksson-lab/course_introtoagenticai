<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <rect x="20" y="20" width="960" height="380" rx="14" fill="#f7f7f7" stroke="#bbb" stroke-width="2"/>
  <text x="40" y="55" font-size="19" fill="#555">your computer: Python itself, installed once</text>
  <rect x="50" y="80" width="420" height="295" rx="12" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
  <text x="70" y="115" font-family="Menlo, Consolas, monospace" font-size="19" fill="#2a7f8f" font-weight="bold">nuclei-project/</text>
  <rect x="80" y="135" width="360" height="160" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="100" y="165" font-family="Menlo, Consolas, monospace" font-size="18" fill="#333">.venv/</text>
  <g font-size="17" fill="#333">
    <text x="120" y="197">scikit-image</text><text x="290" y="197">numpy</text>
    <text x="120" y="227">pandas</text><text x="290" y="227">matplotlib</text>
    <text x="120" y="257">tifffile</text>
  </g>
  <text x="100" y="283" font-size="15" fill="#777">packages for this project only</text>
  <text x="100" y="330" font-family="Menlo, Consolas, monospace" font-size="17" fill="#333">requirements.txt</text>
  <text x="100" y="358" font-family="Menlo, Consolas, monospace" font-size="17" fill="#333">count_nuclei.py</text>
  <g font-size="19" fill="#333">
    <text x="510" y="115" font-weight="bold">What you need to know</text>
    <text x="510" y="155">A "virtual environment" is a folder</text>
    <text x="510" y="181">(.venv) with this project's packages.</text>
    <text x="510" y="225">Other projects cannot break it.</text>
    <text x="510" y="269">requirements.txt lists the packages</text>
    <text x="510" y="295">and versions: a colleague can rebuild it.</text>
    <text x="510" y="339">The agent creates and uses it. You only</text>
    <text x="510" y="365">check that it did, and do not delete it.</text>
  </g>
</svg>
