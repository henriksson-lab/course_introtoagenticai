  <text x="500" y="168" font-size="17" text-anchor="middle" fill="#333">reads, never writes back</text>
  <rect x="720" y="50" width="260" height="200" rx="12" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
  <text x="740" y="88" font-family="Menlo, Consolas, monospace" font-size="19" fill="#a8324a" font-weight="bold">results/</text>
