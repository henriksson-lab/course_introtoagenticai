  <line x1="282" y1="150" x2="367" y2="150" stroke="#777" stroke-width="3" marker-end="url(#a)"/>
  <line x1="632" y1="150" x2="717" y2="150" stroke="#777" stroke-width="3" marker-end="url(#a)"/>
  <path d="M500,212 C500,300 160,310 150,255" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <g stroke="#a8324a" stroke-width="5"><line x1="310" y1="280" x2="340" y2="310"/><line x1="340" y1="280" x2="310" y2="310"/></g>
  <text x="500" y="345" font-size="18" text-anchor="middle" fill="#a8324a">never: "brightened", cropped or converted copies saved over the originals</text>
