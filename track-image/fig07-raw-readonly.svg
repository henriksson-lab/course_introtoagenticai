    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker>
  </defs>
  <rect x="20" y="50" width="260" height="200" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="40" y="88" font-family="Menlo, Consolas, monospace" font-size="19" fill="#2a7f8f" font-weight="bold">data/raw/</text>
  <rect x="230" y="62" width="30" height="24" rx="3" fill="#2a7f8f"/><path d="M237,62 v-8 a8,8 0 0 1 16,0 v8" fill="none" stroke="#2a7f8f" stroke-width="3"/>
  <g font-size="17" fill="#333"><text x="40" y="125">.tif files as they came</text><text x="40" y="152">from the microscope</text><text x="40" y="195">read-only</text><text x="40" y="222">backed up elsewhere</text></g>
  <rect x="370" y="90" width="260" height="120" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
