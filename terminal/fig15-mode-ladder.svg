<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- gradient arrow -->
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2a7f8f"/><stop offset="1" stop-color="#a8324a"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="890" height="14" fill="url(#g)"/>
  <path d="M930,30 l35,17 l-35,17 z" fill="#a8324a"/>
  <text x="40" y="88" font-size="19" fill="#2a7f8f" font-weight="bold">asks about more</text>
  <text x="960" y="88" font-size="19" fill="#a8324a" font-weight="bold" text-anchor="end">asks about less</text>
  <!-- Claude row -->
  <text x="40" y="140" font-size="21" fill="#222" font-weight="bold">Claude Code</text>
  <g font-size="19" text-anchor="middle">
    <rect x="40" y="160" width="165" height="74" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="122" y="192" fill="#222" font-weight="bold">Plan</text>
    <text x="122" y="218" fill="#555" font-size="16">reads, proposes</text>
    <rect x="225" y="160" width="165" height="74" rx="8" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="3.5"/>
    <text x="307" y="192" fill="#2a7f8f" font-weight="bold">Manual</text>
    <text x="307" y="218" fill="#555" font-size="16">asks before edits</text>
    <rect x="410" y="160" width="165" height="74" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="492" y="192" fill="#222" font-weight="bold">Accept edits</text>
    <text x="492" y="218" fill="#555" font-size="16">edits without asking</text>
    <rect x="595" y="160" width="165" height="74" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="677" y="192" fill="#222" font-weight="bold">Auto</text>
    <text x="677" y="218" fill="#555" font-size="16">a checker decides</text>
    <rect x="780" y="160" width="180" height="74" rx="8" fill="#fdf6f7" stroke="#a8324a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="870" y="192" fill="#a8324a" font-weight="bold">Bypass</text>
    <text x="870" y="218" fill="#a8324a" font-size="16">never asks: avoid</text>
  </g>
  <!-- Codex row -->
  <text x="40" y="290" font-size="21" fill="#222" font-weight="bold">Codex</text>
  <g font-size="19" text-anchor="middle">
    <rect x="225" y="310" width="165" height="74" rx="8" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="3.5"/>
    <text x="307" y="342" fill="#2a7f8f" font-weight="bold">Read Only</text>
    <text x="307" y="368" fill="#555" font-size="16">asks before edits</text>
    <rect x="410" y="310" width="350" height="74" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="585" y="342" fill="#222" font-weight="bold">Auto</text>
    <text x="585" y="368" fill="#555" font-size="16">edits and runs in the folder; asks to go outside</text>
    <rect x="780" y="310" width="180" height="74" rx="8" fill="#fdf6f7" stroke="#a8324a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="870" y="342" fill="#a8324a" font-weight="bold">Full Access</text>
    <text x="870" y="368" fill="#a8324a" font-size="16">no sandbox: avoid</text>
  </g>
  <text x="307" y="290" font-size="17" fill="#2a7f8f" text-anchor="middle" font-weight="bold">this unit</text>
</svg>
