<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <defs>
    <g id="doc"><path d="M0,0 h40 l14,14 v56 h-54 z" fill="#fff" stroke="#444" stroke-width="2"/><path d="M40,0 v14 h14" fill="none" stroke="#444" stroke-width="2"/></g>
  </defs>
  <!-- rm panel -->
  <rect x="20" y="20" width="470" height="340" rx="12" fill="#fdf6f7" stroke="#a8324a" stroke-width="2"/>
  <text x="40" y="58" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#a8324a" font-weight="bold">rm draft.docx</text>
  <use xlink:href="#doc" x="70" y="100"/>
  <text x="97" y="195" font-size="16" fill="#222" text-anchor="middle">draft.docx</text>
  <path d="M150,135 h90" stroke="#a8324a" stroke-width="3"/><path d="M252,135 l-13,-8 v16 z" fill="#a8324a"/>
  <!-- bin crossed -->
  <path d="M320,108 h60 l-6,64 h-48 z" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <path d="M312,102 h76" stroke="#999" stroke-width="3"/>
  <path d="M300,90 l100,100" stroke="#a8324a" stroke-width="5"/>
  <text x="350" y="220" font-size="17" fill="#666" text-anchor="middle">no wastebasket</text>
  <text x="40" y="275" font-size="19" fill="#222">Deletes at once. There is no</text>
  <text x="40" y="301" font-size="19" fill="#222">"undo" and no Recycle Bin.</text>
  <text x="40" y="335" font-size="19" fill="#555"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">rm -r</tspan> deletes whole folders.</text>
  <!-- mv panel -->
  <rect x="510" y="20" width="470" height="340" rx="12" fill="#f7f1e1" stroke="#8a6a12" stroke-width="2"/>
  <text x="530" y="58" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#8a6a12" font-weight="bold">mv report.docx final/</text>
  <use xlink:href="#doc" x="550" y="100"/>
  <text x="577" y="195" font-size="16" fill="#222" text-anchor="middle">report.docx</text>
  <text x="577" y="215" font-size="15" fill="#555" text-anchor="middle">(new)</text>
  <path d="M625,135 h70" stroke="#8a6a12" stroke-width="3"/><path d="M707,135 l-13,-8 v16 z" fill="#8a6a12"/>
  <rect x="725" y="84" width="230" height="146" rx="8" fill="#ffffff" stroke="#8a6a12" stroke-width="1.5"/>
  <text x="740" y="108" font-size="17" fill="#8a6a12" font-weight="bold">final/</text>
  <use xlink:href="#doc" x="790" y="122"/>
  <path d="M780,118 l74,78 M854,118 l-74,78" stroke="#a8324a" stroke-width="4"/>
  <text x="840" y="220" font-size="15" fill="#555" text-anchor="middle">old report.docx: gone</text>
  <text x="530" y="275" font-size="19" fill="#222">Moves or renames. If a file with</text>
  <text x="530" y="301" font-size="19" fill="#222">the same name is there, it is</text>
  <text x="530" y="327" font-size="19" fill="#222">replaced without a warning.</text>
</svg>
