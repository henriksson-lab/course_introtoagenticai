<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <rect x="20" y="20" width="620" height="420" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h600 a10,10 0 0 1 10,10 v26 h-620 z" fill="#e4e4e4"/>
  <text x="330" y="44" font-size="16" fill="#555" text-anchor="middle">~/agentic-course: claude</text>
  <rect x="40" y="76" width="580" height="340" rx="8" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#222">
    <text x="60" y="112" font-weight="bold" fill="#6b4fa0">Bash command</text>
    <text x="80" y="152" font-weight="bold">mkdir results</text>
    <text x="80" y="184" fill="#777">Create a folder for the output</text>
    <text x="60" y="232">Do you want to proceed?</text>
    <text x="60" y="270" fill="#6b4fa0">&gt; 1. Yes</text>
    <text x="60" y="304">&#160;&#160;2. Yes, and don't ask again</text>
    <text x="60" y="328">&#160;&#160;&#160;&#160;&#160;for: mkdir *</text>
    <text x="60" y="362">&#160;&#160;3. No</text>
    <text x="60" y="400" font-size="15" fill="#888">Esc to cancel · Tab to amend</text>
  </g>
  <!-- numbered annotations -->
  <g font-size="19">
    <path d="M675,146 H230" stroke="#2a7f8f" stroke-width="2"/>
    <circle cx="690" cy="146" r="15" fill="#2a7f8f"/><text x="690" y="153" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
    <text x="715" y="141" fill="#222" font-weight="bold">What will run</text>
    <text x="715" y="165" fill="#555">read every word</text>
    <path d="M675,184 H420" stroke="#2a7f8f" stroke-width="2"/>
    <circle cx="690" cy="196" r="15" fill="#2a7f8f"/><text x="690" y="203" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
    <text x="715" y="203" fill="#222" font-weight="bold">Why: the agent's reason</text>
    <path d="M675,40 H520" stroke="#2a7f8f" stroke-width="2"/>
    <circle cx="690" cy="46" r="15" fill="#2a7f8f"/><text x="690" y="53" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <text x="715" y="43" fill="#222" font-weight="bold">Where: which folder</text>
    <text x="715" y="67" fill="#555">does it touch only this one?</text>
    <path d="M675,304 H560" stroke="#2a7f8f" stroke-width="2"/>
    <circle cx="690" cy="304" r="15" fill="#2a7f8f"/><text x="690" y="311" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <text x="715" y="299" fill="#222" font-weight="bold">How long: once, or</text>
    <text x="715" y="323" fill="#222" font-weight="bold">from now on?</text>
  </g>
  <text x="632" y="460" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
