<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="470" height="295" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <rect x="510" y="20" width="470" height="295" rx="12" fill="#fdf6f7" stroke="#a8324a" stroke-width="2"/>
  <!-- tick -->
  <path d="M45,62 l12,14 l24,-30" stroke="#2a7f8f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="95" y="72" font-size="23" fill="#2a7f8f" font-weight="bold">Start the agent here</text>
  <!-- cross -->
  <path d="M537,46 l26,26 M563,46 l-26,26" stroke="#a8324a" stroke-width="6" stroke-linecap="round"/>
  <text x="585" y="72" font-size="23" fill="#a8324a" font-weight="bold">Not here</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="21" fill="#222">
    <text x="50" y="130">~/agentic-course</text>
    <text x="50" y="195">~/agentic-course/project</text>
    <text x="50" y="260">a folder with a COPY</text>
    <text x="540" y="130">~&#160;&#160;(your home folder)</text>
    <text x="540" y="195">Desktop, Documents</text>
    <text x="540" y="260">/&#160;&#160;or&#160;&#160;C:\</text>
  </g>
  <g font-size="18" fill="#555">
    <text x="50" y="156">one folder made for the work</text>
    <text x="50" y="221">one project, one folder</text>
    <text x="50" y="286">of the data you need</text>
    <text x="540" y="156">every file you own is in reach</text>
    <text x="540" y="221">mixed private and work files</text>
    <text x="540" y="286">the whole computer</text>
  </g>
  <text x="500" y="370" font-size="20" fill="#444" text-anchor="middle">Check with pwd before you type claude or codex.</text>
</svg>
