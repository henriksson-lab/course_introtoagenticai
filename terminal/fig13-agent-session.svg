<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <rect x="20" y="20" width="640" height="480" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h620 a10,10 0 0 1 10,10 v26 h-640 z" fill="#e4e4e4"/>
  <text x="340" y="44" font-size="16" fill="#555" text-anchor="middle">agentic-course: claude</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17">
    <rect x="40" y="72" width="600" height="70" rx="6" fill="#ffffff" stroke="#6b4fa0" stroke-width="1.5"/>
    <text x="56" y="100" fill="#6b4fa0" font-weight="bold">Claude Code</text>
    <text x="56" y="127" fill="#555">~/agentic-course</text>
    <text x="40" y="182" fill="#222">&gt; What files are in this folder?</text>
    <text x="40" y="222" fill="#2a7f8f">* Bash(ls)</text>
    <text x="60" y="248" fill="#777">notes.md</text>
    <text x="40" y="288" fill="#222">There is one file, notes.md. It is</text>
    <text x="40" y="312" fill="#222">a Markdown text file ...</text>
    <rect x="40" y="350" width="600" height="56" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
    <text x="56" y="384" fill="#222">&gt; </text>
    <rect x="80" y="368" width="10" height="22" fill="#a8324a"/>
    <text x="40" y="438" fill="#8a6a12">manual mode on (shift+tab to cycle)</text>
    <text x="40" y="468" fill="#999" font-size="15">? for shortcuts</text>
  </g>
  <!-- annotations -->
  <g font-size="19">
    <path d="M688,118 H600" stroke="#666" stroke-width="1.5"/><circle cx="600" cy="118" r="4" fill="#666"/>
    <text x="695" y="113" fill="#222" font-weight="bold">The folder it works in</text>
    <text x="695" y="137" fill="#555">check this first</text>
    <path d="M688,178 H440" stroke="#666" stroke-width="1.5"/><circle cx="440" cy="178" r="4" fill="#666"/>
    <text x="695" y="184" fill="#222" font-weight="bold">Your message</text>
    <path d="M688,228 H180" stroke="#666" stroke-width="1.5"/><circle cx="180" cy="228" r="4" fill="#666"/>
    <text x="695" y="225" fill="#222" font-weight="bold">What the agent did</text>
    <text x="695" y="249" fill="#555">tool and command</text>
    <path d="M688,300 H440" stroke="#666" stroke-width="1.5"/><circle cx="440" cy="300" r="4" fill="#666"/>
    <text x="695" y="306" fill="#222" font-weight="bold">Its answer</text>
    <path d="M688,378 H640" stroke="#666" stroke-width="1.5"/>
    <text x="695" y="372" fill="#222" font-weight="bold">The prompt box</text>
    <text x="695" y="396" fill="#555">type here, then Enter</text>
    <path d="M688,432 H440" stroke="#666" stroke-width="1.5"/><circle cx="440" cy="432" r="4" fill="#666"/>
    <text x="695" y="438" fill="#222" font-weight="bold">The permission mode</text>
    <text x="695" y="462" fill="#555">what it may do unasked</text>
  </g>
  <text x="652" y="512" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
