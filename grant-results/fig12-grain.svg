<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#fff"/>
  <text x="230" y="35" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">One row per project</text>
  <g font-size="18">
    <rect x="30" y="50" width="400" height="36" fill="#2a7f8f"/>
    <g fill="#fff" font-weight="bold"><text x="45" y="74">project</text><text x="170" y="74">years</text><text x="310" y="74">MSEK</text></g>
    <g fill="#333">
      <text x="45" y="112">P1</text><text x="170" y="112">2025-2027</text><text x="380" y="112" text-anchor="end">3.9</text>
      <rect x="30" y="122" width="400" height="36" fill="#f4f4f4"/>
      <text x="45" y="146">P2</text><text x="170" y="146">2026-2027</text><text x="380" y="146" text-anchor="end">2.0</text>
    </g>
    <line x1="30" y1="166" x2="430" y2="166" stroke="#333"/>
    <text x="45" y="192" fill="#333" font-weight="bold">2 projects</text><text x="380" y="192" text-anchor="end" font-weight="bold" fill="#333">5.9</text>
  </g>
  <text x="730" y="35" font-size="21" font-weight="bold" fill="#6b4fa0" text-anchor="middle">One row per project and year</text>
  <g font-size="18">
    <rect x="530" y="50" width="440" height="36" fill="#6b4fa0"/>
    <g fill="#fff" font-weight="bold"><text x="545" y="74">project</text><text x="650" y="74">year</text><text x="740" y="74">paid</text><text x="830" y="74">project total</text></g>
    <g fill="#333">
      <text x="545" y="112">P1</text><text x="650" y="112">2025</text><text x="740" y="112">1.3</text><text x="830" y="112">3.9</text>
      <rect x="530" y="122" width="440" height="34" fill="#f4f4f4"/>
      <text x="545" y="145">P1</text><text x="650" y="145">2026</text><text x="740" y="145">1.3</text><text x="830" y="145">3.9</text>
      <text x="545" y="178">P1</text><text x="650" y="178">2027</text><text x="740" y="178">1.3</text><text x="830" y="178">3.9</text>
      <rect x="530" y="188" width="440" height="34" fill="#f4f4f4"/>
      <text x="545" y="211">P2</text><text x="650" y="211">2026</text><text x="740" y="211">1.0</text><text x="830" y="211">2.0</text>
      <text x="545" y="244">P2</text><text x="650" y="244">2027</text><text x="740" y="244">1.0</text><text x="830" y="244">2.0</text>
    </g>
    <line x1="530" y1="256" x2="970" y2="256" stroke="#333"/>
    <text x="545" y="284" fill="#333">sum of "paid":</text><text x="760" y="284" fill="#2a7f8f" font-weight="bold">5.9 ✓</text>
    <text x="545" y="314" fill="#333">sum of "project total":</text><text x="830" y="314" fill="#a8324a" font-weight="bold">15.7 ✗</text>
    <text x="545" y="344" fill="#333">count of rows as "projects":</text><text x="830" y="344" fill="#a8324a" font-weight="bold">5 ✗</text>
  </g>
  <rect x="30" y="240" width="440" height="140" rx="8" fill="#f6f1e3" stroke="#8a6a12"/>
  <text x="50" y="276" font-size="19" fill="#8a6a12" font-weight="bold">Ask the agent, then check yourself:</text>
  <text x="50" y="310" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">In this table, what is one</text>
  <text x="50" y="336" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">row? Show me all rows for</text>
  <text x="50" y="362" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">one project.</text>
  <text x="500" y="440" font-size="20" fill="#333" text-anchor="middle">Same grants, same money: the wrong sum nearly triples it, and the script still runs.</text>
  <text x="980" y="472" font-size="13" fill="#999" text-anchor="end">illustrative numbers</text>
</svg>
