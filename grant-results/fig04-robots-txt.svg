<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <g font-size="22" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="20" y="20" width="300" height="56" rx="8" fill="#2a7f8f"/><text x="170" y="56">Terms and licence</text>
    <rect x="350" y="20" width="300" height="56" rx="8" fill="#6b4fa0"/><text x="500" y="56">API documentation</text>
    <rect x="680" y="20" width="300" height="56" rx="8" fill="#8a6a12"/><text x="830" y="56">robots.txt</text>
  </g>
  <g font-size="18" fill="#333">
    <text x="30" y="115">What may I do with the data?</text>
    <text x="30" y="150">• analyse, combine, publish?</text>
    <text x="30" y="180">• credit required? how?</text>
    <text x="30" y="210">• personal data inside?</text>
    <text x="360" y="115">How should I ask?</text>
    <text x="360" y="150">• requests per second</text>
    <text x="360" y="180">• records per request</text>
    <text x="360" y="210">• key or token needed?</text>
    <text x="360" y="240">• best time for big jobs</text>
    <text x="690" y="115">Which pages may programs visit?</text>
    <text x="690" y="150">• at the root of every site:</text>
    <text x="690" y="180">  example.se/robots.txt</text>
    <text x="690" y="210">• a convention, not a lock</text>
  </g>
  <!-- robots mock -->
  <rect x="560" y="265" width="420" height="190" rx="8" fill="#1f2430"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="580" y="298" fill="#9a9aa8"># example.se/robots.txt</text>
    <text x="580" y="328" fill="#e8e8e8">User-agent: *</text>
    <text x="580" y="356" fill="#e0b84a">Disallow: /search?</text>
    <text x="580" y="384" fill="#e0b84a">Disallow: /*.pdf</text>
    <text x="580" y="412" fill="#e8e8e8">Crawl-delay: 2</text>
    <text x="580" y="440" fill="#e8e8e8">Sitemap: /sitemap.xml</text>
  </g>
  <text x="975" y="485" font-size="13" fill="#999" text-anchor="end">illustrative</text>
  <!-- prompt -->
  <rect x="20" y="265" width="510" height="190" rx="8" fill="#f6f1e3" stroke="#8a6a12"/>
  <text x="40" y="298" font-size="18" font-weight="bold" fill="#8a6a12">Ask first, before any script:</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#333">
    <text x="40" y="332">Fetch the terms of use, the API</text>
    <text x="40" y="356">documentation and robots.txt for</text>
    <text x="40" y="380">this site. Summarise what I may</text>
    <text x="40" y="404">do, how fast, and how to credit.</text>
    <text x="40" y="428">Quote the sentences you rely on.</text>
  </g>
</svg>
