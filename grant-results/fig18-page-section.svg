<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="600" fill="#fff"/>
  <rect x="20" y="20" width="960" height="560" rx="8" fill="#fff" stroke="#999" stroke-width="2"/>
  <rect x="20" y="20" width="960" height="44" rx="8" fill="#e8e8e8"/>
  <rect x="40" y="30" width="600" height="24" rx="12" fill="#fff" stroke="#bbb"/>
  <text x="55" y="48" font-size="15" fill="#666">you.github.io/soil-funding/funding.html</text>
  <text x="60" y="110" font-size="28" font-weight="bold" fill="#333">Soil research funding in Sweden</text>
  <!-- mini plot -->
  <rect x="60" y="135" width="420" height="250" fill="#fafafa" stroke="#ddd"/>
  <g fill="#2a7f8f">
    <rect x="80" y="320" width="22" height="45"/><rect x="110" y="310" width="22" height="55"/><rect x="140" y="300" width="22" height="65"/><rect x="170" y="290" width="22" height="75"/>
    <rect x="200" y="285" width="22" height="80"/><rect x="230" y="270" width="22" height="95"/><rect x="260" y="262" width="22" height="103"/><rect x="290" y="250" width="22" height="115"/>
    <rect x="320" y="238" width="22" height="127"/><rect x="350" y="225" width="22" height="140"/><rect x="380" y="212" width="22" height="153"/><rect x="410" y="196" width="22" height="169"/>
  </g>
  <text x="270" y="165" font-size="16" fill="#555" text-anchor="middle">MSEK per year, 2014-2025</text>
  <rect x="510" y="135" width="420" height="250" fill="#fafafa" stroke="#ddd"/>
  <g fill="#6b4fa0"><rect x="540" y="180" width="300" height="26"/><rect x="540" y="220" width="230" height="26"/><rect x="540" y="260" width="190" height="26"/><rect x="540" y="300" width="120" height="26"/><rect x="540" y="340" width="80" height="26"/></g>
  <text x="720" y="165" font-size="16" fill="#555" text-anchor="middle">largest topics</text>
  <g font-size="18" fill="#333">
    <text x="60" y="425">Funding for soil research has roughly tripled since 2014, mostly in</text>
    <text x="60" y="450">projects on microbes and carbon. Three funders account for 80 %.</text>
  </g>
  <rect x="60" y="475" width="880" height="80" rx="6" fill="#f4f4f4"/>
  <g font-size="16" fill="#555">
    <text x="75" y="502">Data: Swecris (Swedish Research Council), search "soil" in English and Swedish, downloaded 2026-11-23.</text>
    <text x="75" y="526">Start year, current prices. Totals checked against the API's own sums and the funders'</text>
    <text x="75" y="548">statistics (differences under 5 %, explained in notes/checks.md). Scripts: GitHub repository.</text>
  </g>
  <text x="975" y="595" font-size="13" fill="#999" text-anchor="end">illustrative</text>
</svg>
