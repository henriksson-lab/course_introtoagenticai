<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <g font-size="17">
    <rect x="20" y="20" width="960" height="44" fill="#2a7f8f"/>
    <g fill="#fff" font-weight="bold">
      <text x="32" y="48">Number</text><text x="400" y="48">Published</text><text x="530" y="48">My data</text><text x="650" y="48">Difference and reason</text>
    </g>
    <g fill="#333">
      <text x="32" y="98">API's own yearly sums for my search</text><text x="400" y="98">412.6</text><text x="530" y="98">412.6</text><text x="650" y="98" fill="#2a7f8f" font-weight="bold">0 ✓</text>
      <rect x="20" y="118" width="960" height="70" fill="#f4f4f4"/>
      <text x="32" y="148">Funder X, all fields, granted 2024</text><text x="32" y="172" fill="#777" font-size="15">(funder's decision statistics, MSEK)</text>
      <text x="400" y="148">6 150</text><text x="530" y="148">5 960</text>
      <text x="650" y="148" fill="#8a6a12" font-weight="bold">−3 %: Swecris counts</text><text x="650" y="172" fill="#8a6a12" font-weight="bold">start year, not decision year</text>
      <text x="32" y="222">Projects matching "soil" in the</text><text x="32" y="246">Swecris web search, 2024</text>
      <text x="400" y="222">64</text><text x="530" y="222">64</text><text x="650" y="222" fill="#2a7f8f" font-weight="bold">0 ✓</text>
      <rect x="20" y="266" width="960" height="70" fill="#f8e9ec"/>
      <text x="32" y="296">Funder Y, soil-related, 2020</text><text x="32" y="320" fill="#777" font-size="15">(from its annual report, MSEK)</text>
      <text x="400" y="296">88</text><text x="530" y="296">46</text>
      <text x="650" y="296" fill="#a8324a" font-weight="bold">−48 % ✗ no explanation:</text><text x="650" y="320" fill="#a8324a" font-weight="bold">stop, find out before you plot</text>
    </g>
  </g>
  <text x="500" y="385" font-size="20" fill="#333" text-anchor="middle">A small difference with a reason is normal. A large one, or one without a reason, is a bug</text>
  <text x="500" y="413" font-size="20" fill="#333" text-anchor="middle">in the search, the year or the sum, until you have shown otherwise.</text>
  <text x="985" y="458" font-size="13" fill="#999" text-anchor="end">illustrative numbers</text>
</svg>
