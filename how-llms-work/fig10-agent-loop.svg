<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <!-- you -->
  <rect x="20" y="190" width="150" height="80" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <text x="95" y="225" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">You</text>
  <text x="95" y="251" font-size="16" text-anchor="middle" fill="#666">a task</text>
  <path d="M170,230 h50" stroke="#333" stroke-width="2.5"/><path d="M220,222 L234,230 L220,238 Z" fill="#333"/>
  <!-- LLM -->
  <rect x="240" y="170" width="200" height="120" rx="14" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="3"/>
  <text x="340" y="220" font-size="24" font-weight="bold" text-anchor="middle" fill="#6b4fa0">LLM</text>
  <text x="340" y="248" font-size="16" text-anchor="middle" fill="#6b4fa0">decides the next step</text>
  <!-- harness -->
  <rect x="560" y="40" width="200" height="90" rx="10" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="660" y="78" font-size="20" font-weight="bold" text-anchor="middle" fill="#8a6a12">Harness</text>
  <text x="660" y="104" font-size="16" text-anchor="middle" fill="#8a6a12">asks your permission</text>
  <!-- tools -->
  <rect x="560" y="330" width="200" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="660" y="362" font-size="20" font-weight="bold" text-anchor="middle" fill="#2a7f8f">Tools</text>
  <g font-size="16" fill="#2a7f8f" text-anchor="middle">
    <text x="660" y="388">read / write a file</text>
    <text x="660" y="410">run a command</text>
    <text x="660" y="432">search the web</text>
  </g>
  <!-- arrows -->
  <path d="M440,195 C500,140 520,90 552,86" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M548,78 L562,86 L548,94 Z" fill="#333"/>
  <text x="462" y="185" font-size="16" fill="#333">"please run this"</text>
  <path d="M700,130 C740,220 740,280 700,322" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M694,314 L700,330 L710,317 Z" fill="#333"/>
  <text x="745" y="232" font-size="16" fill="#333">you said yes</text>
  <path d="M560,390 C480,390 400,350 360,300" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M354,308 L356,292 L369,302 Z" fill="#333"/>
  <text x="350" y="395" font-size="16" fill="#333">result goes back</text>
  <text x="350" y="415" font-size="16" fill="#333">into the context</text>
  <!-- done -->
  <path d="M340,170 v-60 h-50" fill="none" stroke="#2a7f8f" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M292,102 L278,110 L292,118 Z" fill="#2a7f8f"/>
  <text x="270" y="80" font-size="16" fill="#2a7f8f" text-anchor="end">or: "done", with</text>
  <text x="270" y="100" font-size="16" fill="#2a7f8f" text-anchor="end">a reply to you</text>
  <text x="985" y="400" font-size="19" text-anchor="end" fill="#333">loop until</text>
  <text x="985" y="425" font-size="19" text-anchor="end" fill="#333">the task is done</text>
</svg>
