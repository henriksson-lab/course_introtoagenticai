<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <rect x="20" y="130" width="250" height="110" rx="10" fill="#f5f5f5" stroke="#888"/>
  <text x="145" y="168" font-size="18" text-anchor="middle" fill="#333">"... as shown by</text>
  <text x="145" y="194" font-size="18" text-anchor="middle" fill="#333">Berg et al. (2018),</text>
  <text x="145" y="220" font-size="18" text-anchor="middle" fill="#333">doi:10.1000/ ..."</text>
  <rect x="340" y="140" width="220" height="90" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="450" y="178" font-size="18" text-anchor="middle" font-weight="bold" fill="#2a7f8f">one process:</text>
  <text x="450" y="204" font-size="18" text-anchor="middle" fill="#333">most plausible next token</text>
  <line x1="272" y1="185" x2="336" y2="185" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="562" y1="170" x2="636" y2="100" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="562" y1="200" x2="636" y2="270" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="640" y="40" width="340" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f"/>
  <text x="660" y="74" font-size="18" font-weight="bold" fill="#2a7f8f">a real reference</text>
  <text x="660" y="102" font-size="17" fill="#333">the paper was seen often in training,</text>
  <text x="660" y="126" font-size="17" fill="#333">so the true details are the likely ones</text>
  <rect x="640" y="220" width="340" height="110" rx="10" fill="#f6e4e8" stroke="#a8324a"/>
  <text x="660" y="254" font-size="18" font-weight="bold" fill="#a8324a">an invented reference</text>
  <text x="660" y="282" font-size="17" fill="#333">no such paper was learnt, so a</text>
  <text x="660" y="306" font-size="17" fill="#333">likely-looking one is assembled</text>
  <text x="500" y="375" font-size="19" text-anchor="middle" fill="#333">Same process, same fluency, same confidence. There is no separate "true" check inside.</text>
</svg>
