<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <rect x="300" y="20" width="400" height="56" rx="10" fill="#f5f5f5" stroke="#666"/>
  <text x="500" y="55" font-size="19" text-anchor="middle" fill="#333">"How many samples come from site B?"</text>
  <path d="M400,78 L250,120" stroke="#333" stroke-width="2.5"/><path d="M256,111 L242,123 L260,124 Z" fill="#333"/>
  <path d="M600,78 L750,120" stroke="#333" stroke-width="2.5"/><path d="M740,124 L758,123 L744,111 Z" fill="#333"/>
  <rect x="20" y="130" width="450" height="220" rx="12" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
  <text x="245" y="168" font-size="22" font-weight="bold" text-anchor="middle" fill="#a8324a">In its head</text>
  <text x="245" y="208" font-size="18" text-anchor="middle" fill="#333">reads 600 rows, "counts"</text>
  <text x="245" y="262" font-size="36" font-weight="bold" text-anchor="middle" fill="#a8324a">"112 samples."</text>
  <text x="245" y="310" font-size="18" text-anchor="middle" fill="#333">sounds exact, is a guess</text>
  <rect x="530" y="130" width="450" height="220" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="755" y="168" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">By running code</text>
  <rect x="560" y="186" width="390" height="40" rx="5" fill="#333"/>
  <text x="575" y="213" font-size="16" fill="#9fe0ea" font-family="Menlo, Consolas, monospace">count rows where site == "B"</text>
  <text x="755" y="272" font-size="36" font-weight="bold" text-anchor="middle" fill="#2a7f8f">118</text>
  <text x="755" y="310" font-size="18" text-anchor="middle" fill="#333">and you can rerun the count</text>
  <text x="985" y="374" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
