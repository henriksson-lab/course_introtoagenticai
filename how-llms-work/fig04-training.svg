<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <!-- stage 1 -->
  <rect x="20" y="40" width="290" height="250" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="165" y="80" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">1. Read a lot of text</text>
  <g fill="#fff" stroke="#2a7f8f" stroke-width="1.5">
    <rect x="60" y="100" width="44" height="58"/><rect x="112" y="100" width="44" height="58"/>
    <rect x="164" y="100" width="44" height="58"/><rect x="216" y="100" width="44" height="58"/>
  </g>
  <text x="165" y="195" font-size="18" text-anchor="middle" fill="#333">web pages, books, papers,</text>
  <text x="165" y="219" font-size="18" text-anchor="middle" fill="#333">code, forums</text>
  <text x="165" y="255" font-size="18" text-anchor="middle" fill="#333">Learns: continue any text</text>
  <!-- arrow -->
  <path d="M318,165 h30" stroke="#333" stroke-width="2.5"/><path d="M348,157 L362,165 L348,173 Z" fill="#333"/>
  <!-- stage 2 -->
  <rect x="370" y="40" width="290" height="250" rx="12" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <text x="515" y="80" font-size="22" font-weight="bold" text-anchor="middle" fill="#6b4fa0">2. Learn to follow</text>
  <text x="515" y="106" font-size="22" font-weight="bold" text-anchor="middle" fill="#6b4fa0">instructions</text>
  <rect x="410" y="122" width="210" height="34" rx="14" fill="#fff" stroke="#6b4fa0"/>
  <text x="515" y="145" font-size="17" text-anchor="middle" fill="#333">question → good answer</text>
  <text x="515" y="195" font-size="18" text-anchor="middle" fill="#333">examples and human</text>
  <text x="515" y="219" font-size="18" text-anchor="middle" fill="#333">ratings of answers</text>
  <text x="515" y="255" font-size="18" text-anchor="middle" fill="#333">Learns: be a helpful assistant</text>
  <path d="M668,165 h30" stroke="#333" stroke-width="2.5"/><path d="M698,157 L712,165 L698,173 Z" fill="#333"/>
  <!-- stage 3 -->
  <rect x="720" y="40" width="260" height="250" rx="12" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="850" y="80" font-size="22" font-weight="bold" text-anchor="middle" fill="#8a6a12">3. Learn to use tools</text>
  <rect x="760" y="100" width="180" height="56" rx="6" fill="#333"/>
  <text x="772" y="134" font-size="17" fill="#9fe0ea" font-family="Menlo, Consolas, monospace">run: count.py</text>
  <text x="850" y="195" font-size="18" text-anchor="middle" fill="#333">practice tasks: write code,</text>
  <text x="850" y="219" font-size="18" text-anchor="middle" fill="#333">run it, fix it</text>
  <text x="850" y="255" font-size="18" text-anchor="middle" fill="#333">Learns: act, then check</text>
  <text x="500" y="340" font-size="20" text-anchor="middle" fill="#333">Under all three stages it is still the same thing: predict the next token.</text>
</svg>
