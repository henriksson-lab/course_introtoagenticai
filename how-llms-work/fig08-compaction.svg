<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="190" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">A long session, nearly full</text>
  <rect x="40" y="50" width="300" height="340" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <g>
    <rect x="58" y="66" width="264" height="34" rx="5" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="70" y="89" font-size="16" fill="#a8324a">"Never edit files in raw/"</text>
    <rect x="58" y="108" width="200" height="22" rx="5" fill="#e3f1f3"/>
    <rect x="58" y="138" width="250" height="22" rx="5" fill="#eeeaf5"/>
    <rect x="58" y="168" width="180" height="22" rx="5" fill="#e3f1f3"/>
    <rect x="58" y="198" width="264" height="22" rx="5" fill="#eeeaf5"/>
    <rect x="58" y="228" width="220" height="22" rx="5" fill="#eeeaf5"/>
    <rect x="58" y="258" width="160" height="22" rx="5" fill="#e3f1f3"/>
    <rect x="58" y="288" width="250" height="22" rx="5" fill="#eeeaf5"/>
    <rect x="58" y="318" width="230" height="22" rx="5" fill="#eeeaf5"/>
    <rect x="58" y="348" width="190" height="22" rx="5" fill="#e3f1f3"/>
  </g>
  <rect x="350" y="50" width="22" height="340" rx="4" fill="#eeeeee" stroke="#999"/>
  <rect x="350" y="70" width="22" height="320" rx="4" fill="#a8324a"/>
  <text x="390" y="80" font-size="16" fill="#a8324a">95% full</text>
  <path d="M420,220 h90" stroke="#333" stroke-width="3"/><path d="M510,211 L526,220 L510,229 Z" fill="#333"/>
  <text x="470" y="200" font-size="18" text-anchor="middle" fill="#333">compact</text>
  <text x="470" y="250" font-size="16" text-anchor="middle" fill="#666">(summarise)</text>
  <text x="750" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">The same session, after</text>
  <rect x="560" y="50" width="380" height="340" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <rect x="578" y="66" width="344" height="110" rx="6" fill="#f5efdd" stroke="#8a6a12"/>
  <text x="592" y="94" font-size="17" fill="#8a6a12">Summary: we cleaned the plant</text>
  <text x="592" y="118" font-size="17" fill="#8a6a12">data, fixed the units, made</text>
  <text x="592" y="142" font-size="17" fill="#8a6a12">two plots. Next: statistics.</text>
  <text x="750" y="226" font-size="18" text-anchor="middle" fill="#999">(free space)</text>
  <rect x="578" y="290" width="344" height="80" rx="6" fill="#fff" stroke="#a8324a" stroke-dasharray="6 4"/>
  <text x="750" y="322" font-size="17" text-anchor="middle" fill="#a8324a">Lost: "never edit files in raw/"</text>
  <text x="750" y="348" font-size="17" text-anchor="middle" fill="#a8324a">and the exact numbers</text>
  <text x="985" y="412" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
