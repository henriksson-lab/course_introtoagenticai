<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <g font-size="18">
    <rect x="420" y="20" width="560" height="56" rx="14" fill="#e3f1f3"/>
    <text x="440" y="54" fill="#333">Which group grew taller?</text>
    <rect x="20" y="92" width="600" height="56" rx="14" fill="#f5f5f5" stroke="#ccc"/>
    <text x="40" y="126" fill="#333">The control plants: 15.0 cm vs 13.2 cm.</text>
    <rect x="420" y="166" width="560" height="84" rx="14" fill="#e3f1f3"/>
    <text x="440" y="200" fill="#333">That can't be right. The treatment</text>
    <text x="440" y="226" fill="#333">always increases growth. Check again.</text>
    <rect x="20" y="268" width="600" height="84" rx="14" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
    <text x="40" y="302" fill="#333">You're right, I apologise for the error!</text>
    <text x="40" y="328" fill="#333">The treated plants grew taller.</text>
  </g>
  <text x="650" y="300" font-size="19" fill="#a8324a">It caved. Nothing new was</text>
  <text x="650" y="326" font-size="19" fill="#a8324a">checked; the data did not change.</text>
  <text x="20" y="400" font-size="18" fill="#333">The model was trained partly on people's ratings, and people tend to rate agreement highly.</text>
  <text x="985" y="432" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
