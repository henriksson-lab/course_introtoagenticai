<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <!-- card 1: folder -->
  <g>
    <rect x="20" y="20" width="300" height="380" rx="12" fill="#f5f5f5" stroke="#cccccc"/>
    <text x="170" y="58" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Organise a folder</text>
    <path d="M80,100 h60 l15,18 h85 v110 h-160 z" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2.5"/>
    <rect x="100" y="140" width="40" height="50" fill="#fff" stroke="#2a7f8f"/>
    <rect x="150" y="140" width="40" height="50" fill="#fff" stroke="#2a7f8f"/>
    <rect x="200" y="140" width="30" height="50" fill="#fff" stroke="#2a7f8f"/>
    <text x="170" y="275" font-size="18" text-anchor="middle" fill="#2a7f8f">Looked fine:</text>
    <text x="170" y="298" font-size="18" text-anchor="middle" fill="#2a7f8f">48 files sorted</text>
    <rect x="40" y="320" width="260" height="62" rx="8" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="170" y="346" font-size="18" text-anchor="middle" fill="#a8324a">But: 2 files ended up</text>
    <text x="170" y="370" font-size="18" text-anchor="middle" fill="#a8324a">in the wrong folder</text>
  </g>
  <!-- card 2: spreadsheet -->
  <g>
    <rect x="350" y="20" width="300" height="380" rx="12" fill="#f5f5f5" stroke="#cccccc"/>
    <text x="500" y="58" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Clean a spreadsheet</text>
    <g stroke="#6b4fa0" stroke-width="1.5" fill="#fff">
      <rect x="410" y="95" width="180" height="140"/>
    </g>
    <rect x="410" y="95" width="180" height="28" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="1.5"/>
    <g stroke="#6b4fa0" stroke-width="1">
      <line x1="470" y1="95" x2="470" y2="235"/><line x1="530" y1="95" x2="530" y2="235"/>
      <line x1="410" y1="151" x2="590" y2="151"/><line x1="410" y1="179" x2="590" y2="179"/><line x1="410" y1="207" x2="590" y2="207"/>
    </g>
    <text x="500" y="275" font-size="18" text-anchor="middle" fill="#6b4fa0">Looked fine:</text>
    <text x="500" y="298" font-size="18" text-anchor="middle" fill="#6b4fa0">a tidy table</text>
    <rect x="370" y="320" width="260" height="62" rx="8" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="500" y="346" font-size="18" text-anchor="middle" fill="#a8324a">But: 6 rows that did not</text>
    <text x="500" y="370" font-size="18" text-anchor="middle" fill="#a8324a">parse were quietly dropped</text>
  </g>
  <!-- card 3: PDFs -->
  <g>
    <rect x="680" y="20" width="300" height="380" rx="12" fill="#f5f5f5" stroke="#cccccc"/>
    <text x="830" y="58" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Summarise PDFs</text>
    <g fill="#fff" stroke="#8a6a12" stroke-width="2">
      <path d="M760,110 h70 l20,20 v95 h-90 z"/>
      <path d="M790,100 h70 l20,20 v95 h-90 z"/>
    </g>
    <g stroke="#8a6a12" stroke-width="1.5">
      <line x1="805" y1="140" x2="865" y2="140"/><line x1="805" y1="155" x2="865" y2="155"/>
      <line x1="805" y1="170" x2="865" y2="170"/><line x1="805" y1="185" x2="850" y2="185"/>
    </g>
    <text x="830" y="275" font-size="18" text-anchor="middle" fill="#8a6a12">Looked fine:</text>
    <text x="830" y="298" font-size="18" text-anchor="middle" fill="#8a6a12">a neat summary table</text>
    <rect x="700" y="320" width="260" height="62" rx="8" fill="#f6e4e8" stroke="#a8324a"/>
    <text x="830" y="346" font-size="18" text-anchor="middle" fill="#a8324a">But: one sample size is</text>
    <text x="830" y="370" font-size="18" text-anchor="middle" fill="#a8324a">not in the paper at all</text>
  </g>
</svg>
