<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="20" y="20" width="420" height="80" rx="14" fill="#e3f1f3"/>
  <text x="40" y="54" font-size="18" fill="#333">"Fix the axis label in</text>
  <text x="40" y="80" font-size="18" fill="#333">make_plot.R."</text>
  <text x="500" y="44" font-size="20" font-weight="bold" fill="#333">Files changed in this session</text>
  <g font-size="19">
    <text x="500" y="90" fill="#333">project/</text>
    <rect x="520" y="104" width="460" height="40" rx="6" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
    <text x="536" y="131" fill="#2a7f8f">make_plot.R    (asked for)</text>
    <rect x="520" y="154" width="460" height="40" rx="6" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
    <text x="536" y="181" fill="#a8324a">helpers.R    "tidied up"</text>
    <rect x="520" y="204" width="460" height="40" rx="6" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
    <text x="536" y="231" fill="#a8324a">README.md    rewritten</text>
    <text x="536" y="282" fill="#333">data/raw/</text>
    <rect x="550" y="294" width="430" height="40" rx="6" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
    <text x="566" y="321" fill="#a8324a">plate1.csv    "fixed" a typo</text>
    <text x="566" y="370" fill="#999">plate2.csv</text>
  </g>
  <g font-size="18" fill="#333">
    <text x="20" y="170">Each change was meant to help.</text>
    <text x="20" y="196">Together they make the job</text>
    <text x="20" y="222">hard to review, and one</text>
    <text x="20" y="248">touched your raw data.</text>
  </g>
  <g font-size="18" fill="#2a7f8f">
    <text x="20" y="310">Defence: say what may change;</text>
    <text x="20" y="336">work in a copy; ask for a</text>
    <text x="20" y="362">list of changed files.</text>
  </g>
  <text x="985" y="412" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
