<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <g font-size="17">
    <rect x="30" y="30" width="460" height="300" rx="12" fill="#e3f1e5" stroke="#2e7d32" stroke-width="2"/>
    <text x="260" y="66" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e7d32">Mark found</text>
    <text x="50" y="106" fill="#1b2a3a" font-weight="bold">It tells you:</text>
    <text x="50" y="134" fill="#1b2a3a">that provider's model processed it</text>
    <text x="50" y="176" fill="#1b2a3a" font-weight="bold">It does not tell you:</text>
    <text x="50" y="204" fill="#1b2a3a">how much: it may only have translated,</text>
    <text x="50" y="228" fill="#1b2a3a">proofread or summarised a human text</text>
    <text x="50" y="256" fill="#1b2a3a">whether the content is true</text>
    <text x="50" y="280" fill="#1b2a3a">who pressed the button</text>

    <rect x="510" y="30" width="460" height="300" rx="12" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/>
    <text x="740" y="66" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a4a5a">No mark found</text>
    <text x="530" y="106" fill="#1b2a3a" font-weight="bold">It does not tell you</text>
    <text x="530" y="134" fill="#1b2a3a" font-weight="bold">that a human wrote it. The text may</text>
    <text x="530" y="170" fill="#1b2a3a">come from another provider or an</text>
    <text x="530" y="194" fill="#1b2a3a">open model without marks</text>
    <text x="530" y="222" fill="#1b2a3a">be too short, or paraphrased</text>
    <text x="530" y="250" fill="#1b2a3a">predate marking, or have lost its</text>
    <text x="530" y="274" fill="#1b2a3a">metadata in a screenshot</text>
  </g>
  <text x="500" y="364" text-anchor="middle" font-size="18" fill="#1b2a3a">Both Anthropic and OpenAI say this on their own help pages.</text>
</svg>
