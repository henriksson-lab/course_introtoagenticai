<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="30" y="40" font-size="19" fill="#1b2a3a">The text so far: <tspan font-weight="bold">"The samples were stored at room ..."</tspan></text>
  <text x="30" y="72" font-size="16" fill="#5a6a7a">Likely next words. A secret key plus the previous word colours each one green or red, about half each.</text>
  <!-- left: without -->
  <text x="250" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a4a5a">Without watermark</text>
  <!-- right: with -->
  <text x="750" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b4fa0">With watermark</text>
  <g font-size="17">
    <!-- rows: word, colour, p without, p with -->
    <text x="40" y="160" fill="#2e7d32" font-weight="bold">temperature</text>
    <rect x="200" y="144" width="240" height="22" fill="#2e7d32" opacity="0.8"/><text x="450" y="161" fill="#1b2a3a">60%</text>
    <text x="540" y="160" fill="#2e7d32" font-weight="bold">temperature</text>
    <rect x="700" y="144" width="264" height="22" fill="#2e7d32" opacity="0.8"/><text x="956" y="161" text-anchor="end" fill="#ffffff" font-weight="bold">66%</text>

    <text x="40" y="206" fill="#b23a3a">temp.</text>
    <rect x="200" y="190" width="80" height="22" fill="#b23a3a" opacity="0.8"/><text x="290" y="207" fill="#1b2a3a">20%</text>
    <text x="540" y="206" fill="#b23a3a">temp.</text>
    <rect x="700" y="190" width="56" height="22" fill="#b23a3a" opacity="0.8"/><text x="766" y="207" fill="#1b2a3a">14%</text>

    <text x="40" y="252" fill="#2e7d32" font-weight="bold">conditions</text>
    <rect x="200" y="236" width="48" height="22" fill="#2e7d32" opacity="0.8"/><text x="258" y="253" fill="#1b2a3a">12%</text>
    <text x="540" y="252" fill="#2e7d32" font-weight="bold">conditions</text>
    <rect x="700" y="236" width="64" height="22" fill="#2e7d32" opacity="0.8"/><text x="774" y="253" fill="#1b2a3a">16%</text>

    <text x="40" y="298" fill="#b23a3a">air</text>
    <rect x="200" y="282" width="32" height="22" fill="#b23a3a" opacity="0.8"/><text x="242" y="299" fill="#1b2a3a">8%</text>
    <text x="540" y="298" fill="#b23a3a">air</text>
    <rect x="700" y="282" width="16" height="22" fill="#b23a3a" opacity="0.8"/><text x="726" y="299" fill="#1b2a3a">4%</text>
  </g>
  <line x1="500" y1="100" x2="500" y2="320" stroke="#c5cfd8" stroke-width="2"/>
  <rect x="30" y="336" width="940" height="66" rx="8" fill="#f4f7fa"/>
  <text x="46" y="364" font-size="17" fill="#1b2a3a">The model still picks a sensible word. Green words just win a little more often, at every step.</text>
  <text x="46" y="390" font-size="17" fill="#1b2a3a">A reader cannot see it. A detector that knows the key re-colours the words and counts the green ones.</text>
</svg>
