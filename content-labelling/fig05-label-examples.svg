<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- image with label -->
  <rect x="20" y="20" width="300" height="250" rx="10" fill="#eef6f7" stroke="#2a7f8f"/>
  <ellipse cx="170" cy="130" rx="110" ry="78" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="176" cy="126" r="26" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <rect x="226" y="226" width="84" height="32" rx="6" fill="#1b2a3a" opacity="0.85"/>
  <text x="268" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">AI</text>
  <text x="20" y="298" font-size="15" fill="#1b2a3a">Figure 1. Overview of an animal cell.</text>
  <text x="20" y="318" font-size="15" fill="#1b2a3a">Illustration generated with an AI tool</text>
  <text x="20" y="338" font-size="15" fill="#1b2a3a">and checked by the teacher.</text>
  <!-- video -->
  <rect x="350" y="20" width="300" height="250" rx="10" fill="#1b2a3a"/>
  <polygon points="480,110 480,180 540,145" fill="#ffffff"/>
  <rect x="362" y="226" width="276" height="32" rx="6" fill="#ffffff" opacity="0.9"/>
  <text x="500" y="248" text-anchor="middle" font-size="15" fill="#1b2a3a">voice generated with AI</text>
  <text x="350" y="298" font-size="15" fill="#1b2a3a">A label visible when the video starts,</text>
  <text x="350" y="318" font-size="15" fill="#1b2a3a">not only in the credits.</text>
  <!-- chatbot -->
  <rect x="680" y="20" width="300" height="250" rx="10" fill="#f4f7fa" stroke="#9aa8b5"/>
  <rect x="680" y="20" width="300" height="44" rx="10" fill="#dfe6ec"/>
  <text x="700" y="48" font-size="16" font-weight="bold" fill="#1b2a3a">Course assistant (AI)</text>
  <rect x="700" y="80" width="250" height="56" rx="8" fill="#ffffff" stroke="#c5cfd8"/>
  <text x="712" y="104" font-size="14" fill="#1b2a3a">I am an AI assistant. My answers</text>
  <text x="712" y="124" font-size="14" fill="#1b2a3a">can be wrong; the course page rules.</text>
  <rect x="760" y="150" width="190" height="34" rx="8" fill="#eef6f7"/>
  <text x="772" y="172" font-size="14" fill="#1b2a3a">When is the exam?</text>
  <text x="680" y="298" font-size="15" fill="#1b2a3a">Says it is an AI before the first</text>
  <text x="680" y="318" font-size="15" fill="#1b2a3a">question, not "Ask the course team".</text>
  <text x="500" y="376" text-anchor="middle" font-size="16" fill="#5a6a7a">Generic examples. The official EU icons are downloadable from the Commission's page; check their design there.</text>
  <text x="980" y="396" text-anchor="end" font-size="13" fill="#9aa8b5">illustrative</text>
</svg>
