<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <rect x="30" y="40" width="360" height="300" rx="12" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/>
  <text x="50" y="72" font-size="17" font-weight="bold" fill="#1b2a3a">cell-overview.png</text>
  <rect x="60" y="90" width="300" height="160" rx="8" fill="#eef6f7" stroke="#2a7f8f"/>
  <ellipse cx="210" cy="170" rx="100" ry="62" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="214" cy="166" r="22" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="210" y="282" text-anchor="middle" font-size="15" fill="#3a4a5a">the pixels</text>
  <rect x="60" y="294" width="300" height="34" rx="6" fill="#6b4fa0"/>
  <text x="210" y="317" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">+ attached credential</text>
  <path d="M362,311 C420,311 430,200 480,200" fill="none" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="480" y="40" width="490" height="300" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="500" y="74" font-size="18" font-weight="bold" fill="#6b4fa0">Content credential (C2PA)</text>
  <g font-size="16" fill="#1b2a3a">
    <text x="500" y="112">Made with:  an AI image generator</text>
    <text x="500" y="142">Issued by:  the AI provider</text>
    <text x="500" y="172">Action:  created by generative AI</text>
    <text x="500" y="202">Date:  2026-08-19</text>
    <text x="500" y="232">Fingerprint of the pixels:  9f3a...c41e</text>
  </g>
  <rect x="500" y="256" width="450" height="64" rx="8" fill="#ffffff" stroke="#6b4fa0"/>
  <text x="516" y="282" font-size="15" fill="#1b2a3a">Digital signature: if the pixels or the note change,</text>
  <text x="516" y="304" font-size="15" fill="#1b2a3a">the check fails. Others cannot sign in the issuer's name.</text>
  <text x="500" y="378" text-anchor="middle" font-size="17" fill="#1b2a3a">A signed note travels inside the file. A checking tool reads it and verifies the signature.</text>
  <text x="970" y="396" text-anchor="end" font-size="13" fill="#9aa8b5">illustrative</text>
</svg>
