<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#ffffff"/>
  <!-- left: course page -->
  <rect x="20" y="20" width="470" height="360" rx="12" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/>
  <rect x="20" y="20" width="470" height="36" rx="12" fill="#dfe6ec"/>
  <text x="40" y="44" font-size="16" fill="#1b2a3a">course page: BIO-1042 Cell biology</text>
  <rect x="44" y="76" width="200" height="150" rx="8" fill="#eef6f7" stroke="#2a7f8f"/>
  <ellipse cx="144" cy="151" rx="78" ry="56" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="150" cy="148" r="20" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <ellipse cx="104" cy="128" rx="14" ry="8" fill="#faf5e8" stroke="#8a6a12"/>
  <ellipse cx="186" cy="178" rx="14" ry="8" fill="#faf5e8" stroke="#8a6a12"/>
  <text x="144" y="246" text-anchor="middle" font-size="14" fill="#5a6a7a">AI-generated illustration</text>
  <g fill="#9aa8b5"><rect x="264" y="82" width="200" height="10" rx="4"/><rect x="264" y="104" width="180" height="10" rx="4"/><rect x="264" y="126" width="196" height="10" rx="4"/><rect x="264" y="148" width="150" height="10" rx="4"/></g>
  <text x="264" y="190" font-size="14" fill="#5a6a7a">text drafted by an agent,</text>
  <text x="264" y="208" font-size="14" fill="#5a6a7a">edited by the teacher</text>
  <rect x="44" y="270" width="420" height="40" rx="8" fill="#ffffff" stroke="#9aa8b5"/>
  <text x="60" y="296" font-size="15" fill="#1b2a3a">Ask the course team ...   (a chatbot)</text>
  <text x="255" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b4fa0">What must I label, and how?</text>
  <!-- right: detector -->
  <rect x="520" y="20" width="460" height="360" rx="12" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
  <text x="750" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Essay from a student</text>
  <g fill="#c5cfd8"><rect x="560" y="80" width="380" height="10" rx="4"/><rect x="560" y="100" width="350" height="10" rx="4"/><rect x="560" y="120" width="370" height="10" rx="4"/><rect x="560" y="140" width="300" height="10" rx="4"/></g>
  <rect x="580" y="176" width="340" height="96" rx="10" fill="#ffffff" stroke="#a8324a" stroke-width="2"/>
  <text x="750" y="208" text-anchor="middle" font-size="16" fill="#3a4a5a">"AI detector" result</text>
  <text x="750" y="252" text-anchor="middle" font-size="34" font-weight="bold" fill="#a8324a">87% AI</text>
  <text x="750" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#a8324a">What does this number mean?</text>
  <text x="970" y="372" text-anchor="end" font-size="13" fill="#9aa8b5">illustrative</text>
  <text x="500" y="416" text-anchor="middle" font-size="18" fill="#1b2a3a">Two sides of the same question: can anyone tell that a text or image was made by AI?</text>
</svg>
