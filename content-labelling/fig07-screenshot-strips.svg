<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker></defs>
  <rect width="1000" height="360" fill="#ffffff"/>
  <g>
    <rect x="30" y="40" width="250" height="180" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
    <ellipse cx="155" cy="120" rx="80" ry="50" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <rect x="30" y="190" width="250" height="30" rx="0" fill="#6b4fa0"/>
    <text x="155" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">credential: present</text>
    <text x="155" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Downloaded original</text>
  </g>
  <line x1="290" y1="130" x2="370" y2="130" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="114" text-anchor="middle" font-size="15" fill="#1b2a3a">screenshot</text>
  <g>
    <rect x="380" y="40" width="250" height="180" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
    <ellipse cx="505" cy="120" rx="80" ry="50" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <rect x="380" y="190" width="250" height="30" fill="#e2e8ee"/>
    <text x="505" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a6a7a">credential: none</text>
    <text x="505" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Looks identical</text>
  </g>
  <line x1="640" y1="130" x2="720" y2="130" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="680" y="114" text-anchor="middle" font-size="15" fill="#1b2a3a">upload</text>
  <g>
    <rect x="730" y="40" width="250" height="180" rx="10" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/>
    <text x="855" y="92" text-anchor="middle" font-size="16" fill="#1b2a3a">many sites and chat</text>
    <text x="855" y="114" text-anchor="middle" font-size="16" fill="#1b2a3a">apps strip metadata</text>
    <text x="855" y="136" text-anchor="middle" font-size="16" fill="#1b2a3a">when they recompress</text>
    <rect x="730" y="190" width="250" height="30" fill="#e2e8ee"/>
    <text x="855" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a6a7a">credential: often gone</text>
    <text x="855" y="256" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Social media, email</text>
  </g>
  <text x="500" y="310" text-anchor="middle" font-size="18" fill="#1b2a3a">Easy to read, easy to lose. A missing credential proves nothing about who made the image.</text>
</svg>
