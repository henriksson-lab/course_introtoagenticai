<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <!-- card 1: medicine -->
  <rect x="20" y="20" width="300" height="320" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="170" y="56" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Pharmacology</text>
  <line x1="60" y1="210" x2="290" y2="210" stroke="#555" stroke-width="2"/>
  <line x1="60" y1="210" x2="60" y2="90" stroke="#555" stroke-width="2"/>
  <path d="M60,100 C100,140 140,170 180,185 S260,203 290,206" fill="none" stroke="#2a7f8f" stroke-width="4"/>
  <line x1="60" y1="170" x2="290" y2="170" stroke="#8a6a12" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="170" y="250" font-size="18" fill="#333" text-anchor="middle">How long does the drug</text>
  <text x="170" y="274" font-size="18" fill="#333" text-anchor="middle">stay above the level</text>
  <text x="170" y="298" font-size="18" fill="#333" text-anchor="middle">where it works?</text>
  <!-- card 2: epidemic -->
  <rect x="350" y="20" width="300" height="320" rx="12" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="500" y="56" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">Public health</text>
  <g fill="#bbb">
    <circle cx="420" cy="110" r="13"/><circle cx="470" cy="100" r="13"/><circle cx="530" cy="115" r="13"/><circle cx="580" cy="100" r="13"/>
    <circle cx="410" cy="160" r="13"/><circle cx="560" cy="165" r="13"/><circle cx="600" cy="150" r="13"/>
    <circle cx="440" cy="205" r="13"/><circle cx="520" cy="200" r="13"/><circle cx="590" cy="205" r="13"/>
  </g>
  <g fill="#a8324a"><circle cx="480" cy="155" r="13"/><circle cx="515" cy="160" r="13"/><circle cx="470" cy="200" r="13"/></g>
  <text x="500" y="250" font-size="18" fill="#333" text-anchor="middle">How many pupils in a</text>
  <text x="500" y="274" font-size="18" fill="#333" text-anchor="middle">school fall ill, and when</text>
  <text x="500" y="298" font-size="18" fill="#333" text-anchor="middle">is the peak?</text>
  <!-- card 3: engineering -->
  <rect x="680" y="20" width="300" height="320" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="830" y="56" font-size="22" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Engineering</text>
  <defs>
    <linearGradient id="hot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#a8324a"/><stop offset="1" stop-color="#2a7f8f"/>
    </linearGradient>
  </defs>
  <rect x="720" y="90" width="110" height="110" fill="url(#hot)"/>
  <rect x="850" y="120" width="12" height="80" fill="#555"/>
  <path d="M862,130 Q910,135 950,160" fill="none" stroke="#6b4fa0" stroke-width="10"/>
  <line x1="950" y1="165" x2="950" y2="200" stroke="#a8324a" stroke-width="3"/>
  <polygon points="943,195 957,195 950,208" fill="#a8324a"/>
  <text x="830" y="250" font-size="18" fill="#333" text-anchor="middle">How hot does the plate</text>
  <text x="830" y="274" font-size="18" fill="#333" text-anchor="middle">get? How far does the</text>
  <text x="830" y="298" font-size="18" fill="#333" text-anchor="middle">beam bend?</text>
  <!-- bottom line -->
  <rect x="20" y="370" width="960" height="80" rx="10" fill="#f4f4f4" stroke="#999"/>
  <text x="500" y="402" font-size="20" fill="#333" text-anchor="middle">An experiment is slow, costly, or not allowed. A simulation answers "what if" in minutes,</text>
  <text x="500" y="432" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">but only if the model, the numbers and the code are right.</text>
</svg>
