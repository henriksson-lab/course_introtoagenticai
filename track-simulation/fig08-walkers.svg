<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <!-- panel 1 -->
  <text x="160" y="36" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Start: all in one spot</text>
  <line x1="30" y1="230" x2="290" y2="230" stroke="#999" stroke-width="2"/>
  <g fill="#a8324a">
    <circle cx="160" cy="215" r="8"/><circle cx="160" cy="197" r="8"/><circle cx="160" cy="179" r="8"/><circle cx="160" cy="161" r="8"/><circle cx="160" cy="143" r="8"/><circle cx="160" cy="125" r="8"/><circle cx="160" cy="107" r="8"/><circle cx="160" cy="89" r="8"/>
  </g>
  <text x="160" y="270" font-size="17" fill="#333" text-anchor="middle">each step: one step left</text>
  <text x="160" y="293" font-size="17" fill="#333" text-anchor="middle">or right, by a coin toss</text>
  <line x1="300" y1="160" x2="350" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <!-- panel 2 -->
  <text x="500" y="36" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Later: spread out</text>
  <line x1="370" y1="230" x2="630" y2="230" stroke="#999" stroke-width="2"/>
  <g fill="#a8324a">
    <circle cx="500" cy="215" r="8"/><circle cx="500" cy="197" r="8"/><circle cx="482" cy="215" r="8"/><circle cx="518" cy="215" r="8"/>
    <circle cx="482" cy="197" r="8"/><circle cx="464" cy="215" r="8"/><circle cx="536" cy="215" r="8"/><circle cx="572" cy="215" r="8"/>
  </g>
  <text x="500" y="270" font-size="17" fill="#333" text-anchor="middle">nobody plans it; the crowd</text>
  <text x="500" y="293" font-size="17" fill="#333" text-anchor="middle">spreads anyway</text>
  <line x1="640" y1="160" x2="690" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <!-- panel 3 -->
  <text x="840" y="36" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Many walkers</text>
  <line x1="710" y1="230" x2="970" y2="230" stroke="#999" stroke-width="2"/>
  <g fill="#e3f0f2" stroke="#2a7f8f">
    <rect x="740" y="215" width="20" height="15"/><rect x="760" y="195" width="20" height="35"/><rect x="780" y="160" width="20" height="70"/>
    <rect x="800" y="120" width="20" height="110"/><rect x="820" y="95" width="20" height="135"/><rect x="840" y="92" width="20" height="138"/>
    <rect x="860" y="118" width="20" height="112"/><rect x="880" y="158" width="20" height="72"/><rect x="900" y="192" width="20" height="38"/><rect x="920" y="213" width="20" height="17"/>
  </g>
  <path d="M730,228 C780,226 800,90 840,90 S900,226 950,228" fill="none" stroke="#a8324a" stroke-width="3"/>
  <text x="840" y="270" font-size="17" fill="#333" text-anchor="middle">matches the smooth</text>
  <text x="840" y="293" font-size="17" fill="#333" text-anchor="middle">diffusion prediction</text>
  <rect x="60" y="330" width="880" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12"/>
  <text x="500" y="360" font-size="19" fill="#333" text-anchor="middle">Agent-based models shine when individuals differ or interact (crowds, infection</text>
  <text x="500" y="388" font-size="19" fill="#333" text-anchor="middle">on a contact network). In the simple case, they must agree with the smooth model.</text>
</svg>
