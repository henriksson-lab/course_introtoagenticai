<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#fff"/>
  <!-- ladder rails -->
  <line x1="60" y1="20" x2="60" y2="460" stroke="#555" stroke-width="6"/>
  <line x1="160" y1="20" x2="160" y2="460" stroke="#555" stroke-width="6"/>
  <g stroke="#555" stroke-width="5">
    <line x1="60" y1="70" x2="160" y2="70"/><line x1="60" y1="155" x2="160" y2="155"/><line x1="60" y1="240" x2="160" y2="240"/>
    <line x1="60" y1="325" x2="160" y2="325"/><line x1="60" y1="410" x2="160" y2="410"/>
  </g>
  <g font-size="18">
    <rect x="190" y="370" width="790" height="72" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="210" y="400" font-weight="bold" fill="#2a7f8f">1. A case with an exact answer</text>
    <text x="210" y="428" fill="#333">half the drug after one half-life; a straight line in the rod; P L³/(3EI) for the beam</text>
    <rect x="190" y="285" width="790" height="72" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="210" y="315" font-weight="bold" fill="#2a7f8f">2. Nothing appears from nowhere</text>
    <text x="210" y="343" fill="#333">S + I + R stays 10 000; no temperature above the hottest edge; no negative amounts</text>
    <rect x="190" y="200" width="790" height="72" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="210" y="230" font-weight="bold" fill="#8a6a12">3. Extreme cases behave sensibly</text>
    <text x="210" y="258" fill="#333">R0 below 1: no outbreak; no force: no bending; twice the dose: twice the level</text>
    <rect x="190" y="115" width="790" height="72" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="210" y="145" font-weight="bold" fill="#6b4fa0">4. Smaller steps, finer mesh: the answer stops changing</text>
    <text x="210" y="173" fill="#333">halve the step or the cell size; report how much the key number moved</text>
    <rect x="190" y="30" width="790" height="72" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="210" y="60" font-weight="bold" fill="#a8324a">5. Compare with real measurements</text>
    <text x="210" y="88" fill="#333">your field's data or published results: is this the right model at all?</text>
  </g>
  <text x="110" y="475" font-size="15" fill="#666" text-anchor="middle">start here</text>
</svg>
