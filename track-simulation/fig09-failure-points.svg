<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <g font-size="18" text-anchor="middle">
    <rect x="10" y="60" width="150" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="85" y="102" fill="#2a7f8f" font-weight="bold">Model</text>
    <rect x="175" y="60" width="150" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="250" y="92" fill="#8a6a12" font-weight="bold">Numbers</text>
    <text x="250" y="116" fill="#8a6a12" font-weight="bold">and units</text>
    <rect x="340" y="60" width="150" height="70" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="415" y="92" fill="#6b4fa0" font-weight="bold">Start and</text>
    <text x="415" y="116" fill="#6b4fa0" font-weight="bold">edges</text>
    <rect x="505" y="60" width="150" height="70" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
    <text x="580" y="92" fill="#333" font-weight="bold">Step size</text>
    <text x="580" y="116" fill="#333" font-weight="bold">and mesh</text>
    <rect x="670" y="60" width="150" height="70" rx="10" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
    <text x="745" y="102" fill="#333" font-weight="bold">Code</text>
    <rect x="835" y="60" width="150" height="70" rx="10" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="910" y="102" fill="#2a7f8f" font-weight="bold">Smooth plot</text>
  </g>
  <g stroke="#555" stroke-width="2">
    <line x1="160" y1="95" x2="173" y2="95" marker-end="url(#a)"/><line x1="325" y1="95" x2="338" y2="95" marker-end="url(#a)"/>
    <line x1="490" y1="95" x2="503" y2="95" marker-end="url(#a)"/><line x1="655" y1="95" x2="668" y2="95" marker-end="url(#a)"/>
    <line x1="820" y1="95" x2="833" y2="95" marker-end="url(#a)"/>
  </g>
  <g font-size="16" fill="#a8324a" text-anchor="middle">
    <text x="85" y="170">wrong mechanism</text><text x="85" y="192">for the question</text>
    <text x="250" y="170">hours read as</text><text x="250" y="192">minutes; a value</text><text x="250" y="214">from another drug</text>
    <text x="415" y="170">an insulated edge</text><text x="415" y="192">treated as a cold</text><text x="415" y="214">one</text>
    <text x="580" y="170">too big a step:</text><text x="580" y="192">blows up; too</text><text x="580" y="214">coarse: too stiff</text>
    <text x="745" y="170">a sign or index</text><text x="745" y="192">off by one</text>
  </g>
  <g fill="#a8324a" font-size="30" font-weight="bold" text-anchor="middle">
    <text x="85" y="52">✗</text><text x="250" y="52">✗</text><text x="415" y="52">✗</text><text x="580" y="52">✗</text><text x="745" y="52">✗</text>
  </g>
  <rect x="80" y="270" width="840" height="130" rx="12" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="500" y="312" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">Every one of these mistakes still gives a smooth, plausible plot.</text>
  <text x="500" y="348" font-size="19" fill="#333" text-anchor="middle">The code runs, there are no error messages, the curve has the right shape.</text>
  <text x="500" y="378" font-size="19" fill="#333" text-anchor="middle">Only checks against known answers find them.</text>
</svg>
