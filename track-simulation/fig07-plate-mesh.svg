<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#555" stroke-width="3"/>
    </pattern>
  </defs>
  <!-- left: plate -->
  <text x="250" y="36" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Heat in a plate</text>
  <g stroke="#6b4fa0" stroke-width="1.2" fill="none">
    <rect x="110" y="80" width="280" height="280" fill="#f1edf7"/>
    <line x1="180" y1="80" x2="180" y2="360"/><line x1="250" y1="80" x2="250" y2="360"/><line x1="320" y1="80" x2="320" y2="360"/>
    <line x1="110" y1="150" x2="390" y2="150"/><line x1="110" y1="220" x2="390" y2="220"/><line x1="110" y1="290" x2="390" y2="290"/>
    <line x1="110" y1="80" x2="390" y2="360"/><line x1="180" y1="80" x2="390" y2="290"/><line x1="250" y1="80" x2="390" y2="220"/><line x1="320" y1="80" x2="390" y2="150"/>
    <line x1="110" y1="150" x2="320" y2="360"/><line x1="110" y1="220" x2="250" y2="360"/><line x1="110" y1="290" x2="180" y2="360"/>
  </g>
  <rect x="96" y="80" width="14" height="280" fill="#a8324a"/>
  <rect x="390" y="80" width="14" height="280" fill="#2a7f8f"/>
  <text x="70" y="225" font-size="19" font-weight="bold" fill="#a8324a" text-anchor="middle" transform="rotate(-90 70 225)">held at 100 °C</text>
  <text x="432" y="225" font-size="19" font-weight="bold" fill="#2a7f8f" text-anchor="middle" transform="rotate(90 432 225)">held at 20 °C</text>
  <text x="250" y="70" font-size="17" fill="#555" text-anchor="middle">insulated: no heat in or out</text>
  <text x="250" y="385" font-size="17" fill="#555" text-anchor="middle">insulated: no heat in or out</text>
  <text x="250" y="425" font-size="18" fill="#333" text-anchor="middle">the "mesh": small triangles</text>
  <text x="250" y="452" font-size="18" fill="#333" text-anchor="middle">known answer: falls in a straight line, left to right</text>
  <!-- right: beam -->
  <text x="740" y="36" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">A beam bending</text>
  <rect x="530" y="110" width="40" height="160" fill="url(#hatch)" stroke="#555"/>
  <g stroke="#6b4fa0" stroke-width="1.2">
    <rect x="570" y="170" width="380" height="40" fill="#f1edf7"/>
    <line x1="617" y1="170" x2="617" y2="210"/><line x1="665" y1="170" x2="665" y2="210"/><line x1="712" y1="170" x2="712" y2="210"/><line x1="760" y1="170" x2="760" y2="210"/>
    <line x1="807" y1="170" x2="807" y2="210"/><line x1="855" y1="170" x2="855" y2="210"/><line x1="902" y1="170" x2="902" y2="210"/>
    <line x1="570" y1="170" x2="617" y2="210"/><line x1="617" y1="170" x2="665" y2="210"/><line x1="665" y1="170" x2="712" y2="210"/><line x1="712" y1="170" x2="760" y2="210"/>
    <line x1="760" y1="170" x2="807" y2="210"/><line x1="807" y1="170" x2="855" y2="210"/><line x1="855" y1="170" x2="902" y2="210"/><line x1="902" y1="170" x2="950" y2="210"/>
  </g>
  <path d="M570,190 Q760,195 950,260" fill="none" stroke="#6b4fa0" stroke-width="4" stroke-dasharray="8,6"/>
  <line x1="950" y1="100" x2="950" y2="165" stroke="#a8324a" stroke-width="4" marker-end="url(#a)"/>
  <text x="935" y="95" font-size="19" font-weight="bold" fill="#a8324a" text-anchor="end">force P = 100 N</text>
  <text x="550" y="300" font-size="17" fill="#555" text-anchor="middle">clamped</text>
  <text x="760" y="245" font-size="16" fill="#6b4fa0" text-anchor="middle">bent shape</text>
  <text x="740" y="345" font-size="18" fill="#333" text-anchor="middle">steel, 1 m long, 5 cm high</text>
  <text x="740" y="385" font-size="18" fill="#333" text-anchor="middle">known formula for the tip:</text>
  <text x="740" y="420" font-size="22" font-weight="bold" fill="#8a6a12" text-anchor="middle">P L³ / (3 E I) = 1.52 mm</text>
  <line x1="500" y1="40" x2="500" y2="450" stroke="#ddd" stroke-width="2"/>
</svg>
