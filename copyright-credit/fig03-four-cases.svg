<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <g font-size="18">
    <!-- card 1 -->
    <rect x="15" y="20" width="235" height="420" rx="12" fill="#f1ecf8" stroke="#6b4fa0" stroke-width="2.5"/>
    <text x="132" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#6b4fa0">GEMA v OpenAI</text>
    <text x="132" y="86" text-anchor="middle" fill="#52606d">Germany · lyrics</text>
    <text x="32" y="130" font-weight="bold" fill="#1f2933">Nov 2025, Munich:</text>
    <text x="32" y="156" fill="#333">memorised lyrics</text>
    <text x="32" y="180" fill="#333">in the model are</text>
    <text x="32" y="204" fill="#333">copies; outputs</text>
    <text x="32" y="228" fill="#333">infringe</text>
    <line x1="32" y1="330" x2="232" y2="330" stroke="#c9cfd6"/>
    <text x="32" y="362" font-weight="bold" fill="#6b4fa0">Status:</text>
    <text x="32" y="388" fill="#333">on appeal</text>
    <!-- card 2 -->
    <rect x="262" y="20" width="235" height="420" rx="12" fill="#fdf8e8" stroke="#8a6a12" stroke-width="2.5"/>
    <text x="379" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6a12">Bartz v Anthropic</text>
    <text x="379" y="86" text-anchor="middle" fill="#52606d">US · books</text>
    <text x="279" y="130" font-weight="bold" fill="#1f2933">Jun 2025:</text>
    <text x="279" y="156" fill="#333">training on bought</text>
    <text x="279" y="180" fill="#333">books fair use;</text>
    <text x="279" y="204" fill="#333">pirated copies not</text>
    <text x="279" y="250" font-weight="bold" fill="#1f2933">Settled:</text>
    <text x="279" y="276" fill="#333">USD 1.5 billion,</text>
    <text x="279" y="300" fill="#333">~USD 3,000 per book</text>
    <line x1="279" y1="330" x2="479" y2="330" stroke="#c9cfd6"/>
    <text x="279" y="362" font-weight="bold" fill="#8a6a12">Status:</text>
    <text x="279" y="388" fill="#333">approved Jul 2026;</text>
    <text x="279" y="412" fill="#333">payments starting</text>
    <!-- card 3 -->
    <rect x="509" y="20" width="235" height="420" rx="12" fill="#e8f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="626" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7f8f">NYT v OpenAI</text>
    <text x="626" y="86" text-anchor="middle" fill="#52606d">US · news articles</text>
    <text x="526" y="130" font-weight="bold" fill="#1f2933">Since Dec 2023:</text>
    <text x="526" y="156" fill="#333">training without</text>
    <text x="526" y="180" fill="#333">permission; outputs</text>
    <text x="526" y="204" fill="#333">near-verbatim</text>
    <text x="526" y="228" fill="#333">articles</text>
    <line x1="526" y1="330" x2="726" y2="330" stroke="#c9cfd6"/>
    <text x="526" y="362" font-weight="bold" fill="#2a7f8f">Status:</text>
    <text x="526" y="388" fill="#333">no fair-use ruling;</text>
    <text x="526" y="412" fill="#333">pre-trial motions</text>
    <!-- card 4 -->
    <rect x="756" y="20" width="235" height="420" rx="12" fill="#f9ecef" stroke="#a8324a" stroke-width="2.5"/>
    <text x="873" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#a8324a">Getty v Stability</text>
    <text x="873" y="86" text-anchor="middle" fill="#52606d">UK · photos</text>
    <text x="773" y="130" font-weight="bold" fill="#1f2933">Nov 2025, London:</text>
    <text x="773" y="156" fill="#333">model weights do</text>
    <text x="773" y="180" fill="#333">not store images,</text>
    <text x="773" y="204" fill="#333">so not a copy;</text>
    <text x="773" y="228" fill="#333">narrow trade mark</text>
    <text x="773" y="252" fill="#333">win for Getty</text>
    <line x1="773" y1="330" x2="973" y2="330" stroke="#c9cfd6"/>
    <text x="773" y="362" font-weight="bold" fill="#a8324a">Status:</text>
    <text x="773" y="388" fill="#333">appeal heard</text>
    <text x="773" y="412" fill="#333">Nov 2026</text>
  </g>
  <text x="500" y="462" font-size="15" fill="#7b8794" text-anchor="middle">Status as of November 2026. Simplified; not legal advice.</text>
</svg>
