<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
  <!-- original (famous picture) -->
  <text x="160" y="40" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">A famous picture</text>
  <text x="160" y="64" font-size="17" fill="#52606d" text-anchor="middle">on thousands of web pages</text>
  <rect x="40" y="80" width="240" height="240" fill="#e8f3f5" stroke="#9aa5b1" stroke-width="2"/>
  <circle cx="160" cy="160" r="48" fill="#8a6a12"/>
  <path d="M60,320 L130,230 L190,280 L230,240 L280,300 L280,320 Z" fill="#2a7f8f"/>
  <rect x="85" y="100" width="40" height="16" fill="#6b4fa0"/>
  <!-- arrow -->
  <line x1="300" y1="200" x2="360" y2="200" stroke="#7b8794" stroke-width="3" marker-end="url(#a)"/>
  <text x="330" y="180" font-size="16" fill="#52606d" text-anchor="middle">trained</text>
  <!-- near copy -->
  <text x="500" y="40" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">Prompt names it</text>
  <text x="500" y="64" font-size="17" fill="#52606d" text-anchor="middle">near-copy comes out</text>
  <rect x="380" y="80" width="240" height="240" fill="#e8f3f5" stroke="#a8324a" stroke-width="3"/>
  <circle cx="503" cy="158" r="46" fill="#8a6a12"/>
  <path d="M400,320 L468,232 L530,282 L570,238 L620,302 L620,320 Z" fill="#2a7f8f"/>
  <rect x="427" y="102" width="40" height="16" fill="#6b4fa0"/>
  <!-- new combination -->
  <text x="840" y="40" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Ordinary prompt</text>
  <text x="840" y="64" font-size="17" fill="#52606d" text-anchor="middle">usually a new combination</text>
  <rect x="720" y="80" width="240" height="240" fill="#fdf8e8" stroke="#9aa5b1" stroke-width="2"/>
  <circle cx="900" cy="130" r="30" fill="#a8324a"/>
  <path d="M720,320 L760,260 L820,300 L880,220 L960,320 Z" fill="#6b4fa0" opacity="0.8"/>
  <g font-size="18" fill="#333">
    <text x="40" y="370">Risky for course pages: anything that looks like a known picture, a famous</text>
    <text x="40" y="398">character or a logo. Do not use it, even if an AI made it.</text>
  </g>
  <text x="960" y="440" font-size="14" fill="#8a97a5" text-anchor="end">schematic</text>
</svg>
