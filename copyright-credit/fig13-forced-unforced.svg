<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="330" fill="#fff"/>
  <defs>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f8f"/></marker>
  </defs>
  <!-- forced -->
  <rect x="20" y="20" width="460" height="230" rx="12" fill="#f9ecef" stroke="#a8324a" stroke-width="2.5"/>
  <text x="250" y="55" font-size="21" font-weight="bold" fill="#a8324a" text-anchor="middle">With an outside force (option C)</text>
  <ellipse cx="250" cy="150" rx="90" ry="55" fill="#e8f3f5" stroke="#2a7f8f" stroke-width="2"/>
  <path d="M195,150 C215,120 285,120 305,150 C285,180 215,180 200,155" fill="none" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#t)"/>
  <line x1="60" y1="110" x2="150" y2="135" stroke="#a8324a" stroke-width="3" marker-end="url(#r)"/>
  <line x1="60" y1="195" x2="150" y2="170" stroke="#a8324a" stroke-width="3" marker-end="url(#r)"/>
  <line x1="440" y1="110" x2="350" y2="135" stroke="#a8324a" stroke-width="3" marker-end="url(#r)"/>
  <line x1="440" y1="195" x2="350" y2="170" stroke="#a8324a" stroke-width="3" marker-end="url(#r)"/>
  <text x="250" y="235" font-size="18" fill="#333" text-anchor="middle">a force built to make the flow blow up</text>
  <!-- unforced -->
  <rect x="520" y="20" width="460" height="230" rx="12" fill="#e8f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="750" y="55" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Left alone (no outside force)</text>
  <ellipse cx="750" cy="150" rx="90" ry="55" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
  <path d="M695,150 C715,120 785,120 805,150 C785,180 715,180 700,155" fill="none" stroke="#2a7f8f" stroke-width="2.5" marker-end="url(#t)"/>
  <text x="750" y="235" font-size="18" fill="#333" text-anchor="middle">can it break down on its own?</text>
  <text x="250" y="295" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold">OpenAI's claimed proof</text>
  <text x="750" y="295" font-size="19" fill="#2a7f8f" text-anchor="middle" font-weight="bold">What many experts mean; still open</text>
</svg>
