<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
  <!-- project folder -->
  <rect x="700" y="130" width="270" height="170" rx="12" fill="#f0f4f8" stroke="#52606d" stroke-width="2.5"/>
  <text x="835" y="200" font-size="22" font-weight="bold" fill="#1f2933" text-anchor="middle">Your project</text>
  <text x="835" y="230" font-size="18" fill="#52606d" text-anchor="middle">what you publish</text>
  <g font-size="19">
    <rect x="20" y="25" width="420" height="110" rx="10" fill="#f9ecef" stroke="#a8324a" stroke-width="2"/>
    <text x="40" y="60" font-weight="bold" fill="#a8324a">1. From memory</text>
    <text x="40" y="90" fill="#333">the model reproduces text, code or</text>
    <text x="40" y="116" fill="#333">images it saw many times in training</text>
    <rect x="20" y="165" width="420" height="110" rx="10" fill="#fdf8e8" stroke="#8a6a12" stroke-width="2"/>
    <text x="40" y="200" font-weight="bold" fill="#8a6a12">2. From a fetch</text>
    <text x="40" y="230" fill="#333">the agent read a web page or PDF in</text>
    <text x="40" y="256" fill="#333">this session and pasted from it</text>
    <rect x="20" y="305" width="420" height="110" rx="10" fill="#f1ecf8" stroke="#6b4fa0" stroke-width="2"/>
    <text x="40" y="340" font-weight="bold" fill="#6b4fa0">3. From you</text>
    <text x="40" y="370" fill="#333">files you or a colleague put in the</text>
    <text x="40" y="396" fill="#333">folder: a found image, a copied figure</text>
  </g>
  <line x1="442" y1="80" x2="695" y2="170" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="442" y1="220" x2="695" y2="215" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="442" y1="360" x2="695" y2="260" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/>
  <g font-size="16" fill="#52606d" font-style="italic">
    <text x="470" y="105">check: exact-phrase search</text>
    <text x="470" y="207">check: ask for sources</text>
    <text x="470" y="345">check: your own notes</text>
  </g>
</svg>
