<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="470" fill="#fff"/>
  <!-- computer -->
  <rect x="20" y="20" width="560" height="430" rx="14" fill="#fafafa" stroke="#555" stroke-width="2"/>
  <text x="40" y="52" font-size="20" font-weight="bold" fill="#333">Your computer</text>
  <rect x="50" y="80" width="200" height="90" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="150" y="132" font-size="19" font-weight="bold" fill="#2a7f8f" text-anchor="middle">The agent</text>
  <rect x="330" y="80" width="220" height="90" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="440" y="117" font-size="18" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Local connector</text>
  <text x="440" y="143" font-size="16" fill="#333" text-anchor="middle">e.g. Zotero</text>
  <line x1="255" y1="125" x2="322" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="330" y="230" width="220" height="70" rx="10" fill="#fff" stroke="#999"/>
  <text x="440" y="272" font-size="17" fill="#333" text-anchor="middle">Zotero library</text>
  <rect x="50" y="230" width="220" height="70" rx="10" fill="#fff" stroke="#999"/>
  <text x="160" y="272" font-size="17" fill="#333" text-anchor="middle">your files</text>
  <line x1="440" y1="175" x2="440" y2="222" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="380" y1="175" x2="200" y2="225" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="40" y="350" font-size="17" fill="#333">A local connector is a program. It runs with</text>
  <text x="40" y="374" font-size="17" fill="#333">your permissions: it <tspan fill="#a8324a" font-weight="bold">could</tspan> read or change</text>
  <text x="40" y="398" font-size="17" fill="#333">anything you can, without asking the agent.</text>
  <!-- internet -->
  <rect x="640" y="20" width="340" height="430" rx="14" fill="#fff" stroke="#8a6a12" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="660" y="52" font-size="20" font-weight="bold" fill="#8a6a12">A server elsewhere</text>
  <rect x="680" y="80" width="260" height="90" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="810" y="117" font-size="18" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Remote connector</text>
  <text x="810" y="143" font-size="16" fill="#333" text-anchor="middle">e.g. PubMed</text>
  <rect x="680" y="230" width="260" height="70" rx="10" fill="#fff" stroke="#999"/>
  <text x="810" y="272" font-size="17" fill="#333" text-anchor="middle">PubMed database</text>
  <line x1="810" y1="175" x2="810" y2="222" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M250,95 C 400,30 560,30 672,100" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="810" y="73" font-size="14" fill="#555" text-anchor="middle">receives: search terms, text the agent sends</text>
  <text x="660" y="350" font-size="17" fill="#333">Cannot see your files.</text>
  <text x="660" y="374" font-size="17" fill="#333">Sees everything the</text>
  <text x="660" y="398" font-size="17" fill="#333">agent sends to it.</text>
</svg>
