<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#fff"/>
  <text x="250" y="32" font-size="18" fill="#666" text-anchor="middle">where it lives</text>
  <text x="560" y="32" font-size="18" fill="#666" text-anchor="middle">when it is used</text>
  <text x="850" y="32" font-size="18" fill="#666" text-anchor="middle">example</text>
  <g font-size="19">
    <rect x="20" y="50" width="960" height="78" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="40" y="84" font-weight="bold" fill="#555">Instruction file</text>
    <text x="40" y="110" font-size="16" fill="#555">CLAUDE.md / AGENTS.md</text>
    <text x="420" y="94" fill="#333">read at the start of every session</text>
    <text x="760" y="94" font-size="16" fill="#555">"data/raw is read-only"</text>

    <rect x="20" y="140" width="960" height="78" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="3"/>
    <text x="40" y="174" font-weight="bold" fill="#2a7f8f">Skill</text>
    <text x="40" y="200" font-size="16" fill="#2a7f8f">a folder with SKILL.md</text>
    <text x="420" y="184" fill="#333">when the task matches its description</text>
    <text x="760" y="184" font-size="16" fill="#555">figure house style</text>

    <rect x="20" y="230" width="960" height="78" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="3"/>
    <text x="40" y="264" font-weight="bold" fill="#2a7f8f">Slash command</text>
    <text x="40" y="290" font-size="16" fill="#2a7f8f">a skill you call by name</text>
    <text x="420" y="274" fill="#333">when you type /figure-style</text>
    <text x="760" y="274" font-size="16" fill="#555">/figure-style growth.csv</text>

    <rect x="20" y="320" width="960" height="78" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="3"/>
    <text x="40" y="354" font-weight="bold" fill="#6b4fa0">MCP connector</text>
    <text x="40" y="380" font-size="16" fill="#6b4fa0">new tools for the agent</text>
    <text x="420" y="364" fill="#333">when the agent decides to call a tool</text>
    <text x="760" y="364" font-size="16" fill="#555">search PubMed</text>

    <rect x="20" y="410" width="960" height="78" rx="10" fill="#fff" stroke="#bbb" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="40" y="444" font-weight="bold" fill="#888">Hook</text>
    <text x="40" y="470" font-size="16" fill="#888">a rule in the settings</text>
    <text x="420" y="454" fill="#888">automatically, at fixed moments</text>
    <text x="760" y="454" font-size="16" fill="#888">rerun a check after each edit</text>
  </g>
  <text x="980" y="512" font-size="15" fill="#2a7f8f" text-anchor="end">today: skills, commands, connectors · hooks: mention only</text>
</svg>
