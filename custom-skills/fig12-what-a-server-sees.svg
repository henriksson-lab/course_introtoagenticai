<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#fff"/>
  <g font-size="17">
    <rect x="20" y="20" width="310" height="420" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2.5"/>
    <text x="175" y="58" font-size="21" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Local connector</text>
    <text x="175" y="84" fill="#555" text-anchor="middle">a program on your computer</text>
    <text x="40" y="135" fill="#333">can read your files</text>
    <text x="40" y="170" fill="#333">can change or delete them</text>
    <text x="40" y="205" fill="#333">can send data anywhere</text>
    <text x="40" y="240" fill="#333">does not ask the agent's</text>
    <text x="40" y="262" fill="#333">permission to do so</text>
    <text x="40" y="330" fill="#a8324a" font-weight="bold">Trust needed: high</text>
    <text x="40" y="360" fill="#555">as for any program you</text>
    <text x="40" y="382" fill="#555">install</text>

    <rect x="345" y="20" width="310" height="420" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2.5"/>
    <text x="500" y="58" font-size="21" font-weight="bold" fill="#8a6a12" text-anchor="middle">Remote connector</text>
    <text x="500" y="84" fill="#555" text-anchor="middle">a service run by someone</text>
    <text x="365" y="135" fill="#333">sees your search terms</text>
    <text x="365" y="170" fill="#333">sees any text the agent</text>
    <text x="365" y="192" fill="#333">passes to it</text>
    <text x="365" y="227" fill="#333">returns text the agent</text>
    <text x="365" y="249" fill="#333">will read and act on</text>
    <text x="365" y="330" fill="#a8324a" font-weight="bold">Trust needed: medium</text>
    <text x="365" y="360" fill="#555">who runs it, and what</text>
    <text x="365" y="382" fill="#555">do they keep?</text>

    <rect x="670" y="20" width="310" height="420" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="825" y="58" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Someone's skill</text>
    <text x="825" y="84" fill="#555" text-anchor="middle">instructions + maybe scripts</text>
    <text x="690" y="135" fill="#333">instructions the agent</text>
    <text x="690" y="157" fill="#333">follows by design</text>
    <text x="690" y="192" fill="#333">scripts the agent may run</text>
    <text x="690" y="227" fill="#333">runs inside your agent's</text>
    <text x="690" y="249" fill="#333">permissions</text>
    <text x="690" y="330" fill="#a8324a" font-weight="bold">Trust needed: read it</text>
    <text x="690" y="360" fill="#555">every line of SKILL.md,</text>
    <text x="690" y="382" fill="#555">and any scripts</text>
  </g>
</svg>
