<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="470" fill="#fff"/>
  <g font-size="20" text-anchor="middle" font-weight="bold">
    <text x="165" y="35" fill="#333">1. Session starts</text>
    <text x="500" y="35" fill="#333">2. Request matches</text>
    <text x="835" y="35" fill="#333">3. Only if needed</text>
  </g>
  <!-- stage 1: list of names -->
  <rect x="20" y="55" width="290" height="300" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
  <text x="40" y="85" font-size="16" fill="#666">the agent sees only:</text>
  <g font-size="16">
    <rect x="35" y="100" width="260" height="56" rx="6" fill="#e3f0f2" stroke="#2a7f8f"/>
    <text x="45" y="123" font-weight="bold" fill="#2a7f8f">figure-style</text>
    <text x="45" y="145" fill="#333">"Use whenever you make a plot"</text>
    <rect x="35" y="166" width="260" height="56" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="45" y="189" font-weight="bold" fill="#555">report-style</text>
    <text x="45" y="211" fill="#555">"Use when writing a report"</text>
    <rect x="35" y="232" width="260" height="56" rx="6" fill="#fff" stroke="#bbb"/>
    <text x="45" y="255" font-weight="bold" fill="#555">lit-table</text>
    <text x="45" y="277" fill="#555">"Use for reference tables"</text>
  </g>
  <text x="165" y="330" font-size="16" fill="#666" text-anchor="middle">names + descriptions</text>
  <line x1="315" y1="200" x2="350" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- stage 2 -->
  <rect x="355" y="55" width="290" height="300" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <rect x="370" y="72" width="260" height="46" rx="6" fill="#fff" stroke="#6b4fa0"/>
  <text x="385" y="101" font-size="16" fill="#6b4fa0">you: "plot height over time"</text>
  <text x="500" y="150" font-size="16" fill="#2a7f8f" text-anchor="middle">matches figure-style:</text>
  <text x="500" y="172" font-size="16" fill="#2a7f8f" text-anchor="middle">read the whole SKILL.md</text>
  <rect x="395" y="190" width="210" height="140" rx="6" fill="#fff" stroke="#2a7f8f"/>
  <g stroke="#2a7f8f" stroke-width="3"><line x1="415" y1="215" x2="585" y2="215"/><line x1="415" y1="240" x2="565" y2="240"/><line x1="415" y1="265" x2="580" y2="265"/><line x1="415" y1="290" x2="540" y2="290"/><line x1="415" y1="315" x2="570" y2="315"/></g>
  <line x1="650" y1="200" x2="685" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- stage 3 -->
  <rect x="690" y="55" width="290" height="300" rx="10" fill="#fff" stroke="#999" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="835" y="95" font-size="16" fill="#555" text-anchor="middle">SKILL.md points to</text>
  <text x="835" y="117" font-size="16" fill="#555" text-anchor="middle">extra files:</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#555">
    <rect x="725" y="140" width="220" height="44" rx="6" fill="#f4f4f4"/><text x="740" y="168">example-figure.R</text>
    <rect x="725" y="200" width="220" height="44" rx="6" fill="#f4f4f4"/><text x="740" y="228">palette.md</text>
  </g>
  <text x="835" y="300" font-size="16" fill="#555" text-anchor="middle">opened only when</text>
  <text x="835" y="322" font-size="16" fill="#555" text-anchor="middle">the instructions say so</text>
  <rect x="20" y="380" width="960" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="412" font-size="19" fill="#8a6a12" text-anchor="middle" font-weight="bold">The description is the most important line you write.</text>
  <text x="500" y="438" font-size="17" fill="#333" text-anchor="middle">Vague description: the skill is never picked up. Then call it by name.</text>
</svg>
