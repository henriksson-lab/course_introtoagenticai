<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <text x="250" y="32" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">growth.csv: a time course</text>
  <text x="750" y="32" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">course-eval.csv: yearly scores</text>
  <!-- panel 1 -->
  <rect x="60" y="50" width="380" height="290" fill="#fff" stroke="#ccc" stroke-dasharray="4 4"/>
  <g stroke="#333" stroke-width="1.5"><line x1="120" y1="290" x2="420" y2="290"/><line x1="120" y1="70" x2="120" y2="290"/></g>
  <g font-size="16" fill="#333">
    <text x="270" y="325" text-anchor="middle">Day</text>
    <text x="85" y="180" text-anchor="middle" transform="rotate(-90 85 180)">Height (cm)</text>
  </g>
  <polyline points="125,282 195,240 265,200 335,160 405,125" fill="none" stroke="#000000" stroke-width="3"/>
  <polyline points="125,283 195,255 265,230 335,205 405,185" fill="none" stroke="#E69F00" stroke-width="3"/>
  <polyline points="125,281 195,220 265,165 335,115 405,80" fill="none" stroke="#56B4E9" stroke-width="3"/>
  <g font-size="15"><text x="140" y="90" fill="#000">control</text><text x="140" y="110" fill="#b07a00">low N</text><text x="140" y="130" fill="#2b86b8">high N</text></g>
  <!-- panel 2 -->
  <rect x="560" y="50" width="380" height="290" fill="#fff" stroke="#ccc" stroke-dasharray="4 4"/>
  <g stroke="#333" stroke-width="1.5"><line x1="620" y1="290" x2="920" y2="290"/><line x1="620" y1="70" x2="620" y2="290"/></g>
  <g font-size="16" fill="#333">
    <text x="770" y="325" text-anchor="middle">Year</text>
    <text x="585" y="180" text-anchor="middle" transform="rotate(-90 585 180)">Mean score (1-5)</text>
  </g>
  <g stroke-width="3" fill="none">
    <polyline points="630,160 700,130 770,115 840,120 910,105" stroke="#000000"/>
    <polyline points="630,125 700,118 770,108 840,110 910,95" stroke="#E69F00"/>
    <polyline points="630,250 700,235 770,205 840,212 910,175" stroke="#56B4E9"/>
    <polyline points="630,128 700,127 770,131 840,110 910,106" stroke="#009E73"/>
  </g>
  <!-- checks -->
  <rect x="60" y="370" width="880" height="110" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="80" y="402" font-size="19" font-weight="bold" fill="#2a7f8f">Same in both, so the skill worked:</text>
  <g font-size="17" fill="#333">
    <text x="80" y="435">1003 × 767 px (8.5 × 6.5 cm)</text>
    <text x="80" y="463">8 pt Arial, units in brackets</text>
    <text x="400" y="435">first colour black, then orange, blue</text>
    <text x="400" y="463">no title, no grey background</text>
    <text x="720" y="435">PDF + PNG</text>
    <text x="720" y="463">in results/figures/</text>
  </g>
</svg>
