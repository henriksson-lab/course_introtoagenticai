<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="340" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
  <g font-size="18" text-anchor="middle">
    <rect x="10" y="40" width="140" height="90" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
    <text x="80" y="80" fill="#2a7f8f" font-weight="bold">counts +</text><text x="80" y="104" fill="#2a7f8f" font-weight="bold">sample sheet</text>
    <rect x="175" y="40" width="140" height="90" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
    <text x="245" y="80" fill="#2a7f8f" font-weight="bold">QC</text><text x="245" y="104" fill="#555" font-size="16">sizes, PCA, corr.</text>
    <rect x="340" y="40" width="140" height="90" rx="10" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
    <text x="410" y="80" fill="#6b4fa0" font-weight="bold">DESeq2</text><text x="410" y="104" fill="#555" font-size="16">design formula</text>
    <rect x="505" y="40" width="140" height="90" rx="10" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
    <text x="575" y="80" fill="#6b4fa0" font-weight="bold">volcano</text><text x="575" y="104" fill="#6b4fa0" font-weight="bold">and MA plots</text>
    <rect x="670" y="40" width="140" height="90" rx="10" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
    <text x="740" y="80" fill="#a8324a" font-weight="bold">enrichment</text><text x="740" y="104" fill="#555" font-size="16">pathways, GO</text>
    <rect x="835" y="40" width="155" height="90" rx="10" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
    <text x="912" y="80" fill="#a8324a" font-weight="bold">literature</text><text x="912" y="104" fill="#a8324a" font-weight="bold">table</text>
  </g>
  <g stroke="#777" stroke-width="2.5" marker-end="url(#a)">
    <line x1="150" y1="85" x2="172" y2="85"/><line x1="315" y1="85" x2="337" y2="85"/><line x1="480" y1="85" x2="502" y2="85"/>
    <line x1="645" y1="85" x2="667" y2="85"/><line x1="810" y1="85" x2="832" y2="85"/>
  </g>
  <text x="10" y="180" font-size="18" fill="#8a6a12" font-weight="bold">check:</text>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="80" y="215">names match?</text><text x="80" y="238">all samples in?</text>
    <text x="245" y="215">odd samples?</text><text x="245" y="238">swaps? batches?</text>
    <text x="410" y="215">design matches</text><text x="410" y="238">the experiment?</text>
    <text x="575" y="215">known genes</text><text x="575" y="238">where expected?</text>
    <text x="740" y="215">right</text><text x="740" y="238">background?</text>
    <text x="912" y="215">references</text><text x="912" y="238">real?</text>
  </g>
  <rect x="10" y="275" width="980" height="45" rx="8" fill="#f4f4f4"/>
  <text x="500" y="304" font-size="18" text-anchor="middle" fill="#333">all of it in scripts on disk: rerun from scratch gives the same numbers</text>
