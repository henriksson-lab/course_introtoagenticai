<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#fff"/>
  <rect x="20" y="20" width="600" height="400" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
  <rect x="20" y="20" width="600" height="44" rx="8" fill="#e9eef0"/>
  <text x="40" y="49" font-size="18" fill="#333" font-weight="bold">Your RNA-seq data are ready</text>
  <text x="40" y="94" font-size="17" fill="#555">From: Sequencing facility</text>
  <text x="40" y="120" font-size="17" fill="#555">Project: drug response pilot, 12 samples</text>
  <text x="40" y="160" font-size="17" fill="#333">Reads were aligned and counted per gene.</text>
  <text x="40" y="186" font-size="17" fill="#333">Please find the count table attached.</text>
  <g font-size="17">
    <rect x="40" y="220" width="560" height="52" rx="6" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="60" y="252" fill="#2a7f8f" font-weight="bold">counts.csv</text>
    <text x="220" y="252" fill="#555">10 000 genes x 12 samples</text>
    <rect x="40" y="284" width="560" height="52" rx="6" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
    <text x="60" y="316" fill="#6b4fa0" font-weight="bold">samples.csv</text>
    <text x="220" y="316" fill="#555">which sample is which</text>
    <rect x="40" y="348" width="560" height="52" rx="6" fill="#fff" stroke="#8a6a12" stroke-width="2"/>
    <text x="60" y="380" fill="#8a6a12" font-weight="bold">lab-notes.txt</text>
    <text x="220" y="380" fill="#555">from the person who did the lab work</text>
  </g>
  <g transform="rotate(3 820 210)">
    <rect x="680" y="80" width="280" height="250" fill="#fdf3c4" stroke="#d9c77a" stroke-width="1.5"/>
    <text x="700" y="125" font-size="20" fill="#333">Which genes change</text>
    <text x="700" y="153" font-size="20" fill="#333">with the drug?</text>
    <text x="700" y="195" font-size="20" fill="#333">Anything we already</text>
    <text x="700" y="223" font-size="20" fill="#333">know about them?</text>
  </g>
  <text x="980" y="450" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
