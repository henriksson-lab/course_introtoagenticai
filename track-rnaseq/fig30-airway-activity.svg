<text x="20" y="445" font-size="17" fill="#333" text-anchor="start">Rank 1 is the progesterone receptor, which these cells barely express (mean count 6).</text>
<text x="20" y="470" font-size="17" fill="#333" text-anchor="start">The glucocorticoid receptor, NR3C1, is rank 2. Its regulon shares 44 targets with PGR's 133.</text>
