<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
  <text x="20" y="30" font-size="18" fill="#6b4fa0" font-weight="bold">DESeq2 results</text>
  <g font-size="16" fill="#333">
    <rect x="20" y="42" width="400" height="30" fill="#f3f0f8"/>
    <text x="30" y="63" font-weight="bold">gene</text><text x="150" y="63" font-weight="bold">log2FC</text><text x="260" y="63" font-weight="bold">padj</text>
    <text x="30" y="96">FKBP5</text><text x="150" y="96">4.0</text><text x="260" y="96">7e-26</text>
    <text x="30" y="124">TSC22D3</text><text x="150" y="124">3.2</text><text x="260" y="124">3e-19</text>
    <text x="30" y="152">PER1</text><text x="150" y="152">3.2</text><text x="260" y="152">2e-81</text>
    <text x="30" y="180">GAPDH</text><text x="150" y="180">-0.2</text><text x="260" y="180">0.38</text>
  </g>
  <text x="560" y="30" font-size="18" fill="#8a6a12" font-weight="bold">your literature table</text>
  <g font-size="16" fill="#333">
    <rect x="560" y="42" width="420" height="30" fill="#f6f1e1"/>
    <text x="570" y="63" font-weight="bold">gene</text><text x="680" y="63" font-weight="bold">reported</text><text x="870" y="63" font-weight="bold">PMID</text>
    <text x="570" y="96">FKBP5</text><text x="680" y="96">up with GC</text><text x="870" y="96">verified</text>
    <text x="570" y="124">TSC22D3</text><text x="680" y="124">up with GC</text><text x="870" y="124">verified</text>
    <text x="570" y="152">PER1</text><text x="680" y="152">up with GC</text><text x="870" y="152">verified</text>
  </g>
  <line x1="220" y1="195" x2="420" y2="255" stroke="#777" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="770" y1="170" x2="580" y2="255" stroke="#777" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="500" y="230" font-size="17" text-anchor="middle" fill="#555">join by gene name</text>
  <g font-size="16" fill="#333">
    <rect x="120" y="265" width="760" height="30" fill="#eef6f7"/>
    <text x="130" y="286" font-weight="bold">gene</text><text x="250" y="286" font-weight="bold">our result</text><text x="430" y="286" font-weight="bold">literature</text><text x="620" y="286" font-weight="bold">agrees?</text>
    <text x="130" y="320">FKBP5</text><text x="250" y="320">up, 16-fold</text><text x="430" y="320">up with GC</text><text x="620" y="320" fill="#2a7f8f" font-weight="bold">yes</text>
    <text x="130" y="348">TSC22D3</text><text x="250" y="348">up, 9-fold</text><text x="430" y="348">up with GC</text><text x="620" y="348" fill="#2a7f8f" font-weight="bold">yes</text>
    <text x="130" y="376">PER1</text><text x="250" y="376">up, 9-fold</text><text x="430" y="376">up with GC</text><text x="620" y="376" fill="#2a7f8f" font-weight="bold">yes</text>
    <text x="130" y="404">SPARCL1</text><text x="250" y="404">up, 24-fold</text><text x="430" y="404">not in table</text><text x="620" y="404" fill="#8a6a12" font-weight="bold">new to you: look it up</text>
  </g>
  <text x="20" y="455" font-size="16" fill="#777">airway: dexamethasone (a glucocorticoid, GC) vs untreated. Fold changes from our run; literature column illustrative.</text>
