<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <rect x="20" y="30" width="560" height="380" rx="14" fill="#f4f4f4" stroke="#bbb" stroke-width="2"/>
  <text x="40" y="62" font-size="18" fill="#555">background: all 16 000 genes that were tested</text>
  <circle cx="230" cy="240" r="130" fill="#a8324a" fill-opacity="0.18" stroke="#a8324a" stroke-width="2.5"/>
  <circle cx="390" cy="240" r="85" fill="#2a7f8f" fill-opacity="0.18" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="170" y="235" font-size="18" text-anchor="middle" fill="#a8324a" font-weight="bold">your gene list</text>
  <text x="170" y="260" font-size="18" text-anchor="middle" fill="#a8324a">1 000 genes</text>
  <text x="430" y="235" font-size="18" text-anchor="middle" fill="#2a7f8f" font-weight="bold">a pathway</text>
  <text x="430" y="260" font-size="18" text-anchor="middle" fill="#2a7f8f">150 genes</text>
  <text x="330" y="248" font-size="26" text-anchor="middle" fill="#333" font-weight="bold">30</text>
  <g font-size="19" fill="#333">
    <text x="610" y="100">By chance you expect:</text>
    <text x="610" y="130">150 x 1 000 / 16 000 ≈ <tspan font-weight="bold">9</tspan></text>
    <text x="610" y="180">You see <tspan font-weight="bold">30</tspan>: about 3 times</text>
    <text x="610" y="206">more than chance.</text>
    <text x="610" y="256">Repeat for thousands of</text>
    <text x="610" y="282">pathways, correct for</text>
    <text x="610" y="308">multiple testing.</text>
    <text x="610" y="358" fill="#a8324a">Wrong background (the whole</text>
    <text x="610" y="384" fill="#a8324a">genome) inflates the result.</text>
  </g>
  <text x="975" y="432" font-size="14" fill="#999" text-anchor="end">numbers illustrative</text>
</svg>
