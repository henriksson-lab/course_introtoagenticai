<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <text x="20" y="35" font-size="19" fill="#2a7f8f" font-weight="bold">counts.csv: column order</text>
  <g font-size="17">
    <g fill="#333">
      <rect x="20" y="55" width="70" height="36" fill="#eef6f7"/><text x="35" y="80">S01</text>
      <rect x="95" y="55" width="70" height="36" fill="#eef6f7"/><text x="110" y="80">S02</text>
      <rect x="170" y="55" width="70" height="36" fill="#eef6f7"/><text x="185" y="80">S03</text>
      <rect x="245" y="55" width="70" height="36" fill="#f8eef0" stroke="#a8324a" stroke-width="2.5"/><text x="260" y="80">S04</text>
      <rect x="320" y="55" width="70" height="36" fill="#eef6f7"/><text x="335" y="80">S05</text>
      <text x="410" y="80">...</text>
    </g>
  </g>
  <text x="20" y="145" font-size="19" fill="#6b4fa0" font-weight="bold">samples.csv: row order</text>
  <g font-size="17" fill="#333">
    <rect x="20" y="160" width="400" height="34" fill="#f3f0f8"/>
    <text x="30" y="183" font-weight="bold">sample_id</text><text x="150" y="183" font-weight="bold">treatment</text><text x="280" y="183" font-weight="bold">batch</text>
    <text x="30" y="218">S01</text><text x="150" y="218">control</text><text x="280" y="218">day1</text>
    <text x="30" y="250">S02</text><text x="150" y="250">control</text><text x="280" y="250">day1</text>
    <text x="30" y="282">S03</text><text x="150" y="282">control</text><text x="280" y="282">day1</text>
    <rect x="20" y="292" width="400" height="32" fill="none" stroke="#a8324a" stroke-width="2.5"/>
    <text x="30" y="314">S07</text><text x="150" y="314">control</text><text x="280" y="314">day2</text>
    <text x="30" y="346">S08</text><text x="150" y="346">control</text><text x="280" y="346">day2</text>
    <text x="30" y="378">...</text>
  </g>
  <line x1="280" y1="93" x2="300" y2="290" stroke="#a8324a" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="19" fill="#333">
    <text x="490" y="190">4th column = <tspan fill="#a8324a" font-weight="bold">S04 (treated)</tspan></text>
    <text x="490" y="222">4th row = <tspan fill="#a8324a" font-weight="bold">S07 (control)</tspan></text>
    <text x="490" y="270">Matched by position, S04 is silently</text>
    <text x="490" y="296">called control. Nothing crashes.</text>
    <text x="490" y="350" font-weight="bold" fill="#2a7f8f">Match by sample name, and ask the</text>
    <text x="490" y="376" font-weight="bold" fill="#2a7f8f">agent to show you the matched table.</text>
  </g>
  <text x="20" y="425" font-size="16" fill="#777">the synthetic example: sample sheet sorted by group, count columns sorted by number</text>
</svg>
