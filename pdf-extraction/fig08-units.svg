<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <rect x="20" y="20" width="440" height="200" rx="6" fill="#fff" stroke="#999"/>
  <text x="40" y="52" font-size="17" font-weight="bold" fill="#333">Aldersen 2021, Table 1</text>
  <g font-size="16" fill="#333">
    <text x="40" y="92" font-weight="bold">Group</text><text x="140" y="92" font-weight="bold">n</text><text x="200" y="92" font-weight="bold">Mean 25(OH)D <tspan fill="#2a7f8f" font-weight="bold" text-decoration="underline">(nmol/L)</tspan></text>
    <text x="40" y="130">All</text><text x="140" y="130">212</text><text x="200" y="130">58.4</text>
  </g>
  <rect x="520" y="20" width="460" height="200" rx="6" fill="#fff" stroke="#999"/>
  <text x="540" y="52" font-size="17" font-weight="bold" fill="#333">Moreau 2019, Table 1</text>
  <g font-size="16" fill="#333">
    <text x="540" y="92" font-weight="bold">Measure</text><text x="800" y="92" font-weight="bold">Value</text>
    <text x="540" y="130">Mean 25(OH)D <tspan fill="#a8324a" font-weight="bold" text-decoration="underline">(ng/mL)</tspan></text><text x="800" y="130">21.6</text>
  </g>
  <text x="40" y="190" font-size="16" fill="#555">the unit is in the column header</text>
  <text x="540" y="190" font-size="16" fill="#555">the unit is in the row label</text>
  <g font-size="19" fill="#333">
    <text x="20" y="270">Copy the numbers and you get <tspan font-weight="bold">58.4</tspan> and <tspan font-weight="bold">21.6</tspan>: the second looks far lower.</text>
    <text x="20" y="310">Convert: 21.6 ng/mL × 2.496 = <tspan font-weight="bold" fill="#2a7f8f">53.9 nmol/L</tspan>. Almost the same.</text>
  </g>
  <text x="20" y="365" font-size="18" fill="#8a6a12" font-weight="bold">Keep the value as printed and its unit, then the converted value, in separate columns.</text>
  <text x="20" y="393" font-size="18" fill="#8a6a12" font-weight="bold">You check the conversion factor; the agent only applies it.</text>
</svg>
