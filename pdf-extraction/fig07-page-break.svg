<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <!-- page 1 -->
  <rect x="20" y="20" width="400" height="370" fill="#fff" stroke="#999"/>
  <text x="400" y="44" font-size="14" fill="#999" text-anchor="end">page 1</text>
  <g font-size="15" fill="#333">
    <text x="40" y="160" font-weight="bold">Table 1. Serum 25(OH)D (nmol/L) by district.</text>
    <rect x="36" y="172" width="370" height="28" fill="#e3f1f3"/>
    <text x="40" y="192" font-weight="bold">District</text><text x="150" y="192" font-weight="bold">n</text><text x="200" y="192" font-weight="bold">Mean (nmol/L)</text><text x="320" y="192" font-weight="bold">SD (nmol/L)</text>
    <text x="40" y="222">Ask</text><text x="150" y="222">15</text><text x="200" y="222">57,5</text><text x="320" y="222">18,5</text>
    <text x="40" y="248">Berga</text><text x="150" y="248">8</text><text x="200" y="248">40,2</text><text x="320" y="248">17,6</text>
    <text x="40" y="274">…</text>
    <text x="40" y="300">Malma</text><text x="150" y="300">11</text><text x="200" y="300">36,7</text><text x="320" y="300">16,6</text>
    <text x="40" y="326">Nora</text><text x="150" y="326">9</text><text x="200" y="326">47,7</text><text x="320" y="326">18,6</text>
  </g>
  <g fill="#ccc"><rect x="40" y="60" width="340" height="10"/><rect x="40" y="80" width="300" height="10"/><rect x="40" y="100" width="320" height="10"/><rect x="40" y="120" width="200" height="10"/></g>
  <!-- page 2 -->
  <rect x="560" y="20" width="400" height="370" fill="#fff" stroke="#999"/>
  <text x="940" y="44" font-size="14" fill="#999" text-anchor="end">page 2</text>
  <g font-size="15" fill="#333">
    <text x="580" y="74">Orsa</text><text x="690" y="74">12</text><text x="740" y="74">44,0</text><text x="860" y="74">19,8</text>
    <text x="580" y="100">Rimbo</text><text x="690" y="100">10</text><text x="740" y="100">42,5</text><text x="860" y="100">20,4</text>
    <text x="580" y="126">…</text>
    <text x="580" y="152">Älvsbyn</text><text x="690" y="152">15</text><text x="740" y="152">49,6</text><text x="860" y="152">13,0</text>
    <rect x="576" y="162" width="370" height="28" fill="#fbf3f5" stroke="#a8324a"/>
    <text x="580" y="182" font-weight="bold">All districts</text><text x="690" y="182" font-weight="bold">416</text><text x="740" y="182" font-weight="bold">48,2</text><text x="860" y="182" font-weight="bold">17,9</text>
  </g>
  <g fill="#ccc"><rect x="580" y="220" width="340" height="10"/><rect x="580" y="240" width="300" height="10"/></g>
  <text x="760" y="290" font-size="16" fill="#a8324a" text-anchor="middle">no header on this page:</text>
  <text x="760" y="312" font-size="16" fill="#a8324a" text-anchor="middle">which column is the mean?</text>
  <text x="760" y="340" font-size="16" fill="#a8324a" text-anchor="middle">and "48,2" has a decimal comma</text>
  <path d="M425,190 C490,190 500,170 565,170" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="20" y="425" font-size="18" fill="#333">The answer is in the last row, on the page after the header. Read per page, it loses its meaning.</text>
</svg>
