<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#fff"/>
  <!-- table row -->
  <rect x="20" y="40" width="420" height="140" rx="6" fill="#fafafa" stroke="#bbb"/>
  <text x="35" y="70" font-size="17" font-weight="bold" fill="#333">Row 3 (picked at random)</text>
  <g font-size="16" fill="#333">
    <text x="35" y="100">file: 03_Nyberg-2022.pdf</text>
    <text x="35" y="124">n = 416, mean = 48.2 nmol/L</text>
    <text x="35" y="148">page 2, Table 1, last row</text>
  </g>
  <line x1="445" y1="110" x2="525" y2="110" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="485" y="96" font-size="15" fill="#555" text-anchor="middle">open p. 2</text>
  <!-- PDF page -->
  <rect x="535" y="20" width="440" height="230" fill="#fff" stroke="#999"/>
  <g font-size="15" fill="#333">
    <text x="555" y="52">Rimbo</text><text x="690" y="52">10</text><text x="760" y="52">42,5</text><text x="860" y="52">20,4</text>
    <text x="555" y="78">…</text>
    <text x="555" y="104">Älvsbyn</text><text x="690" y="104">15</text><text x="760" y="104">49,6</text><text x="860" y="104">13,0</text>
    <rect x="550" y="114" width="410" height="28" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="555" y="134" font-weight="bold">All districts</text><text x="690" y="134" font-weight="bold">416</text><text x="760" y="134" font-weight="bold">48,2</text><text x="860" y="134" font-weight="bold">17,9</text>
  </g>
  <text x="555" y="180" font-size="15" fill="#555">then: is column 3 the mean? (header on p. 1)</text>
  <text x="555" y="204" font-size="15" fill="#555">is 416 the number analysed?</text>
  <!-- checklist -->
  <g font-size="18" fill="#333">
    <text x="20" y="290" font-weight="bold">For each sampled row, without the agent:</text>
    <text x="40" y="322">1. Open the PDF at the page the table names. Is the value there?</text>
    <text x="40" y="350">2. Is it the right value: right group, right column, mean not median?</text>
    <text x="40" y="378">3. Unit and conversion right? Decimal comma read as a point?</text>
    <text x="40" y="406">4. Write ok, or what was wrong, in notes/hand-checks.md.</text>
  </g>
</svg>
