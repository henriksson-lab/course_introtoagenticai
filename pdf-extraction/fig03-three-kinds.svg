<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <!-- text pdf -->
  <rect x="40" y="30" width="250" height="230" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
  <g font-size="14" fill="#333">
    <text x="60" y="62" font-weight="bold">Results</text>
    <text x="60" y="86">212 adults took part.</text>
    <text x="60" y="108">The mean was 58.4 nmol/L</text>
    <rect x="58" y="94" width="190" height="20" fill="#2a7f8f" opacity="0.25"/>
    <text x="60" y="130">in late winter, and 31%</text>
    <text x="60" y="152">were below 50 nmol/L.</text>
  </g>
  <text x="165" y="300" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Text PDF</text>
  <text x="165" y="326" font-size="16" fill="#333" text-anchor="middle">made by Word, LaTeX, a journal</text>
  <text x="165" y="352" font-size="16" fill="#333" text-anchor="middle">text can be selected</text>
  <text x="165" y="390" font-size="16" fill="#2a7f8f" text-anchor="middle">pdftotext, pdfplumber,</text>
  <text x="165" y="412" font-size="16" fill="#2a7f8f" text-anchor="middle">or the agent reads it</text>
  <!-- scanned -->
  <rect x="375" y="30" width="250" height="230" fill="#f2f2f2" stroke="#a8324a" stroke-width="2.5" transform="rotate(-1.2 500 145)"/>
  <g font-size="14" fill="#555" transform="rotate(-1.2 500 145)" font-family="Times New Roman, serif">
    <text x="395" y="62" font-weight="bold">Results</text>
    <text x="395" y="86">Ninety-six patients were</text>
    <text x="395" y="108">included. Table 1 gives</text>
    <text x="395" y="130">the results.</text>
    <circle cx="560" cy="180" r="2" fill="#999"/><circle cx="430" cy="210" r="1.5" fill="#999"/><circle cx="600" cy="90" r="1.5" fill="#999"/>
  </g>
  <text x="500" y="300" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">Scanned PDF</text>
  <text x="500" y="326" font-size="16" fill="#333" text-anchor="middle">a photo of each page</text>
  <text x="500" y="352" font-size="16" fill="#333" text-anchor="middle">no text inside at all</text>
  <text x="500" y="390" font-size="16" fill="#a8324a" text-anchor="middle">OCR (e.g. Tesseract),</text>
  <text x="500" y="412" font-size="16" fill="#a8324a" text-anchor="middle">or a model reading the image</text>
  <!-- mixed -->
  <rect x="710" y="30" width="250" height="230" fill="#fff" stroke="#8a6a12" stroke-width="2.5"/>
  <g font-size="14" fill="#333">
    <text x="730" y="62" font-weight="bold">Results</text>
    <text x="730" y="86">Values are given in</text>
    <text x="730" y="108">Table 2 below.</text>
  </g>
  <rect x="730" y="125" width="210" height="110" fill="#eee" stroke="#999"/>
  <g stroke="#bbb"><line x1="740" y1="150" x2="930" y2="150"/><line x1="740" y1="175" x2="930" y2="175"/><line x1="740" y1="200" x2="930" y2="200"/></g>
  <text x="835" y="225" font-size="13" fill="#777" text-anchor="middle">table pasted as a picture</text>
  <text x="835" y="300" font-size="20" font-weight="bold" fill="#8a6a12" text-anchor="middle">Mixed</text>
  <text x="835" y="326" font-size="16" fill="#333" text-anchor="middle">text, plus tables or figures</text>
  <text x="835" y="352" font-size="16" fill="#333" text-anchor="middle">as images</text>
  <text x="835" y="390" font-size="16" fill="#8a6a12" text-anchor="middle">text tools miss the table;</text>
  <text x="835" y="412" font-size="16" fill="#8a6a12" text-anchor="middle">nothing tells you</text>
</svg>
