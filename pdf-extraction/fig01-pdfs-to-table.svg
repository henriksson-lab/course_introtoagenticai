    <text x="325" y="150">Moreau 2019</text><text x="455" y="150">140</text><text x="510" y="150">21.6</text><text x="590" y="150">ng/mL</text><text x="670" y="150">2</text><text x="730" y="150">1</text><text x="805" y="150">text</text>
