<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <!-- bad -->
  <rect x="20" y="15" width="470" height="440" rx="12" fill="#fff" stroke="#a8324a" stroke-width="2.5"/>
  <text x="255" y="50" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">Hard to read</text>
  <text x="45" y="95" font-size="22" fill="#bbbbbb">Light grey text on white</text>
  <text x="45" y="122" font-size="17" fill="#52606d">contrast 1.9 : 1 (fails; AA needs 4.5 : 1)</text>
  <line x1="60" y1="380" x2="440" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="380" x2="60" y2="170" stroke="#333" stroke-width="1.5"/>
  <polyline points="70,360 150,320 230,280 310,240 400,200" fill="none" stroke="#d62728" stroke-width="3"/>
  <polyline points="70,350 150,330 230,290 310,255 400,215" fill="none" stroke="#2ca02c" stroke-width="3"/>
  <rect x="300" y="300" width="14" height="4" fill="#d62728"/><text x="320" y="307" font-size="15" fill="#52606d">control</text>
  <rect x="300" y="322" width="14" height="4" fill="#2ca02c"/><text x="320" y="329" font-size="15" fill="#52606d">treated</text>
  <text x="45" y="420" font-size="17" fill="#333">red and green lines, legend only:</text>
  <text x="45" y="442" font-size="17" fill="#333">colour carries the meaning alone</text>
  <!-- good -->
  <rect x="510" y="15" width="470" height="440" rx="12" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="745" y="50" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Readable for everyone</text>
  <text x="535" y="95" font-size="22" fill="#333333">Dark grey text on white</text>
  <text x="535" y="122" font-size="17" fill="#52606d">contrast 12.6 : 1 (passes)</text>
  <line x1="550" y1="380" x2="900" y2="380" stroke="#333" stroke-width="1.5"/>
  <line x1="550" y1="380" x2="550" y2="170" stroke="#333" stroke-width="1.5"/>
  <polyline points="560,360 640,320 720,280 800,240 860,200" fill="none" stroke="#0072b2" stroke-width="3"/>
  <polyline points="560,350 640,330 720,290 800,255 860,225" fill="none" stroke="#d55e00" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="868" y="200" font-size="16" fill="#0072b2" font-weight="bold">control</text>
  <text x="868" y="232" font-size="16" fill="#d55e00" font-weight="bold">treated</text>
  <text x="535" y="420" font-size="17" fill="#333">blue and orange, solid and dashed,</text>
  <text x="535" y="442" font-size="17" fill="#333">labels next to the lines</text>
</svg>
