<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <text x="500" y="40" font-size="24" font-weight="bold" fill="#1f2933" text-anchor="middle">Week 2 of "Describing data", 150 students</text>
  <g font-size="19">
    <rect x="20" y="70" width="300" height="170" rx="12" fill="#e8f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="40" y="108" font-weight="bold" fill="#2a7f8f">Weekly quiz in Canvas</text>
    <text x="40" y="140" fill="#333">10 questions, a reason</text>
    <text x="40" y="166" fill="#333">for every wrong answer</text>
    <text x="40" y="210" fill="#52606d" font-size="17">by hand: ~3 hours</text>
    <rect x="350" y="70" width="300" height="170" rx="12" fill="#fdf8e8" stroke="#8a6a12" stroke-width="2.5"/>
    <text x="370" y="108" font-weight="bold" fill="#8a6a12">Exercise sheet × 3</text>
    <text x="370" y="140" fill="#333">new numbers in each,</text>
    <text x="370" y="166" fill="#333">answer keys for the TAs</text>
    <text x="370" y="210" fill="#52606d" font-size="17">by hand: ~2 hours</text>
    <rect x="680" y="70" width="300" height="170" rx="12" fill="#f1ecf8" stroke="#6b4fa0" stroke-width="2.5"/>
    <text x="700" y="108" font-weight="bold" fill="#6b4fa0">Lecture deck</text>
    <text x="700" y="140" fill="#333">updated slides, figures,</text>
    <text x="700" y="166" fill="#333">speaker notes</text>
    <text x="700" y="210" fill="#52606d" font-size="17">by hand: ~4 hours</text>
    <rect x="185" y="270" width="300" height="150" rx="12" fill="#f0f4f8" stroke="#52606d" stroke-width="2.5"/>
    <text x="205" y="308" font-weight="bold" fill="#1f2933">Accessibility</text>
    <text x="205" y="340" fill="#333">alt text, contrast,</text>
    <text x="205" y="366" fill="#333">captions for the recording</text>
    <rect x="515" y="270" width="300" height="150" rx="12" fill="#f9ecef" stroke="#a8324a" stroke-width="2.5"/>
    <text x="535" y="308" font-weight="bold" fill="#a8324a">Rubric for lab report</text>
    <text x="535" y="340" fill="#333">so three TAs grade</text>
    <text x="535" y="366" fill="#333">the same way</text>
  </g>
  <text x="500" y="455" font-size="15" fill="#7b8794" text-anchor="middle">times are rough guesses for illustration</text>
</svg>
