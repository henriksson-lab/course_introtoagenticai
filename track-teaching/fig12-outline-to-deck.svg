    <text x="360" y="240">![](fig01.svg){fig-alt=...}</text>
    <text x="360" y="276" fill="#e0c27a">::: notes</text>
    <text x="360" y="298">Both groups have ...</text>
    <text x="360" y="320" fill="#e0c27a">:::</text>
