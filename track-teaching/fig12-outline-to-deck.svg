  <line x1="642" y1="205" x2="695" y2="205" stroke="#52606d" stroke-width="3" marker-end="url(#a)"/>
  <text x="668" y="190" font-size="15" fill="#52606d" text-anchor="middle">Quarto</text>
  <!-- slide -->
  <rect x="700" y="95" width="280" height="190" rx="6" fill="#fff" stroke="#52606d" stroke-width="2.5"/>
  <text x="715" y="130" font-size="17" font-weight="bold" fill="#1f2933">A bar of means can hide</text>
  <text x="715" y="152" font-size="17" font-weight="bold" fill="#1f2933">the data</text>
  <rect x="740" y="190" width="40" height="70" fill="#2a7f8f"/>
  <rect x="820" y="190" width="40" height="70" fill="#2a7f8f"/>
  <circle cx="905" cy="200" r="5" fill="#a8324a"/><circle cx="915" cy="215" r="5" fill="#a8324a"/><circle cx="905" cy="250" r="5" fill="#a8324a"/><circle cx="925" cy="255" r="5" fill="#a8324a"/>
  <text x="970" y="276" font-size="13" fill="#7b8794" text-anchor="end">3 / 24</text>
