  <line x1="145" y1="288" x2="145" y2="245" stroke="#52606d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="272" y1="160" x2="345" y2="160" stroke="#52606d" stroke-width="3" marker-end="url(#a)"/>
