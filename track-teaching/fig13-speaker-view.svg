<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="20" y="15" width="960" height="420" rx="8" fill="#2d3b45"/>
  <text x="40" y="45" font-size="16" fill="#cfd6dc">Current slide</text>
  <rect x="40" y="55" width="420" height="236" fill="#fff"/>
  <text x="60" y="95" font-size="19" font-weight="bold" fill="#1f2933">A bar of means can hide</text>
  <text x="60" y="120" font-size="19" font-weight="bold" fill="#1f2933">the data</text>
  <rect x="110" y="170" width="60" height="100" fill="#2a7f8f"/><rect x="230" y="170" width="60" height="100" fill="#2a7f8f"/>
  <circle cx="350" cy="180" r="6" fill="#a8324a"/><circle cx="365" cy="200" r="6" fill="#a8324a"/><circle cx="352" cy="255" r="6" fill="#a8324a"/><circle cx="375" cy="262" r="6" fill="#a8324a"/>
  <text x="490" y="45" font-size="16" fill="#cfd6dc">Upcoming</text>
  <rect x="490" y="55" width="220" height="124" fill="#fff" opacity="0.9"/>
  <text x="505" y="85" font-size="14" font-weight="bold" fill="#1f2933">Mean and median differ</text>
  <text x="505" y="102" font-size="14" font-weight="bold" fill="#1f2933">for skewed data</text>
  <text x="760" y="70" font-size="34" fill="#fff" font-family="Courier New, monospace">0:12:41</text>
  <text x="760" y="100" font-size="16" fill="#cfd6dc">slide 3 of 24</text>
  <text x="40" y="325" font-size="16" fill="#e0c27a" font-weight="bold">Notes</text>
  <g font-size="19" fill="#fff">
    <text x="40" y="355">Both groups have the same mean and the same bar. Only the points show</text>
    <text x="40" y="382">that the second group is really two groups. Ask the room: which group</text>
    <text x="40" y="409">would you rather have in your experiment, and why?</text>
  </g>
  <text x="975" y="458" font-size="14" fill="#8a97a5" text-anchor="end">illustrative; press S in a reveal.js deck</text>
</svg>
