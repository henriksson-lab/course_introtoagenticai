<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
  <rect x="20" y="40" width="330" height="230" rx="10" fill="#fdf8e8" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="40" y="75" font-size="20" font-weight="bold" fill="#8a6a12">Template</text>
  <text x="40" y="110" font-size="18" fill="#333">A sample of <tspan font-weight="bold" fill="#6b4fa0">{n}</tspan> patients has</text>
  <text x="40" y="136" font-size="18" fill="#333">SD <tspan font-weight="bold" fill="#6b4fa0">{sd}</tspan> mmHg. What is the SE?</text>
  <text x="40" y="180" font-size="17" fill="#52606d">n: a square, 16 to 100</text>
  <text x="40" y="206" font-size="17" fill="#52606d">sd: 8 to 15</text>
  <text x="40" y="244" font-size="17" fill="#52606d">answer = sd / sqrt(n)</text>
  <rect x="20" y="300" width="330" height="70" rx="10" fill="#f0f4f8" stroke="#52606d" stroke-width="2"/>
  <text x="40" y="343" font-size="19" fill="#1f2933">fixed seed: <tspan font-family="Courier New, monospace">2026</tspan></text>
  <line x1="352" y1="200" x2="420" y2="200" stroke="#52606d" stroke-width="3" marker-end="url(#a)"/>
  <line x1="352" y1="335" x2="420" y2="230" stroke="#52606d" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="425" y="160" width="150" height="80" rx="10" fill="#f0f4f8" stroke="#52606d" stroke-width="2.5"/>
  <text x="500" y="207" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">script</text>
  <line x1="577" y1="200" x2="630" y2="200" stroke="#52606d" stroke-width="3" marker-end="url(#a)"/>
  <rect x="635" y="40" width="345" height="330" rx="10" fill="#e8f3f5" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="655" y="75" font-size="20" font-weight="bold" fill="#2a7f8f">Variants + computed key</text>
  <g font-size="18" fill="#333">
    <text x="655" y="115" font-weight="bold">variant</text><text x="755" y="115" font-weight="bold">n</text><text x="815" y="115" font-weight="bold">sd</text><text x="880" y="115" font-weight="bold">SE</text>
    <line x1="655" y1="125" x2="960" y2="125" stroke="#9aa5b1"/>
    <text x="655" y="158">A</text><text x="755" y="158">36</text><text x="815" y="158">12</text><text x="880" y="158">2.00</text>
    <text x="655" y="193">B</text><text x="755" y="193">64</text><text x="815" y="193">10</text><text x="880" y="193">1.25</text>
    <text x="655" y="228">C</text><text x="755" y="228">25</text><text x="815" y="228">9</text><text x="880" y="228">1.80</text>
  </g>
  <text x="655" y="290" font-size="17" fill="#52606d">same seed, same variants,</text>
  <text x="655" y="314" font-size="17" fill="#52606d">every time you rerun</text>
  <text x="500" y="420" font-size="19" fill="#1f2933" text-anchor="middle">The script computes every answer. You solve two by hand.</text>
</svg>
