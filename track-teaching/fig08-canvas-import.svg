<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#fff"/>
  <rect x="20" y="15" width="960" height="430" rx="8" fill="#ffffff" stroke="#c9cfd6" stroke-width="2"/>
  <rect x="20" y="15" width="90" height="430" fill="#2d3b45"/>
  <rect x="110" y="15" width="870" height="50" fill="#f5f5f5"/>
  <text x="135" y="47" font-size="18" fill="#52606d">Describing data › Settings › Import Content</text>
  <text x="140" y="105" font-size="26" fill="#2d3b45">Import Content</text>
  <g font-size="19" fill="#2d3b45">
    <text x="140" y="160" font-weight="bold">Content Type</text>
    <rect x="320" y="138" width="330" height="36" rx="4" fill="#fff" stroke="#9aa5b1"/>
    <text x="335" y="162">QTI .zip file</text>
    <text x="625" y="162" fill="#52606d">▾</text>
    <text x="140" y="225" font-weight="bold">Source</text>
    <rect x="320" y="203" width="140" height="36" rx="4" fill="#f5f5f5" stroke="#9aa5b1"/>
    <text x="337" y="227">Choose File</text>
    <text x="475" y="227" fill="#52606d">question-bank-qti.zip</text>
    <text x="140" y="290" font-weight="bold">Options</text>
    <rect x="320" y="272" width="22" height="22" rx="3" fill="#fff" stroke="#9aa5b1"/>
    <text x="355" y="290">Import existing quizzes as New Quizzes</text>
    <text x="355" y="316" fill="#7b8794" font-size="16">(only shown if your institution has enabled it)</text>
    <rect x="320" y="352" width="110" height="40" rx="4" fill="#2a7f8f"/>
    <text x="375" y="378" fill="#fff" text-anchor="middle">Import</text>
  </g>
  <rect x="310" y="130" width="350" height="52" rx="6" fill="none" stroke="#a8324a" stroke-width="3"/>
  <text x="975" y="470" font-size="14" fill="#8a97a5" text-anchor="end">illustrative; labels vary between Canvas versions</text>
  <g font-size="18" fill="#a8324a" font-weight="bold">
    <text x="700" y="162">1. choose QTI .zip file</text>
    <text x="700" y="227">2. pick the zip</text>
    <text x="700" y="290">3. tick only if you</text>
    <text x="700" y="313">use New Quizzes</text>
    <text x="700" y="378">4. Import; wait a minute</text>
  </g>
</svg>
