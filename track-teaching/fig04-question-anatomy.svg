<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="20" y="15" width="640" height="470" rx="8" fill="#fdfcf7" stroke="#c9cfd6" stroke-width="2"/>
  <g font-family="Courier New, monospace" font-size="16" fill="#1f2933" xml:space="preserve">
    <text x="35" y="45" font-weight="bold">## q04: Which error bar</text>
    <text x="35" y="70">- type: mc</text>
    <text x="35" y="92">- topic: spread</text>
    <text x="35" y="114">- difficulty: medium</text>
    <text x="35" y="148">The caption says the error bars "show</text>
    <text x="35" y="170">how much individual plants vary".</text>
    <text x="35" y="192">Which quantity should they show?</text>
    <text x="35" y="228">*A) The standard deviation (SD)</text>
    <text x="35" y="250" fill="#52606d">   why: The SD describes the spread ...</text>
    <text x="35" y="276">B) The standard error of the mean</text>
    <text x="35" y="298" fill="#52606d">   why: The SE describes how precisely ...</text>
    <text x="35" y="324">C) A 95 % confidence interval</text>
    <text x="35" y="346" fill="#52606d">   why: About the mean, not ...</text>
    <text x="35" y="372">D) The full range</text>
    <text x="35" y="394" fill="#52606d">   why: Depends on a single extreme ...</text>
    <text x="35" y="434">explanation: SD for "how much individuals</text>
    <text x="35" y="456">vary"; SE or a CI for "how well we know ...</text>
  </g>
  <g font-size="18">
    <line x1="290" y1="40" x2="690" y2="40" stroke="#2a7f8f" stroke-width="2"/>
    <text x="700" y="46" fill="#2a7f8f" font-weight="bold">1-2. id and title</text>
    <line x1="240" y1="92" x2="690" y2="92" stroke="#2a7f8f" stroke-width="2"/>
    <text x="700" y="98" fill="#2a7f8f" font-weight="bold">3-4. topic, difficulty</text>
    <line x1="420" y1="170" x2="690" y2="170" stroke="#6b4fa0" stroke-width="2"/>
    <text x="700" y="176" fill="#6b4fa0" font-weight="bold">5. stem</text>
    <line x1="360" y1="228" x2="690" y2="228" stroke="#a8324a" stroke-width="2"/>
    <text x="700" y="234" fill="#a8324a" font-weight="bold">6. choices; * = correct</text>
    <line x1="490" y1="298" x2="690" y2="298" stroke="#8a6a12" stroke-width="2"/>
    <text x="700" y="290" fill="#8a6a12" font-weight="bold">a reason under every</text>
    <text x="700" y="312" fill="#8a6a12" font-weight="bold">choice, shown as feedback</text>
    <line x1="500" y1="445" x2="690" y2="445" stroke="#52606d" stroke-width="2"/>
    <text x="700" y="451" fill="#52606d" font-weight="bold">7. general feedback</text>
  </g>
</svg>
