<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <text x="500" y="32" font-size="21" font-weight="bold" fill="#1f2933" text-anchor="middle">Rubric: lab report, "Enzyme kinetics"</text>
  <g font-size="17">
    <rect x="20" y="50" width="200" height="50" fill="#f0f4f8" stroke="#9aa5b1"/>
    <rect x="220" y="50" width="253" height="50" fill="#f9ecef" stroke="#9aa5b1"/>
    <rect x="473" y="50" width="253" height="50" fill="#fdf8e8" stroke="#9aa5b1"/>
    <rect x="726" y="50" width="254" height="50" fill="#e8f3f5" stroke="#9aa5b1"/>
    <text x="35" y="81" font-weight="bold" fill="#1f2933">Criterion</text>
    <text x="235" y="81" font-weight="bold" fill="#a8324a">Not yet (0)</text>
    <text x="488" y="81" font-weight="bold" fill="#8a6a12">Meets (1)</text>
    <text x="741" y="81" font-weight="bold" fill="#2a7f8f">Exceeds (2)</text>
    <!-- rows -->
    <g fill="#333">
      <rect x="20" y="100" width="200" height="80" fill="#fff" stroke="#9aa5b1"/><text x="35" y="137" font-weight="bold">Question</text>
      <rect x="220" y="100" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="235" y="132">no clear question</text>
      <rect x="473" y="100" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="488" y="132">question stated</text>
      <rect x="726" y="100" width="254" height="80" fill="#fff" stroke="#9aa5b1"/><text x="741" y="132">question and why</text><text x="741" y="155">it matters</text>
      <rect x="20" y="180" width="200" height="80" fill="#fff" stroke="#9aa5b1"/><text x="35" y="217" font-weight="bold">Methods</text>
      <rect x="220" y="180" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="235" y="212">cannot be repeated</text>
      <rect x="473" y="180" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="488" y="212">concentrations and</text><text x="488" y="235">volumes given</text>
      <rect x="726" y="180" width="254" height="80" fill="#fff" stroke="#9aa5b1"/><text x="741" y="212">another group could</text><text x="741" y="235">repeat it exactly</text>
      <rect x="20" y="260" width="200" height="80" fill="#fff" stroke="#9aa5b1"/><text x="35" y="297" font-weight="bold">Figures</text>
      <rect x="220" y="260" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="235" y="292">no units or n</text>
      <rect x="473" y="260" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="488" y="292">points shown; units,</text><text x="488" y="315">n, SD or SE stated</text>
      <rect x="726" y="260" width="254" height="80" fill="#fff" stroke="#9aa5b1"/><text x="741" y="292">fit shown with its</text><text x="741" y="315">uncertainty</text>
      <rect x="20" y="340" width="200" height="80" fill="#fff" stroke="#9aa5b1"/><text x="35" y="377" font-weight="bold">Discussion</text>
      <rect x="220" y="340" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="235" y="372">repeats the results</text>
      <rect x="473" y="340" width="253" height="80" fill="#fff" stroke="#9aa5b1"/><text x="488" y="372">answers the question</text>
      <rect x="726" y="340" width="254" height="80" fill="#fff" stroke="#9aa5b1"/><text x="741" y="372">names limits and a</text><text x="741" y="395">next experiment</text>
    </g>
  </g>
  <text x="500" y="442" font-size="15" fill="#7b8794" text-anchor="middle">criteria in rows, levels in columns, observable descriptions in the cells</text>
</svg>
