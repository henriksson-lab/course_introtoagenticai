<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <!-- cloud zone -->
  <rect x="20" y="20" width="560" height="400" rx="14" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="300" y="52" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">With the agent (goes to the provider)</text>
  <rect x="50" y="80" width="220" height="90" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="160" y="115" font-size="18" fill="#333" text-anchor="middle">column names,</text>
  <text x="160" y="140" font-size="18" fill="#333" text-anchor="middle">answer options</text>
  <rect x="50" y="210" width="220" height="90" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="160" y="245" font-size="18" fill="#333" text-anchor="middle">synthetic export</text>
  <text x="160" y="270" font-size="16" fill="#333" text-anchor="middle">(same columns, fake rows)</text>
  <rect x="330" y="145" width="220" height="90" rx="10" fill="#fff" stroke="#2a7f8f" stroke-width="3"/>
  <text x="440" y="180" font-size="18" font-weight="bold" fill="#2a7f8f" text-anchor="middle">script + report</text>
  <text x="440" y="205" font-size="18" fill="#2a7f8f" text-anchor="middle">tested, all checks pass</text>
  <line x1="270" y1="125" x2="328" y2="175" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="270" y1="255" x2="328" y2="205" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="350" font-size="17" fill="#333" text-anchor="middle">The agent never sees a real answer.</text>
  <!-- local zone -->
  <rect x="620" y="20" width="360" height="400" rx="14" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="800" y="52" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">You alone, agent closed</text>
  <rect x="650" y="80" width="300" height="70" rx="10" fill="#fff" stroke="#a8324a" stroke-width="2"/>
  <text x="800" y="122" font-size="18" fill="#333" text-anchor="middle">real export</text>
  <rect x="650" y="190" width="300" height="70" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="800" y="232" font-size="18" fill="#333" text-anchor="middle">run the same script</text>
  <rect x="650" y="300" width="300" height="70" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="800" y="342" font-size="18" fill="#333" text-anchor="middle">read and check the report</text>
  <line x1="800" y1="150" x2="800" y2="188" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="800" y1="260" x2="800" y2="298" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="550" y1="190" x2="648" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="800" y="400" font-size="16" fill="#666" text-anchor="middle">unless your university has approved the tool</text>
</svg>
