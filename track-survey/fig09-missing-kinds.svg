<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <text x="500" y="38" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Four kinds of "no number", four different meanings</text>
  <g font-size="17">
    <rect x="20" y="65" width="230" height="250" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="135" y="100" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Skipped</text>
    <text x="135" y="140" fill="#333" text-anchor="middle">one blank cell</text>
    <text x="135" y="165" fill="#333" text-anchor="middle">in a full row</text>
    <text x="135" y="230" fill="#666" text-anchor="middle">here: about 3 %</text>
    <text x="135" y="290" fill="#2a7f8f" font-weight="bold" text-anchor="middle">NA, leave out</text>
    <rect x="270" y="65" width="230" height="250" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="385" y="100" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Not applicable</text>
    <text x="385" y="140" fill="#333" text-anchor="middle">"I did not use</text>
    <text x="385" y="165" fill="#333" text-anchor="middle">the recordings"</text>
    <text x="385" y="230" fill="#666" text-anchor="middle">here: 9 on item 3</text>
    <text x="385" y="290" fill="#2a7f8f" font-weight="bold" text-anchor="middle">not a scale value; count it</text>
    <rect x="520" y="65" width="230" height="250" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="635" y="100" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Stopped</text>
    <text x="635" y="140" fill="#333" text-anchor="middle">everything blank</text>
    <text x="635" y="165" fill="#333" text-anchor="middle">after item 6</text>
    <text x="635" y="230" fill="#666" text-anchor="middle">here: 1 respondent</text>
    <text x="635" y="290" fill="#2a7f8f" font-weight="bold" text-anchor="middle">keep the first six</text>
    <rect x="770" y="65" width="210" height="250" rx="12" fill="#f4f4f4" stroke="#999" stroke-width="2"/>
    <text x="875" y="100" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">Did not reply</text>
    <text x="875" y="140" fill="#333" text-anchor="middle">no row at all</text>
    <text x="875" y="230" fill="#666" text-anchor="middle">here: 44 of 164</text>
    <text x="875" y="290" fill="#2a7f8f" font-weight="bold" text-anchor="middle">report the rate</text>
  </g>
  <rect x="120" y="345" width="760" height="64" rx="12" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="500" y="384" font-size="20" fill="#a8324a" text-anchor="middle">Never let a blank become 0 or 3. Both change every mean.</text>
</svg>
