<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <text x="500" y="36" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Each extra breakdown splits the groups further</text>
  <!-- level boxes -->
  <g font-size="17" text-anchor="middle">
    <rect x="380" y="60" width="240" height="56" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="500" y="95" fill="#2a7f8f" font-weight="bold">All respondents: 120</text>
    <rect x="200" y="150" width="240" height="56" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="320" y="185" fill="#2a7f8f">Biotechnology: 38</text>
    <rect x="560" y="150" width="240" height="56" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="680" y="185" fill="#2a7f8f">other programmes: 82</text>
    <rect x="100" y="240" width="240" height="56" rx="8" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="220" y="275" fill="#8a6a12">+ distance: 13</text>
    <rect x="360" y="240" width="240" height="56" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="480" y="275" fill="#2a7f8f">+ campus: 25</text>
    <rect x="30" y="330" width="280" height="56" rx="8" fill="#f8e9ec" stroke="#a8324a" stroke-width="3"/>
    <text x="170" y="365" fill="#a8324a" font-weight="bold">+ 26-30 + woman: 1</text>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="450" y1="116" x2="350" y2="150"/><line x1="550" y1="116" x2="650" y2="150"/>
    <line x1="290" y1="206" x2="230" y2="240"/><line x1="350" y1="206" x2="450" y2="240"/>
    <line x1="210" y1="296" x2="180" y2="330"/>
  </g>
  <rect x="640" y="230" width="340" height="180" rx="12" fill="#f4f4f4" stroke="#999"/>
  <text x="810" y="262" font-size="19" font-weight="bold" fill="#333" text-anchor="middle">k-anonymity, in words</text>
  <text x="810" y="296" font-size="17" fill="#333" text-anchor="middle">Every combination of facts</text>
  <text x="810" y="320" font-size="17" fill="#333" text-anchor="middle">you report is shared by at</text>
  <text x="810" y="344" font-size="17" fill="#333" text-anchor="middle">least k people.</text>
  <text x="810" y="384" font-size="18" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Course evaluations: k ≥ 5</text>
</svg>
