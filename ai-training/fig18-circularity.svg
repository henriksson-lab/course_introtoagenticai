<text x="500" y="56" font-size="20" fill="#8a6a12" text-anchor="middle" font-weight="bold" >your assumptions</text>
<text x="500" y="82" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" >what nuclei, tissue, noise look like</text>
