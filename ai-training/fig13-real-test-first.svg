<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="370" fill="#fff"/>
<rect x="15" y="60" width="178" height="170" rx="8" fill="#fff" stroke="#a8324a" stroke-width="2"/>
<circle cx="104" cy="60" r="22" fill="#a8324a"/>
<text x="104" y="68" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >1</text>
<text x="104" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >label 20-50 real</text>
<text x="104" y="153" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >images by hand;</text>
<text x="104" y="181" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >lock them away</text>
<line x1="195" y1="145" x2="209" y2="145" stroke="#888" stroke-width="3"/><polygon points="209,145 197.9,149.7 197.9,140.3" fill="#888"/>
<rect x="212" y="60" width="178" height="170" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
<circle cx="301" cy="60" r="22" fill="#6b4fa0"/>
<text x="301" y="68" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >2</text>
<text x="301" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >agent writes</text>
<text x="301" y="153" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >the simulator</text>
<text x="301" y="181" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" ></text>
<line x1="392" y1="145" x2="406" y2="145" stroke="#888" stroke-width="3"/><polygon points="406,145 394.9,149.7 394.9,140.3" fill="#888"/>
<rect x="409" y="60" width="178" height="170" rx="8" fill="#fff" stroke="#6b4fa0" stroke-width="2"/>
<circle cx="498" cy="60" r="22" fill="#6b4fa0"/>
<text x="498" y="68" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >3</text>
<text x="498" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >train on</text>
<text x="498" y="153" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >simulated images</text>
<text x="498" y="181" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" ></text>
<line x1="589" y1="145" x2="603" y2="145" stroke="#888" stroke-width="3"/><polygon points="603,145 591.9,149.7 591.9,140.3" fill="#888"/>
<rect x="606" y="60" width="178" height="170" rx="8" fill="#fff" stroke="#a8324a" stroke-width="2"/>
<circle cx="695" cy="60" r="22" fill="#a8324a"/>
<text x="695" y="68" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >4</text>
<text x="695" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >test on the</text>
<text x="695" y="153" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >locked real set</text>
<text x="695" y="181" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" ></text>
<line x1="786" y1="145" x2="800" y2="145" stroke="#888" stroke-width="3"/><polygon points="800,145 788.9,149.7 788.9,140.3" fill="#888"/>
<rect x="803" y="60" width="178" height="170" rx="8" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
<circle cx="892" cy="60" r="22" fill="#2a7f8f"/>
<text x="892" y="68" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" >5</text>
<text x="892" y="125" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >fine-tune on a few</text>
<text x="892" y="153" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >OTHER real labels,</text>
<text x="892" y="181" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >test again</text>
<path d="M 694,235 C 694,300 400,300 300,262" fill="none" stroke="#888" stroke-width="2.5" stroke-dasharray="7,5"/>
<line x1="306" y1="266" x2="296" y2="260" stroke="#888" stroke-width="2.5"/><polygon points="296,260 307.9,261.7 303.1,269.7" fill="#888"/>
<text x="500" y="318" font-size="18" fill="#333" text-anchor="middle" font-weight="normal" >if the real score is poor: improve the simulator, not the test set</text>
<text x="500" y="350" font-size="19" fill="#a8324a" text-anchor="middle" font-weight="bold" >Step 1 comes first, before anyone has seen what the model does.</text>
