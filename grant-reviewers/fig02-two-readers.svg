<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="30" y="30" width="450" height="400" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <rect x="520" y="30" width="450" height="400" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
  <text x="255" y="75" font-size="26" font-weight="bold" fill="#2a7f8f" text-anchor="middle">The expert</text>
  <text x="255" y="105" font-size="18" fill="#555" text-anchor="middle">one or two on the panel</text>
  <text x="745" y="75" font-size="26" font-weight="bold" fill="#8a6a12" text-anchor="middle">The non-expert</text>
  <text x="745" y="105" font-size="18" fill="#555" text-anchor="middle">most of the panel</text>
  <g font-size="20" fill="#333">
    <text x="60" y="160">• reads the methods line by line</text>
    <text x="60" y="200">• knows the literature you cite,</text>
    <text x="80" y="226">and what you did not cite</text>
    <text x="60" y="266">• tests every claim of novelty</text>
    <text x="60" y="306">• asks: will this design work?</text>
    <text x="550" y="160">• has 20 proposals this week</text>
    <text x="550" y="200">• skims; reads aims and</text>
    <text x="570" y="226">significance closely</text>
    <text x="550" y="266">• stops at every abbreviation</text>
    <text x="550" y="306">• asks: why does this matter?</text>
  </g>
  <rect x="60" y="345" width="390" height="56" rx="8" fill="#2a7f8f"/>
  <text x="255" y="381" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle">finds the gaps</text>
  <rect x="550" y="345" width="390" height="56" rx="8" fill="#8a6a12"/>
  <text x="745" y="381" font-size="21" fill="#fff" font-weight="bold" text-anchor="middle">stumbles on the jargon</text>
  <text x="500" y="458" font-size="19" fill="#333" text-anchor="middle">Both give a grade, and the panel decides together.</text>
</svg>
