<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="30" y="40" width="300" height="380" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
  <text x="50" y="80" font-size="20" font-weight="bold" fill="#333">Research plan</text>
  <text x="50" y="106" font-size="17" fill="#777">draft 3</text>
  <g fill="#ccc"><rect x="50" y="130" width="250" height="10"/><rect x="50" y="150" width="230" height="10"/><rect x="50" y="170" width="245" height="10"/><rect x="50" y="200" width="200" height="10"/><rect x="50" y="220" width="250" height="10"/><rect x="50" y="240" width="220" height="10"/><rect x="50" y="270" width="240" height="10"/><rect x="50" y="290" width="250" height="10"/><rect x="50" y="310" width="180" height="10"/></g>
  <rect x="50" y="350" width="260" height="46" rx="6" fill="#f8e9ec" stroke="#a8324a"/>
  <text x="180" y="380" font-size="18" fill="#a8324a" text-anchor="middle" font-weight="bold">call closes in 10 weeks</text>
  <line x1="345" y1="230" x2="440" y2="230" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="455" y="40" width="520" height="380" rx="12" fill="#f4f4f4"/>
  <text x="715" y="78" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">The review panel (published)</text>
  <g font-size="15" text-anchor="middle" fill="#333">
    <circle cx="530" cy="140" r="32" fill="#6b4fa0"/><text x="530" y="146" fill="#fff" font-weight="bold">chair</text><text x="530" y="195">soil carbon</text>
    <circle cx="645" cy="140" r="32" fill="#2a7f8f"/><text x="645" y="195">microbes</text>
    <circle cx="760" cy="140" r="32" fill="#2a7f8f"/><text x="760" y="195">forest ecology</text>
    <circle cx="875" cy="140" r="32" fill="#8a6a12"/><text x="875" y="195">statistics</text>
    <circle cx="530" cy="270" r="32" fill="#8a6a12"/><text x="530" y="325">hydrology</text>
    <circle cx="645" cy="270" r="32" fill="#2a7f8f"/><text x="645" y="325">plant-microbe</text>
    <circle cx="760" cy="270" r="32" fill="#999"/><text x="760" y="325">climate</text>
    <circle cx="875" cy="270" r="32" fill="#999"/><text x="875" y="325">animal ecology</text>
  </g>
  <text x="715" y="380" font-size="18" fill="#333" text-anchor="middle">Who reads it closely? Who skims?</text>
  <text x="715" y="404" font-size="18" fill="#333" text-anchor="middle">What will each of them find thin or unclear?</text>
  <text x="975" y="470" font-size="14" fill="#999" text-anchor="end">fictional panel</text>
</svg>
