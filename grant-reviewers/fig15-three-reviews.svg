<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#fff"/>
  <g font-size="17">
    <rect x="20" y="20" width="960" height="40" fill="#555"/>
    <g fill="#fff" font-weight="bold"><text x="35" y="47">Point raised</text><text x="590" y="47">biogeochemist</text><text x="740" y="47">statistician</text><text x="880" y="47">outsider</text></g>
    <g fill="#333">
      <rect x="20" y="60" width="960" height="40" fill="#f8e9ec"/>
      <text x="35" y="87">Design: 3 roofs, not 120 samples</text><text x="640" y="87">✓</text><text x="790" y="87">✓</text><text x="920" y="87">✓</text>
      <rect x="20" y="100" width="960" height="40" fill="#f8e9ec"/>
      <text x="35" y="127">Risks and time plan unrealistic</text><text x="640" y="127">✓</text><text x="790" y="127">✓</text><text x="920" y="127">✓</text>
      <text x="35" y="167">"First study" overclaims</text><text x="640" y="167">✓</text><text x="790" y="167"></text><text x="920" y="167">✓</text>
      <rect x="20" y="180" width="960" height="40" fill="#f4f4f4"/>
      <text x="35" y="207">CUE method not stated</text><text x="640" y="207">✓</text>
      <text x="35" y="247">Drought not verified (moisture)</text><text x="640" y="247">✓</text><text x="790" y="247">✓</text>
      <rect x="20" y="260" width="960" height="40" fill="#f4f4f4"/>
      <text x="35" y="287">Abbreviations unexplained</text><text x="920" y="287">✓</text>
      <text x="35" y="327">Why it matters beyond Sweden</text><text x="920" y="327">✓</text>
    </g>
    <line x1="20" y1="342" x2="980" y2="342" stroke="#333"/>
    <g fill="#333">
      <text x="35" y="372" font-weight="bold">Overall grade (1 to 7)</text><text x="640" y="372" font-weight="bold">4</text><text x="790" y="372" font-weight="bold">3</text><text x="920" y="372" font-weight="bold">5</text>
    </g>
  </g>
  <rect x="20" y="400" width="470" height="90" rx="8" fill="#f8e9ec" stroke="#a8324a"/>
  <text x="40" y="432" font-size="18" fill="#a8324a" font-weight="bold">Raised by all three: fix first</text>
  <text x="40" y="462" font-size="17" fill="#333">design and replication; risks and time plan</text>
  <rect x="510" y="400" width="470" height="90" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="530" y="432" font-size="18" fill="#555" font-weight="bold">Grades: weakest criterion only</text>
  <text x="530" y="462" font-size="17" fill="#333">not a prediction of your real grade</text>
  <text x="980" y="512" font-size="13" fill="#999" text-anchor="end">illustrative, synthetic draft</text>
</svg>
