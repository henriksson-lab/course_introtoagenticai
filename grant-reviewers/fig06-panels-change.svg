  <text x="200" y="384" font-size="17" fill="#777" text-anchor="middle">grey: rotated out</text>
  <text x="790" y="440" font-size="17" fill="#a8324a" text-anchor="middle">dashed red: steps out for your proposal</text>
  <text x="790" y="462" font-size="17" fill="#a8324a" text-anchor="middle">(conflict of interest)</text>
  <text x="300" y="440" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">Prepare for the expertise in the room,</text>
  <text x="300" y="466" font-size="19" fill="#333" text-anchor="middle" font-weight="bold">not for named people.</text>
  <text x="985" y="492" font-size="13" fill="#999" text-anchor="end">fictional panel</text>
