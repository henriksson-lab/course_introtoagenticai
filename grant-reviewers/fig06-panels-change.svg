  <text x="790" y="40" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Your round</text>
  <g font-size="17">
    <rect x="60" y="60" width="280" height="40" rx="6" fill="#6b4fa0"/><text x="75" y="86" fill="#fff">chair: soil carbon</text>
    <rect x="60" y="110" width="280" height="40" rx="6" fill="#2a7f8f"/><text x="75" y="136" fill="#fff">microbial ecology</text>
    <rect x="60" y="160" width="280" height="40" rx="6" fill="#2a7f8f"/><text x="75" y="186" fill="#fff">forest ecology</text>
    <rect x="60" y="210" width="280" height="40" rx="6" fill="#8a6a12"/><text x="75" y="236" fill="#fff">statistics</text>
    <rect x="60" y="260" width="280" height="40" rx="6" fill="#bbb"/><text x="75" y="286" fill="#333">limnology</text>
    <rect x="60" y="310" width="280" height="40" rx="6" fill="#bbb"/><text x="75" y="336" fill="#333">plant physiology</text>
    <rect x="650" y="60" width="280" height="40" rx="6" fill="#2a7f8f"/><text x="665" y="86" fill="#fff">chair: microbial ecology</text>
    <rect x="650" y="110" width="280" height="40" rx="6" fill="#6b4fa0"/><text x="665" y="136" fill="#fff">soil carbon</text>
    <rect x="650" y="160" width="280" height="40" rx="6" fill="#2a7f8f" stroke="#a8324a" stroke-width="4" stroke-dasharray="8 5"/><text x="665" y="186" fill="#fff">forest ecology</text>
    <rect x="650" y="210" width="280" height="40" rx="6" fill="#8a6a12"/><text x="665" y="236" fill="#fff">statistics</text>
    <rect x="650" y="260" width="280" height="40" rx="6" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="665" y="286" fill="#333">new: soil hydrology</text>
    <rect x="650" y="310" width="280" height="40" rx="6" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="665" y="336" fill="#333">new: animal ecology</text>
    <rect x="650" y="370" width="280" height="40" rx="6" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><text x="665" y="396" fill="#333">+ external reviewer</text>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="340" y1="80" x2="650" y2="130"/><line x1="340" y1="130" x2="650" y2="80"/><line x1="340" y1="180" x2="650" y2="180"/><line x1="340" y1="230" x2="650" y2="230"/>
