<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="20" y="20" width="450" height="400" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="245" y="56" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Project repository (public)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#333" xml:space="preserve">
    <text x="40" y="100">soil-funding-map/</text>
    <text x="40" y="130">├─ README.md</text>
    <text x="40" y="160">├─ scripts/  results/</text>
    <text x="40" y="190">├─ notes/</text>
    <text x="40" y="220">└─ ... → GitHub, project page</text>
  </g>
  <text x="40" y="280" font-size="17" fill="#333">funding plots, literature table,</text>
  <text x="40" y="304" font-size="17" fill="#333">extracted data: published</text>
  <text x="40" y="360" font-size="17" fill="#a8324a" font-weight="bold">no panel lists, no profiles,</text>
  <text x="40" y="384" font-size="17" fill="#a8324a" font-weight="bold">no draft, no mock reviews</text>
  <rect x="530" y="20" width="450" height="400" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
  <text x="755" y="56" font-size="21" font-weight="bold" fill="#a8324a" text-anchor="middle">Call folder (private)</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#333" xml:space="preserve">
    <text x="550" y="100">grant-2027-call/</text>
    <text x="550" y="130">├─ panel.csv</text>
    <text x="550" y="160">├─ profiles/</text>
    <text x="550" y="190">├─ criteria.md</text>
    <text x="550" y="220">├─ proposal-draft.md</text>
    <text x="550" y="250">├─ mock-reviews/</text>
    <text x="550" y="280">└─ revision-plan.md</text>
  </g>
  <g font-size="16" font-weight="bold">
    <text x="830" y="130" fill="#a8324a">delete after</text><text x="830" y="160" fill="#a8324a">the decision</text>
    <text x="830" y="280" fill="#2a7f8f">keep</text>
  </g>
  <text x="550" y="340" font-size="17" fill="#333">not on GitHub; if it must sit inside</text>
  <text x="550" y="364" font-size="17" fill="#333">a repository, list it in .gitignore;</text>
  <text x="550" y="388" font-size="17" fill="#333">share only with co-applicants</text>
  <text x="500" y="465" font-size="19" fill="#333" text-anchor="middle">Personal data and unpublished ideas stay private and temporary.</text>
</svg>
