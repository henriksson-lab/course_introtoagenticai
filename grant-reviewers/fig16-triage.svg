<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <text x="20" y="30" font-size="18" fill="#555">revision-plan.md</text>
  <g font-size="17">
    <rect x="20" y="42" width="960" height="40" fill="#2a7f8f"/>
    <g fill="#fff" font-weight="bold"><text x="35" y="68">Point</text><text x="370" y="68">Decision</text><text x="500" y="68">What I do, or why not</text></g>
    <g fill="#333">
      <text x="35" y="112">Pseudoreplication</text><rect x="365" y="94" width="90" height="28" rx="14" fill="#2a7f8f"/><text x="410" y="114" fill="#fff" text-anchor="middle">fix</text><text x="500" y="112">6 roofs + 6 controls; mixed model; power</text>
      <rect x="20" y="130" width="960" height="40" fill="#f4f4f4"/>
      <text x="35" y="156">"First study" claim</text><rect x="365" y="138" width="90" height="28" rx="14" fill="#2a7f8f"/><text x="410" y="158" fill="#fff" text-anchor="middle">fix</text><text x="500" y="156">cite reviews; state what is new: repeated field drought</text>
      <text x="35" y="200">CUE method</text><rect x="365" y="182" width="90" height="28" rx="14" fill="#8a6a12"/><text x="410" y="202" fill="#fff" text-anchor="middle">explain</text><text x="500" y="200">one sentence: 18O-water method, as in pilot</text>
      <rect x="20" y="218" width="960" height="40" fill="#f4f4f4"/>
      <text x="35" y="244">Abbreviations</text><rect x="365" y="226" width="90" height="28" rx="14" fill="#8a6a12"/><text x="410" y="246" fill="#fff" text-anchor="middle">explain</text><text x="500" y="244">spell out once; drop PLFA (not needed)</text>
      <text x="35" y="288">"Use a second site"</text><rect x="365" y="270" width="90" height="28" rx="14" fill="#999"/><text x="410" y="290" fill="#fff" text-anchor="middle">ignore</text><text x="500" y="288">budget; explain backup plots at same site instead</text>
      <rect x="20" y="306" width="960" height="40" fill="#f4f4f4"/>
      <text x="35" y="332">"Smith 2021 did this"</text><rect x="365" y="314" width="90" height="28" rx="14" fill="#a8324a"/><text x="410" y="334" fill="#fff" text-anchor="middle">invented</text><text x="500" y="332">no such paper found in PubMed or OpenAlex</text>
    </g>
  </g>
  <text x="500" y="395" font-size="19" fill="#333" text-anchor="middle">Every point gets a decision and a reason. The reasons keep you honest.</text>
  <text x="500" y="425" font-size="19" fill="#333" text-anchor="middle">Then a human colleague from a neighbouring field reads the revised draft.</text>
  <text x="980" y="462" font-size="13" fill="#999" text-anchor="end">illustrative</text>
</svg>
