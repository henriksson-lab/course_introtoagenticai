<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <text x="20" y="32" font-size="18" fill="#555">check</text>
  <text x="640" y="32" font-size="18" fill="#555">catches</text>
  <text x="900" y="32" font-size="18" fill="#555">who</text>
  <g font-size="18">
    <rect x="20" y="48" width="600" height="62" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="35" y="86" fill="#333"><tspan font-weight="bold">1</tspan>  Every PMID and DOI resolves</text>
    <text x="640" y="86" fill="#333">invented IDs, typos</text>
    <text x="900" y="86" fill="#2a7f8f" font-weight="bold">script</text>
    <rect x="20" y="120" width="600" height="62" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="35" y="158" fill="#333"><tspan font-weight="bold">2</tspan>  The title at that ID matches the table</text>
    <text x="640" y="158" fill="#333">real ID, wrong paper</text>
    <text x="900" y="158" fill="#2a7f8f" font-weight="bold">script</text>
    <rect x="20" y="192" width="600" height="62" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="35" y="230" fill="#333"><tspan font-weight="bold">3</tspan>  The quote is in the abstract, word for word</text>
    <text x="640" y="230" fill="#333">invented quotes</text>
    <text x="900" y="230" fill="#2a7f8f" font-weight="bold">script</text>
    <rect x="20" y="264" width="600" height="62" rx="6" fill="#fbf3f5" stroke="#a8324a"/>
    <text x="35" y="302" fill="#333"><tspan font-weight="bold">4</tspan>  The claim says what the quote says</text>
    <text x="640" y="302" fill="#333">overstated claims</text>
    <text x="900" y="302" fill="#a8324a" font-weight="bold">you</text>
    <rect x="20" y="336" width="600" height="62" rx="6" fill="#fbf3f5" stroke="#a8324a"/>
    <text x="35" y="374" fill="#333"><tspan font-weight="bold">5</tspan>  A random sample, read in full</text>
    <text x="640" y="374" fill="#333">abstract ≠ paper</text>
    <text x="900" y="374" fill="#a8324a" font-weight="bold">you</text>
  </g>
  <text x="20" y="432" font-size="17" fill="#333">Checks 1-3 are cheap and cover every row. Checks 4-5 need your judgement and cover a sample.</text>
</svg>
