<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#fff"/>
  <!-- left -->
  <rect x="15" y="15" width="475" height="410" rx="10" fill="#fbf3f5" stroke="#a8324a"/>
  <text x="252" y="50" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">From memory</text>
  <rect x="40" y="75" width="140" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="110" y="111" font-size="18" text-anchor="middle" fill="#333">model</text>
  <line x1="185" y1="105" x2="245" y2="105" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="255" y="70" width="210" height="72" rx="6" fill="#fff" stroke="#a8324a"/>
  <text x="268" y="98" font-size="16" fill="#333">Author et al. (2019)</text>
  <text x="268" y="124" font-size="16" fill="#333">doi:10.xxxx/…</text>
  <g font-size="17" fill="#333">
    <text x="40" y="185">The text is what is <tspan font-weight="bold">plausible</tspan></text>
    <text x="40" y="210">given the question.</text>
    <text x="40" y="250">A real paper and an invented</text>
    <text x="40" y="275">one come out of the same process</text>
    <text x="40" y="300">and look equally confident.</text>
    <text x="40" y="340">Nothing on disk shows where</text>
    <text x="40" y="365">a reference came from.</text>
  </g>
  <!-- right -->
  <rect x="510" y="15" width="475" height="410" rx="10" fill="#eef6f7" stroke="#2a7f8f"/>
  <text x="747" y="50" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Looked up</text>
  <rect x="530" y="75" width="105" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="582" y="111" font-size="17" text-anchor="middle" fill="#333">script</text>
  <line x1="638" y1="105" x2="678" y2="105" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="682" y="75" width="120" height="60" rx="8" fill="#fff" stroke="#2a7f8f"/>
  <text x="742" y="101" font-size="17" text-anchor="middle" fill="#333">PubMed</text>
  <text x="742" y="123" font-size="15" text-anchor="middle" fill="#555">database</text>
  <line x1="805" y1="105" x2="845" y2="105" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="849" y="75" width="120" height="60" rx="8" fill="#fff" stroke="#555"/>
  <text x="909" y="101" font-size="16" text-anchor="middle" fill="#333">raw/…json</text>
  <text x="909" y="123" font-size="15" text-anchor="middle" fill="#555">on disk</text>
  <g font-size="17" fill="#333">
    <text x="530" y="185">The agent <tspan font-weight="bold">writes a program</tspan> that asks</text>
    <text x="530" y="210">the database, and keeps the answer.</text>
    <text x="530" y="250">Every row carries an ID that came</text>
    <text x="530" y="275">from the database, not from the model.</text>
    <text x="530" y="315">A second script looks every ID up</text>
    <text x="530" y="340">again and compares the titles.</text>
    <text x="530" y="380" fill="#2a7f8f" font-weight="bold">You can see where each row came from.</text>
  </g>
</svg>
