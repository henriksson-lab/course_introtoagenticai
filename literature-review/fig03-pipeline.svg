<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#fff"/>
  <g font-size="18" text-anchor="middle">
    <rect x="10" y="60" width="150" height="110" rx="10" fill="#f4f4f4" stroke="#777"/>
    <text x="85" y="100" font-weight="bold" fill="#333">1 Plan</text>
    <text x="85" y="128" font-size="15" fill="#555">question, queries,</text>
    <text x="85" y="148" font-size="15" fill="#555">rules</text>
    <rect x="175" y="60" width="150" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="250" y="100" font-weight="bold" fill="#2a7f8f">2 Search</text>
    <text x="250" y="128" font-size="15" fill="#555">script asks</text>
    <text x="250" y="148" font-size="15" fill="#555">the APIs</text>
    <rect x="340" y="60" width="150" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="415" y="100" font-weight="bold" fill="#2a7f8f">3 Keep raw</text>
    <text x="415" y="128" font-size="15" fill="#555">every download,</text>
    <text x="415" y="148" font-size="15" fill="#555">dated, untouched</text>
    <rect x="505" y="60" width="150" height="110" rx="10" fill="#efeaf6" stroke="#6b4fa0"/>
    <text x="580" y="100" font-weight="bold" fill="#6b4fa0">4 Table</text>
    <text x="580" y="128" font-size="15" fill="#555">claim + quote</text>
    <text x="580" y="148" font-size="15" fill="#555">from abstracts</text>
    <rect x="670" y="60" width="150" height="110" rx="10" fill="#fbf3f5" stroke="#a8324a" stroke-width="2.5"/>
    <text x="745" y="100" font-weight="bold" fill="#a8324a">5 Verify</text>
    <text x="745" y="128" font-size="15" fill="#555">script, then</text>
    <text x="745" y="148" font-size="15" fill="#555">you, by hand</text>
    <rect x="835" y="60" width="155" height="110" rx="10" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="912" y="100" font-weight="bold" fill="#8a6a12">6 Export</text>
    <text x="912" y="128" font-size="15" fill="#555">BibTeX, Zotero,</text>
    <text x="912" y="148" font-size="15" fill="#555">your page</text>
  </g>
  <g stroke="#555" stroke-width="2.5">
    <line x1="160" y1="115" x2="172" y2="115" marker-end="url(#ar)"/>
    <line x1="325" y1="115" x2="337" y2="115" marker-end="url(#ar)"/>
    <line x1="490" y1="115" x2="502" y2="115" marker-end="url(#ar)"/>
    <line x1="655" y1="115" x2="667" y2="115" marker-end="url(#ar)"/>
    <line x1="820" y1="115" x2="832" y2="115" marker-end="url(#ar)"/>
  </g>
  <path d="M745,175 C745,250 580,250 580,180" fill="none" stroke="#a8324a" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ar)"/>
  <text x="662" y="268" font-size="16" fill="#a8324a" text-anchor="middle">a failed check sends you back</text>
  <g font-size="17" fill="#333">
    <text x="10" y="325"><tspan font-weight="bold" fill="#2a7f8f">Agent's job:</tspan> write and run the scripts, draft the claims, list doubts.</text>
    <text x="10" y="355"><tspan font-weight="bold" fill="#a8324a">Your job:</tspan> the plan, the rules, reading the sample, deciding what goes on the page.</text>
  </g>
</svg>
