  <rect x="568" y="52" width="170" height="250" fill="none" stroke="#a8324a" stroke-width="3"/>
  <rect x="898" y="52" width="87" height="250" fill="none" stroke="#8a6a12" stroke-width="3"/>
  <text x="653" y="330" font-size="17" fill="#a8324a" font-weight="bold" text-anchor="middle">every ID must exist</text>
  <text x="653" y="352" font-size="17" fill="#a8324a" font-weight="bold" text-anchor="middle">and be the right paper</text>
  <text x="940" y="330" font-size="17" fill="#8a6a12" font-weight="bold" text-anchor="middle">words from</text>
  <text x="940" y="352" font-size="17" fill="#8a6a12" font-weight="bold" text-anchor="middle">the abstract</text>
  <text x="270" y="400" font-size="18" fill="#333">Then: a BibTeX file for writing, a Zotero library, and the table on your page.</text>
  <text x="985" y="430" font-size="14" fill="#999" text-anchor="end">illustrative, shortened</text>
