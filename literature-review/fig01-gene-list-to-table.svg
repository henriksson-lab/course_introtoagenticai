    <rect x="110" y="140" width="80" height="34" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/><text x="150" y="163" text-anchor="middle">SMO</text>
    <rect x="20" y="184" width="80" height="34" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/><text x="60" y="207" text-anchor="middle">SUFU</text>
