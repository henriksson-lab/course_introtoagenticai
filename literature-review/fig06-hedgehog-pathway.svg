<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#fff"/>
  <!-- ligands -->
  <text x="40" y="36" font-size="17" fill="#555">ligands (secreted)</text>
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="80" cy="80" r="32" fill="#2a7f8f"/><text x="80" y="86">SHH</text>
    <circle cx="160" cy="80" r="32" fill="#2a7f8f"/><text x="160" y="86">IHH</text>
    <circle cx="240" cy="80" r="32" fill="#2a7f8f"/><text x="240" y="86">DHH</text>
  </g>
  <!-- membrane -->
  <rect x="20" y="150" width="960" height="34" fill="#f0e8d0"/>
  <text x="975" y="173" font-size="15" fill="#8a6a12" text-anchor="end">cell membrane</text>
  <!-- receptors -->
  <rect x="110" y="128" width="170" height="78" rx="10" fill="#efeaf6" stroke="#6b4fa0" stroke-width="2"/>
  <text x="195" y="162" font-size="18" font-weight="bold" fill="#6b4fa0" text-anchor="middle">PTCH1</text>
  <text x="195" y="188" font-size="18" font-weight="bold" fill="#6b4fa0" text-anchor="middle">PTCH2</text>
  <line x1="160" y1="114" x2="180" y2="124" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="290" y="100" font-size="15" fill="#555">bind PTCH</text><line x1="240" y1="114" x2="222" y2="124" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="420" y="128" width="130" height="78" rx="10" fill="#fbf3f5" stroke="#a8324a" stroke-width="2"/>
  <text x="485" y="174" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">SMO</text>
  <!-- inhibit PTCH -> SMO -->
  <line x1="285" y1="167" x2="410" y2="167" stroke="#555" stroke-width="2.5"/>
  <line x1="412" y1="152" x2="412" y2="182" stroke="#555" stroke-width="3"/>
  <text x="348" y="226" font-size="15" fill="#555" text-anchor="middle">holds back</text>
  <!-- cytoplasm complex -->
  <rect x="380" y="270" width="270" height="70" rx="12" fill="#f4f4f4" stroke="#777"/>
  <text x="440" y="312" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">SUFU</text>
  <text x="565" y="312" font-size="17" font-weight="bold" fill="#2a7f8f" text-anchor="middle">GLI1/2/3</text>
  <line x1="485" y1="210" x2="485" y2="262" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="497" y="245" font-size="15" fill="#555">releases GLI from SUFU</text>
  <!-- nucleus -->
  <ellipse cx="830" cy="340" rx="140" ry="90" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="830" y="282" font-size="15" fill="#2a7f8f" text-anchor="middle">nucleus</text>
  <text x="830" y="322" font-size="18" font-weight="bold" fill="#2a7f8f" text-anchor="middle">GLI1, GLI2, GLI3</text>
  <text x="830" y="352" font-size="16" fill="#333" text-anchor="middle">switch target genes</text>
  <text x="830" y="376" font-size="16" fill="#333" text-anchor="middle">on or off (incl. GLI1, PTCH1)</text>
  <line x1="655" y1="305" x2="690" y2="316" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="20" y="420" font-size="17" fill="#333">Ten human genes, one well-studied signalling pathway (development, bone, cancer).</text>
  <text x="20" y="448" font-size="17" fill="#333">Big literature for some (SHH, GLI1), small for others (DHH, PTCH2).</text>
  <text x="985" y="462" font-size="13" fill="#999" text-anchor="end">simplified sketch</text>
</svg>
