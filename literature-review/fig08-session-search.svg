<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="10" y="10" width="980" height="430" rx="10" fill="#1f2430"/>
  <circle cx="32" cy="30" r="6" fill="#ff5f57"/><circle cx="52" cy="30" r="6" fill="#febc2e"/><circle cx="72" cy="30" r="6" fill="#28c840"/>
  <text x="500" y="35" font-size="14" fill="#9fb3c8" text-anchor="middle">~/agentic-course/literature-review</text>
  <g font-family="Courier New, monospace" font-size="16" xml:space="preserve">
    <text x="30" y="72" fill="#9fb3c8">&gt; Follow search-plan.md. Write scripts/search.py, run it, save raw results.</text>
    <text x="30" y="108" fill="#e8e8e8">I'll query PubMed (E-utilities) for each gene with the query in</text>
    <text x="30" y="130" fill="#e8e8e8">search-plan.md, then fetch the abstracts of the top 20 per gene.</text>
    <text x="30" y="160" fill="#7fd3e0">  Write scripts/search.py</text>
    <text x="30" y="182" fill="#7fd3e0">  Run python scripts/search.py</text>
    <text x="30" y="210" fill="#e8e8e8">    SHH    hits: 2654  saved: raw/pubmed/2026-11-23/SHH.json</text>
    <text x="30" y="232" fill="#e8e8e8">    IHH    hits:  332  saved: raw/pubmed/2026-11-23/IHH.json</text>
    <text x="30" y="254" fill="#e8e8e8">    DHH    hits:  100  saved: raw/pubmed/2026-11-23/DHH.json</text>
    <text x="30" y="276" fill="#e8e8e8">    ...</text>
    <text x="30" y="298" fill="#e8e8e8">    GLI3   hits:  341  saved: raw/pubmed/2026-11-23/GLI3.json</text>
    <text x="30" y="326" fill="#e8e8e8">    200 abstracts fetched, 0 errors. Log: raw/pubmed/2026-11-23/log.txt</text>
    <text x="30" y="362" fill="#f0c674">Note: many DHH hits are about testis and nerve sheaths; that is</text>
    <text x="30" y="384" fill="#f0c674">the gene's real biology, not a symbol clash. SMO: query includes</text>
    <text x="30" y="406" fill="#f0c674">"smoothened" as well as the symbol (see search-plan.md).</text>
  </g>
  <text x="985" y="462" font-size="14" fill="#999" text-anchor="end">illustrative; your session will look different</text>
</svg>
