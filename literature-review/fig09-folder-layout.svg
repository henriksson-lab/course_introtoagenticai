<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="15" y="15" width="520" height="440" rx="8" fill="#fafafa" stroke="#bbb"/>
  <g font-family="Courier New, monospace" font-size="17" fill="#333" xml:space="preserve">
    <text x="35" y="50" font-weight="bold">literature-review/</text>
    <text x="35" y="80">├── README.md</text>
    <text x="35" y="108">├── search-plan.md</text>
    <text x="35" y="136">├── .env            (not in git)</text>
    <text x="35" y="164">├── scripts/</text>
    <text x="35" y="192">│   ├── search.py</text>
    <text x="35" y="220">│   ├── verify.py</text>
    <text x="35" y="248">│   └── export_bibtex.py</text>
    <text x="35" y="276">├── raw/</text>
    <text x="35" y="304">│   └── pubmed/2026-11-23/…json</text>
    <text x="35" y="332">├── results/</text>
    <text x="35" y="360">│   ├── literature_table.csv</text>
    <text x="35" y="388">│   ├── verification_report.md</text>
    <text x="35" y="416">│   └── references.bib</text>
    <text x="35" y="444">└── notes/hand-checks.md</text>
  </g>
  <g font-size="17">
    <rect x="560" y="90" width="425" height="50" rx="6" fill="#f4f4f4" stroke="#777"/>
    <text x="575" y="121" fill="#333"><tspan font-weight="bold">Plan:</tspan> the question and the queries, by you</text>
    <rect x="560" y="170" width="425" height="70" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="575" y="200" fill="#333"><tspan font-weight="bold">Scripts:</tspan> rerun next year, or by a</text>
    <text x="575" y="224" fill="#333">colleague, to redo the search</text>
    <rect x="560" y="264" width="425" height="60" rx="6" fill="#fbf3f5" stroke="#a8324a"/>
    <text x="575" y="290" fill="#333"><tspan font-weight="bold">Raw:</tspan> what the database said that day.</text>
    <text x="575" y="312" fill="#a8324a" font-weight="bold">Never edited.</text>
    <rect x="560" y="345" width="425" height="60" rx="6" fill="#efeaf6" stroke="#6b4fa0"/>
    <text x="575" y="371" fill="#333"><tspan font-weight="bold">Results:</tspan> made from raw by the scripts;</text>
    <text x="575" y="393" fill="#333">delete and remake at any time</text>
  </g>
  <text x="560" y="50" font-size="18" fill="#333" font-weight="bold">Each part has one job</text>
</svg>
