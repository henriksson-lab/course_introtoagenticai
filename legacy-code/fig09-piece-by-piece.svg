<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <text x="150" y="35" font-size="19" text-anchor="middle" font-weight="bold" fill="#a8324a">original (MATLAB)</text>
  <text x="500" y="35" font-size="19" text-anchor="middle" font-weight="bold" fill="#333">compare</text>
  <text x="850" y="35" font-size="19" text-anchor="middle" font-weight="bold" fill="#6b4fa0">port (R or Python)</text>
  <g font-size="18" text-anchor="middle">
    <g>
      <rect x="40" y="55" width="220" height="56" rx="8" fill="#f6e4e8" stroke="#a8324a"/><text x="150" y="90">blcorr.m</text>
      <rect x="740" y="55" width="220" height="56" rx="8" fill="#eeeaf5" stroke="#6b4fa0"/><text x="850" y="90">blcorr()</text>
      <text x="500" y="80" font-size="16" fill="#555">blank-corrected table</text>
      <text x="500" y="102" font-size="17" fill="#2a7f8f" font-weight="bold">match</text>
    </g>
    <g>
      <rect x="40" y="135" width="220" height="56" rx="8" fill="#f6e4e8" stroke="#a8324a"/><text x="150" y="170">mvavg.m</text>
      <rect x="740" y="135" width="220" height="56" rx="8" fill="#eeeaf5" stroke="#6b4fa0"/><text x="850" y="170">mvavg()</text>
      <text x="500" y="160" font-size="16" fill="#555">smoothed curves</text>
      <text x="500" y="182" font-size="17" fill="#2a7f8f" font-weight="bold">match</text>
    </g>
    <g>
      <rect x="40" y="215" width="220" height="56" rx="8" fill="#f6e4e8" stroke="#a8324a"/><text x="150" y="250">fitwin.m</text>
      <rect x="740" y="215" width="220" height="56" rx="8" fill="#eeeaf5" stroke="#6b4fa0"/><text x="850" y="250">fitwin()</text>
      <text x="500" y="240" font-size="16" fill="#555">window first/last, rate</text>
      <text x="500" y="262" font-size="17" fill="#a8324a" font-weight="bold">off by one: counts from 0</text>
    </g>
    <g>
      <rect x="40" y="295" width="220" height="56" rx="8" fill="#f6e4e8" stroke="#a8324a"/><text x="150" y="330">gr_calc.m</text>
      <rect x="740" y="295" width="220" height="56" rx="8" fill="#eeeaf5" stroke="#6b4fa0"/><text x="850" y="330">gr_calc()</text>
      <text x="500" y="320" font-size="16" fill="#555">whole output file</text>
      <text x="500" y="342" font-size="17" fill="#555">after the pieces match</text>
    </g>
  </g>
  <g stroke="#bbb" stroke-width="2" stroke-dasharray="5 4">
    <line x1="262" y1="83" x2="380" y2="83"/><line x1="620" y1="83" x2="738" y2="83"/>
    <line x1="262" y1="163" x2="400" y2="163"/><line x1="600" y1="163" x2="738" y2="163"/>
    <line x1="262" y1="243" x2="390" y2="243"/><line x1="610" y1="243" x2="738" y2="243"/>
    <line x1="262" y1="323" x2="420" y2="323"/><line x1="580" y1="323" x2="738" y2="323"/>
  </g>
  <text x="500" y="388" font-size="18" text-anchor="middle" fill="#333">A difference is found where it starts, not only at the end.</text>
  <text x="980" y="396" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
