<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <rect x="20" y="40" width="190" height="110" rx="10" fill="#f5f5f5" stroke="#888"/>
  <text x="115" y="72" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">plate_0312.csv</text>
  <text x="115" y="98" font-size="16" text-anchor="middle" fill="#555">time + 24 wells</text>
  <text x="115" y="121" font-size="16" text-anchor="middle" fill="#555">OD600, A1..D6</text>
  <rect x="300" y="20" width="400" height="60" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="500" y="57" font-size="20" text-anchor="middle" font-weight="bold" fill="#2a7f8f">gr_calc.m  (entry point)</text>
  <g font-size="17">
    <rect x="300" y="115" width="400" height="62" rx="8" fill="#fff" stroke="#2a7f8f"/>
    <text x="318" y="141" font-weight="bold" fill="#333">blcorr.m</text>
    <text x="318" y="164" fill="#555">subtract mean of blank wells; floor 0.001</text>
    <rect x="300" y="195" width="400" height="62" rx="8" fill="#fff" stroke="#2a7f8f"/>
    <text x="318" y="221" font-weight="bold" fill="#333">mvavg.m</text>
    <text x="318" y="244" fill="#555">3-point moving average over time</text>
    <rect x="300" y="275" width="400" height="62" rx="8" fill="#fff" stroke="#2a7f8f"/>
    <text x="318" y="301" font-weight="bold" fill="#333">fitwin.m   (called once per well)</text>
    <text x="318" y="324" fill="#555">straight line to log(OD) from OD 0.02 to 0.2</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="212" y1="95" x2="296" y2="140"/>
    <line x1="500" y1="82" x2="500" y2="111"/><line x1="500" y1="179" x2="500" y2="191"/><line x1="500" y1="259" x2="500" y2="271"/>
    <line x1="500" y1="339" x2="500" y2="363"/>
  </g>
  <rect x="300" y="367" width="400" height="66" rx="10" fill="#f5f5f5" stroke="#888"/>
  <text x="500" y="395" font-size="18" text-anchor="middle" font-weight="bold" fill="#333">gr_out_0312.txt</text>
  <text x="500" y="420" font-size="15" text-anchor="middle" fill="#555">rate, doubling time, R², window per well; strain means</text>
  <g font-size="17" fill="#8a6a12">
    <rect x="740" y="115" width="245" height="222" rx="10" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="756" y="145" font-weight="bold">hard-coded in gr_calc.m</text>
    <text x="756" y="175">file name</text>
    <text x="756" y="201">blank wells [1 7 13]</text>
    <text x="756" y="227">15 min between reads</text>
    <text x="756" y="253">thresholds 0.02, 0.2</text>
    <text x="756" y="279">strain names, layout</text>
    <text x="756" y="305">date = fname(7:10)</text>
  </g>
  <text x="115" y="200" font-size="16" text-anchor="middle" fill="#a8324a">time column</text>
  <text x="115" y="222" font-size="16" text-anchor="middle" fill="#a8324a">is never read</text>
</svg>
