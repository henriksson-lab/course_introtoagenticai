<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#333">ASSUMPTIONS.md</text>
  <g font-size="17">
    <rect x="20" y="48" width="960" height="36" fill="#e6e6e6"/>
    <text x="32" y="72" font-weight="bold" fill="#333">Assumption</text>
    <text x="400" y="72" font-weight="bold" fill="#333">Where</text>
    <text x="560" y="72" font-weight="bold" fill="#333">Holds for 0312?</text>
    <text x="750" y="72" font-weight="bold" fill="#333">Holds for 0409?</text>
    <g fill="#333">
      <rect x="20" y="88" width="960" height="44" fill="#f6e4e8"/>
      <text x="32" y="116">one reading every 15 min</text><text x="400" y="116">gr_calc.m l. 13</text>
      <text x="560" y="116" fill="#2a7f8f">yes (time col.)</text><text x="750" y="116" fill="#a8324a" font-weight="bold">NO: every 10 min</text>
      <rect x="20" y="136" width="960" height="44" fill="#f6e4e8"/>
      <text x="32" y="164">blanks are wells 1, 7, 13</text><text x="400" y="164">gr_calc.m l. 17</text>
      <text x="560" y="164" fill="#a8324a" font-weight="bold">? layout: 4 blanks</text><text x="750" y="164" fill="#a8324a" font-weight="bold">? same layout</text>
      <rect x="20" y="184" width="960" height="44" fill="#fafafa"/>
      <text x="32" y="212">exp. phase OD 0.02 to 0.2</text><text x="400" y="212">gr_calc.m l. 23</text>
      <text x="560" y="212" fill="#2a7f8f">plausible</text><text x="750" y="212" fill="#2a7f8f">plausible</text>
      <rect x="20" y="232" width="960" height="44" fill="#fafafa"/>
      <text x="32" y="260">24 wells, 4 rows x 6 columns</text><text x="400" y="260">gr_calc.m l. 30</text>
      <text x="560" y="260" fill="#2a7f8f">yes</text><text x="750" y="260" fill="#2a7f8f">yes</text>
      <rect x="20" y="280" width="960" height="44" fill="#fafafa"/>
      <text x="32" y="308">strains WT..dAB in columns 2-6</text><text x="400" y="308">gr_calc.m l. 44</text>
      <text x="560" y="308" fill="#2a7f8f">yes (notebook)</text><text x="750" y="308" fill="#8a6a12">ask</text>
      <rect x="20" y="328" width="960" height="44" fill="#fafafa"/>
      <text x="32" y="356">file name is plate_MMDD.csv</text><text x="400" y="356">gr_calc.m l. 46</text>
      <text x="560" y="356" fill="#2a7f8f">yes</text><text x="750" y="356" fill="#2a7f8f">yes</text>
    </g>
  </g>
  <text x="20" y="408" font-size="18" fill="#333">The agent drafts the rows from the code; <tspan font-weight="bold">you</tspan> fill in whether they hold, from the lab.</text>
  <text x="980" y="434" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
