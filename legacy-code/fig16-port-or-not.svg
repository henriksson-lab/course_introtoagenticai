<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <rect x="300" y="15" width="400" height="60" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="500" y="42" font-size="18" text-anchor="middle" fill="#333">Always: map, README, comments,</text>
  <text x="500" y="64" font-size="18" text-anchor="middle" fill="#333">reference outputs, assumptions</text>
  <rect x="330" y="110" width="340" height="56" rx="28" fill="#fff" stroke="#555" stroke-width="2"/>
  <text x="500" y="144" font-size="19" text-anchor="middle" fill="#333">What must it do in two years?</text>
  <line x1="500" y1="77" x2="500" y2="106" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#a)">
    <line x1="400" y1="168" x2="180" y2="225"/><line x1="500" y1="168" x2="500" y2="225"/><line x1="600" y1="168" x2="820" y2="225"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <text x="290" y="182" fill="#555" text-anchor="end">rerun now and then</text>
    <text x="510" y="205" fill="#555" text-anchor="start">one result</text>
    <text x="710" y="182" fill="#555" text-anchor="start">grow, for years</text>
    <rect x="40" y="230" width="280" height="160" rx="10" fill="#f5f5f5" stroke="#888"/>
    <text x="180" y="262" font-weight="bold" fill="#333">Keep it as it is</text>
    <text x="180" y="292" fill="#333">run in MATLAB or Octave;</text>
    <text x="180" y="316" fill="#333">the documentation is</text>
    <text x="180" y="340" fill="#333">the deliverable</text>
    <text x="180" y="372" fill="#2a7f8f">hours</text>
    <rect x="360" y="230" width="280" height="160" rx="10" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="500" y="262" font-weight="bold" fill="#333">Port one path</text>
    <text x="500" y="292" fill="#333">the code behind one figure</text>
    <text x="500" y="316" fill="#333">or table; archive the rest</text>
    <text x="500" y="340" fill="#333">with its map</text>
    <text x="500" y="372" fill="#8a6a12">days</text>
    <rect x="680" y="230" width="280" height="160" rx="10" fill="#eeeaf5" stroke="#6b4fa0"/>
    <text x="820" y="262" font-weight="bold" fill="#333">Port it all</text>
    <text x="820" y="292" fill="#333">to the group's language,</text>
    <text x="820" y="316" fill="#333">piece by piece, with tests</text>
    <text x="820" y="340" fill="#333">for every piece</text>
    <text x="820" y="372" fill="#6b4fa0">weeks, in sessions</text>
  </g>
</svg>
