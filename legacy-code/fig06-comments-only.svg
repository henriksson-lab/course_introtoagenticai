<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <text x="20" y="32" font-size="19" fill="#666">What git shows after "add comments" (green = added, red = removed)</text>
  <rect x="20" y="45" width="960" height="190" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <g xml:space="preserve" style="white-space:pre" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17">
    <rect x="22" y="60" width="956" height="26" fill="#e3f3e6"/>
    <text x="34" y="79" fill="#2e7d32">+ % Blank wells: indices into the 24 wells, counted row by row.</text>
    <rect x="22" y="88" width="956" height="26" fill="#e3f3e6"/>
    <text x="34" y="107" fill="#2e7d32">+ % NOTE: only A1, B1, C1; D1 (19) is missing. Intended?</text>
    <text x="34" y="135" fill="#333">  bl = [1 7 13];</text>
    <rect x="22" y="146" width="956" height="26" fill="#e3f3e6"/>
    <text x="34" y="165" fill="#2e7d32">+ % Subtract the mean blank at each time point (see blcorr.m).</text>
    <text x="34" y="193" fill="#333">  Y = blcorr(X, bl);</text>
    <text x="34" y="221" fill="#2a7f8f">  OK: every changed line is a comment</text>
  </g>
  <rect x="20" y="255" width="960" height="150" rx="8" fill="#f7f7f7" stroke="#a8324a" stroke-width="2"/>
  <g xml:space="preserve" style="white-space:pre" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="17">
    <rect x="22" y="270" width="956" height="26" fill="#e3f3e6"/>
    <text x="34" y="289" fill="#2e7d32">+ % Blank wells (column 1).</text>
    <rect x="22" y="298" width="956" height="26" fill="#fbe5e8"/>
    <text x="34" y="317" fill="#a8324a">- bl = [1 7 13];</text>
    <rect x="22" y="326" width="956" height="26" fill="#e3f3e6"/>
    <text x="34" y="345" fill="#2e7d32">+ bl = [1 7 13 19];</text>
    <text x="34" y="385" fill="#a8324a" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold">NOT OK: a "comment" job that changed the code. These are no longer the published numbers.</text>
  </g>
  <text x="980" y="414" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
