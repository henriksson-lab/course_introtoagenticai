<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- README -->
  <rect x="20" y="30" width="460" height="380" rx="12" fill="#f0ecf7" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="250" y="72" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#6b4fa0">README.md</text>
  <text x="250" y="102" text-anchor="middle" font-size="18" fill="#333">read by people: colleagues, you later</text>
  <g font-size="18" fill="#333">
    <text x="45" y="150">• what the project is and why</text>
    <text x="45" y="185">• where the data came from, licence</text>
    <text x="45" y="220">• how to rerun the analysis</text>
    <text x="45" y="255">• who to ask</text>
    <text x="45" y="290">• data class and precautions</text>
  </g>
  <text x="250" y="380" text-anchor="middle" font-size="17" fill="#555" font-style="italic">opened when someone wants to</text>
  <!-- AGENTS -->
  <rect x="520" y="30" width="460" height="380" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="750" y="72" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#2a7f8f">AGENTS.md</text>
  <text x="750" y="102" text-anchor="middle" font-size="18" fill="#333">read by agents: every session</text>
  <g font-size="18" fill="#333">
    <text x="545" y="150">• what the project is, in two lines</text>
    <text x="545" y="185">• where things are; what is current</text>
    <text x="545" y="220">• what values and codes mean</text>
    <text x="545" y="255">• rules: read-only, keep out</text>
    <text x="545" y="290">• how to check work</text>
    <text x="545" y="325">• in doubt: list it and ask</text>
  </g>
  <text x="750" y="380" text-anchor="middle" font-size="17" fill="#555" font-style="italic">loaded automatically at the start</text>
</svg>
