<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
  </defs>
  <!-- without -->
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#a8324a">Without notes in the folder</text>
  <g font-size="17">
    <rect x="20" y="50" width="290" height="120" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="38" y="80" font-weight="bold" fill="#333">Monday</text>
    <text x="38" y="106" fill="#555">explains: blank = not visited,</text>
    <text x="38" y="130" fill="#555">site F out in autumn, OLD file</text>
    <text x="38" y="154" fill="#555">is old ... (one hour)</text>
    <rect x="355" y="50" width="290" height="120" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="373" y="80" font-weight="bold" fill="#333">Tuesday: new session</text>
    <text x="373" y="106" fill="#555">knows none of it</text>
    <text x="373" y="130" fill="#555">re-reads every file</text>
    <text x="373" y="154" fill="#555">uses counts_clean_OLD.csv</text>
    <rect x="690" y="50" width="290" height="120" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="708" y="80" font-weight="bold" fill="#333">Wednesday: new session</text>
    <text x="708" y="106" fill="#555">explain it all again ...</text>
  </g>
  <line x1="310" y1="110" x2="351" y2="110" stroke="#ccc" stroke-width="2.5" stroke-dasharray="5,4"/>
  <line x1="645" y1="110" x2="686" y2="110" stroke="#ccc" stroke-width="2.5" stroke-dasharray="5,4"/>
  <!-- with -->
  <text x="20" y="234" font-size="20" font-weight="bold" fill="#2a7f8f">With AGENTS.md and notes/plan.md</text>
  <g font-size="17">
    <rect x="20" y="250" width="290" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="38" y="280" font-weight="bold" fill="#333">Monday</text>
    <text x="38" y="306" fill="#555">explains once, and</text>
    <text x="38" y="330" fill="#555">writes it into the files</text>
    <rect x="355" y="250" width="290" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="373" y="280" font-weight="bold" fill="#333">Tuesday: new session</text>
    <text x="373" y="306" fill="#555">reads AGENTS.md, plan.md</text>
    <text x="373" y="330" fill="#555">starts where Monday ended</text>
    <rect x="690" y="250" width="290" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="708" y="280" font-weight="bold" fill="#333">Wednesday: same</text>
    <text x="708" y="306" fill="#555">and so does a colleague</text>
  </g>
  <rect x="300" y="380" width="400" height="44" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <text x="500" y="408" text-anchor="middle" font-size="17" fill="#2a7f8f">the folder: AGENTS.md + notes/</text>
  <line x1="165" y1="350" x2="320" y2="378" stroke="#2a7f8f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="380" x2="500" y2="354" stroke="#2a7f8f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="378" x2="835" y2="354" stroke="#2a7f8f" stroke-width="2" marker-end="url(#a)"/>
</svg>
