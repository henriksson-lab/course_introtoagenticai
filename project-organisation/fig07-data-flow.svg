  <text x="115" y="150" text-anchor="middle" font-size="17" fill="#333">originals</text>
  <text x="115" y="180" text-anchor="middle" font-size="17" fill="#a8324a">read-only</text>
  <rect x="270" y="95" width="170" height="100" rx="10" fill="#f6efdc" stroke="#8a6a12" stroke-width="2"/>
  <text x="355" y="132" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="17" fill="#333">scripts/</text>
  <text x="355" y="162" text-anchor="middle" font-size="16" fill="#555">01_clean.py</text>
  <rect x="500" y="80" width="210" height="130" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="605" y="118" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" fill="#333">data/processed/</text>
  <text x="605" y="150" text-anchor="middle" font-size="17" fill="#555">counts_clean.csv</text>
  <rect x="770" y="80" width="210" height="130" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="875" y="118" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="18" fill="#333">results/</text>
  <text x="875" y="150" text-anchor="middle" font-size="17" fill="#555">fig_sites.svg</text>
  <line x1="210" y1="145" x2="266" y2="145" stroke="#666" stroke-width="3" marker-end="url(#a)"/>
  <line x1="440" y1="145" x2="496" y2="145" stroke="#666" stroke-width="3" marker-end="url(#a)"/>
  <line x1="710" y1="145" x2="766" y2="145" stroke="#666" stroke-width="3" marker-end="url(#a)"/>
  <text x="738" y="132" text-anchor="middle" font-size="14" fill="#555">02_</text>
  <!-- bracket regenerable -->
  <path d="M500,235 L500,255 L980,255 L980,235" fill="none" stroke="#2a7f8f" stroke-width="2.5"/>
