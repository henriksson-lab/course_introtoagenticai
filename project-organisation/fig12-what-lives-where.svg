<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <rect x="20" y="30" width="470" height="330" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="255" y="68" text-anchor="middle" font-size="21" font-weight="bold" fill="#2a7f8f">In the project folder</text>
  <text x="255" y="96" text-anchor="middle" font-size="17" fill="#555">shared with colleagues, and on GitHub</text>
  <g font-size="18" fill="#333">
    <text x="50" y="145">AGENTS.md, CLAUDE.md, README.md</text>
    <text x="50" y="180">notes/: plan, decisions, AI log</text>
    <text x="50" y="215">data/, scripts/, results/</text>
    <text x="50" y="260" fill="#2a7f8f" font-weight="bold">Project rules and knowledge:</text>
    <text x="50" y="288" fill="#2a7f8f">"data/raw is read-only"</text>
    <text x="50" y="316" fill="#2a7f8f">"blank = not visited"</text>
  </g>
  <rect x="510" y="30" width="470" height="330" rx="12" fill="#f4f4f4" stroke="#888" stroke-width="2.5"/>
  <text x="745" y="68" text-anchor="middle" font-size="21" font-weight="bold" fill="#555">On your computer only</text>
  <text x="745" y="96" text-anchor="middle" font-size="17" fill="#555">nobody else sees it</text>
  <g font-size="18" fill="#333">
    <text x="540" y="145">Claude Code auto memory</text>
    <text x="540" y="180">Codex memories (if switched on)</text>
    <text x="540" y="215">session history, settings</text>
    <text x="540" y="260" font-weight="bold" fill="#555">How you like to work:</text>
    <text x="540" y="288" fill="#555">"answer in short sentences"</text>
    <text x="540" y="316" fill="#555">"I prefer R to Python"</text>
  </g>
  <text x="500" y="405" text-anchor="middle" font-size="19" fill="#333">Test: would a colleague need it to continue the project? Then it goes in the folder.</text>
</svg>
