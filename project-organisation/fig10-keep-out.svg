<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <rect x="20" y="20" width="560" height="420" rx="12" fill="#f8e9ec" stroke="#a8324a" stroke-width="2.5"/>
  <text x="300" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#a8324a">Keep out of the project folder</text>
  <g font-size="18" fill="#333">
    <text x="45" y="105" font-weight="bold">Passwords, API keys, tokens</text>
    <text x="45" y="129" fill="#555">the agent may read them; a pushed key is leaked</text>
    <text x="45" y="172" font-weight="bold">Personal data the analysis does not need</text>
    <text x="45" y="196" fill="#555">contact lists, names next to codes</text>
    <text x="45" y="239" font-weight="bold">Sensitive or confidential raw data</text>
    <text x="45" y="263" fill="#555">patients, exams, data under agreement</text>
    <text x="45" y="306" font-weight="bold">Very large files that live elsewhere</text>
    <text x="45" y="330" fill="#555">write where they are instead</text>
    <text x="45" y="373" font-weight="bold">Private things that happen to be nearby</text>
    <text x="45" y="397" fill="#555">e-mails, reviews, other projects</text>
  </g>
  <text x="790" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">In the bird project</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17">
    <rect x="620" y="85" width="340" height="44" rx="6" fill="#ffffff" stroke="#a8324a" stroke-width="2"/>
    <text x="640" y="114" fill="#a8324a">api_key.txt</text>
    <rect x="620" y="145" width="340" height="44" rx="6" fill="#ffffff" stroke="#a8324a" stroke-width="2"/>
    <text x="640" y="174" fill="#a8324a">volunteer_contacts.csv</text>
  </g>
  <g font-size="17" fill="#333">
    <text x="620" y="235">Move them out by hand,</text>
    <text x="620" y="259">before the agent starts.</text>
    <text x="620" y="303">AGENTS.md then says:</text>
    <text x="620" y="327" fill="#555" font-style="italic">"Contact details and keys are</text>
    <text x="620" y="351" fill="#555" font-style="italic">kept outside this folder."</text>
  </g>
</svg>
