    <text x="360" y="390" fill="#555">where we are, what is next</text>
    <text x="360" y="422" fill="#555">what was decided, and why</text>
    <text x="360" y="454" fill="#555">log of AI use</text>
  </g>
  <rect x="20" y="490" width="860" height="50" rx="8" fill="#f4f4f4"/>
  <text x="450" y="522" text-anchor="middle" font-size="18" fill="#333">Nothing else loose at the top. Extra folders (docs/, text/) are fine: say so in AGENTS.md.</text>
