  <text x="500" y="390" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">Only the export goes into the public page folder: it holds app.R and the data file.</text>
  <text x="500" y="416" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">_quarto.yml lists water-app-site under resources, so rendering copies it into docs/.</text>
  <text x="500" y="442" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">Re-export after every change to the app; never edit the export by hand.</text>
