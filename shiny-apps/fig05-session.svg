<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
    <marker id="arwt" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#2a7f8f"/></marker>
    <marker id="arwc" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#a8324a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="380" rx="10" fill="#1e2630" stroke="#3a4654" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="34" rx="10" fill="#2d3743"/>
  <rect x="20" y="44" width="960" height="10" fill="#2d3743"/>
  <circle cx="40" cy="37" r="6.5" fill="#e0605a"/>
  <circle cx="62" cy="37" r="6.5" fill="#e6b84f"/>
  <circle cx="84" cy="37" r="6.5" fill="#5fbf6a"/>
  <text x="500.0" y="43" font-size="15" fill="#b8c2cc" text-anchor="middle" font-weight="normal" xml:space="preserve">water-app: agent session</text>
  <text x="38" y="82" font-size="18" fill="#9fe0ea" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">&gt; Make a Shiny app in app.R for water-quality.csv ...</text>
  <text x="38" y="116" font-size="18" fill="#e8edf2" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">● I'll write app.R with a sidebar of filters, a plot,</text>
  <text x="38" y="150" font-size="18" fill="#e8edf2" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  a summary table and a download button.</text>
  <text x="38" y="184" font-size="18" fill="#e6b84f" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  Write(app.R)   +96 lines</text>
  <text x="38" y="218" font-size="18" fill="#e8edf2" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">● The app needs the R package shiny. Install it?</text>
  <text x="38" y="252" font-size="18" fill="#ffffff" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  Rscript -e 'install.packages("shiny")'</text>
  <text x="38" y="286" font-size="18" fill="#e6b84f" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  Do you want to proceed?   &gt; 1. Yes    2. No</text>
  <text x="38" y="320" font-size="18" fill="#e8edf2" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">● Start the app with:  Rscript -e 'shiny::runApp()'</text>
  <text x="38" y="354" font-size="18" fill="#e8edf2" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">  Then open the address it prints in your browser.</text>
  <rect x="28" y="192" width="700" height="104" rx="6" fill="none" stroke="#e6b84f" stroke-width="2.5"/>
  <text x="30" y="440" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">Installing shiny (and ggplot2) is a normal, one-time step: read the command, then say yes.</text>
  <text x="30" y="466" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">The agent should not install anything you did not expect; ask what it is if unsure.</text>
  <text x="990" y="510" font-size="14" fill="#9aa4ad" text-anchor="end" font-weight="normal" font-style="italic" xml:space="preserve">illustrative: your session will look different</text>
</svg>
