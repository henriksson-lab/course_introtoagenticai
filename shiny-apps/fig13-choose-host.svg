<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
    <marker id="arwt" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#2a7f8f"/></marker>
    <marker id="arwc" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#a8324a"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <rect x="270" y="20" width="460" height="80" rx="10" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
  <text x="500.0" y="54.3" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" xml:space="preserve">May anyone in the world</text>
  <text x="500.0" y="79.0" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">download all of this data?</text>
  <line x1="400" y1="102" x2="230" y2="160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="290" y="140" font-size="17" fill="#2a7f8f" text-anchor="end" font-weight="bold" xml:space="preserve">yes</text>
  <line x1="600" y1="102" x2="770" y2="160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="710" y="140" font-size="17" fill="#a8324a" text-anchor="start" font-weight="bold" xml:space="preserve">no</text>
  <rect x="40" y="165" width="380" height="90" rx="10" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
  <text x="230.0" y="204.89999999999998" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold" xml:space="preserve">Does it need secrets, a database,</text>
  <text x="230.0" y="226.99999999999997" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">large data or unusual packages?</text>
  <line x1="130" y1="258" x2="130" y2="320" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="120" y="295" font-size="17" fill="#2a7f8f" text-anchor="end" font-weight="bold" xml:space="preserve">no</text>
  <line x1="330" y1="258" x2="330" y2="320" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="340" y="295" font-size="17" fill="#8a6a12" text-anchor="start" font-weight="bold" xml:space="preserve">yes</text>
  <rect x="20" y="325" width="220" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="130.0" y="374.0" font-size="20" fill="#2a7f8f" text-anchor="middle" font-weight="bold" xml:space="preserve">Shinylive</text>
  <text x="130.0" y="400.0" font-size="20" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">on GitHub Pages</text>
  <rect x="255" y="325" width="200" height="110" rx="10" fill="#eee9f6" stroke="#6b4fa0" stroke-width="2"/>
  <text x="355.0" y="374.6" font-size="18" fill="#6b4fa0" text-anchor="middle" font-weight="bold" xml:space="preserve">A server</text>
  <text x="355.0" y="398.0" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">hosted or university</text>
  <rect x="560" y="165" width="420" height="90" rx="10" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
  <text x="770.0" y="204.60000000000002" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold" xml:space="preserve">Personal, sensitive or</text>
  <text x="770.0" y="228.00000000000003" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">given in confidence?</text>
  <line x1="650" y1="258" x2="650" y2="320" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="640" y="295" font-size="17" fill="#8a6a12" text-anchor="end" font-weight="bold" xml:space="preserve">no (internal)</text>
  <line x1="880" y1="258" x2="880" y2="320" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="890" y="295" font-size="17" fill="#a8324a" text-anchor="start" font-weight="bold" xml:space="preserve">yes</text>
  <rect x="530" y="325" width="230" height="110" rx="10" fill="#f5efdf" stroke="#8a6a12" stroke-width="2"/>
  <text x="645.0" y="374.6" font-size="18" fill="#8a6a12" text-anchor="middle" font-weight="bold" xml:space="preserve">Server with login</text>
  <text x="645.0" y="398.0" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">in the university</text>
  <rect x="775" y="325" width="215" height="110" rx="10" fill="#f7e6ea" stroke="#a8324a" stroke-width="2"/>
  <text x="882.5" y="363.84999999999997" font-size="17" fill="#a8324a" text-anchor="middle" font-weight="bold" xml:space="preserve">Do not publish</text>
  <text x="882.5" y="385.95" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">use aggregated or</text>
  <text x="882.5" y="408.04999999999995" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">synthetic data</text>
  <text x="500" y="490" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">A login protects who can open the app. It does not change what the app shows</text>
  <text x="500" y="516" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">to those who can. Ask the data owner before anything leaves your computer.</text>
</svg>
