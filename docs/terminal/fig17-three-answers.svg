<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>
  <rect x="380" y="20" width="240" height="56" rx="8" fill="#f2f2f2" stroke="#666" stroke-width="1.5"/>
  <text x="500" y="56" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">Permission request</text>
  <g stroke="#999" stroke-width="2" fill="none">
    <path d="M500,76 V100 M170,100 H830 M170,100 V125 M500,100 V125 M830,100 V125"/>
  </g>
  <rect x="30" y="125" width="280" height="215" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="170" y="162" font-size="22" fill="#2a7f8f" text-anchor="middle" font-weight="bold">Yes (once)</text>
  <text x="170" y="200" font-size="18" fill="#222" text-anchor="middle">runs this one action</text>
  <text x="170" y="228" font-size="18" fill="#222" text-anchor="middle">asks again next time</text>
  <text x="170" y="290" font-size="18" fill="#555" text-anchor="middle">the safe default while</text>
  <text x="170" y="314" font-size="18" fill="#555" text-anchor="middle">you are learning</text>
  <rect x="360" y="125" width="280" height="215" rx="10" fill="#f7f1e1" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="162" font-size="22" fill="#8a6a12" text-anchor="middle" font-weight="bold">Yes, don't ask again</text>
  <text x="500" y="200" font-size="18" fill="#222" text-anchor="middle">similar actions run</text>
  <text x="500" y="228" font-size="18" fill="#222" text-anchor="middle">without asking</text>
  <text x="500" y="290" font-size="18" fill="#555" text-anchor="middle">read what "similar"</text>
  <text x="500" y="314" font-size="18" fill="#555" text-anchor="middle">covers before you choose</text>
  <rect x="690" y="125" width="280" height="215" rx="10" fill="#fdf6f7" stroke="#a8324a" stroke-width="2"/>
  <text x="830" y="162" font-size="22" fill="#a8324a" text-anchor="middle" font-weight="bold">No, do this instead</text>
  <text x="830" y="200" font-size="18" fill="#222" text-anchor="middle">nothing runs</text>
  <text x="830" y="228" font-size="18" fill="#222" text-anchor="middle">you say what to do</text>
  <text x="830" y="290" font-size="18" fill="#555" text-anchor="middle">"No. First explain what</text>
  <text x="830" y="314" font-size="18" fill="#555" text-anchor="middle">this command does."</text>
</svg>
