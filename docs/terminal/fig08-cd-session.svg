<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <rect x="20" y="20" width="580" height="400" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h560 a10,10 0 0 1 10,10 v26 h-580 z" fill="#e4e4e4"/>
  <text x="310" y="44" font-size="16" fill="#555" text-anchor="middle">Terminal</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18">
    <text x="38" y="92"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop ~ %</tspan><tspan fill="#6b4fa0" font-weight="bold"> cd Documents</tspan></text>
    <text x="38" y="132"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop Documents %</tspan><tspan fill="#6b4fa0" font-weight="bold"> ls</tspan></text>
    <text x="38" y="168" fill="#333">grants&#160;&#160;&#160;&#160;&#160;&#160;teaching</text>
    <text x="38" y="208"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop Documents %</tspan><tspan fill="#6b4fa0" font-weight="bold"> cd teaching</tspan></text>
    <text x="38" y="248"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop teaching %</tspan><tspan fill="#6b4fa0" font-weight="bold"> cd ..</tspan></text>
    <text x="38" y="288"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop Documents %</tspan><tspan fill="#6b4fa0" font-weight="bold"> mkdir notes</tspan></text>
    <text x="38" y="328"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop Documents %</tspan><tspan fill="#6b4fa0" font-weight="bold"> ls</tspan></text>
    <text x="38" y="364" fill="#333">grants&#160;&#160;&#160;&#160;&#160;&#160;notes&#160;&#160;&#160;&#160;&#160;&#160;&#160;teaching</text>
  </g>
  <g font-size="19" fill="#2a7f8f">
    <text x="625" y="92">1. go into Documents</text>
    <text x="625" y="132">2. what is in here?</text>
    <text x="625" y="208">3. go into teaching</text>
    <text x="625" y="248">4. back up one level</text>
    <text x="625" y="288">5. make a folder called notes</text>
    <text x="625" y="328">6. check: is it there?</text>
  </g>
  <text x="625" y="390" font-size="18" fill="#666">Watch the prompt: it always</text>
  <text x="625" y="414" font-size="18" fill="#666">shows the folder you are in.</text>
  <text x="592" y="412" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
