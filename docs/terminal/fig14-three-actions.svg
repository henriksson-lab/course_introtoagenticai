<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>
  <!-- read -->
  <rect x="20" y="20" width="300" height="320" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <path d="M130,50 h40 l14,14 v56 h-54 z" fill="#fff" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="178" cy="108" r="16" fill="none" stroke="#2a7f8f" stroke-width="4"/>
  <path d="M190,120 l16,16" stroke="#2a7f8f" stroke-width="5" stroke-linecap="round"/>
  <text x="170" y="180" font-size="25" fill="#2a7f8f" font-weight="bold" text-anchor="middle">Read</text>
  <text x="170" y="215" font-size="18" fill="#222" text-anchor="middle">looks at files and folders</text>
  <text x="170" y="245" font-size="18" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ls, cat, head</text>
  <text x="170" y="290" font-size="18" fill="#222" text-anchor="middle">Inside the folder:</text>
  <text x="170" y="314" font-size="18" fill="#222" text-anchor="middle">usually no question</text>
  <!-- edit -->
  <rect x="350" y="20" width="300" height="320" rx="12" fill="#f7f1e1" stroke="#8a6a12" stroke-width="2"/>
  <path d="M460,50 h40 l14,14 v56 h-54 z" fill="#fff" stroke="#8a6a12" stroke-width="2"/>
  <path d="M488,120 l34,-40 l10,8 l-34,40 l-14,6 z" fill="#8a6a12"/>
  <text x="500" y="180" font-size="25" fill="#8a6a12" font-weight="bold" text-anchor="middle">Edit</text>
  <text x="500" y="215" font-size="18" fill="#222" text-anchor="middle">creates or changes a file</text>
  <text x="500" y="245" font-size="18" fill="#555" text-anchor="middle">shows you the change</text>
  <text x="500" y="290" font-size="18" fill="#222" text-anchor="middle">Asks first, unless you</text>
  <text x="500" y="314" font-size="18" fill="#222" text-anchor="middle">allowed edits</text>
  <!-- run -->
  <rect x="680" y="20" width="300" height="320" rx="12" fill="#fdf6f7" stroke="#a8324a" stroke-width="2"/>
  <rect x="783" y="55" width="94" height="68" rx="6" fill="#fff" stroke="#a8324a" stroke-width="2"/>
  <text x="798" y="100" font-size="26" fill="#a8324a" font-weight="bold" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&gt;_</text>
  <text x="830" y="180" font-size="25" fill="#a8324a" font-weight="bold" text-anchor="middle">Run a command</text>
  <text x="830" y="215" font-size="18" fill="#222" text-anchor="middle">starts a program</text>
  <text x="830" y="245" font-size="18" fill="#555" text-anchor="middle" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">mv, rm, Rscript</text>
  <text x="830" y="290" font-size="18" fill="#222" text-anchor="middle">Can do anything you can.</text>
  <text x="830" y="314" font-size="18" fill="#222" text-anchor="middle">Read it before you say yes.</text>
</svg>
