<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#ffffff"/>
  <!-- terminal window -->
  <rect x="20" y="20" width="960" height="400" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h940 a10,10 0 0 1 10,10 v26 h-960 z" fill="#e4e4e4"/>
  <circle cx="44" cy="38" r="7" fill="#c8c8c8"/><circle cx="66" cy="38" r="7" fill="#c8c8c8"/><circle cx="88" cy="38" r="7" fill="#c8c8c8"/>
  <text x="500" y="44" font-size="16" fill="#555" text-anchor="middle">agentic-course: claude</text>
  <!-- prompt box -->
  <rect x="50" y="80" width="900" height="300" rx="8" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" fill="#222">
    <text x="75" y="118" font-weight="bold" fill="#6b4fa0">Bash command</text>
    <text x="95" y="156">mv data/*.xlsx old/</text>
    <text x="95" y="188" fill="#777">Move the Excel files into the old folder</text>
    <text x="75" y="230">Do you want to proceed?</text>
    <text x="75" y="264" fill="#6b4fa0">&gt; 1. Yes</text>
    <text x="75" y="296">&#160;&#160;2. Yes, and don't ask again for: mv *</text>
    <text x="75" y="328">&#160;&#160;3. No</text>
    <text x="75" y="364" font-size="16" fill="#888">Esc to cancel · Tab to amend</text>
  </g>
  <!-- question callout -->
  <path d="M590,146 L360,150" stroke="#a8324a" stroke-width="2.5" fill="none"/>
  <path d="M360,150 l12,-7 v14 z" fill="#a8324a"/>
  <text x="600" y="140" font-size="22" fill="#a8324a" font-weight="bold">What does this do?</text>
  <text x="600" y="168" font-size="20" fill="#a8324a">Which files? Can I undo it?</text>
  <text x="972" y="440" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
