<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="490" fill="#ffffff"/>
  <rect x="20" y="20" width="960" height="450" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h940 a10,10 0 0 1 10,10 v26 h-960 z" fill="#e4e4e4"/>
  <text x="500" y="44" font-size="16" fill="#555" text-anchor="middle">~/agentic-course: agent session</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18">
    <text x="45" y="94" fill="#6b4fa0" font-weight="bold">Wants to run:&#160;&#160;find . -name "*.tmp" -delete</text>
    <text x="45" y="124" fill="#a8324a">You chose: No</text>
    <rect x="35" y="146" width="930" height="70" rx="6" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="52" y="176" fill="#222">&gt; What does that command do? Explain in plain words.</text>
    <text x="52" y="202" fill="#222">&#160;&#160;Then list the files it would remove. Do not run it.</text>
    <text x="45" y="258" fill="#222">It searches this folder and every folder inside it for files</text>
    <text x="45" y="284" fill="#222">whose names end in .tmp, and deletes them. They do not go to</text>
    <text x="45" y="310" fill="#222">the wastebasket, so this cannot be undone.</text>
    <text x="45" y="350" fill="#222">It would remove 3 files:</text>
    <text x="65" y="378" fill="#555">./draft.tmp</text>
    <text x="65" y="404" fill="#555">./example-data/cache.tmp</text>
    <text x="65" y="430" fill="#555">./example-data/old/run1.tmp</text>
  </g>
  <rect x="620" y="345" width="335" height="90" rx="8" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="1.5"/>
  <text x="640" y="380" font-size="19" fill="#2a7f8f" font-weight="bold">Now you can decide:</text>
  <text x="640" y="410" font-size="19" fill="#222">are these three safe to delete?</text>
  <text x="972" y="486" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
