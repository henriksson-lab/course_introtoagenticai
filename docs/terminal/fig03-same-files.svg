<svg xml:space="preserve" style="white-space:pre" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <defs>
    <g id="folder">
      <path d="M0,8 h22 l6,-8 h26 v8 h16 v46 h-70 z" fill="#8cc2cc" stroke="#2a7f8f" stroke-width="1.5"/>
    </g>
  </defs>
  <!-- file browser -->
  <rect x="20" y="20" width="450" height="350" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <path d="M20,30 a10,10 0 0 1 10,-10 h430 a10,10 0 0 1 10,10 v26 h-450 z" fill="#e4e4e4"/>
  <text x="245" y="44" font-size="16" fill="#555" text-anchor="middle">anna (file browser)</text>
  <rect x="20" y="56" width="110" height="314" fill="#f2f2f2"/>
  <g font-size="16" fill="#666"><text x="34" y="90">Home</text><text x="34" y="118">Recent</text><text x="34" y="146">Trash</text></g>
  <g font-size="16" fill="#222" text-anchor="middle">
    <use xlink:href="#folder" x="160" y="85"/><text x="195" y="165">Desktop</text>
    <use xlink:href="#folder" x="265" y="85"/><text x="300" y="165">Documents</text>
    <use xlink:href="#folder" x="370" y="85"/><text x="405" y="165">Downloads</text>
    <use xlink:href="#folder" x="160" y="215"/><text x="195" y="295">Pictures</text>
    <use xlink:href="#folder" x="265" y="215"/><text x="300" y="295">agentic-course</text>
  </g>
  <!-- terminal -->
  <rect x="530" y="20" width="450" height="350" rx="10" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <path d="M530,30 a10,10 0 0 1 10,-10 h430 a10,10 0 0 1 10,10 v26 h-450 z" fill="#e4e4e4"/>
  <text x="755" y="44" font-size="16" fill="#555" text-anchor="middle">Terminal</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19">
    <text x="550" y="100"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop ~ %</tspan><tspan fill="#6b4fa0" font-weight="bold"> ls</tspan></text>
    <text x="550" y="140" fill="#333">Desktop</text>
    <text x="550" y="172" fill="#333">Documents</text>
    <text x="550" y="204" fill="#333">Downloads</text>
    <text x="550" y="236" fill="#333">Pictures</text>
    <text x="550" y="268" fill="#333">agentic-course</text>
    <text x="550" y="312"><tspan fill="#2a7f8f" font-weight="bold">anna@laptop ~ %</tspan></text>
  </g>
  <!-- double arrow -->
  <path d="M478,200 h44" stroke="#6b4fa0" stroke-width="3"/>
  <path d="M478,200 l12,-8 v16 z M522,200 l-12,-8 v16 z" fill="#6b4fa0"/>
  <text x="500" y="412" font-size="21" fill="#222" text-anchor="middle">The same folder, seen through two different windows</text>
  <text x="980" y="434" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
