<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#fff"/>
  <!-- original -->
  <path d="M60,90 L150,90 L170,110 L330,110 L330,280 L60,280 Z" fill="#eeeeee" stroke="#777" stroke-width="2"/>
  <text x="195" y="160" font-size="22" font-weight="bold" fill="#444" text-anchor="middle">messy-folder</text>
  <text x="195" y="190" font-size="18" fill="#666" text-anchor="middle">the original</text>
  <!-- lock -->
  <rect x="172" y="228" width="46" height="36" rx="4" fill="#777"/>
  <path d="M182,228 L182,218 A13,13 0 0 1 208,218 L208,228" fill="none" stroke="#777" stroke-width="5"/>
  <text x="195" y="320" font-size="18" fill="#444" text-anchor="middle">never touched by the agent</text>

  <!-- arrow -->
  <line x1="350" y1="185" x2="560" y2="185" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="455" y="170" font-size="18" fill="#333" text-anchor="middle">duplicate in your</text>
  <text x="455" y="215" font-size="18" fill="#333" text-anchor="middle">file browser</text>

  <!-- copy -->
  <path d="M580,90 L670,90 L690,110 L870,110 L870,280 L580,280 Z" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="725" y="160" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">messy-folder-work</text>
  <text x="725" y="190" font-size="18" fill="#2a7f8f" text-anchor="middle">the copy</text>
  <!-- agent badge -->
  <rect x="650" y="210" width="150" height="40" rx="20" fill="#6b4fa0"/>
  <text x="725" y="237" font-size="18" fill="#fff" text-anchor="middle">agent starts here</text>
  <text x="725" y="320" font-size="18" fill="#444" text-anchor="middle">mistakes cost nothing: delete and copy again</text>
</svg>
