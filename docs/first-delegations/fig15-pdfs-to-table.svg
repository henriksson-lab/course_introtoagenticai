    <text x="280" y="344">Corrosion of…</text><text x="440" y="344">Fernández</text><text x="560" y="344">2025-02-03</text><text x="660" y="344">2</text><text x="695" y="344">printed: ~2× mass loss</text><text x="950" y="344">2</text>
