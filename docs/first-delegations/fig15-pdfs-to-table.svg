    <text x="280" y="250">Drought toler…</text><text x="440" y="250">Virtanen</text><text x="560" y="250">2024-11</text><text x="660" y="250">1</text><text x="695" y="250">HB-17 kept 82%</text><text x="950" y="250">3</text>
