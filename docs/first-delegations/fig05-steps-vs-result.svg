<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <!-- left card: steps -->
  <rect x="30" y="60" width="440" height="300" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="2"/>
  <text x="250" y="42" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">Describing the steps</text>
  <g font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">
    <text x="55" y="100">First list all the files.</text>
    <text x="55" y="132">Then make some folders.</text>
    <text x="55" y="164">Then move the images.</text>
    <text x="55" y="196">Then give the files</text>
    <text x="55" y="228">good names.</text>
    <text x="55" y="260">Then remove duplicates.</text>
  </g>
  <rect x="50" y="210" width="150" height="28" fill="none" stroke="#a8324a" stroke-width="2.5" rx="4"/>
  <rect x="50" y="242" width="300" height="28" fill="none" stroke="#a8324a" stroke-width="2.5" rx="4"/>
  <text x="250" y="305" font-size="17" fill="#a8324a" text-anchor="middle">What is a "good name"?</text>
  <text x="250" y="330" font-size="17" fill="#a8324a" text-anchor="middle">Remove = delete? Which copy stays?</text>
  <text x="250" y="400" font-size="18" fill="#333" text-anchor="middle">You cannot tell when it is done.</text>

  <!-- right card: result -->
  <rect x="530" y="60" width="440" height="300" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="750" y="42" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Describing the result</text>
  <g font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">
    <text x="555" y="100">At the end I want:</text>
    <text x="555" y="132">- at most 4 subfolders</text>
    <text x="580" y="164">by kind of file</text>
    <text x="555" y="196">- names like</text>
    <text x="580" y="228">2024-03-12_plate.csv</text>
    <text x="555" y="260">- duplicates moved to</text>
    <text x="580" y="292">duplicates/, not deleted</text>
    <text x="555" y="324">- a rename-log.csv</text>
  </g>
  <text x="750" y="400" font-size="18" fill="#333" text-anchor="middle">Anyone can check the result against it.</text>
</svg>
