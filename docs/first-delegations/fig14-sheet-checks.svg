  </g>
  <rect x="50" y="320" width="900" height="36" fill="none" stroke="#a8324a" stroke-width="2.5" rx="6"/>
  <text x="500" y="395" font-size="18" fill="#a8324a" text-anchor="middle">B2-17 was typed month first (04/09/2024) and read day first. Rows and mean cannot see it.</text>
