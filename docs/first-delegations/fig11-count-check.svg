<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#fff"/>
  <!-- before bar -->
  <text x="40" y="70" font-size="21" font-weight="bold" fill="#333">Before</text>
  <rect x="160" y="40" width="800" height="50" fill="#dddddd" stroke="#777"/>
  <text x="560" y="73" font-size="21" fill="#333" text-anchor="middle">40 files in messy-folder</text>
  <!-- after bar: 37 + 3 -->
  <text x="40" y="170" font-size="21" font-weight="bold" fill="#333">After</text>
  <rect x="160" y="140" width="200" height="50" fill="#e3f0f2" stroke="#2a7f8f"/>
  <text x="260" y="172" font-size="19" fill="#2a7f8f" text-anchor="middle">data 10</text>
  <rect x="360" y="140" width="220" height="50" fill="#f1edf7" stroke="#6b4fa0"/>
  <text x="470" y="172" font-size="19" fill="#6b4fa0" text-anchor="middle">figures 11</text>
  <rect x="580" y="140" width="320" height="50" fill="#f6f1e3" stroke="#8a6a12"/>
  <text x="740" y="172" font-size="19" fill="#8a6a12" text-anchor="middle">documents 16</text>
  <rect x="900" y="140" width="60" height="50" fill="#f8e9ec" stroke="#a8324a"/>
  <text x="930" y="172" font-size="19" fill="#a8324a" text-anchor="middle">3</text>
  <text x="930" y="215" font-size="16" fill="#a8324a" text-anchor="middle">duplicates</text>
  <!-- equation -->
  <text x="500" y="265" font-size="28" fill="#333" text-anchor="middle">10 + 11 + 16 + 3 = 40  ✓</text>
  <text x="500" y="305" font-size="20" fill="#333" text-anchor="middle">and rename-log.csv has 40 rows</text>
  <rect x="160" y="330" width="800" height="50" rx="8" fill="#f8e9ec" stroke="#a8324a"/>
  <text x="560" y="362" font-size="19" fill="#a8324a" text-anchor="middle">39? Two files got the same new name, and one overwrote the other.</text>
</svg>
