  <g stroke="#eee"><line x1="20" y1="132" x2="980" y2="132"/><line x1="20" y1="168" x2="980" y2="168"/><line x1="20" y1="204" x2="980" y2="204"/><line x1="20" y1="240" x2="980" y2="240"/><line x1="20" y1="276" x2="980" y2="276"/></g>
