<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <rect x="20" y="20" width="960" height="380" rx="10" fill="#1f2430"/>
  <circle cx="45" cy="42" r="7" fill="#a8324a"/><circle cx="68" cy="42" r="7" fill="#8a6a12"/><circle cx="91" cy="42" r="7" fill="#2a7f8f"/>
  <text x="500" y="48" font-size="16" fill="#aab" text-anchor="middle">terminal: messy-folder-work</text>
  <g font-family="Menlo, Consolas, monospace" font-size="18">
    <text x="45" y="95" fill="#8fd3df">&gt; list your assumptions before you move anything</text>
    <text x="45" y="140" fill="#e8e8e8">Assumptions:</text>
    <text x="45" y="172" fill="#e8e8e8">1. Dates like 05-03-2024 are day-month-year</text>
    <text x="75" y="198" fill="#e8e8e8">(5 March), as in the other file names.</text>
    <text x="45" y="230" fill="#e8e8e8">2. Files with no date in the name get the</text>
    <text x="75" y="256" fill="#e8e8e8">file's own last-modified date.</text>
    <text x="45" y="288" fill="#e8e8e8">3. "Mar26" means 26 March 2024 (date column).</text>
    <text x="45" y="320" fill="#e8e8e8">4. "final" and "REALLYfinal" are different</text>
    <text x="75" y="346" fill="#e8e8e8">versions; I keep both, newest marked.</text>
    <text x="45" y="380" fill="#8fd3df">Shall I go ahead?</text>
  </g>
  <rect x="35" y="152" width="560" height="56" fill="none" stroke="#e0b84a" stroke-width="3" rx="6"/>
  <text x="620" y="178" font-size="18" fill="#e0b84a" font-weight="bold">a guess you can now</text>
  <text x="620" y="202" font-size="18" fill="#e0b84a" font-weight="bold">confirm or correct</text>
  <text x="975" y="422" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
