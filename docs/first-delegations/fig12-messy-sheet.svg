<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <!-- grid -->
  <g font-size="16" fill="#333">
    <!-- column letters -->
    <rect x="20" y="10" width="700" height="26" fill="#eeeeee" stroke="#ccc"/>
    <g fill="#777" text-anchor="middle"><text x="90" y="29">A</text><text x="185" y="29">B</text><text x="270" y="29">C</text><text x="370" y="29">D</text><text x="490" y="29">E</text><text x="600" y="29">F</text><text x="680" y="29">G</text></g>
    <!-- row 1 merged title -->
    <rect x="20" y="36" width="700" height="32" fill="#f1edf7" stroke="#bbb"/>
    <text x="30" y="58" font-weight="bold">Cohort B body weights, spring 2024. Compound X17</text>
    <!-- row 2 merged groups -->
    <rect x="20" y="68" width="300" height="32" fill="#f1edf7" stroke="#bbb"/><text x="170" y="90" font-weight="bold" text-anchor="middle">Animal</text>
    <rect x="320" y="68" width="100" height="32" fill="#f1edf7" stroke="#bbb"/><text x="370" y="90" font-weight="bold" text-anchor="middle">Treatment</text>
    <rect x="420" y="68" width="230" height="32" fill="#f1edf7" stroke="#bbb"/><text x="535" y="90" font-weight="bold" text-anchor="middle">Weighing</text>
    <rect x="650" y="68" width="70" height="32" fill="#f1edf7" stroke="#bbb"/><text x="685" y="90" font-weight="bold" text-anchor="middle">Notes</text>
    <!-- row 3 headers -->
    <g font-weight="bold"><text x="30" y="122">ID</text><text x="165" y="122">Sex</text><text x="230" y="122">Group</text><text x="330" y="122">Dose</text><text x="430" y="122">Date</text><text x="560" y="122">Weight (g)</text><text x="655" y="122">Comm.</text></g>
    <!-- grid lines -->
    <g stroke="#ccc">
      <line x1="20" y1="100" x2="720" y2="100"/><line x1="20" y1="132" x2="720" y2="132"/>
      <line x1="20" y1="164" x2="720" y2="164"/><line x1="20" y1="196" x2="720" y2="196"/>
      <line x1="20" y1="228" x2="720" y2="228"/><line x1="20" y1="260" x2="720" y2="260"/>
      <line x1="20" y1="292" x2="720" y2="292"/><line x1="20" y1="324" x2="720" y2="324"/>
      <line x1="20" y1="356" x2="720" y2="356"/><line x1="20" y1="388" x2="720" y2="388"/>
      <line x1="20" y1="420" x2="720" y2="420"/><line x1="20" y1="452" x2="720" y2="452"/>
      <line x1="155" y1="100" x2="155" y2="452"/><line x1="220" y1="100" x2="220" y2="452"/>
      <line x1="320" y1="100" x2="320" y2="452"/><line x1="420" y1="100" x2="420" y2="452"/>
      <line x1="550" y1="100" x2="550" y2="452"/><line x1="650" y1="100" x2="650" y2="452"/>
      <line x1="20" y1="36" x2="20" y2="452"/><line x1="720" y1="36" x2="720" y2="452"/>
    </g>
    <!-- data -->
    <text x="30" y="154">B1-02</text><text x="165" y="154">m</text><text x="230" y="154">low dose</text><text x="330" y="154">5mg/kg</text><text x="430" y="154">2024-03-12</text><text x="560" y="154">26.5 g</text>
    <text x="30" y="186">B1-05</text><text x="165" y="186">male</text><text x="230" y="186">Low dose</text><text x="330" y="186">5 mg/kg</text><text x="430" y="186">12.3.2024</text><text x="560" y="186">24,1</text>
    <text x="30" y="218">B1-06</text><text x="165" y="218">F</text><text x="230" y="218">control</text><text x="330" y="218">0 mg/kg</text><text x="430" y="218">12 March 2024</text><text x="560" y="218">19.6</text>
    <!-- blank row 228-260 -->
    <text x="30" y="282">B1-15</text><text x="165" y="282">F</text><text x="230" y="282">High</text><text x="330" y="282">20mg/kg</text><text x="430" y="282">2024-03-12</text><text x="560" y="282">21.3</text>
    <text x="30" y="314">B1-15</text><text x="165" y="314">F</text><text x="230" y="314">High</text><text x="330" y="314">20mg/kg</text><text x="430" y="314">2024-03-12</text><text x="560" y="314">21.3</text>
    <rect x="21" y="325" width="398" height="30" fill="#fff"/><line x1="420" y1="324" x2="420" y2="356" stroke="#ccc"/><text x="30" y="346" font-style="italic">Batch 2 - arrived 2 April, weighed one…</text>
    <text x="30" y="378">B2-11</text><text x="165" y="378">f</text><text x="230" y="378">Low dose</text><text x="330" y="378">5mg/kg</text><text x="430" y="378">2024-04-09</text><text x="556" y="378" font-size="13">not weighed (sick)</text>
    <text x="30" y="410">B2-17</text><text x="165" y="410">female</text><text x="230" y="410">High dose</text><text x="330" y="410">20mg/kg</text><text x="430" y="410">04/09/2024</text><text x="560" y="410">22,6</text>
    <text x="30" y="442" font-weight="bold">Mean</text><text x="560" y="442" font-weight="bold">23.27</text>
  </g>
  <!-- numbered markers -->
  <g font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="710" cy="52" r="12" fill="#a8324a"/><text x="710" y="57">1</text>
    <circle cx="540" cy="146" r="12" fill="#a8324a"/><text x="540" y="151">2</text>
    <circle cx="205" cy="146" r="12" fill="#a8324a"/><text x="205" y="151">3</text>
    <circle cx="540" cy="178" r="12" fill="#a8324a"/><text x="540" y="183">4</text>
    <circle cx="140" cy="244" r="12" fill="#a8324a"/><text x="140" y="249">5</text>
    <circle cx="140" cy="306" r="12" fill="#a8324a"/><text x="140" y="311">6</text>
    <circle cx="540" cy="402" r="12" fill="#a8324a"/><text x="540" y="407">7</text>
    <circle cx="140" cy="436" r="12" fill="#a8324a"/><text x="140" y="441">8</text>
  </g>
  <!-- legend -->
  <g font-size="17" fill="#333">
    <text x="745" y="58"><tspan fill="#a8324a" font-weight="bold">1</tspan> merged header rows</text>
    <text x="745" y="100"><tspan fill="#a8324a" font-weight="bold">2</tspan> units in cells</text>
    <text x="745" y="142"><tspan fill="#a8324a" font-weight="bold">3</tspan> m, male, F, f, female …</text>
    <text x="745" y="184"><tspan fill="#a8324a" font-weight="bold">4</tspan> decimal comma</text>
    <text x="745" y="226"><tspan fill="#a8324a" font-weight="bold">5</tspan> blank row</text>
    <text x="745" y="268"><tspan fill="#a8324a" font-weight="bold">6</tspan> duplicated row</text>
    <text x="745" y="310"><tspan fill="#a8324a" font-weight="bold">7</tspan> month-first date</text>
    <text x="745" y="352"><tspan fill="#a8324a" font-weight="bold">8</tspan> a mean row</text>
    <text x="745" y="394">+ notes in data cells,</text>
    <text x="745" y="418">  date formats mixed</text>
  </g>
  <text x="975" y="490" font-size="14" fill="#999" text-anchor="end">excerpt of messy-sheet.xlsx, some rows left out</text>
</svg>
