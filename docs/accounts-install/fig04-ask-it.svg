  <text x="170" y="392.0" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">Yes: use the institutional</text>
  <text x="170" y="414.1" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">account (often better data terms)</text>
