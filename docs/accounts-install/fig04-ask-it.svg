  <text x="50" y="105" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">To:  IT service desk</text>
  <text x="50" y="135" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">Subject:  AI coding agents</text>
