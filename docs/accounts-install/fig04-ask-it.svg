  <text x="50" y="269" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">If so, how do I get access?</text>
  <text x="50" y="312" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">Thanks!</text>
