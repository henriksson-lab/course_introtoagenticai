  <text x="50" y="185" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">Hello,</text>
  <text x="50" y="213" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="normal" xml:space="preserve">do we have a Claude or ChatGPT plan, and</text>
