<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
    <marker id="arwt" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#2a7f8f"/></marker>
    <marker id="arwc" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#a8324a"/></marker>
    <marker id="arwo" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#e6b84f"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>
  <rect x="20" y="40" width="210" height="160" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="125" y="78" font-size="22" fill="#2a7f8f" text-anchor="middle" font-weight="bold" xml:space="preserve">1. Download</text>
  <text x="125" y="115" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">installer script</text>
  <text x="125" y="140" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">from claude.ai or</text>
  <text x="125" y="165" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">chatgpt.com</text>
  <line x1="233" y1="120" x2="275" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="270" y="40" width="210" height="160" rx="12" fill="#eee9f6" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="375" y="78" font-size="22" fill="#6b4fa0" text-anchor="middle" font-weight="bold" xml:space="preserve">2. Put program</text>
  <text x="375" y="115" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">in a folder in your</text>
  <text x="375" y="140" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">home directory</text>
  <text x="375" y="165" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">~/.local/bin</text>
  <line x1="483" y1="120" x2="525" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="520" y="40" width="210" height="160" rx="12" fill="#f5efdf" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="625" y="78" font-size="22" fill="#8a6a12" text-anchor="middle" font-weight="bold" xml:space="preserve">3. Add to PATH</text>
  <text x="625" y="115" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">the list of folders</text>
  <text x="625" y="140" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">the terminal searches</text>
  <line x1="733" y1="120" x2="775" y2="120" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="770" y="40" width="210" height="160" rx="12" fill="#f7e6ea" stroke="#a8324a" stroke-width="2.5"/>
  <text x="875" y="78" font-size="22" fill="#a8324a" text-anchor="middle" font-weight="bold" xml:space="preserve">4. Type the name</text>
  <text x="875" y="115" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">claude  /  codex</text>
  <text x="875" y="140" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" xml:space="preserve">starts the program</text>
  <rect x="520" y="225" width="460" height="55" rx="8" fill="#ffffff" stroke="#8a6a12" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="535" y="248" font-size="16" fill="#8a6a12" text-anchor="start" font-weight="bold" xml:space="preserve">PATH:</text>
  <text x="595" y="248" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" xml:space="preserve">/usr/bin   /bin   ~/.local/bin   ...</text>
  <text x="535" y="270" font-size="16" fill="#a8324a" text-anchor="start" font-weight="normal" xml:space="preserve">folder not on the list → "command not found"</text>
</svg>
