<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <!-- original -->
  <rect x="20" y="60" width="260" height="200" rx="10" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="150" y="96" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4fa0">The original</text>
  <text x="150" y="130" text-anchor="middle" font-size="16" fill="#1b2a3a">instrument export,</text>
  <text x="150" y="152" text-anchor="middle" font-size="16" fill="#1b2a3a">course spreadsheet,</text>
  <text x="150" y="174" text-anchor="middle" font-size="16" fill="#1b2a3a">old analysis</text>
  <!-- lock -->
  <rect x="132" y="206" width="36" height="28" rx="4" fill="#6b4fa0"/>
  <path d="M138,206 L138,196 A12,12 0 0 1 162,196 L162,206" fill="none" stroke="#6b4fa0" stroke-width="4"/>
  <text x="150" y="290" text-anchor="middle" font-size="16" fill="#3a4a5a">backed up, agent never</text>
  <text x="150" y="312" text-anchor="middle" font-size="16" fill="#3a4a5a">started here</text>
  <!-- copy arrow -->
  <line x1="284" y1="160" x2="384" y2="160" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="334" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">copy</text>
  <!-- project -->
  <rect x="390" y="30" width="590" height="290" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="414" y="64" font-size="19" font-weight="bold" fill="#2a7f8f">my-project/ (the agent works here)</text>
  <rect x="414" y="86" width="250" height="90" rx="8" fill="#ffffff" stroke="#9aa8b5"/>
  <text x="430" y="118" font-size="17" font-weight="bold" fill="#1b2a3a">data/raw/</text>
  <text x="430" y="144" font-size="15" fill="#3a4a5a">the copy; treat as</text>
  <text x="430" y="164" font-size="15" fill="#3a4a5a">read-only</text>
  <line x1="666" y1="131" x2="712" y2="131" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="718" y="86" width="240" height="90" rx="8" fill="#ffffff" stroke="#9aa8b5"/>
  <text x="734" y="118" font-size="17" font-weight="bold" fill="#1b2a3a">results/</text>
  <text x="734" y="144" font-size="15" fill="#3a4a5a">everything the agent</text>
  <text x="734" y="164" font-size="15" fill="#3a4a5a">makes goes here</text>
  <text x="414" y="222" font-size="17" fill="#1b2a3a">If the agent breaks something, delete the folder and copy again.</text>
  <text x="414" y="250" font-size="17" fill="#1b2a3a">The structure comes in <tspan font-style="italic">Organising a project for an agent</tspan>;</text>
  <text x="414" y="276" font-size="17" fill="#1b2a3a">the undo button in <tspan font-style="italic">Git as undo button</tspan>.</text>
</svg>
