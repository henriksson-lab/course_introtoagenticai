<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <!-- column headers -->
  <rect x="250" y="20" width="360" height="56" rx="8" fill="#8a6a12"/>
  <text x="430" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Personal (consumer) plans</text>
  <rect x="630" y="20" width="350" height="56" rx="8" fill="#2a7f8f"/>
  <text x="805" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Business and education plans</text>
  <!-- rows -->
  <g font-size="17" fill="#1b2a3a">
    <text x="20" y="118" font-weight="bold">Examples</text>
    <text x="260" y="110">Claude Pro, Max</text>
    <text x="260" y="134">ChatGPT Free, Go, Plus, Pro</text>
    <text x="640" y="110">Claude Team, Enterprise, Education, API</text>
    <text x="640" y="134">ChatGPT Business, Enterprise, Edu</text>
    <line x1="20" y1="156" x2="980" y2="156" stroke="#dfe6ec"/>

    <text x="20" y="196" font-weight="bold">Used to train</text>
    <text x="20" y="218" font-weight="bold">future models?</text>
    <text x="260" y="196">Depends on a setting in your account.</text>
    <text x="260" y="220">ChatGPT: on unless you turn it off.</text>
    <text x="640" y="196">Not by default.</text>
    <line x1="20" y1="244" x2="980" y2="244" stroke="#dfe6ec"/>

    <text x="20" y="282" font-weight="bold">How long kept?</text>
    <text x="260" y="282">Claude: 30 days with training off,</text>
    <text x="260" y="306">up to 5 years with training on.</text>
    <text x="640" y="282">Set by the contract</text>
    <text x="640" y="306">(Claude: 30 days as standard).</text>
    <line x1="20" y1="330" x2="980" y2="330" stroke="#dfe6ec"/>

    <text x="20" y="368" font-weight="bold">Who agreed to</text>
    <text x="20" y="390" font-weight="bold">the terms?</text>
    <text x="260" y="368">You, as a private person.</text>
    <text x="260" y="392">Your university is not a party.</text>
    <text x="640" y="368">Your institution, often with a</text>
    <text x="640" y="392">data processing agreement.</text>
  </g>
  <rect x="20" y="420" width="960" height="66" rx="8" fill="#f4f7fa" stroke="#c9d3dd"/>
  <text x="500" y="447" text-anchor="middle" font-size="17" fill="#3a4a5a">Checked November 2026. Policies change: read privacy.claude.com, code.claude.com/docs/en/data-usage</text>
  <text x="500" y="472" text-anchor="middle" font-size="17" fill="#3a4a5a">and help.openai.com (Data Controls FAQ) before you rely on any line here.</text>
</svg>
