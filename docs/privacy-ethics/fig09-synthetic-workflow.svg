<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- agent zone -->
  <rect x="20" y="20" width="960" height="180" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="40" y="52" font-size="20" font-weight="bold" fill="#2a7f8f">1. With the agent: fake data only</text>
  <rect x="50" y="80" width="230" height="90" rx="8" fill="#ffffff" stroke="#9aa8b5"/>
  <text x="165" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">fake_grades.csv</text>
  <text x="165" y="138" text-anchor="middle" font-size="15" fill="#3a4a5a">same columns,</text>
  <text x="165" y="158" text-anchor="middle" font-size="15" fill="#3a4a5a">invented values</text>
  <line x1="282" y1="125" x2="354" y2="125" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="360" y="80" width="270" height="90" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <text x="495" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Agent writes and</text>
  <text x="495" y="138" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">tests the script</text>
  <line x1="632" y1="125" x2="704" y2="125" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="710" y="80" width="240" height="90" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="830" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">grade_report.R</text>
  <text x="830" y="142" text-anchor="middle" font-size="15" fill="#3a4a5a">checked on fake data</text>
  <!-- handover -->
  <!-- local zone -->
  <rect x="20" y="240" width="960" height="180" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="40" y="272" font-size="20" font-weight="bold" fill="#6b4fa0">2. Without the agent: real data</text>
  <rect x="50" y="300" width="230" height="90" rx="8" fill="#ffffff" stroke="#a8324a" stroke-width="2"/>
  <text x="165" y="336" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">real_grades.csv</text>
  <text x="165" y="360" text-anchor="middle" font-size="15" fill="#3a4a5a">in a folder the agent</text>
  <text x="165" y="380" text-anchor="middle" font-size="15" fill="#3a4a5a">is never started in</text>
  <line x1="282" y1="345" x2="354" y2="345" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="360" y="300" width="270" height="90" rx="8" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <text x="495" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">You run the script</text>
  <text x="495" y="358" text-anchor="middle" font-size="15" fill="#3a4a5a">in RStudio or a plain</text>
  <text x="495" y="378" text-anchor="middle" font-size="15" fill="#3a4a5a">terminal, agent closed</text>
  <line x1="632" y1="345" x2="704" y2="345" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="710" y="300" width="240" height="90" rx="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <text x="830" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">report.pdf</text>
  <text x="830" y="362" text-anchor="middle" font-size="15" fill="#3a4a5a">stays on your computer</text>
  <line x1="830" y1="172" x2="830" y2="292" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="845" y="226" font-size="16" fill="#1b2a3a">copy the script</text>
  <text x="500" y="455" text-anchor="middle" font-size="18" fill="#1b2a3a">The agent sees the structure of your data, never the content.</text>
</svg>
