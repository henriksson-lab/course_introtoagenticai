<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="200" y="30" text-anchor="middle" font-size="16" fill="#8a97a5">class</text>
  <text x="510" y="30" text-anchor="middle" font-size="16" fill="#8a97a5">examples</text>
  <text x="870" y="30" text-anchor="middle" font-size="16" fill="#8a97a5">with an agent</text>
  <!-- band 1 -->
  <rect x="20" y="42" width="960" height="82" rx="8" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="40" y="90" font-size="21" font-weight="bold" fill="#2a7f8f">Public</text>
  <text x="250" y="76" font-size="16" fill="#1b2a3a">Published papers, open datasets, public</text>
  <text x="250" y="98" font-size="16" fill="#1b2a3a">web pages, your public course syllabus</text>
  <text x="870" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a7f8f">Yes</text>
  <!-- band 2 -->
  <rect x="20" y="134" width="960" height="82" rx="8" fill="#f1f5f3" stroke="#5a8f7a" stroke-width="2"/>
  <text x="40" y="182" font-size="21" font-weight="bold" fill="#4a7a66">Internal</text>
  <text x="250" y="168" font-size="16" fill="#1b2a3a">Draft course plan, meeting notes without</text>
  <text x="250" y="190" font-size="16" fill="#1b2a3a">names, lab measurements of non-human samples</text>
  <text x="870" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a66">Usually yes;</text>
  <text x="870" y="194" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a66">training off</text>
  <!-- band 3 -->
  <rect x="20" y="226" width="960" height="82" rx="8" fill="#faf5e8" stroke="#8a6a12" stroke-width="2"/>
  <text x="40" y="264" font-size="21" font-weight="bold" fill="#8a6a12">Personal</text>
  <text x="40" y="288" font-size="15" fill="#8a6a12">(GDPR)</text>
  <text x="250" y="260" font-size="16" fill="#1b2a3a">Student names and grades, email lists, ID numbers,</text>
  <text x="250" y="282" font-size="16" fill="#1b2a3a">photos, free-text course evaluations</text>
  <text x="870" y="264" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6a12">Approved tool only;</text>
  <text x="870" y="286" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6a12">prefer stand-ins</text>
  <!-- band 4 -->
  <rect x="20" y="318" width="960" height="82" rx="8" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
  <text x="40" y="356" font-size="21" font-weight="bold" fill="#a8324a">Sensitive</text>
  <text x="40" y="380" font-size="15" fill="#a8324a">personal (GDPR art. 9)</text>
  <text x="250" y="352" font-size="16" fill="#1b2a3a">Health and patient data, ethnicity, genetic data,</text>
  <text x="250" y="374" font-size="16" fill="#1b2a3a">religion, sexual orientation, union membership</text>
  <text x="870" y="356" text-anchor="middle" font-size="17" font-weight="bold" fill="#a8324a">Not without explicit</text>
  <text x="870" y="378" text-anchor="middle" font-size="17" font-weight="bold" fill="#a8324a">approval</text>
  <!-- band 5 -->
  <rect x="20" y="410" width="960" height="96" rx="8" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="40" y="450" font-size="21" font-weight="bold" fill="#6b4fa0">Confidential</text>
  <text x="250" y="442" font-size="16" fill="#1b2a3a">Your unpublished results, exam questions before the exam,</text>
  <text x="250" y="464" font-size="16" fill="#1b2a3a">data under a contract or NDA</text>
  <text x="250" y="490" font-size="16" font-weight="bold" fill="#a8324a">Manuscripts and grant proposals you review in confidence</text>
  <text x="870" y="446" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b4fa0">Precautions;</text>
  <text x="870" y="468" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b4fa0">check contract</text>
  <text x="870" y="492" text-anchor="middle" font-size="17" font-weight="bold" fill="#a8324a">Never</text>
</svg>
