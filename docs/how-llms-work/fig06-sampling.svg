  <text x="170" y="208" font-size="19" text-anchor="middle" fill="#333">"Suggest a title for my</text>
  <text x="170" y="232" font-size="19" text-anchor="middle" fill="#333">course on lab safety"</text>
  <path d="M330,180 C380,120 400,95 440,95" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M438,87 L452,95 L438,103 Z" fill="#333"/>
  <path d="M330,210 C380,270 400,295 440,295" fill="none" stroke="#333" stroke-width="2.5"/>
