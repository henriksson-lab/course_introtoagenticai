  <text x="480" y="275" font-size="18" fill="#6b4fa0">Session 2</text>
  <text x="480" y="312" font-size="22" fill="#333">"Lab Safety from Day One"</text>
  <text x="720" y="205" font-size="18" text-anchor="middle" fill="#666">a different token was picked early on,</text>
  <text x="720" y="229" font-size="18" text-anchor="middle" fill="#666">and everything after it follows from that</text>
