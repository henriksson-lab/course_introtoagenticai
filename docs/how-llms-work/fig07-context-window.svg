<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <rect x="20" y="20" width="560" height="420" rx="14" fill="#f5f5f5" stroke="#2a7f8f" stroke-width="3"/>
  <text x="300" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">Context window = working memory</text>
  <g font-size="18">
    <rect x="45" y="76" width="510" height="44" rx="6" fill="#e8e8e8"/>
    <text x="60" y="104" fill="#333">Instructions built into the tool</text>
    <rect x="45" y="128" width="510" height="44" rx="6" fill="#f5efdd" stroke="#8a6a12"/>
    <text x="60" y="156" fill="#8a6a12">Project notes file, if there is one</text>
    <rect x="45" y="180" width="510" height="44" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/>
    <text x="60" y="208" fill="#2a7f8f">Your messages</text>
    <rect x="45" y="232" width="510" height="44" rx="6" fill="#eeeaf5" stroke="#6b4fa0"/>
    <text x="60" y="260" fill="#6b4fa0">Files it has read: plant_heights.csv</text>
    <rect x="45" y="284" width="510" height="44" rx="6" fill="#eeeaf5" stroke="#6b4fa0"/>
    <text x="60" y="312" fill="#6b4fa0">Output of commands it ran</text>
    <rect x="45" y="336" width="510" height="44" rx="6" fill="#e8e8e8"/>
    <text x="60" y="364" fill="#333">Its own earlier replies</text>
  </g>
  <text x="300" y="420" font-size="17" text-anchor="middle" fill="#666">Everything here is re-read for every new token.</text>
  <!-- outside -->
  <text x="790" y="56" font-size="22" font-weight="bold" text-anchor="middle" fill="#999">Not in the window</text>
  <g font-size="18" fill="#999">
    <rect x="620" y="76" width="340" height="44" rx="6" fill="#fff" stroke="#bbbbbb" stroke-dasharray="6 4"/>
    <text x="635" y="104">Files it has not opened</text>
    <rect x="620" y="128" width="340" height="44" rx="6" fill="#fff" stroke="#bbbbbb" stroke-dasharray="6 4"/>
    <text x="635" y="156">Yesterday's session</text>
    <rect x="620" y="180" width="340" height="44" rx="6" fill="#fff" stroke="#bbbbbb" stroke-dasharray="6 4"/>
    <text x="635" y="208">What you meant but did not say</text>
    <rect x="620" y="232" width="340" height="44" rx="6" fill="#fff" stroke="#bbbbbb" stroke-dasharray="6 4"/>
    <text x="635" y="260">Your lab's unwritten habits</text>
  </g>
  <text x="790" y="330" font-size="19" text-anchor="middle" fill="#a8324a">For the model, this</text>
  <text x="790" y="356" font-size="19" text-anchor="middle" fill="#a8324a">does not exist.</text>
</svg>
