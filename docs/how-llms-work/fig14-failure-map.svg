<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <rect x="20" y="20" width="225" height="165" rx="12" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
  <text x="132" y="72" font-size="22" font-weight="bold" text-anchor="middle" fill="#a8324a">Hallucination</text>
  <text x="132" y="118" font-size="18" text-anchor="middle" fill="#333">invents a reference or</text>
  <text x="132" y="144" font-size="18" text-anchor="middle" fill="#333">a function option</text>
  <rect x="265" y="20" width="225" height="165" rx="12" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
  <text x="377" y="72" font-size="22" font-weight="bold" text-anchor="middle" fill="#a8324a">Wrong numbers</text>
  <text x="377" y="118" font-size="18" text-anchor="middle" fill="#333">counts or adds</text>
  <text x="377" y="144" font-size="18" text-anchor="middle" fill="#333">in its head</text>
  <rect x="510" y="20" width="225" height="165" rx="12" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <text x="622" y="72" font-size="22" font-weight="bold" text-anchor="middle" fill="#6b4fa0">Sycophancy</text>
  <text x="622" y="118" font-size="18" text-anchor="middle" fill="#333">agrees with you,</text>
  <text x="622" y="144" font-size="18" text-anchor="middle" fill="#333">even when you are wrong</text>
  <rect x="755" y="20" width="225" height="165" rx="12" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <text x="867" y="72" font-size="22" font-weight="bold" text-anchor="middle" fill="#6b4fa0">Silent shortcuts</text>
  <text x="867" y="118" font-size="18" text-anchor="middle" fill="#333">drops rows, hard-codes,</text>
  <text x="867" y="144" font-size="18" text-anchor="middle" fill="#333">simplifies the task</text>
  <rect x="20" y="205" width="225" height="165" rx="12" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="132" y="257" font-size="22" font-weight="bold" text-anchor="middle" fill="#8a6a12">Scope creep</text>
  <text x="132" y="303" font-size="18" text-anchor="middle" fill="#333">changes files you</text>
  <text x="132" y="329" font-size="18" text-anchor="middle" fill="#333">did not ask about</text>
  <rect x="265" y="205" width="225" height="165" rx="12" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="377" y="257" font-size="22" font-weight="bold" text-anchor="middle" fill="#8a6a12">Stale knowledge</text>
  <text x="377" y="303" font-size="18" text-anchor="middle" fill="#333">old versions,</text>
  <text x="377" y="329" font-size="18" text-anchor="middle" fill="#333">old functions</text>
  <rect x="510" y="205" width="225" height="165" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="622" y="257" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">Losing track</text>
  <text x="622" y="303" font-size="18" text-anchor="middle" fill="#333">forgets early rules</text>
  <text x="622" y="329" font-size="18" text-anchor="middle" fill="#333">in long sessions</text>
  <rect x="755" y="205" width="225" height="165" rx="12" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="867" y="257" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">Prompt injection</text>
  <text x="867" y="303" font-size="18" text-anchor="middle" fill="#333">obeys text hidden</text>
  <text x="867" y="329" font-size="18" text-anchor="middle" fill="#333">in a page or PDF</text>
</svg>
