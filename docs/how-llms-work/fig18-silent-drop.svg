<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <!-- input stack -->
  <text x="130" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">raw.xlsx</text>
  <rect x="40" y="50" width="180" height="230" rx="6" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <g stroke="#6b4fa0" stroke-width="1" opacity="0.6">
    <line x1="40" y1="80" x2="220" y2="80"/><line x1="40" y1="110" x2="220" y2="110"/><line x1="40" y1="140" x2="220" y2="140"/>
    <line x1="40" y1="170" x2="220" y2="170"/><line x1="40" y1="200" x2="220" y2="200"/><line x1="40" y1="230" x2="220" y2="230"/>
    <line x1="40" y1="260" x2="220" y2="260"/>
  </g>
  <rect x="40" y="140" width="180" height="30" fill="#f6e4e8" stroke="#a8324a"/>
  <rect x="40" y="230" width="180" height="30" fill="#f6e4e8" stroke="#a8324a"/>
  <text x="130" y="315" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">1,200 rows</text>
  <!-- process -->
  <path d="M240,165 h120" stroke="#333" stroke-width="3"/><path d="M360,156 L376,165 L360,174 Z" fill="#333"/>
  <text x="305" y="148" font-size="18" text-anchor="middle" fill="#333">cleaning</text>
  <text x="305" y="196" font-size="18" text-anchor="middle" fill="#333">script</text>
  <!-- output -->
  <text x="480" y="36" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">clean.csv</text>
  <rect x="390" y="50" width="180" height="210" rx="6" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <g stroke="#2a7f8f" stroke-width="1" opacity="0.6">
    <line x1="390" y1="80" x2="570" y2="80"/><line x1="390" y1="110" x2="570" y2="110"/><line x1="390" y1="140" x2="570" y2="140"/>
    <line x1="390" y1="170" x2="570" y2="170"/><line x1="390" y1="200" x2="570" y2="200"/><line x1="390" y1="230" x2="570" y2="230"/>
  </g>
  <text x="480" y="315" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">1,143 rows</text>
  <!-- agent message -->
  <rect x="610" y="50" width="370" height="120" rx="14" fill="#f5f5f5" stroke="#ccc"/>
  <text x="630" y="88" font-size="18" fill="#333">Done! I cleaned the data and</text>
  <text x="630" y="114" font-size="18" fill="#333">saved it to clean.csv. Dates are</text>
  <text x="630" y="140" font-size="18" fill="#333">now in one format.</text>
  <rect x="610" y="190" width="370" height="90" rx="10" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/>
  <text x="630" y="225" font-size="18" fill="#a8324a">Not mentioned: 57 rows whose</text>
  <text x="630" y="251" font-size="18" fill="#a8324a">dates did not parse were dropped.</text>
  <text x="500" y="372" font-size="20" text-anchor="middle" fill="#333">Defence: count before and after, and ask "what did you drop, skip or simplify?"</text>
</svg>
