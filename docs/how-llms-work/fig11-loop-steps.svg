<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>
  <!-- row 1 -->
  <rect x="20" y="20" width="300" height="190" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="48" cy="50" r="18" fill="#2a7f8f"/><text x="48" y="57" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="76" y="57" font-size="19" font-weight="bold" fill="#2a7f8f">You ask</text>
  <text x="40" y="100" font-size="17" fill="#333">"What is the mean height</text>
  <text x="40" y="124" font-size="17" fill="#333">per group in</text>
  <text x="40" y="148" font-size="17" fill="#333">plant_heights.csv?"</text>

  <rect x="350" y="20" width="300" height="190" rx="10" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <circle cx="378" cy="50" r="18" fill="#6b4fa0"/><text x="378" y="57" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="406" y="57" font-size="19" font-weight="bold" fill="#6b4fa0">LLM writes a request</text>
  <text x="370" y="100" font-size="17" fill="#333">Next tokens are not prose</text>
  <text x="370" y="124" font-size="17" fill="#333">but a tool request:</text>
  <rect x="370" y="140" width="260" height="44" rx="5" fill="#333"/>
  <text x="382" y="168" font-size="16" fill="#9fe0ea" font-family="Menlo, Consolas, monospace">run: python3 means.py</text>

  <rect x="680" y="20" width="300" height="190" rx="10" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <circle cx="708" cy="50" r="18" fill="#8a6a12"/><text x="708" y="57" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="736" y="57" font-size="19" font-weight="bold" fill="#8a6a12">Harness asks you</text>
  <text x="700" y="100" font-size="17" fill="#333">"Allow this command?"</text>
  <text x="700" y="134" font-size="17" fill="#333">You read it and say yes.</text>
  <text x="700" y="168" font-size="17" fill="#333">The LLM itself cannot run</text>
  <text x="700" y="192" font-size="17" fill="#333">anything: the harness does.</text>

  <!-- row 2 -->
  <rect x="680" y="260" width="300" height="190" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <circle cx="708" cy="290" r="18" fill="#2a7f8f"/><text x="708" y="297" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="736" y="297" font-size="19" font-weight="bold" fill="#2a7f8f">The tool runs</text>
  <rect x="700" y="314" width="260" height="110" rx="5" fill="#333"/>
  <g font-size="15" fill="#e6e6e6" font-family="Menlo, Consolas, monospace">
    <text x="712" y="340">control  85.9</text>
    <text x="712" y="364">treated  77.2</text>
    <text x="712" y="396" fill="#f2b8c3">warning: 4 values</text>
    <text x="712" y="416" fill="#f2b8c3">could not be read</text>
  </g>

  <rect x="350" y="260" width="300" height="190" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="2"/>
  <circle cx="378" cy="290" r="18" fill="#666"/><text x="378" y="297" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="406" y="297" font-size="19" font-weight="bold" fill="#333">Output joins context</text>
  <text x="370" y="340" font-size="17" fill="#333">The printed result is</text>
  <text x="370" y="364" font-size="17" fill="#333">pasted into the conversation,</text>
  <text x="370" y="388" font-size="17" fill="#333">as if it were a message.</text>

  <rect x="20" y="260" width="300" height="190" rx="10" fill="#eeeaf5" stroke="#6b4fa0" stroke-width="2"/>
  <circle cx="48" cy="290" r="18" fill="#6b4fa0"/><text x="48" y="297" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <text x="76" y="297" font-size="19" font-weight="bold" fill="#6b4fa0">LLM continues</text>
  <text x="40" y="340" font-size="17" fill="#333">Reads the warning; heights</text>
  <text x="40" y="364" font-size="17" fill="#333">of 80 cm look odd. Next:</text>
  <text x="40" y="388" font-size="17" fill="#333">look at those rows (back to 2),</text>
  <text x="40" y="412" font-size="17" fill="#333">or answer you (done).</text>

  <g stroke="#333" stroke-width="2.5" fill="none">
    <path d="M322,115 h24" marker-end="url(#ah)"/>
    <path d="M652,115 h24" marker-end="url(#ah)"/>
    <path d="M830,212 v44" marker-end="url(#ah)"/>
    <path d="M678,355 h-24" marker-end="url(#ah)"/>
    <path d="M348,355 h-24" marker-end="url(#ah)"/>
  </g>
  <path d="M170,258 C170,235 500,240 500,214" fill="none" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</svg>
