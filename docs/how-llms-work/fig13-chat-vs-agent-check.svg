<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="235" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#a8324a">Chat: answers from reading</text>
  <rect x="20" y="56" width="430" height="360" rx="12" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <rect x="40" y="76" width="390" height="60" rx="10" fill="#e3f1f3"/>
  <text x="56" y="112" font-size="17" fill="#333">[pastes the table] Mean per group?</text>
  <rect x="40" y="152" width="390" height="100" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="56" y="184" font-size="17" fill="#333">Control: about 15.4 cm</text>
  <text x="56" y="210" font-size="17" fill="#333">Treated: about 13.1 cm</text>
  <text x="56" y="236" font-size="17" fill="#333">Treated plants are shorter.</text>
  <text x="235" y="300" font-size="18" text-anchor="middle" fill="#a8324a">Plausible numbers.</text>
  <text x="235" y="326" font-size="18" text-anchor="middle" fill="#a8324a">Nothing was run.</text>
  <text x="235" y="352" font-size="18" text-anchor="middle" fill="#a8324a">Nothing you can rerun.</text>

  <text x="760" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#2a7f8f">Agent: answers from running</text>
  <rect x="510" y="56" width="470" height="360" rx="12" fill="#f5f5f5" stroke="#2a7f8f" stroke-width="2"/>
  <g font-size="17">
    <rect x="530" y="74" width="430" height="44" rx="6" fill="#eeeaf5"/>
    <text x="544" y="102" fill="#333">writes means.py, runs it</text>
    <rect x="530" y="128" width="430" height="44" rx="6" fill="#f6e4e8"/>
    <text x="544" y="156" fill="#a8324a">output: means of 86 and 77 cm? 4 errors</text>
    <rect x="530" y="182" width="430" height="44" rx="6" fill="#eeeaf5"/>
    <text x="544" y="210" fill="#333">looks at the rows: mm, decimal commas</text>
    <rect x="530" y="236" width="430" height="44" rx="6" fill="#eeeaf5"/>
    <text x="544" y="264" fill="#333">fixes the script, runs it again</text>
    <rect x="530" y="290" width="430" height="44" rx="6" fill="#e3f1f3"/>
    <text x="544" y="318" fill="#2a7f8f">control 15.00, treated 13.17 (60 plants)</text>
  </g>
  <text x="745" y="372" font-size="18" text-anchor="middle" fill="#2a7f8f">The script stays on disk:</text>
  <text x="745" y="398" font-size="18" text-anchor="middle" fill="#2a7f8f">you can read it and rerun it.</text>
  <text x="985" y="436" font-size="14" fill="#999" text-anchor="end">illustrative</text>
</svg>
