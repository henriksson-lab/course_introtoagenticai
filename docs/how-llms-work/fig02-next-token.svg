<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="30" y="50" font-size="20" fill="#666">Text so far</text>
  <rect x="30" y="65" width="520" height="60" rx="8" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="48" y="104" font-size="24" fill="#333">The cells were incubated at 37</text>
  <rect x="440" y="78" width="96" height="36" rx="6" fill="#fff" stroke="#2a7f8f" stroke-dasharray="5 4"/>
  <text x="488" y="104" font-size="22" text-anchor="middle" fill="#2a7f8f">?</text>
  <line x1="560" y1="95" x2="610" y2="95" stroke="#333" stroke-width="2.5"/>
  <path d="M610,87 L624,95 L610,103 Z" fill="#333"/>
  <text x="640" y="50" font-size="20" fill="#666">Model's guess for the next token</text>
  <g font-size="20" fill="#333">
    <text x="640" y="95">°C</text>
    <rect x="740" y="78" width="200" height="24" fill="#6b4fa0"/>
    <text x="948" y="96" font-size="18" fill="#6b4fa0">0.81</text>
    <text x="640" y="135">degrees</text>
    <rect x="740" y="118" width="24" height="24" fill="#6b4fa0" opacity="0.7"/>
    <text x="772" y="136" font-size="18" fill="#6b4fa0">0.10</text>
    <text x="640" y="175">°</text>
    <rect x="740" y="158" width="14" height="24" fill="#6b4fa0" opacity="0.6"/>
    <text x="762" y="176" font-size="18" fill="#6b4fa0">0.06</text>
    <text x="640" y="215">for</text>
    <rect x="740" y="198" width="6" height="24" fill="#6b4fa0" opacity="0.5"/>
    <text x="754" y="216" font-size="18" fill="#6b4fa0">0.02</text>
    <text x="640" y="250" font-size="18" fill="#999">... thousands more, each tiny</text>
  </g>
  <!-- loop -->
  <rect x="30" y="300" width="940" height="110" rx="10" fill="#f5f5f5" stroke="#cccccc"/>
  <g font-size="20" fill="#333" text-anchor="middle">
    <text x="140" y="350">1. Score every</text><text x="140" y="375">possible next token</text>
    <text x="385" y="350">2. Pick one</text><text x="385" y="375">(usually a likely one)</text>
    <text x="625" y="350">3. Add it to the text</text><text x="625" y="375">"... at 37 °C"</text>
    <text x="865" y="350">4. Repeat until</text><text x="865" y="375">the answer is done</text>
  </g>
  <g stroke="#2a7f8f" stroke-width="2.5" fill="#2a7f8f">
    <line x1="240" y1="357" x2="266" y2="357"/><path d="M266,350 L278,357 L266,364 Z"/>
    <line x1="490" y1="357" x2="514" y2="357"/><path d="M514,350 L526,357 L514,364 Z"/>
    <line x1="724" y1="357" x2="752" y2="357"/><path d="M752,350 L764,357 L752,364 Z"/>
  </g>
  <path d="M865,388 C865,425 140,425 140,396" fill="none" stroke="#2a7f8f" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M133,398 L140,385 L147,398 Z" fill="#2a7f8f"/>
  <text x="980" y="432" font-size="14" fill="#999" text-anchor="end">illustrative numbers</text>
</svg>
