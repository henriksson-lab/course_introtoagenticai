<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <rect x="20" y="10" width="960" height="400" rx="10" fill="#1e1e1e"/>
  <rect x="20" y="10" width="960" height="34" rx="10" fill="#3a3a3a"/>
  <rect x="20" y="30" width="960" height="14" fill="#3a3a3a"/>
  <circle cx="46" cy="27" r="7" fill="#e06c75"/><circle cx="68" cy="27" r="7" fill="#e5c07b"/><circle cx="90" cy="27" r="7" fill="#98c379"/>
  <text x="500" y="33" font-size="16" fill="#cccccc" text-anchor="middle">catch-the-agent-out: agent session</text>
  <g font-family="Menlo, Consolas, monospace" font-size="18">
    <text x="44" y="82" fill="#e6e6e6">I'll compute the means with a short script.</text>
    <rect x="40" y="104" width="920" height="270" rx="6" fill="none" stroke="#8a8a8a"/>
    <text x="60" y="136" fill="#e5c07b" font-weight="bold">Run command</text>
    <text x="60" y="172" fill="#ffffff">python3 means.py plant_heights.csv</text>
    <text x="60" y="200" fill="#9a9a9a">Compute mean height per group</text>
    <text x="60" y="244" fill="#e6e6e6">Do you want to proceed?</text>
    <text x="60" y="278" fill="#9fe0ea">&gt; 1. Yes</text>
    <text x="60" y="308" fill="#e6e6e6">  2. Yes, and don't ask again for this command</text>
    <text x="60" y="338" fill="#e6e6e6">  3. No, and tell the agent what to do instead</text>
  </g>
  <!-- annotations -->
  <rect x="580" y="148" width="370" height="34" rx="6" fill="none" stroke="#a8324a" stroke-width="3"/>
  <rect x="52" y="149" width="408" height="30" rx="6" fill="none" stroke="#a8324a" stroke-width="3"/>
  <text x="590" y="174" font-size="18" fill="#f2b8c3" font-family="Helvetica, Arial, sans-serif">read this before you say yes</text>
  <path d="M580,167 h-118" stroke="#f2b8c3" stroke-width="2"/>
  <text x="980" y="432" font-size="14" fill="#999" text-anchor="end">illustrative: the wording differs between Claude Code, Codex and versions</text>
</svg>
