<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="200" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Monday: session 1</text>
  <rect x="40" y="56" width="320" height="230" rx="10" fill="#f5f5f5" stroke="#2a7f8f" stroke-width="2"/>
  <g font-size="17" fill="#2a7f8f">
    <text x="58" y="90">"Column C is in mm."</text>
    <text x="58" y="122">"Ignore plants P50-P60."</text>
    <text x="58" y="154">"Use R, not Python."</text>
    <text x="58" y="186">"Plots in our lab colours."</text>
    <text x="58" y="218">... 2 hours of corrections</text>
  </g>
  <text x="488" y="200" font-size="17" text-anchor="middle" fill="#666">(close the terminal)</text>
  <path d="M370,170 h220" stroke="#999" stroke-width="2.5" stroke-dasharray="8 6"/>
  <path d="M590,161 L606,170 L590,179 Z" fill="#999"/>
  <text x="488" y="155" font-size="17" text-anchor="middle" fill="#a8324a">nothing carries over</text>
  <text x="800" y="40" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Tuesday: session 2</text>
  <rect x="640" y="56" width="320" height="230" rx="10" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
  <text x="800" y="178" font-size="20" text-anchor="middle" fill="#bbbbbb">blank slate</text>
  <!-- notes file bridge -->
  <path d="M200,300 C200,370 800,370 800,300" fill="none" stroke="#8a6a12" stroke-width="2.5"/>
  <path d="M792,304 L800,290 L808,304 Z" fill="#8a6a12"/>
  <rect x="380" y="336" width="240" height="44" rx="6" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="364" font-size="18" text-anchor="middle" fill="#8a6a12">notes file in the folder</text>
</svg>
