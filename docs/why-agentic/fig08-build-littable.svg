<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#1f2933">literature.csv</text>
  <text x="970" y="34" text-anchor="end" font-size="15" fill="#999">illustrative: not real references</text>

  <!-- table frame -->
  <g transform="translate(30,50)">
    <rect width="940" height="300" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect width="940" height="44" fill="#eef3f4"/>
    <g stroke="#ddd" stroke-width="1">
      <line x1="0" y1="44" x2="940" y2="44" stroke="#999"/>
      <line x1="0" y1="96" x2="940" y2="96"/>
      <line x1="0" y1="148" x2="940" y2="148"/>
      <line x1="0" y1="200" x2="940" y2="200"/>
      <line x1="0" y1="252" x2="940" y2="252"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="330" y1="0" x2="330" y2="300"/>
      <line x1="700" y1="0" x2="700" y2="300"/>
    </g>
    <g font-size="17" font-weight="bold" fill="#1f2933">
      <text x="14" y="29">Paper</text><text x="214" y="29">Species</text><text x="344" y="29">Main finding</text><text x="714" y="29">DOI checked?</text>
    </g>
    <g font-size="17" fill="#333">
      <text x="14" y="77">Paper A, 2017</text><text x="214" y="77">pea</text><text x="344" y="77">taller under low light</text>
      <text x="714" y="77" fill="#2a7f8f" font-weight="bold">✓ resolves</text>

      <text x="14" y="129">Paper B, 2020</text><text x="214" y="129">bean</text><text x="344" y="129">more leaf area, high light</text>
      <text x="714" y="129" fill="#2a7f8f" font-weight="bold">✓ resolves</text>

      <text x="14" y="181">Paper C, 2021</text><text x="214" y="181">pea</text><text x="344" y="181">no effect on day 0–7</text>
      <text x="714" y="181" fill="#2a7f8f" font-weight="bold">✓ resolves</text>

      <rect x="1" y="201" width="938" height="50" fill="#faf3f5"/>
      <text x="14" y="233">Paper D, 2022</text><text x="214" y="233">pea</text><text x="344" y="233">doubling of growth rate</text>
      <text x="714" y="233" fill="#a8324a" font-weight="bold">✗ DOI not found</text>

      <text x="14" y="285">Paper E, 2019</text><text x="214" y="285">lentil</text><text x="344" y="285">shade avoidance genes</text>
      <text x="714" y="285" fill="#8a6a12" font-weight="bold">? paywalled, unread</text>
    </g>
  </g>
  <text x="500" y="396" text-anchor="middle" font-size="19" fill="#a8324a">The checking column is the point: every row looks equally confident.</text>
</svg>
