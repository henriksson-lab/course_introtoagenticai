<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- column headers -->
  <text x="420" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2933">Teaching</text>
  <text x="780" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f2933">Research</text>

  <!-- row template: label box + two cells -->
  <g font-size="17" fill="#333">
    <!-- Biology -->
    <rect x="20" y="50" width="200" height="94" rx="8" fill="#2a7f8f"/>
    <text x="120" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Biology</text>
    <rect x="235" y="50" width="370" height="94" rx="8" fill="#f4f8f9" stroke="#2a7f8f"/>
    <text x="250" y="88">Lab report data from 120 students:</text>
    <text x="250" y="114">one tidy table, one class figure</text>
    <rect x="615" y="50" width="365" height="94" rx="8" fill="#f4f8f9" stroke="#2a7f8f"/>
    <text x="630" y="88">Plate-reader exports from 30 runs</text>
    <text x="630" y="114">into one dataset and growth curves</text>

    <!-- Medicine -->
    <rect x="20" y="154" width="200" height="94" rx="8" fill="#a8324a"/>
    <text x="120" y="208" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Medicine</text>
    <rect x="235" y="154" width="370" height="94" rx="8" fill="#faf3f5" stroke="#a8324a"/>
    <text x="250" y="192">Case-based quiz variants with</text>
    <text x="250" y="218">answer keys from one template</text>
    <rect x="615" y="154" width="365" height="94" rx="8" fill="#faf3f5" stroke="#a8324a"/>
    <text x="630" y="192">Sample sizes and effect sizes from</text>
    <text x="630" y="218">40 trial PDFs into one table</text>

    <!-- Engineering -->
    <rect x="20" y="258" width="200" height="94" rx="8" fill="#8a6a12"/>
    <text x="120" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Engineering</text>
    <rect x="235" y="258" width="370" height="94" rx="8" fill="#fbf6ec" stroke="#8a6a12"/>
    <text x="250" y="296">An interactive page showing how</text>
    <text x="250" y="322">a beam bends under load</text>
    <rect x="615" y="258" width="365" height="94" rx="8" fill="#fbf6ec" stroke="#8a6a12"/>
    <text x="630" y="296">Port an old MATLAB model and</text>
    <text x="630" y="322">check that the numbers still match</text>

    <!-- Humanities / social sciences -->
    <rect x="20" y="362" width="200" height="94" rx="8" fill="#6b4fa0"/>
    <text x="120" y="400" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Humanities,</text>
    <text x="120" y="426" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">social sciences</text>
    <rect x="235" y="362" width="370" height="94" rx="8" fill="#f7f4fa" stroke="#6b4fa0"/>
    <text x="250" y="400">A course page with reading list,</text>
    <text x="250" y="426">schedule and seminar questions</text>
    <rect x="615" y="362" width="365" height="94" rx="8" fill="#f7f4fa" stroke="#6b4fa0"/>
    <text x="630" y="400">Code 300 open survey answers into</text>
    <text x="630" y="426">themes, with quotes to check</text>
  </g>
</svg>
