<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="370" rx="10" fill="#1f2933"/>
  <g font-family="Courier New, monospace" font-size="19">
    <rect x="70" y="40" width="860" height="320" rx="8" fill="#26333f" stroke="#e0c27a" stroke-width="2"/>
    <text x="96" y="80" fill="#e0c27a" font-weight="bold">Run this command?</text>
    <rect x="96" y="100" width="560" height="40" rx="4" fill="#1f2933"/>
    <text x="112" y="127" fill="#ffffff">Rscript plot_growth.R</text>
    <text x="96" y="176" fill="#cfd6dc">Runs the new script on seedlings.csv</text>
    <text x="96" y="200" fill="#cfd6dc">and saves growth_plot.png</text>

    <text x="96" y="248" fill="#ffffff">❯ 1. Yes</text>
    <text x="120" y="280" fill="#cfd6dc">2. Yes, and don't ask again for this command</text>
    <text x="120" y="312" fill="#cfd6dc">3. No, and tell the agent what to do instead</text>
  </g>
  <text x="500" y="412" text-anchor="middle" font-size="18" fill="#a8324a" font-weight="bold">Read the command before you press Enter. You can always say no.</text>
  <text x="955" y="378" text-anchor="end" font-size="14" fill="#8a97a5">illustrative</text>
</svg>
