<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- 1 confident errors -->
  <rect x="20" y="20" width="310" height="360" rx="12" fill="#faf3f5" stroke="#a8324a" stroke-width="2.5"/>
  <text x="175" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#a8324a">Confident errors</text>
  <rect x="50" y="85" width="250" height="110" rx="8" fill="#ffffff" stroke="#a8324a"/>
  <text x="66" y="118" font-size="17" fill="#333">"Done. The plot shows</text>
  <text x="66" y="142" font-size="17" fill="#333">all 24 plants and the</text>
  <text x="66" y="166" font-size="17" fill="#333">reference is correct."</text>
  <g font-size="17" fill="#333" text-anchor="middle">
    <text x="175" y="240">The tone is the same</text>
    <text x="175" y="264">whether it is right</text>
    <text x="175" y="288">or wrong.</text>
  </g>

  <!-- 2 privacy -->
  <rect x="345" y="20" width="310" height="360" rx="12" fill="#f7f4fa" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="500" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#6b4fa0">Privacy</text>
  <!-- file to cloud -->
  <path d="M430,110 h44 l16,16 v60 h-60 z" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <path d="M530,145 a20,20 0 0 1 35,-12 a22,22 0 0 1 42,10 a18,18 0 0 1 -3,35 h-70 a18,18 0 0 1 -4,-33 z" fill="#ffffff" stroke="#6b4fa0" stroke-width="2"/>
  <line x1="494" y1="155" x2="526" y2="155" stroke="#6b4fa0" stroke-width="2.5"/>
  <g font-size="17" fill="#333" text-anchor="middle">
    <text x="500" y="240">What the agent reads</text>
    <text x="500" y="264">is sent to a company's</text>
    <text x="500" y="288">servers.</text>
  </g>

  <!-- 3 cost of not checking -->
  <rect x="670" y="20" width="310" height="360" rx="12" fill="#fbf6ec" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="825" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6a12">Not checking</text>
  <g font-size="17" fill="#333">
    <text x="700" y="112">5 min check now</text>
    <rect x="700" y="122" width="40" height="22" fill="#8a6a12"/>
    <text x="700" y="174">vs. a wrong figure in a</text>
    <text x="700" y="198">paper or a lecture</text>
    <rect x="700" y="208" width="250" height="22" fill="#a8324a"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle">
    <text x="825" y="264">Saved time is lost</text>
    <text x="825" y="288">many times over.</text>
  </g>
</svg>
