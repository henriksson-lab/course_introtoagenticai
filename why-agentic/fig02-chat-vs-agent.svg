<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f8f"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- LEFT: chat -->
  <text x="245" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#6b4fa0">Chat window</text>
  <rect x="40" y="56" width="410" height="150" rx="10" fill="#f7f4fa" stroke="#6b4fa0" stroke-width="2"/>
  <rect x="200" y="72" width="230" height="36" rx="16" fill="#ffffff" stroke="#999"/>
  <text x="315" y="96" text-anchor="middle" font-size="16" fill="#333">"Plot my data in R"</text>
  <rect x="60" y="120" width="300" height="70" rx="12" fill="#ffffff" stroke="#6b4fa0"/>
  <text x="76" y="146" font-size="16" fill="#333" font-family="Courier New, monospace">library(ggplot2)</text>
  <text x="76" y="172" font-size="16" fill="#333" font-family="Courier New, monospace">d &lt;- read.csv("data.csv")</text>

  <text x="245" y="246" text-anchor="middle" font-size="18" fill="#333">then you do the rest:</text>
  <g font-size="17" fill="#333">
    <text x="70" y="280">1. copy the text into a file</text>
    <text x="70" y="308">2. guess what "data.csv" should be</text>
    <text x="70" y="336">3. run it, get an error</text>
    <text x="70" y="364">4. paste the error back, repeat</text>
  </g>
  <text x="245" y="410" text-anchor="middle" font-size="17" font-style="italic" fill="#666">it never saw your file</text>

  <line x1="500" y1="50" x2="500" y2="420" stroke="#ddd" stroke-width="2"/>

  <!-- RIGHT: agent -->
  <text x="755" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a7f8f">Agent</text>
  <rect x="550" y="56" width="410" height="300" rx="10" fill="#f4f8f9" stroke="#2a7f8f" stroke-width="2"/>
  <text x="570" y="84" font-size="17" font-weight="bold" fill="#2a7f8f">your folder</text>
  <!-- steps -->
  <g font-size="17" fill="#333">
    <rect x="575" y="100" width="360" height="40" rx="6" fill="#ffffff" stroke="#2a7f8f"/>
    <text x="590" y="126">reads seedlings.csv (192 rows)</text>
    <rect x="575" y="150" width="360" height="40" rx="6" fill="#ffffff" stroke="#2a7f8f"/>
    <text x="590" y="176">writes plot_growth.R</text>
    <rect x="575" y="200" width="360" height="40" rx="6" fill="#ffffff" stroke="#2a7f8f"/>
    <text x="590" y="226">runs it (after asking you)</text>
    <rect x="575" y="250" width="360" height="40" rx="6" fill="#ffffff" stroke="#2a7f8f"/>
    <text x="590" y="276">looks at the output, fixes a slip</text>
    <rect x="575" y="300" width="360" height="40" rx="6" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="590" y="326" font-weight="bold">leaves: script + figure on disk</text>
  </g>
  <text x="755" y="392" text-anchor="middle" font-size="18" fill="#333">you: describe the plot, then judge it</text>
  <text x="755" y="418" text-anchor="middle" font-size="17" font-style="italic" fill="#666">it works on your actual file</text>
</svg>
