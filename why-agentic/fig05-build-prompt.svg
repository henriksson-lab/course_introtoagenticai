<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <rect x="40" y="16" width="920" height="410" rx="10" fill="#1f2933"/>
  <rect x="40" y="16" width="920" height="38" rx="10" fill="#3a4651"/>
  <rect x="40" y="44" width="920" height="10" fill="#3a4651"/>
  <circle cx="66" cy="35" r="7" fill="#6b7782"/><circle cx="88" cy="35" r="7" fill="#6b7782"/><circle cx="110" cy="35" r="7" fill="#6b7782"/>
  <text x="500" y="41" text-anchor="middle" font-size="16" fill="#cfd6dc">Terminal: seedling-project</text>

  <g font-family="Courier New, monospace" font-size="18">
    <!-- prompt -->
    <rect x="60" y="70" width="880" height="62" rx="6" fill="#26333f" stroke="#2a7f8f" stroke-width="1.5"/>
    <text x="76" y="96" fill="#ffffff">&gt; Make a line plot of mean seedling height per light</text>
    <text x="76" y="120" fill="#ffffff">  treatment over time, with error bars. Use an R script.</text>

    <text x="76" y="168" fill="#8fd3df">● Read(seedlings.csv)</text>
    <text x="96" y="192" fill="#cfd6dc">└ 193 lines: plant_id, treatment, day, height_mm</text>

    <text x="76" y="232" fill="#e8e8e8">● The file has 24 plants measured every second day,</text>
    <text x="96" y="256" fill="#e8e8e8">day 0 to 14. I will write plot_growth.R with</text>
    <text x="96" y="280" fill="#e8e8e8">ggplot2: mean ± standard error per treatment.</text>

    <text x="76" y="320" fill="#8fd3df">● Write(plot_growth.R)</text>
    <text x="96" y="344" fill="#cfd6dc">└ 31 lines written</text>

    <text x="76" y="384" fill="#e0c27a">● Run: Rscript plot_growth.R   (waiting for you)</text>
  </g>
  <!-- annotations -->
  <g font-size="16" fill="#a8324a" font-weight="bold">
    <text x="955" y="168" text-anchor="end">it looked first</text>
    <text x="955" y="384" text-anchor="end">asks before running</text>
  </g>
  <text x="955" y="448" text-anchor="end" font-size="14" fill="#999">illustrative</text>
</svg>
