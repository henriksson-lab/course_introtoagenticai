<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <!-- browser -->
  <rect x="60" y="14" width="880" height="420" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <rect x="60" y="14" width="880" height="50" rx="10" fill="#eeeeee"/>
  <rect x="60" y="54" width="880" height="10" fill="#eeeeee"/>
  <circle cx="86" cy="39" r="7" fill="#cccccc"/><circle cx="108" cy="39" r="7" fill="#cccccc"/><circle cx="130" cy="39" r="7" fill="#cccccc"/>
  <rect x="160" y="24" width="600" height="30" rx="15" fill="#ffffff" stroke="#ccc"/>
  <text x="180" y="45" font-size="16" fill="#666">file:///…/seedling-project/index.html</text>

  <!-- page content -->
  <text x="100" y="108" font-size="28" font-weight="bold" fill="#1f2933">Seedling growth and light</text>
  <text x="100" y="138" font-size="17" fill="#666">Lab exercise, Plant physiology, autumn term</text>
  <rect x="100" y="150" width="380" height="3" fill="#2a7f8f"/>

  <!-- mini plot -->
  <g transform="translate(100,170)">
    <rect width="400" height="230" fill="#fafafa" stroke="#ddd"/>
    <line x1="40" y1="200" x2="380" y2="200" stroke="#666" stroke-width="1.5"/>
    <line x1="40" y1="200" x2="40" y2="20" stroke="#666" stroke-width="1.5"/>
    <polyline points="40,185 90,170 140,152 190,132 240,110 290,88 340,62 380,40" fill="none" stroke="#6b4fa0" stroke-width="3"/>
    <polyline points="40,186 90,176 140,164 190,150 240,134 290,120 340,100 380,86" fill="none" stroke="#2a7f8f" stroke-width="3"/>
    <polyline points="40,188 90,180 140,172 190,164 240,154 290,146 340,136 380,130" fill="none" stroke="#8a6a12" stroke-width="3"/>
    <text x="210" y="222" text-anchor="middle" font-size="16" fill="#666">day</text>
  </g>

  <!-- text column -->
  <g font-size="18" fill="#333">
    <text x="530" y="190" font-weight="bold">What we measured</text>
    <text x="530" y="218">24 pea seedlings, three light</text>
    <text x="530" y="242">levels, height every 2nd day.</text>
    <text x="530" y="286" font-weight="bold">Files</text>
    <text x="530" y="314" fill="#2a7f8f" text-decoration="underline">seedlings.csv</text>
    <text x="530" y="340" fill="#2a7f8f" text-decoration="underline">plot_growth.R</text>
    <text x="530" y="366" fill="#2a7f8f" text-decoration="underline">literature.csv</text>
  </g>
  <text x="935" y="455" text-anchor="end" font-size="14" fill="#999">illustrative</text>
