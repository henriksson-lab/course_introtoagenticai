<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- left: first plot (4 lines) -->
  <text x="160" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#a8324a">First run</text>
  <g transform="translate(20,50)">
    <rect width="280" height="200" fill="#fafafa" stroke="#ddd"/>
    <line x1="30" y1="170" x2="200" y2="170" stroke="#666"/>
    <line x1="30" y1="170" x2="30" y2="20" stroke="#666"/>
    <polyline points="30,160 80,135 130,100 200,40" fill="none" stroke="#9aa600" stroke-width="3"/>
    <polyline points="30,160 80,140 130,110 200,55" fill="none" stroke="#e06666" stroke-width="3"/>
    <polyline points="30,161 80,148 130,125 200,95" fill="none" stroke="#b085e0" stroke-width="3"/>
    <polyline points="30,163 80,155 130,142 200,120" fill="none" stroke="#33bbbb" stroke-width="3"/>
    <g font-size="16" fill="#333">
      <text x="210" y="50">high</text>
      <text x="210" y="74" fill="#a8324a" font-weight="bold">High</text>
      <text x="210" y="98">low</text>
      <text x="210" y="122">medium</text>
    </g>
  </g>
  <text x="160" y="285" text-anchor="middle" font-size="17" fill="#333">four groups in the legend</text>

  <line x1="310" y1="150" x2="370" y2="150" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- middle: agent reasoning -->
  <rect x="380" y="60" width="300" height="190" rx="10" fill="#f4f8f9" stroke="#2a7f8f" stroke-width="2"/>
  <text x="530" y="92" text-anchor="middle" font-size="19" font-weight="bold" fill="#2a7f8f">Agent checks</text>
  <g font-size="17" fill="#333">
    <text x="400" y="126">"You said three treatments,</text>
    <text x="400" y="150">the plot shows four. 16 rows</text>
    <text x="400" y="174">say High, not high. I will</text>
    <text x="400" y="198">merge them and tell you."</text>
  </g>
  <text x="530" y="236" text-anchor="middle" font-size="15" fill="#666">counts rows per label</text>

  <line x1="690" y1="150" x2="750" y2="150" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- right: fixed plot -->
  <text x="860" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a7f8f">After the fix</text>
  <g transform="translate(760,50)">
    <rect width="220" height="200" fill="#fafafa" stroke="#ddd"/>
    <line x1="30" y1="170" x2="200" y2="170" stroke="#666"/>
    <line x1="30" y1="170" x2="30" y2="20" stroke="#666"/>
    <polyline points="30,160 80,138 130,105 200,48" fill="none" stroke="#6b4fa0" stroke-width="3"/>
    <polyline points="30,161 80,148 130,125 200,95" fill="none" stroke="#2a7f8f" stroke-width="3"/>
    <polyline points="30,163 80,155 130,142 200,120" fill="none" stroke="#8a6a12" stroke-width="3"/>
  </g>
  <text x="870" y="285" text-anchor="middle" font-size="17" fill="#333">three groups, 8 plants each</text>

  <rect x="200" y="320" width="600" height="56" rx="8" fill="#fbf6ec" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="355" text-anchor="middle" font-size="18" fill="#333">Your check: is "High" really the same treatment as "high"?</text>
</svg>
