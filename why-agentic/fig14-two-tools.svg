<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>

  <!-- Claude Code -->
  <rect x="30" y="20" width="400" height="300" rx="12" fill="#f4f8f9" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="230" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#2a7f8f">Claude Code</text>
  <text x="230" y="88" text-anchor="middle" font-size="17" fill="#666">from Anthropic</text>
  <g font-size="17" fill="#333">
    <text x="60" y="134">model: Claude</text>
    <text x="60" y="166">account: Claude Pro or higher</text>
    <text x="60" y="198">start it: type  claude  in a folder</text>
    <text x="60" y="230">project notes file: CLAUDE.md</text>
    <text x="60" y="262">also: desktop app, editor plug-in</text>
  </g>

  <!-- Codex -->
  <rect x="570" y="20" width="400" height="300" rx="12" fill="#f7f4fa" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="770" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#6b4fa0">Codex</text>
  <text x="770" y="88" text-anchor="middle" font-size="17" fill="#666">from OpenAI</text>
  <g font-size="17" fill="#333">
    <text x="600" y="134">model: GPT</text>
    <text x="600" y="166">account: ChatGPT (Plus realistic)</text>
    <text x="600" y="198">start it: type  codex  in a folder</text>
    <text x="600" y="230">project notes file: AGENTS.md</text>
    <text x="600" y="262">also: desktop app, editor plug-in</text>
  </g>

  <!-- shared middle -->
  <rect x="445" y="120" width="110" height="110" rx="55" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="500" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">same</text>
  <text x="500" y="192" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">idea</text>

  <rect x="30" y="345" width="940" height="76" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
  <text x="500" y="377" text-anchor="middle" font-size="19" fill="#333">Both: work in a folder, read and write files, run commands, ask for approval.</text>
  <text x="500" y="405" text-anchor="middle" font-size="19" fill="#333">What you learn in this course works in either.</text>
</svg>
