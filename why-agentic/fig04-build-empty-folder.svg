<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <!-- window -->
  <rect x="80" y="20" width="840" height="380" rx="10" fill="#ffffff" stroke="#999" stroke-width="2"/>
  <rect x="80" y="20" width="840" height="44" rx="10" fill="#eeeeee"/>
  <rect x="80" y="54" width="840" height="10" fill="#eeeeee"/>
  <circle cx="108" cy="42" r="7" fill="#cccccc"/><circle cx="130" cy="42" r="7" fill="#cccccc"/><circle cx="152" cy="42" r="7" fill="#cccccc"/>
  <text x="500" y="48" text-anchor="middle" font-size="18" fill="#333">seedling-project</text>
  <!-- sidebar -->
  <rect x="80" y="64" width="200" height="336" fill="#f6f6f6"/>
  <g font-size="17" fill="#666">
    <text x="100" y="100">Documents</text>
    <text x="100" y="132">Downloads</text>
    <text x="100" y="164" font-weight="bold" fill="#2a7f8f">course-ai</text>
    <text x="120" y="196" fill="#2a7f8f">seedling-project</text>
  </g>
  <!-- header row -->
  <g font-size="16" fill="#666">
    <text x="310" y="100">Name</text><text x="640" y="100">Size</text><text x="760" y="100">Kind</text>
  </g>
  <line x1="300" y1="110" x2="900" y2="110" stroke="#ddd" stroke-width="1.5"/>
  <!-- the only file -->
  <rect x="300" y="118" width="600" height="40" fill="#e3f0f2"/>
  <g transform="translate(312,124)">
    <path d="M0,0 h18 l8,8 v20 h-26 z" fill="#ffffff" stroke="#2a7f8f" stroke-width="1.5"/>
  </g>
  <g font-size="18" fill="#1f2933">
    <text x="350" y="145">seedlings.csv</text><text x="640" y="145">4 KB</text><text x="760" y="145">CSV text</text>
  </g>
  <text x="600" y="260" text-anchor="middle" font-size="20" fill="#999" font-style="italic">nothing else: no script, no figure, no page</text>
  <text x="600" y="290" text-anchor="middle" font-size="17" fill="#999">(192 rows: 24 seedlings, 3 light levels, 8 days)</text>
  <text x="915" y="425" text-anchor="end" font-size="14" fill="#999">illustrative</text>
</svg>
