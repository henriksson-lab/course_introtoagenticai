<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- your computer -->
  <rect x="20" y="20" width="700" height="420" rx="14" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <text x="40" y="52" font-size="20" font-weight="bold" fill="#666">your computer</text>

  <!-- project folder -->
  <path d="M60,90 h120 l20,20 h480 v300 h-620 z" fill="#f4f8f9" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="80" y="140" font-size="20" font-weight="bold" fill="#2a7f8f">project folder</text>

  <!-- agent -->
  <rect x="270" y="200" width="200" height="90" rx="12" fill="#2a7f8f"/>
  <text x="370" y="240" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">agent</text>
  <text x="370" y="268" text-anchor="middle" font-size="16" fill="#ffffff">works in this folder</text>

  <!-- tools -->
  <g font-size="18" fill="#333">
    <rect x="90" y="165" width="150" height="44" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="165" y="193" text-anchor="middle">read files</text>
    <rect x="90" y="300" width="150" height="44" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="165" y="328" text-anchor="middle">write files</text>
    <rect x="500" y="165" width="160" height="44" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="580" y="193" text-anchor="middle">run commands</text>
    <rect x="500" y="300" width="160" height="44" rx="8" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="580" y="328" text-anchor="middle">check output</text>
  </g>
  <g stroke="#333" stroke-width="2" marker-end="url(#ar)">
    <line x1="270" y1="225" x2="242" y2="200"/>
    <line x1="270" y1="268" x2="242" y2="305"/>
    <line x1="470" y1="225" x2="498" y2="200"/>
    <line x1="470" y1="268" x2="498" y2="305"/>
  </g>

  <!-- files left behind -->
  <g font-size="16" fill="#333">
    <rect x="120" y="360" width="120" height="34" rx="4" fill="#ffffff" stroke="#999"/>
    <text x="180" y="383" text-anchor="middle">data.csv</text>
    <rect x="260" y="360" width="140" height="34" rx="4" fill="#ffffff" stroke="#999"/>
    <text x="330" y="383" text-anchor="middle">plot.R</text>
    <rect x="420" y="360" width="120" height="34" rx="4" fill="#ffffff" stroke="#999"/>
    <text x="480" y="383" text-anchor="middle">plot.png</text>
  </g>

  <!-- cloud model -->
  <path d="M790,170 a40,40 0 0 1 70,-25 a45,45 0 0 1 85,20 a35,35 0 0 1 -5,70 h-145 a35,35 0 0 1 -5,-65 z" fill="#f7f4fa" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="865" y="198" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b4fa0">language</text>
  <text x="865" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b4fa0">model</text>
  <text x="865" y="275" text-anchor="middle" font-size="16" fill="#666">(in the cloud)</text>
  <line x1="472" y1="245" x2="780" y2="215" stroke="#6b4fa0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="865" y="310" text-anchor="middle" font-size="16" fill="#6b4fa0">decides the next step;</text>
  <text x="865" y="332" text-anchor="middle" font-size="16" fill="#6b4fa0">sees what the agent reads</text>
</svg>
