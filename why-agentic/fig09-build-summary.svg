<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="450" fill="#ffffff"/>

  <!-- before -->
  <text x="190" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#666">Before</text>
  <path d="M40,60 h100 l18,18 h182 v300 h-300 z" fill="#fafafa" stroke="#999" stroke-width="2"/>
  <g font-size="18" fill="#333">
    <rect x="60" y="100" width="260" height="38" rx="4" fill="#ffffff" stroke="#999"/>
    <text x="76" y="126">seedlings.csv</text>
  </g>

  <!-- arrow with prompts -->
  <line x1="365" y1="220" x2="520" y2="220" stroke="#333" stroke-width="3" marker-end="url(#ar)"/>
  <text x="442" y="190" text-anchor="middle" font-size="18" fill="#333">a few prompts</text>
  <text x="442" y="254" text-anchor="middle" font-size="18" fill="#333">plus your checks</text>

  <!-- after -->
  <text x="760" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7f8f">After</text>
  <path d="M540,60 h100 l18,18 h302 v320 h-420 z" fill="#f4f8f9" stroke="#2a7f8f" stroke-width="2.5"/>
  <g font-size="18" fill="#333">
    <rect x="560" y="96" width="260" height="36" rx="4" fill="#ffffff" stroke="#999"/>
    <text x="576" y="120">seedlings.csv</text>
    <rect x="560" y="142" width="260" height="36" rx="4" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="576" y="166">plot_growth.R</text>
    <rect x="560" y="188" width="260" height="36" rx="4" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="576" y="212">growth_plot.png</text>
    <rect x="560" y="234" width="260" height="36" rx="4" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="576" y="258">index.html</text>
    <rect x="560" y="280" width="260" height="36" rx="4" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="576" y="304">literature.csv</text>
    <rect x="560" y="326" width="260" height="36" rx="4" fill="#ffffff" stroke="#2a7f8f" stroke-width="2"/>
    <text x="576" y="350">notes.md</text>
  </g>
  <g font-size="16" fill="#6b4fa0">
    <text x="832" y="166">rerun it</text>
    <text x="832" y="212">regenerated</text>
    <text x="832" y="258">open in browser</text>
    <text x="832" y="304">check each row</text>
    <text x="832" y="350">what was done</text>
  </g>
  <text x="500" y="436" text-anchor="middle" font-size="18" fill="#333">Everything is an ordinary file you own, can open, change, share and rerun.</text>
</svg>
