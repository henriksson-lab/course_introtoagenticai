  <text x="103" y="268" text-anchor="middle" font-size="15" fill="#a8324a" font-weight="bold">choose project ▸</text>

  <!-- own project thread -->
  <path d="M150,300 L970,300" stroke="#6b4fa0" stroke-width="6" marker-end="url(#ar)"/>
  <g fill="#6b4fa0">
    <circle cx="190" cy="300" r="9"/><circle cx="299" cy="300" r="9"/><circle cx="495" cy="300" r="9"/>
    <circle cx="691" cy="300" r="9"/><circle cx="887" cy="300" r="9"/>
  </g>
  <text x="500" y="336" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4fa0">your own project: one folder, every exercise adds to it</text>

