    <text x="103" y="140">install</text>
    <text x="103" y="164">terminal</text>
    <text x="103" y="188">first jobs</text>
    <text x="103" y="212">how LLMs fail</text>
    <text x="103" y="236">privacy</text>

    <text x="299" y="116">delegating well</text>
    <text x="299" y="140">project folder</text>
    <text x="299" y="164">git as undo</text>
    <text x="299" y="188">reproducible</text>
    <text x="299" y="212">figures</text>

    <text x="495" y="116">GitHub</text>
    <text x="495" y="140">project page</text>
    <text x="495" y="164">interactive</text>
    <text x="495" y="188">demos</text>
