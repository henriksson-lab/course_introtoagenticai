<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7f8f"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="460" fill="#ffffff"/>

  <!-- goal box (from you) -->
  <rect x="30" y="185" width="190" height="90" rx="12" fill="#6b4fa0"/>
  <text x="125" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Goal</text>
  <text x="125" y="250" text-anchor="middle" font-size="16" fill="#ffffff">from you</text>
  <line x1="222" y1="230" x2="330" y2="110" stroke="#333" stroke-width="2.5" marker-end="url(#arG)"/>

  <!-- cycle nodes -->
  <g font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">
    <rect x="340" y="60" width="200" height="70" rx="35" fill="#ffffff" stroke="#2a7f8f" stroke-width="3"/>
    <text x="440" y="103">Plan</text>
    <rect x="620" y="195" width="220" height="70" rx="35" fill="#ffffff" stroke="#2a7f8f" stroke-width="3"/>
    <text x="730" y="238">Act with tools</text>
    <rect x="340" y="330" width="200" height="70" rx="35" fill="#ffffff" stroke="#2a7f8f" stroke-width="3"/>
    <text x="440" y="373">Look at result</text>
  </g>
  <g stroke="#2a7f8f" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M545,100 Q680,110 715,190"/>
    <path d="M715,270 Q680,355 545,365"/>
    <path d="M370,330 Q300,230 370,135"/>
  </g>
  <text x="300" y="238" text-anchor="middle" font-size="18" fill="#2a7f8f">repeat</text>

  <!-- side notes -->
  <g font-size="16" fill="#666">
    <text x="660" y="118">"read the CSV, then write a script"</text>
    <text x="860" y="225">read, write,</text>
    <text x="860" y="247">run a command</text>
    <text x="600" y="440">"4 groups? expected 3"</text>
  </g>

  <!-- done -->
  <rect x="790" y="370" width="180" height="60" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="880" y="398" text-anchor="middle" font-size="18" font-weight="bold" fill="#2a7f8f">Report back</text>
  <text x="880" y="420" text-anchor="middle" font-size="15" fill="#333">you judge it</text>
  <line x1="545" y1="380" x2="785" y2="398" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arG)"/>
</svg>
