<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a6a12"/></marker>
  </defs>
  <rect width="1000" height="440" fill="#fff"/>
  <!-- mini table 6x4 -->
  <text x="40" y="40" font-size="19" font-weight="bold" fill="#333">Summary table</text>
  <g stroke="#bbb" fill="#fff">
    <rect x="40" y="55" width="400" height="300"/>
  </g>
  <g stroke="#ddd">
    <line x1="40" y1="105" x2="440" y2="105"/><line x1="40" y1="155" x2="440" y2="155"/><line x1="40" y1="205" x2="440" y2="205"/>
    <line x1="40" y1="255" x2="440" y2="255"/><line x1="40" y1="305" x2="440" y2="305"/>
    <line x1="140" y1="55" x2="140" y2="355"/><line x1="240" y1="55" x2="240" y2="355"/><line x1="340" y1="55" x2="340" y2="355"/>
  </g>
  <g font-size="15" fill="#888" text-anchor="middle">
    <text x="90" y="372">title</text><text x="190" y="372">authors</text><text x="290" y="372">date</text><text x="390" y="372">finding</text>
  </g>
  <!-- three highlighted cells -->
  <rect x="242" y="107" width="96" height="46" fill="#f6f1e3" stroke="#8a6a12" stroke-width="3"/>
  <rect x="142" y="207" width="96" height="46" fill="#f6f1e3" stroke="#8a6a12" stroke-width="3"/>
  <rect x="342" y="257" width="96" height="46" fill="#f6f1e3" stroke="#8a6a12" stroke-width="3"/>
  <g font-size="16" font-weight="bold" fill="#8a6a12" text-anchor="middle">
    <text x="290" y="136">A</text><text x="190" y="236">B</text><text x="390" y="286">C</text>
  </g>
  <!-- die -->
  <rect x="40" y="390" width="40" height="40" rx="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <circle cx="51" cy="401" r="4" fill="#333"/><circle cx="60" cy="410" r="4" fill="#333"/><circle cx="69" cy="419" r="4" fill="#333"/>
  <text x="95" y="418" font-size="18" fill="#333">pick at random, not the first rows</text>

  <!-- PDF pages on right -->
  <g font-size="16" fill="#333">
    <rect x="610" y="30" width="350" height="110" fill="#fff" stroke="#a8324a" stroke-width="2"/>
    <text x="625" y="58" font-weight="bold" fill="#a8324a">A: peer feedback, page 1</text>
    <text x="625" y="86">"…Course development report</text>
    <text x="625" y="110"> 03/09/2025"  → 3 Sept? 9 March?</text>
    <rect x="610" y="165" width="350" height="110" fill="#fff" stroke="#a8324a" stroke-width="2"/>
    <text x="625" y="193" font-weight="bold" fill="#a8324a">B: barley, page 1</text>
    <text x="625" y="221">"Aino Virtanen"</text>
    <text x="625" y="245">one author: matches  ✓</text>
    <rect x="610" y="300" width="350" height="110" fill="#fff" stroke="#a8324a" stroke-width="2"/>
    <text x="625" y="328" font-weight="bold" fill="#a8324a">C: hand hygiene, page 1</text>
    <text x="625" y="356">"rose from 64% … to 79%"</text>
    <text x="625" y="380">matches  ✓</text>
  </g>
  <g stroke="#8a6a12" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <path d="M340,130 C 470,100 520,85 600,85"/>
    <path d="M240,230 C 400,230 500,220 600,220"/>
    <path d="M440,280 C 520,300 540,355 600,355"/>
  </g>
</svg>
