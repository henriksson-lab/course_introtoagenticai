<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>
  <!-- quadrants -->
  <rect x="150" y="30" width="400" height="230" fill="#e3f0f2"/>
  <rect x="550" y="30" width="400" height="230" fill="#f6f1e3"/>
  <rect x="150" y="260" width="400" height="230" fill="#f6f1e3"/>
  <rect x="550" y="260" width="400" height="230" fill="#f8e9ec"/>
  <!-- axes -->
  <line x1="150" y1="490" x2="960" y2="490" stroke="#444" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="150" y1="490" x2="150" y2="30" stroke="#444" stroke-width="2"/>
  <text x="555" y="525" font-size="20" fill="#333" text-anchor="middle">harder to check →</text>
  <text x="160" y="525" font-size="18" fill="#666">easy to check</text>
  <text x="120" y="145" font-size="20" fill="#333" text-anchor="middle" transform="rotate(-90 120 145)">easy to undo</text>
  <text x="120" y="375" font-size="20" fill="#333" text-anchor="middle" transform="rotate(-90 120 375)">hard to undo</text>
    <!-- labels -->
  <text x="350" y="62" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Start here</text>
  <g font-size="19" fill="#333">
    <text x="175" y="105">✓ rename files (in a copy)</text>
    <text x="175" y="140">✓ clean a copy of a spreadsheet</text>
    <text x="175" y="175">✓ summarise 6 reports, with pages</text>
    <text x="175" y="210">✓ draft a figure you will look at</text>
  </g>
  <g font-size="19" fill="#333">
    <text x="575" y="105">literature review with 50</text>
    <text x="575" y="130">references (later, with checks)</text>
    <text x="575" y="175">a statistical analysis you</text>
    <text x="575" y="200">cannot judge yourself</text>
  </g>
  <g font-size="19" fill="#333">
    <text x="175" y="335">delete "old" files</text>
    <text x="175" y="360">(easy to see, hard to get back)</text>
    <text x="175" y="405">edit the only copy of your data</text>
  </g>
  <text x="750" y="300" font-size="21" font-weight="bold" fill="#a8324a" text-anchor="middle">Not as a first job</text>
  <g font-size="19" fill="#333">
    <text x="575" y="345">email all your students</text>
    <text x="575" y="390">change grades in the</text>
    <text x="575" y="415">course system</text>
  </g>
</svg>
