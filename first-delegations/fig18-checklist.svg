<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="520" fill="#fff"/>
  <rect x="40" y="20" width="720" height="480" rx="14" fill="#fdf8e8" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="400" y="70" font-size="28" font-weight="bold" fill="#8a6a12" text-anchor="middle">Before, during and after a delegation</text>
  <g font-size="23" fill="#333">
    <rect x="80" y="110" width="30" height="30" rx="4" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="130" y="134"><tspan font-weight="bold" fill="#2a7f8f">Copy:</tspan> the agent starts in a copy</text>
    <rect x="80" y="180" width="30" height="30" rx="4" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="130" y="204"><tspan font-weight="bold" fill="#2a7f8f">Describe</tspan> what done looks like</text>
    <rect x="80" y="250" width="30" height="30" rx="4" fill="#fff" stroke="#6b4fa0" stroke-width="2.5"/>
    <text x="130" y="274"><tspan font-weight="bold" fill="#6b4fa0">Record:</tspan> log, decisions, assumptions</text>
    <rect x="80" y="320" width="30" height="30" rx="4" fill="#fff" stroke="#8a6a12" stroke-width="2.5"/>
    <text x="130" y="344"><tspan font-weight="bold" fill="#8a6a12">Check:</tspan> count, total, 3 at random</text>
    <rect x="80" y="390" width="30" height="30" rx="4" fill="#fff" stroke="#a8324a" stroke-width="2.5"/>
    <text x="130" y="414"><tspan font-weight="bold" fill="#a8324a">Correct:</tspan> say what is wrong</text>
  </g>
  <text x="400" y="472" font-size="19" fill="#666" text-anchor="middle">"It ran without errors" is not a check.</text>
</svg>
