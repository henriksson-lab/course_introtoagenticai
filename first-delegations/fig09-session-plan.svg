<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#fff"/>
  <rect x="20" y="15" width="960" height="425" rx="10" fill="#1f2430"/>
  <circle cx="45" cy="37" r="7" fill="#a8324a"/><circle cx="68" cy="37" r="7" fill="#8a6a12"/><circle cx="91" cy="37" r="7" fill="#2a7f8f"/>
  <text x="500" y="43" font-size="16" fill="#aab" text-anchor="middle">terminal: messy-folder-work</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="45" y="80" fill="#9a9aa8">• Listed 40 files. Read 12 of them. Compared contents.</text>
    <text x="45" y="112" fill="#e8e8e8">Plan:</text>
    <text x="45" y="138" fill="#e8e8e8">  data/        10 csv, 2 xlsx  (2 csv are duplicates)</text>
    <text x="45" y="164" fill="#e8e8e8">  figures/     12 png          (1 is a duplicate)</text>
    <text x="45" y="190" fill="#e8e8e8">  documents/   5 docx, 5 pdf, 5 txt, 1 md</text>
    <text x="45" y="216" fill="#e8e8e8">  duplicates/  the 3 exact copies</text>
    <text x="45" y="242" fill="#e8e8e8">  Names: YYYY-MM-DD_short-description.ext</text>
    <text x="45" y="274" fill="#e8e8e8">Assumptions: 4, listed above.</text>
  </g>
  <!-- permission box -->
  <rect x="40" y="295" width="920" height="130" rx="6" fill="none" stroke="#e0b84a" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="60" y="325" fill="#e0b84a">Run this command?</text>
    <text x="60" y="355" fill="#e8e8e8">  mkdir data figures documents duplicates</text>
    <text x="60" y="390" fill="#8fd3df">  1. Yes      2. Yes, and don't ask again      3. No, tell the agent</text>
    <text x="60" y="414" fill="#9a9aa8">     what to do differently</text>
  </g>
  <text x="975" y="462" font-size="14" fill="#999" text-anchor="end">illustrative; wording differs between tools and versions</text>
</svg>
