<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>
  <g font-size="19" text-anchor="middle">
    <rect x="30" y="60" width="200" height="90" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="130" y="98" font-weight="bold" fill="#2a7f8f">1. Edit</text>
    <text x="130" y="126" font-size="16" fill="#333">a .qmd, a figure</text>
    <rect x="280" y="60" width="200" height="90" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="380" y="98" font-weight="bold" fill="#2a7f8f">2. Render</text>
    <text x="380" y="126" font-size="16" fill="#333">quarto render</text>
    <rect x="530" y="60" width="200" height="90" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="630" y="98" font-weight="bold" fill="#8a6a12">3. Look</text>
    <text x="630" y="126" font-size="16" fill="#333">docs/index.html locally</text>
    <rect x="780" y="60" width="190" height="90" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="875" y="98" font-weight="bold" fill="#6b4fa0">4. Commit</text>
    <text x="875" y="126" font-size="16" fill="#333">sources and docs/</text>
    <rect x="780" y="260" width="190" height="90" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="875" y="298" font-weight="bold" fill="#6b4fa0">5. Push</text>
    <text x="875" y="326" font-size="16" fill="#333">git push</text>
    <rect x="480" y="260" width="250" height="90" rx="12" fill="#fff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="605" y="298" font-weight="bold" fill="#2a7f8f">6. Live</text>
    <text x="605" y="326" font-size="16" fill="#333">a minute or two later</text>
  </g>
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="232" y1="105" x2="273" y2="105"/><line x1="482" y1="105" x2="523" y2="105"/><line x1="732" y1="105" x2="773" y2="105"/>
    <line x1="875" y1="155" x2="875" y2="253"/><line x1="775" y1="305" x2="737" y2="305"/>
  </g>
  <path d="M630,155 C 600,210 420,210 395,155" stroke="#a8324a" stroke-width="2.5" fill="none" stroke-dasharray="7,5" marker-end="url(#ar)"/>
  <text x="510" y="225" font-size="16" fill="#a8324a" text-anchor="middle">not right? fix and render again</text>
  <text x="60" y="300" font-size="17" fill="#333">One prompt does it all:</text>
  <text x="60" y="328" font-size="17" fill="#333" font-style="italic">"Render the site, show me</text>
  <text x="60" y="352" font-size="17" fill="#333" font-style="italic">what changed, then commit</text>
  <text x="60" y="376" font-size="17" fill="#333" font-style="italic">and push."</text>
</svg>
