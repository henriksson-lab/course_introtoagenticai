<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#fff"/>
  <rect x="20" y="70" width="270" height="220" rx="12" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <text x="155" y="105" font-size="19" font-weight="bold" fill="#2a7f8f" text-anchor="middle">your computer</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#333">
    <text x="45" y="145">*.qmd, _quarto.yml</text>
    <text x="45" y="180">docs/   (rendered)</text>
  </g>
  <text x="155" y="235" font-size="16" fill="#555" text-anchor="middle">render, commit</text>
  <line x1="295" y1="180" x2="365" y2="180" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <text x="330" y="165" font-size="17" fill="#555" text-anchor="middle">push</text>
  <rect x="370" y="70" width="270" height="220" rx="12" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <text x="505" y="105" font-size="19" font-weight="bold" fill="#6b4fa0" text-anchor="middle">GitHub repository</text>
  <g font-family="Menlo, Consolas, monospace" font-size="16" fill="#333">
    <text x="395" y="145">branch: main</text>
    <text x="395" y="180" font-weight="bold" fill="#a8324a">folder: /docs</text>
  </g>
  <text x="505" y="235" font-size="16" fill="#555" text-anchor="middle">Settings → Pages:</text>
  <text x="505" y="258" font-size="16" fill="#555" text-anchor="middle">deploy from main, /docs</text>
  <line x1="645" y1="180" x2="715" y2="180" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <text x="680" y="165" font-size="17" fill="#555" text-anchor="middle">Pages</text>
  <rect x="720" y="70" width="260" height="220" rx="12" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
  <text x="850" y="105" font-size="19" font-weight="bold" fill="#8a6a12" text-anchor="middle">the web</text>
  <text x="850" y="150" font-size="16" fill="#333" text-anchor="middle">https://</text>
  <text x="850" y="175" font-size="16" fill="#333" text-anchor="middle">your-username.github.io</text>
  <text x="850" y="200" font-size="16" fill="#333" text-anchor="middle">/repository-name/</text>
  <text x="850" y="250" font-size="16" fill="#555" text-anchor="middle">anyone, no login</text>
  <text x="500" y="350" font-size="18" fill="#333" text-anchor="middle">After each push to main, GitHub serves the new docs/ within a minute or two.</text>
</svg>
