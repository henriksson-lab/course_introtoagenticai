<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>
  <g font-size="17" text-anchor="middle">
    <rect x="20" y="90" width="170" height="100" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="105" y="130" font-weight="bold" fill="#8a6a12">data</text>
    <text x="105" y="158" fill="#333" font-size="15">growth.csv</text>
    <rect x="225" y="90" width="170" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="310" y="130" font-weight="bold" fill="#2a7f8f">script</text>
    <text x="310" y="158" fill="#333" font-size="15">plot_growth.py</text>
    <rect x="430" y="90" width="170" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="515" y="130" font-weight="bold" fill="#2a7f8f">figure</text>
    <text x="515" y="158" fill="#333" font-size="15">growth_plot.png</text>
    <rect x="635" y="90" width="170" height="100" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="720" y="130" font-weight="bold" fill="#6b4fa0">page</text>
    <text x="720" y="158" fill="#333" font-size="15">results.qmd</text>
    <rect x="840" y="90" width="140" height="100" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="910" y="130" font-weight="bold" fill="#6b4fa0">web</text>
    <text x="910" y="158" fill="#333" font-size="15">live site</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="192" y1="140" x2="218" y2="140"/><line x1="397" y1="140" x2="423" y2="140"/><line x1="602" y1="140" x2="628" y2="140"/><line x1="807" y1="140" x2="833" y2="140"/>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle">
    <text x="310" y="72">Reproducible figures</text>
    <text x="720" y="72">this unit</text>
  </g>
  <path d="M105,195 C 105,300 900,300 910,197" fill="none" stroke="#2a7f8f" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#ar)"/>
  <text x="500" y="320" font-size="18" fill="#2a7f8f" text-anchor="middle" font-weight="bold">New data? Rerun the script, render, push. Every step is a file in git.</text>
  <text x="500" y="365" font-size="17" fill="#333" text-anchor="middle">The caption says which script made the figure, so a reader can trace it back.</text>
</svg>
