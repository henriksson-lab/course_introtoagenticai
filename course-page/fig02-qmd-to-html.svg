<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>
  <text x="170" y="40" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">You (and the agent) write</text>
  <rect x="30" y="60" width="280" height="300" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#333">
    <text x="50" y="100">_quarto.yml</text>
    <text x="50" y="140">index.qmd</text>
    <text x="50" y="175">results.qmd</text>
    <text x="50" y="210">slides.qmd</text>
    <text x="50" y="245">about.qmd</text>
    <text x="50" y="285">figures/</text>
  </g>
  <text x="170" y="340" font-size="15" fill="#555" text-anchor="middle">plain text: Markdown + settings</text>
  <rect x="390" y="165" width="220" height="80" rx="40" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="500" y="200" font-size="19" font-weight="bold" fill="#8a6a12" text-anchor="middle">quarto render</text>
  <text x="500" y="225" font-size="15" fill="#333" text-anchor="middle">a few seconds</text>
  <line x1="315" y1="205" x2="383" y2="205" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="615" y1="205" x2="683" y2="205" stroke="#555" stroke-width="3" marker-end="url(#ar)"/>
  <text x="830" y="40" font-size="20" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Quarto produces</text>
  <rect x="690" y="60" width="280" height="300" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" fill="#333">
    <text x="710" y="100" font-weight="bold">docs/</text>
    <text x="730" y="140">index.html</text>
    <text x="730" y="175">results.html</text>
    <text x="730" y="210">slides.html</text>
    <text x="730" y="245">about.html</text>
    <text x="730" y="285">site_libs/ ...</text>
  </g>
  <text x="830" y="340" font-size="15" fill="#555" text-anchor="middle">a finished website, ready to serve</text>
  <text x="500" y="400" font-size="18" fill="#333" text-anchor="middle">Edit the text on the left; never edit docs/ by hand. Render again instead.</text>
</svg>
