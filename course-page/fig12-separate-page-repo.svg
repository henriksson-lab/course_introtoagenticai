<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="420" fill="#fff"/>
  <rect x="20" y="50" width="330" height="270" rx="14" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="185" y="88" font-size="20" font-weight="bold" fill="#2a7f8f" text-anchor="middle">project repository</text>
  <text x="185" y="114" font-size="16" fill="#2a7f8f" text-anchor="middle">PRIVATE</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#333">
    <text x="45" y="150">data/raw/   (internal)</text>
    <text x="45" y="176">notes/      (plans, names)</text>
    <text x="45" y="202">scripts/</text>
    <text x="45" y="228" font-weight="bold" fill="#6b4fa0">results/fig1.png</text>
    <text x="45" y="254" font-weight="bold" fill="#6b4fa0">results/fig2.png</text>
    <text x="45" y="280">history with everything</text>
  </g>
  <rect x="430" y="50" width="300" height="270" rx="14" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="580" y="88" font-size="20" font-weight="bold" fill="#8a6a12" text-anchor="middle">page repository</text>
  <text x="580" y="114" font-size="16" fill="#8a6a12" text-anchor="middle">PUBLIC</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15" fill="#333">
    <text x="455" y="150">_quarto.yml</text>
    <text x="455" y="176">index.qmd, about.qmd</text>
    <text x="455" y="202" font-weight="bold" fill="#6b4fa0">figures/fig1.png</text>
    <text x="455" y="228" font-weight="bold" fill="#6b4fa0">figures/fig2.png</text>
    <text x="455" y="254">docs/</text>
    <text x="455" y="280">only what you chose</text>
  </g>
  <rect x="800" y="120" width="180" height="130" rx="14" fill="#fff" stroke="#8a6a12" stroke-width="2"/>
  <text x="890" y="165" font-size="18" font-weight="bold" fill="#8a6a12" text-anchor="middle">site</text>
  <text x="890" y="195" font-size="14" fill="#333" text-anchor="middle">your-username</text>
  <text x="890" y="215" font-size="14" fill="#333" text-anchor="middle">.github.io/...</text>
  <g stroke="#6b4fa0" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="352" y1="228" x2="423" y2="205"/>
  </g>
  <line x1="733" y1="185" x2="793" y2="185" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="390" y="355" font-size="17" fill="#6b4fa0" text-anchor="middle">copy chosen figures, and say which commit they came from</text>
  <text x="500" y="395" font-size="18" fill="#333" text-anchor="middle">The project stays private. Only what you copy across becomes public.</text>
