<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <text x="30" y="35" font-size="19" fill="#333" font-family="Menlo, Consolas, monospace">plant-biomass.csv   (48 rows)</text>
  <g font-size="17" font-family="Menlo, Consolas, monospace">
    <rect x="30" y="50" width="940" height="38" fill="#2a7f8f"/>
    <g fill="#fff" font-weight="bold">
      <text x="42" y="75">plant_id</text><text x="160" y="75">batch</text><text x="245" y="75">block</text><text x="330" y="75">fertiliser</text><text x="470" y="75">watering</text><text x="650" y="75">biomass_mg</text><text x="790" y="75">comment</text>
    </g>
    <g fill="#333">
      <rect x="30" y="88" width="940" height="36" fill="#f4f4f4"/>
      <text x="42" y="112">B1-33</text><text x="160" y="112">1</text><text x="245" y="112">1</text><text x="330" y="112">low</text><text x="470" y="112">drought</text><text x="650" y="112">106.1</text>
      <text x="42" y="148">B1-09</text><text x="160" y="148">1</text><text x="245" y="148">1</text><text x="330" y="148">low</text><text x="470" y="148">well-watered</text><text x="650" y="148">176.6</text>
      <rect x="30" y="160" width="940" height="36" fill="#f4f4f4"/>
      <text x="42" y="184">B1-26</text><text x="160" y="184">1</text><text x="245" y="184">1</text><text x="330" y="184">none</text><text x="470" y="184">drought</text><text x="650" y="184">80.9</text>
      <text x="42" y="220">B1-42</text><text x="160" y="220">1</text><text x="245" y="220">1</text><text x="330" y="220">high</text><text x="470" y="220">drought</text><text x="650" y="220">128.4</text>
      <rect x="30" y="232" width="940" height="36" fill="#f4f4f4"/>
      <text x="42" y="256">...</text>
      <rect x="30" y="268" width="940" height="36" fill="#f8e9ec"/>
      <text x="42" y="292">B1-44</text><text x="160" y="292">1</text><text x="245" y="292">2</text><text x="330" y="292">high</text><text x="470" y="292">drought</text><text x="650" y="292" fill="#a8324a"></text><text x="790" y="292" fill="#a8324a">died in week 2</text>
    </g>
  </g>
  <g font-size="18" fill="#555">
    <text x="30" y="345">2 factors: <tspan fill="#2a7f8f" font-weight="bold">fertiliser</tspan> (none, low, high) × <tspan fill="#2a7f8f" font-weight="bold">watering</tspan> (well-watered, drought)</text>
    <text x="30" y="377">8 plants per combination, 4 blocks; one plant died, so one empty biomass value</text>
    <text x="30" y="409">One row per plant, one column per variable, units in the column name</text>
  </g>
  <text x="975" y="432" font-size="14" fill="#999" text-anchor="end">synthetic data</text>
</svg>
