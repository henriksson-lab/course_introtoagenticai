<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <!-- left: bar with error bar -->
  <text x="160" y="35" font-size="20" font-weight="bold" fill="#a8324a" text-anchor="middle">Bar ± error</text>
  <line x1="60" y1="340" x2="270" y2="340" stroke="#333" stroke-width="2"/><line x1="60" y1="60" x2="60" y2="340" stroke="#333" stroke-width="2"/>
  <rect x="120" y="180" width="80" height="160" fill="#bbb"/>
  <line x1="160" y1="140" x2="160" y2="220" stroke="#333" stroke-width="2"/><line x1="145" y1="140" x2="175" y2="140" stroke="#333" stroke-width="2"/><line x1="145" y1="220" x2="175" y2="220" stroke="#333" stroke-width="2"/>
  <text x="160" y="375" font-size="17" fill="#555" text-anchor="middle">mean 100, SD 30</text>
  <text x="330" y="200" font-size="34" fill="#555" text-anchor="middle">=</text>
  <!-- three distributions -->
  <g font-size="17" fill="#333" text-anchor="middle">
    <text x="670" y="35" font-weight="bold" fill="#2a7f8f" font-size="20">Three data sets with that same bar</text>
    <line x1="400" y1="340" x2="960" y2="340" stroke="#333" stroke-width="2"/>
    <text x="490" y="375">spread out</text><text x="680" y="375">two clusters</text><text x="870" y="375">one outlier</text>
  </g>
  <g fill="#2a7f8f">
    <circle cx="480" cy="120" r="6"/><circle cx="495" cy="140" r="6"/><circle cx="485" cy="160" r="6"/><circle cx="500" cy="175" r="6"/><circle cx="478" cy="190" r="6"/><circle cx="492" cy="205" r="6"/><circle cx="483" cy="222" r="6"/><circle cx="498" cy="240" r="6"/>
    <circle cx="670" cy="135" r="6"/><circle cx="685" cy="140" r="6"/><circle cx="675" cy="148" r="6"/><circle cx="690" cy="132" r="6"/><circle cx="672" cy="230" r="6"/><circle cx="688" cy="225" r="6"/><circle cx="678" cy="237" r="6"/><circle cx="692" cy="228" r="6"/>
    <circle cx="860" cy="200" r="6"/><circle cx="875" cy="195" r="6"/><circle cx="865" cy="205" r="6"/><circle cx="880" cy="198" r="6"/><circle cx="868" cy="210" r="6"/><circle cx="878" cy="203" r="6"/><circle cx="862" cy="192" r="6"/><circle cx="872" cy="75" r="6" fill="#a8324a"/>
  </g>
  <text x="500" y="410" font-size="18" fill="#333" text-anchor="middle">With n = 8 per group, show the points. Ask for them.</text>
</svg>
