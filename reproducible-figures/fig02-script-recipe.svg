<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="400" fill="#fff"/>
  <g text-anchor="middle">
    <rect x="30" y="120" width="200" height="130" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="130" y="160" font-size="20" font-weight="bold" fill="#2a7f8f">data</text>
    <text x="130" y="192" font-size="16" fill="#333" font-family="Menlo, Consolas, monospace">plant-biomass</text>
    <text x="130" y="214" font-size="16" fill="#333" font-family="Menlo, Consolas, monospace">.csv</text>
    <rect x="320" y="90" width="300" height="190" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="470" y="130" font-size="20" font-weight="bold" fill="#6b4fa0">script</text>
    <text x="470" y="160" font-size="16" fill="#333" font-family="Menlo, Consolas, monospace">plot_biomass.R</text>
    <g font-size="16" fill="#555" text-anchor="start">
      <text x="345" y="195">1. read the CSV</text>
      <text x="345" y="220">2. drop the dead plant, say so</text>
      <text x="345" y="245">3. plot points, mean, n</text>
      <text x="345" y="270">4. save at 85 mm</text>
    </g>
    <rect x="710" y="60" width="260" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="840" y="102" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">figure.pdf</text>
    <rect x="710" y="150" width="260" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="840" y="192" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">figure.svg</text>
    <rect x="710" y="240" width="260" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="840" y="282" font-size="18" fill="#333" font-family="Menlo, Consolas, monospace">figure.png</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="235" y1="185" x2="313" y2="185"/>
    <line x1="625" y1="160" x2="703" y2="100"/><line x1="625" y1="185" x2="703" y2="185"/><line x1="625" y1="210" x2="703" y2="270"/>
  </g>
  <text x="500" y="345" font-size="19" fill="#333" text-anchor="middle">Run it again next year, on new data, on another computer: the same steps, every time.</text>
  <text x="500" y="378" font-size="17" fill="#777" text-anchor="middle">The script is also the record of every choice behind the figure.</text>
</svg>
