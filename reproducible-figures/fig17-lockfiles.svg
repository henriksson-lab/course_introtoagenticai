<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <text x="250" y="35" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">R: renv</text>
  <text x="750" y="35" font-size="21" font-weight="bold" fill="#6b4fa0" text-anchor="middle">Python: requirements.txt</text>
  <rect x="30" y="55" width="440" height="230" rx="8" fill="#fafafa" stroke="#2a7f8f" stroke-width="2"/>
  <g font-size="16" font-family="Menlo, Consolas, monospace" fill="#333" xml:space="preserve">
    <text x="45" y="85" fill="#777">renv.lock (excerpt)</text>
    <text x="45" y="115">"R": { "Version": "4.5.1" },</text>
    <text x="45" y="140">"Packages": {</text>
    <text x="45" y="165">  "ggplot2": {</text>
    <text x="45" y="190">    "Version": "4.0.0",</text>
    <text x="45" y="215">    "Source": "Repository" },</text>
    <text x="45" y="240">  "scales": { "Version": "1.4.0" },</text>
    <text x="45" y="265">  ... about 30 more</text>
  </g>
  <rect x="530" y="55" width="440" height="230" rx="8" fill="#fafafa" stroke="#6b4fa0" stroke-width="2"/>
  <g font-size="16" font-family="Menlo, Consolas, monospace" fill="#333" xml:space="preserve">
    <text x="545" y="85" fill="#777">requirements.txt</text>
    <text x="545" y="115">matplotlib==3.10.1</text>
    <text x="545" y="140">numpy==2.2.4</text>
    <text x="545" y="165">pandas==2.2.3</text>
    <text x="545" y="205" fill="#777"># plus a line in the README:</text>
    <text x="545" y="230" fill="#777"># made with Python 3.12</text>
  </g>
  <g font-size="17" fill="#333">
    <text x="45" y="320" font-weight="bold">Record:</text><text x="140" y="320">"Set up renv and snapshot the packages."</text>
    <text x="45" y="350" font-weight="bold">Restore:</text><text x="140" y="350">renv::restore() installs the same versions</text>
    <text x="545" y="320" font-weight="bold">Record:</text><text x="640" y="320">"Pin the exact versions."</text>
    <text x="545" y="350" font-weight="bold">Restore:</text><text x="640" y="350">pip install -r requirements.txt</text>
  </g>
  <text x="500" y="410" font-size="18" fill="#555" text-anchor="middle">Both are small text files: commit them next to the script.</text>
  <text x="975" y="442" font-size="14" fill="#999" text-anchor="end">illustrative version numbers</text>
</svg>
