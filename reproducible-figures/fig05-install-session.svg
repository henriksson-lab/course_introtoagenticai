<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#fff"/>
  <rect x="20" y="15" width="960" height="455" rx="10" fill="#1f2430"/>
  <circle cx="45" cy="37" r="7" fill="#a8324a"/><circle cx="68" cy="37" r="7" fill="#8a6a12"/><circle cx="91" cy="37" r="7" fill="#2a7f8f"/>
  <text x="500" y="43" font-size="16" fill="#aab" text-anchor="middle">terminal: reproducible-figures</text>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="45" y="82" fill="#8fd3df">&gt; Check whether R and the ggplot2 package are installed.</text>
    <text x="45" y="106" fill="#8fd3df">  If not, tell me how you would install them. Do not install yet.</text>
    <text x="45" y="144" fill="#9a9aa8">• R --version            →  R version 4.5.x</text>
    <text x="45" y="170" fill="#9a9aa8">• Rscript -e 'library(ggplot2)'  →  there is no package called 'ggplot2'</text>
    <text x="45" y="206" fill="#e8e8e8">R is installed. ggplot2 is missing. I suggest installing it</text>
    <text x="45" y="230" fill="#e8e8e8">from CRAN into your personal R library (no administrator rights</text>
    <text x="45" y="254" fill="#e8e8e8">needed). It downloads about 20 packages and takes a few minutes.</text>
  </g>
  <rect x="40" y="280" width="920" height="125" rx="6" fill="none" stroke="#e0b84a" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="17" xml:space="preserve">
    <text x="60" y="310" fill="#e0b84a">Run this command?</text>
    <text x="60" y="338" fill="#e8e8e8">  Rscript -e 'install.packages("ggplot2",</text>
    <text x="60" y="362" fill="#e8e8e8">             repos = "https://cloud.r-project.org")'</text>
    <text x="60" y="392" fill="#8fd3df">  1. Yes      2. Yes, and don't ask again      3. No</text>
  </g>
  <text x="45" y="445" font-size="17" fill="#9a9aa8">Network access: the download comes from CRAN, the official R package archive.</text>
  <text x="975" y="492" font-size="14" fill="#999" text-anchor="end">illustrative; wording differs between tools and versions</text>
</svg>
