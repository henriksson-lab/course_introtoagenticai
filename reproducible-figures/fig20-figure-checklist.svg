<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#fff"/>
  <rect x="170" y="20" width="660" height="440" rx="14" fill="#fffbe9" stroke="#8a6a12" stroke-width="2"/>
  <text x="500" y="62" font-size="24" font-weight="bold" fill="#8a6a12" text-anchor="middle">Before a figure leaves your desk</text>
  <g font-size="19" fill="#333">
    <rect x="205" y="88" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="107">Rows in = rows plotted + rows left out (with reasons)</text>
    <rect x="205" y="138" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="157">n per group matches the design</text>
    <rect x="205" y="188" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="207">One group's mean checked by hand</text>
    <rect x="205" y="238" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="257">Axis labels and units correct</text>
    <rect x="205" y="288" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="307">Error bars say what they are (SD? SE? CI?)</text>
    <rect x="205" y="338" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="357">Readable at final size; colours work in grey</text>
    <rect x="205" y="388" width="24" height="24" rx="4" fill="none" stroke="#2a7f8f" stroke-width="2.5"/><text x="245" y="407">Script, figure, versions committed together</text>
  </g>
  <text x="500" y="445" font-size="16" fill="#777" text-anchor="middle">Redo the first three after every rerun on new data.</text>
</svg>
