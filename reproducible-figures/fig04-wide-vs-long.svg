<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="420" fill="#fff"/>
  <text x="225" y="35" font-size="21" font-weight="bold" fill="#a8324a" text-anchor="middle">Wide: easy to type, hard to plot</text>
  <g font-size="16" font-family="Menlo, Consolas, monospace" fill="#333">
    <rect x="20" y="55" width="420" height="34" fill="#f8e9ec"/>
    <text x="30" y="78" font-weight="bold">date</text><text x="150" y="78" font-weight="bold">temp_1m</text><text x="250" y="78" font-weight="bold">temp_5m</text><text x="350" y="78" font-weight="bold">temp_15m</text>
    <text x="30" y="113">2024-01-01</text><text x="150" y="113">2.9</text><text x="250" y="113">4.2</text><text x="350" y="113">4.3</text>
    <text x="30" y="143">2024-01-02</text><text x="150" y="143">3.0</text><text x="250" y="143">4.1</text><text x="350" y="143">4.4</text>
    <text x="30" y="173">...</text>
  </g>
  <text x="225" y="225" font-size="17" fill="#555" text-anchor="middle">the depth hides in the column names</text>
  <line x1="460" y1="130" x2="530" y2="130" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="770" y="35" font-size="21" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Long (tidy): one row per value</text>
  <g font-size="16" font-family="Menlo, Consolas, monospace" fill="#333">
    <rect x="560" y="55" width="420" height="34" fill="#e3f0f2"/>
    <text x="570" y="78" font-weight="bold">date</text><text x="710" y="78" font-weight="bold">depth_m</text><text x="840" y="78" font-weight="bold">temp_c</text>
    <text x="570" y="113">2024-01-01</text><text x="710" y="113">1</text><text x="840" y="113">2.9</text>
    <text x="570" y="143">2024-01-01</text><text x="710" y="143">5</text><text x="840" y="143">4.2</text>
    <text x="570" y="173">2024-01-01</text><text x="710" y="173">15</text><text x="840" y="173">4.3</text>
    <text x="570" y="203">2024-01-02</text><text x="710" y="203">1</text><text x="840" y="203">3.0</text>
    <text x="570" y="233">...</text>
  </g>
  <text x="770" y="275" font-size="17" fill="#555" text-anchor="middle">depth is a column: colour by it, facet by it</text>
  <text x="500" y="345" font-size="19" fill="#333" text-anchor="middle">You do not have to reshape it yourself. Say what the columns mean;</text>
  <text x="500" y="375" font-size="19" fill="#333" text-anchor="middle">the agent reshapes inside the script and leaves the raw file untouched.</text>
</svg>
