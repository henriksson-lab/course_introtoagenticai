<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="1000" height="420" fill="#fff"/>
  <line x1="40" y1="200" x2="960" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/>
  <g font-size="17" text-anchor="middle">
    <circle cx="160" cy="200" r="11" fill="#2a7f8f"/>
    <text x="160" y="170" font-weight="bold" fill="#2a7f8f">2026: you</text>
    <text x="160" y="240" fill="#333">R 4.5, ggplot2 4.0</text>
    <text x="160" y="268" fill="#333">figure looks right</text>
    <circle cx="500" cy="200" r="11" fill="#8a6a12"/>
    <text x="500" y="170" font-weight="bold" fill="#8a6a12">2027: a new laptop</text>
    <text x="500" y="240" fill="#333">newer versions installed</text>
    <text x="500" y="268" fill="#333">default colours changed,</text>
    <text x="500" y="292" fill="#333">a function was renamed</text>
    <circle cx="840" cy="200" r="11" fill="#a8324a"/>
    <text x="840" y="170" font-weight="bold" fill="#a8324a">2029: a new student</text>
    <text x="840" y="240" fill="#333">script stops with an error,</text>
    <text x="840" y="268" fill="#333">or worse: runs and gives</text>
    <text x="840" y="292" fill="#333">a slightly different figure</text>
  </g>
  <text x="500" y="60" font-size="20" fill="#333" text-anchor="middle">The script is the same. The software under it is not.</text>
  <text x="500" y="370" font-size="19" fill="#333" text-anchor="middle">Write down which versions made the figure, in a file next to the script.</text>
</svg>
