project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    - "!tools/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!contentplan.md"
    - "!designprinciples.md"
    - "!*/data/"

website:
