<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="460" fill="#fff"/>
  <g font-size="18" text-anchor="middle">
    <rect x="20" y="190" width="150" height="70" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="95" y="222" fill="#8a6a12" font-weight="bold">same prompt,</text><text x="95" y="245" fill="#8a6a12" font-weight="bold">same data</text>

    <rect x="230" y="95" width="150" height="70" rx="10" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/>
    <text x="305" y="125" fill="#6b4fa0" font-weight="bold">Claude Code</text><text x="305" y="150" font-size="16" fill="#333">result A</text>
    <rect x="230" y="285" width="150" height="70" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="305" y="315" fill="#2a7f8f" font-weight="bold">Codex</text><text x="305" y="340" font-size="16" fill="#333">result B</text>

    <rect x="440" y="170" width="170" height="110" rx="10" fill="#f6f6f6" stroke="#555" stroke-width="2"/>
    <text x="525" y="205" fill="#333" font-weight="bold">compare</text>
    <text x="525" y="232" font-size="16" fill="#333">cell by cell:</text>
    <text x="525" y="256" font-size="16" fill="#333">where do they differ?</text>

    <rect x="680" y="60" width="300" height="100" rx="10" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="830" y="92" fill="#2a7f8f" font-weight="bold">they agree</text>
    <text x="830" y="118" font-size="16" fill="#333">fewer places to look,</text>
    <text x="830" y="140" font-size="16" fill="#333">but still spot-check</text>

    <rect x="680" y="200" width="300" height="80" rx="10" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="830" y="232" fill="#a8324a" font-weight="bold">one is wrong</text>
    <text x="830" y="258" font-size="16" fill="#333">find out which, fix it</text>

    <rect x="680" y="320" width="300" height="100" rx="10" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/>
    <text x="830" y="352" fill="#8a6a12" font-weight="bold">both are defensible</text>
    <text x="830" y="378" font-size="16" fill="#333">a choice only you can make:</text>
    <text x="830" y="400" font-size="16" fill="#333">write it into the prompt</text>
  </g>
  <g stroke="#555" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="170" y1="210" x2="223" y2="150"/>
    <line x1="170" y1="242" x2="223" y2="300"/>
    <line x1="380" y1="135" x2="433" y2="190"/>
    <line x1="380" y1="318" x2="433" y2="262"/>
    <line x1="610" y1="195" x2="673" y2="125"/>
    <line x1="610" y1="230" x2="673" y2="238"/>
    <line x1="610" y1="262" x2="673" y2="350"/>
  </g>
</svg>
