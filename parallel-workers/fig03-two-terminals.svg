  <rect x="510" y="15" width="475" height="410" rx="10" fill="#1f2430"/>
  <circle cx="533" cy="37" r="7" fill="#a8324a"/><circle cx="555" cy="37" r="7" fill="#8a6a12"/><circle cx="577" cy="37" r="7" fill="#2a7f8f"/>
