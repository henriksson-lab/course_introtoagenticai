<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="470" fill="#fff"/>
  <!-- panel frames -->
  <g fill="none" stroke="#ccc" stroke-width="1.5">
    <rect x="15" y="15" width="310" height="440" rx="12"/>
    <rect x="345" y="15" width="310" height="440" rx="12"/>
    <rect x="675" y="15" width="310" height="440" rx="12"/>
  </g>
  <g font-size="21" font-weight="bold" text-anchor="middle">
    <text x="170" y="52" fill="#2a7f8f">1. Side by side</text>
    <text x="500" y="52" fill="#6b4fa0">2. Same task twice</text>
    <text x="830" y="52" fill="#a8324a">3. One checks the other</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#555">
    <text x="170" y="80">different jobs, different folders</text>
    <text x="500" y="80">compare the two results</text>
    <text x="830" y="80">a second opinion</text>
  </g>

  <!-- panel 1 -->
  <g font-size="18" text-anchor="middle">
    <circle cx="95" cy="150" r="38" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/><text x="95" y="156" fill="#6b4fa0">Claude</text>
    <circle cx="245" cy="150" r="38" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="245" y="156" fill="#2a7f8f">Codex</text>
    <rect x="40" y="270" width="110" height="80" rx="8" fill="#f6f6f6" stroke="#888"/>
    <text x="95" y="305" fill="#333">analysis/</text><text x="95" y="330" font-size="15" fill="#777">figure</text>
    <rect x="190" y="270" width="110" height="80" rx="8" fill="#f6f6f6" stroke="#888"/>
    <text x="245" y="305" fill="#333">docs/</text><text x="245" y="330" font-size="15" fill="#777">README</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="95" y1="190" x2="95" y2="262"/>
    <line x1="245" y1="190" x2="245" y2="262"/>
  </g>
  <text x="170" y="410" font-size="17" text-anchor="middle" fill="#333">gain: time</text>

  <!-- panel 2 -->
  <g font-size="18" text-anchor="middle">
    <rect x="440" y="110" width="120" height="44" rx="8" fill="#f6f1e3" stroke="#8a6a12" stroke-width="2"/><text x="500" y="138" fill="#8a6a12">one prompt</text>
    <circle cx="420" cy="225" r="38" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/><text x="420" y="231" fill="#6b4fa0">Claude</text>
    <circle cx="580" cy="225" r="38" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="580" y="231" fill="#2a7f8f">Codex</text>
    <rect x="375" y="295" width="90" height="56" rx="6" fill="#f6f6f6" stroke="#888"/><text x="420" y="329" fill="#333">result A</text>
    <rect x="535" y="295" width="90" height="56" rx="6" fill="#f6f6f6" stroke="#888"/><text x="580" y="329" fill="#333">result B</text>
    <text x="500" y="329" font-size="26" fill="#a8324a">≠ ?</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="470" y1="158" x2="440" y2="185"/>
    <line x1="530" y1="158" x2="560" y2="185"/>
    <line x1="420" y1="265" x2="420" y2="288"/>
    <line x1="580" y1="265" x2="580" y2="288"/>
  </g>
  <text x="500" y="410" font-size="17" text-anchor="middle" fill="#333">gain: differences show</text>
  <text x="500" y="432" font-size="17" text-anchor="middle" fill="#333">where to look</text>

  <!-- panel 3 -->
  <g font-size="18" text-anchor="middle">
    <circle cx="760" cy="150" r="38" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="760" y="156" fill="#2a7f8f">Codex</text>
    <rect x="715" y="270" width="90" height="70" rx="6" fill="#f6f6f6" stroke="#888"/><text x="760" y="302" fill="#333">script</text><text x="760" y="324" font-size="15" fill="#777">+ result</text>
    <circle cx="910" cy="305" r="38" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/><text x="910" y="311" fill="#6b4fa0">Claude</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="760" y1="190" x2="760" y2="262"/>
  </g>
  <line x1="868" y1="305" x2="813" y2="305" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="840" y="250" font-size="16" fill="#a8324a" text-anchor="middle">reads,</text>
  <text x="840" y="270" font-size="16" fill="#a8324a" text-anchor="middle">does not edit</text>
  <text x="830" y="410" font-size="17" text-anchor="middle" fill="#333">gain: a list of things</text>
  <text x="830" y="432" font-size="17" text-anchor="middle" fill="#333">to check</text>
</svg>
