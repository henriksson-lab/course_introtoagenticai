<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker>
  </defs>
  <rect width="1000" height="450" fill="#fff"/>
  <!-- left: bad -->
  <text x="240" y="40" font-size="22" font-weight="bold" fill="#a8324a" text-anchor="middle">One file, two agents</text>
  <g font-size="18" text-anchor="middle">
    <circle cx="110" cy="115" r="40" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/><text x="110" y="121" fill="#6b4fa0">Claude</text>
    <circle cx="370" cy="115" r="40" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="370" y="121" fill="#2a7f8f">Codex</text>
    <rect x="170" y="215" width="140" height="90" rx="8" fill="#f8e9ec" stroke="#a8324a" stroke-width="2"/>
    <text x="240" y="252" fill="#333">clean.R</text>
    <text x="240" y="280" font-size="15" fill="#a8324a">edited twice</text>
  </g>
  <g stroke="#a8324a" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="135" y1="150" x2="200" y2="208"/>
    <line x1="345" y1="150" x2="280" y2="208"/>
  </g>
  <g font-size="17" fill="#333">
    <text x="40" y="350">• one agent's change silently overwrites</text>
    <text x="40" y="374">  the other's</text>
    <text x="40" y="402">• each agent's picture of the file is out of date</text>
    <text x="40" y="430">• you cannot tell who did what</text>
  </g>
  <line x1="500" y1="30" x2="500" y2="430" stroke="#ccc" stroke-width="2"/>
  <!-- right: good -->
  <text x="760" y="40" font-size="22" font-weight="bold" fill="#2a7f8f" text-anchor="middle">Separate places</text>
  <g font-size="18" text-anchor="middle">
    <circle cx="630" cy="115" r="40" fill="#f1edf7" stroke="#6b4fa0" stroke-width="2"/><text x="630" y="121" fill="#6b4fa0">Claude</text>
    <circle cx="890" cy="115" r="40" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/><text x="890" y="121" fill="#2a7f8f">Codex</text>
    <rect x="560" y="215" width="140" height="90" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="630" y="252" fill="#333">claude/</text><text x="630" y="280" font-size="15" fill="#555">clean.R</text>
    <rect x="820" y="215" width="140" height="90" rx="8" fill="#e3f0f2" stroke="#2a7f8f" stroke-width="2"/>
    <text x="890" y="252" fill="#333">codex/</text><text x="890" y="280" font-size="15" fill="#555">clean.R</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="630" y1="158" x2="630" y2="207"/>
    <line x1="890" y1="158" x2="890" y2="207"/>
  </g>
  <g font-size="17" fill="#333">
    <text x="540" y="350">• each agent owns its folder</text>
    <text x="540" y="378">• or: different files that never overlap</text>
    <text x="540" y="406">• you bring the results together, later,</text>
    <text x="540" y="430">  with one agent</text>
  </g>
</svg>
