<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="450" fill="#fff"/>
  <text x="30" y="40" font-size="21" font-weight="bold" fill="#333">"&lt;5" means: somewhere between 0 and 5 µg/L. What number goes into the mean?</text>
  <!-- number line -->
  <line x1="80" y1="130" x2="560" y2="130" stroke="#555" stroke-width="2"/>
  <g font-size="17" fill="#555" text-anchor="middle">
    <line x1="80" y1="122" x2="80" y2="138" stroke="#555" stroke-width="2"/><text x="80" y="162">0</text>
    <line x1="200" y1="122" x2="200" y2="138" stroke="#555" stroke-width="2"/><text x="200" y="162">2.5</text>
    <line x1="320" y1="122" x2="320" y2="138" stroke="#555" stroke-width="2"/><text x="320" y="162">5</text>
    <line x1="440" y1="122" x2="440" y2="138" stroke="#555" stroke-width="2"/><text x="440" y="162">7.5</text>
    <text x="560" y="162">µg/L</text>
  </g>
  <rect x="80" y="100" width="240" height="22" fill="#fbe9d6" stroke="#b05a10"/>
  <text x="200" y="92" font-size="16" fill="#b05a10" text-anchor="middle">the true value is in here, unknown</text>
  <line x1="320" y1="70" x2="320" y2="190" stroke="#a8324a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="330" y="190" font-size="16" fill="#a8324a">detection limit</text>

  <!-- options table -->
  <g font-size="18">
    <text x="30" y="245" font-weight="bold" fill="#333">Choice for "&lt;5"</text>
    <text x="420" y="245" font-weight="bold" fill="#333">Tallträsk 2023, mean tot_p</text>
    <line x1="30" y1="257" x2="970" y2="257" stroke="#bbb"/>
    <text x="30" y="290" fill="#333">0 (assume none)</text>
    <text x="30" y="328" fill="#333">2.5 (half the limit, a common convention)</text>
    <text x="30" y="366" fill="#333">5 (the limit itself)</text>
    <text x="30" y="404" fill="#333">leave out the value (treat as missing)</text>
  </g>
  <g font-size="18" fill="#fff">
    <rect x="420" y="272" width="300" height="26" fill="#8a6a12"/><text x="430" y="291">4.50</text>
    <rect x="420" y="310" width="355" height="26" fill="#8a6a12"/><text x="430" y="329">5.33</text>
    <rect x="420" y="348" width="411" height="26" fill="#8a6a12"/><text x="430" y="367">6.17</text>
    <rect x="420" y="386" width="450" height="26" fill="#8a6a12"/><text x="430" y="405">6.75</text>
  </g>
  <text x="970" y="440" font-size="17" fill="#a8324a" text-anchor="end">All four are used in practice. Your field decides, not the agent.</text>
</svg>
