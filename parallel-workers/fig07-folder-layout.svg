  <g font-size="17">
    <rect x="560" y="68" width="420" height="34" rx="6" fill="#f6f1e3"/>
    <text x="575" y="91" fill="#8a6a12">the original: no agent changes it</text>
    <rect x="560" y="146" width="420" height="34" rx="6" fill="#f1edf7"/>
    <text x="575" y="169" fill="#6b4fa0">a copy; Claude Code starts in claude/</text>
    <rect x="560" y="323" width="420" height="34" rx="6" fill="#e3f0f2"/>
    <text x="575" y="346" fill="#2a7f8f">a copy; Codex starts in codex/</text>
    <rect x="560" y="363" width="420" height="34" rx="6" fill="#f6f6f6"/>
    <text x="575" y="386" fill="#333">written afterwards, by one agent only</text>
  </g>
</svg>
