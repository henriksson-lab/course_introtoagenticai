<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <g font-family="Menlo, Consolas, monospace" font-size="19" fill="#333" xml:space="preserve">
    <text x="40" y="50" font-weight="bold">parallel-workers/</text>
    <text x="40" y="90">├── lakes.csv</text>
    <text x="40" y="130">├── <tspan fill="#6b4fa0" font-weight="bold">claude/</tspan></text>
    <text x="40" y="165">│   ├── lakes.csv</text>
    <text x="40" y="200">│   ├── summarise.py   (or .R)</text>
    <text x="40" y="235">│   ├── lake_summary.csv</text>
    <text x="40" y="270">│   ├── nitrate.png</text>
    <text x="40" y="305">│   └── decisions.md</text>
    <text x="40" y="345">├── <tspan fill="#2a7f8f" font-weight="bold">codex/</tspan>      (the same five files)</text>
