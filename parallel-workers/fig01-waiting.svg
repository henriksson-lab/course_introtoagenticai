<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <!-- time axis -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="30" y="45" font-size="22" font-weight="bold" fill="#333">One agent</text>
  <g font-size="17" text-anchor="middle">
    <rect x="200" y="70" width="40" height="44" fill="#2a7f8f"/>
    <rect x="240" y="70" width="230" height="44" fill="#6b4fa0"/><text x="355" y="98" fill="#fff">clean lake data</text>
    <rect x="470" y="70" width="70" height="44" fill="#8a6a12"/><text x="505" y="98" fill="#fff">check</text>
    <rect x="540" y="70" width="40" height="44" fill="#2a7f8f"/>
    <rect x="580" y="70" width="200" height="44" fill="#6b4fa0"/><text x="680" y="98" fill="#fff">update README</text>
    <rect x="780" y="70" width="70" height="44" fill="#8a6a12"/><text x="815" y="98" fill="#fff">check</text>
  </g>
  <text x="200" y="140" font-size="16" fill="#a8324a">you wait here</text>
  <line x1="245" y1="122" x2="465" y2="122" stroke="#a8324a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="585" y="140" font-size="16" fill="#a8324a">and here</text>
  <line x1="585" y1="122" x2="775" y2="122" stroke="#a8324a" stroke-width="2" stroke-dasharray="5 4"/>

  <text x="30" y="215" font-size="22" font-weight="bold" fill="#333">Two agents</text>
  <text x="30" y="270" font-size="17" fill="#6b4fa0">agent A</text>
  <text x="30" y="330" font-size="17" fill="#2a7f8f">agent B</text>
  <g font-size="17" text-anchor="middle">
    <rect x="200" y="245" width="40" height="44" fill="#2a7f8f"/>
    <rect x="240" y="245" width="230" height="44" fill="#6b4fa0"/><text x="355" y="273" fill="#fff">clean lake data</text>
    <rect x="490" y="245" width="70" height="44" fill="#8a6a12"/><text x="525" y="273" fill="#fff">check</text>
    <rect x="240" y="305" width="40" height="44" fill="#2a7f8f"/>
    <rect x="280" y="305" width="200" height="44" fill="#6b4fa0"/><text x="380" y="333" fill="#fff">update README</text>
    <rect x="560" y="305" width="70" height="44" fill="#8a6a12"/><text x="595" y="333" fill="#fff">check</text>
  </g>
  <line x1="200" y1="395" x2="900" y2="395" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="900" y="425" font-size="17" fill="#555" text-anchor="end">time</text>
  <text x="660" y="285" font-size="17" fill="#2a7f8f">same work, done sooner;</text>
  <text x="660" y="307" font-size="17" fill="#2a7f8f">checks still one at a time</text>
  <!-- legend -->
  <g font-size="16" fill="#333">
    <rect x="620" y="170" width="20" height="20" fill="#2a7f8f"/><text x="648" y="186">you write the prompt</text>
    <rect x="620" y="198" width="20" height="20" fill="#6b4fa0"/><text x="648" y="214">agent works</text>
    <rect x="800" y="198" width="20" height="20" fill="#8a6a12"/><text x="828" y="214">you check</text>
  </g>
</svg>
