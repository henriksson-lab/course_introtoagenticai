<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <g font-size="19" fill="#1b2a3a">
    <!-- row 1 -->
    <rect x="30" y="24" width="940" height="128" rx="10" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
    <rect x="50" y="48" width="100" height="80" rx="8" fill="#1b2a3a"/>
    <text x="100" y="96" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="22">Mon</text>
    <text x="175" y="80">Reanalyse a public RNA-seq dataset of</text>
    <text x="175" y="106">host cells infected with influenza</text>
    <rect x="700" y="58" width="250" height="60" rx="8" fill="#2a7f8f"/>
    <text x="825" y="95" text-anchor="middle" fill="#ffffff" font-weight="bold">Done, no issue</text>
    <!-- row 2 -->
    <rect x="30" y="172" width="940" height="128" rx="10" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
    <rect x="50" y="196" width="100" height="80" rx="8" fill="#1b2a3a"/>
    <text x="100" y="244" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="22">Wed</text>
    <text x="175" y="228">Literature table on a virus family:</text>
    <text x="175" y="254">host range, outbreaks, key papers</text>
    <rect x="700" y="206" width="250" height="60" rx="8" fill="#8a6a12"/>
    <text x="825" y="243" text-anchor="middle" fill="#ffffff" font-weight="bold">Vaguer than usual</text>
    <!-- row 3 -->
    <rect x="30" y="320" width="940" height="128" rx="10" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
    <rect x="50" y="344" width="100" height="80" rx="8" fill="#1b2a3a"/>
    <text x="100" y="392" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="22">Fri</text>
    <text x="175" y="376">Handout on spill response for the</text>
    <text x="175" y="402">lab's biosafety induction</text>
    <rect x="700" y="354" width="250" height="60" rx="8" fill="#a8324a"/>
    <text x="825" y="391" text-anchor="middle" fill="#ffffff" font-weight="bold">Stopped partway</text>
  </g>
  <text x="500" y="500" text-anchor="middle" font-size="21" font-weight="bold" fill="#1b2a3a">All three tasks are legitimate. Two still met a biology guardrail.</text>
</svg>
