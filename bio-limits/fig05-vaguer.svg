<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <text x="250" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a7f8f">Usual answer (a benign topic)</text>
  <text x="750" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6a12">Vaguer answer (near the core)</text>
  <rect x="30" y="60" width="440" height="330" rx="10" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
  <rect x="530" y="60" width="440" height="330" rx="10" fill="#f4f7fa" stroke="#c9d3dc" stroke-width="2"/>
  <g fill="#9fb0bf">
    <rect x="55" y="90" width="380" height="14" rx="4"/>
    <rect x="55" y="116" width="340" height="14" rx="4"/>
    <rect x="55" y="152" width="20" height="14" rx="4" fill="#2a7f8f"/><rect x="85" y="152" width="330" height="14" rx="4"/>
    <rect x="55" y="180" width="20" height="14" rx="4" fill="#2a7f8f"/><rect x="85" y="180" width="300" height="14" rx="4"/>
    <rect x="55" y="208" width="20" height="14" rx="4" fill="#2a7f8f"/><rect x="85" y="208" width="340" height="14" rx="4"/>
    <rect x="55" y="236" width="20" height="14" rx="4" fill="#2a7f8f"/><rect x="85" y="236" width="280" height="14" rx="4"/>
    <rect x="55" y="264" width="20" height="14" rx="4" fill="#2a7f8f"/><rect x="85" y="264" width="320" height="14" rx="4"/>
    <rect x="55" y="300" width="370" height="14" rx="4"/>
    <rect x="55" y="326" width="250" height="14" rx="4"/>
    <rect x="555" y="90" width="380" height="14" rx="4"/>
    <rect x="555" y="116" width="300" height="14" rx="4"/>
  </g>
  <g font-size="17" fill="#3a4a5a">
    <text x="60" y="372">numbers, steps, named methods, sources</text>
    <text x="555" y="170">"This is an active research area."</text>
    <text x="555" y="198">"Methods vary between labs."</text>
    <text x="555" y="236">"For details, consult the primary</text>
    <text x="555" y="260">literature and your biosafety officer."</text>
  </g>
  <text x="500" y="436" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b2a3a">No refusal and no warning: just less detail. Easy to miss.</text>
  <text x="965" y="480" text-anchor="end" font-size="14" fill="#8a97a5">illustrative</text>
</svg>
