<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="540" fill="#ffffff"/>
  <rect x="120" y="16" width="760" height="500" rx="12" fill="#f4f7fa" stroke="#1b2a3a" stroke-width="2"/>
  <text x="500" y="58" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">Before an agent-written protocol reaches the bench</text>
  <g font-size="19" fill="#1b2a3a">
    <rect x="160" y="88" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="107">Every amount and concentration recalculated by hand</text>
    <rect x="160" y="138" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="157">Every chemical checked on its safety data sheet</text>
    <rect x="160" y="188" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="207">No incompatible chemicals mixed, also in waste</text>
    <rect x="160" y="238" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="257">Protective equipment, fume hood, waste steps present</text>
    <rect x="160" y="288" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="307">Every step has a reason; no invented extras</text>
    <rect x="160" y="338" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="357">Every cited standard, kit or paper looked up</text>
    <rect x="160" y="388" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="407">Compared with a published or in-house protocol</text>
    <rect x="160" y="438" width="24" height="24" rx="3" fill="#ffffff" stroke="#2a7f8f" stroke-width="2.5"/>
    <text x="200" y="457">Fits your lab's risk assessment; small pilot first</text>
  </g>
</svg>
