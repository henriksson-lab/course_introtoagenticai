<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">One character, a different experiment</text>
  <g font-size="22">
    <rect x="40" y="70" width="920" height="74" rx="8" fill="#f4f7fa"/>
    <text x="70" y="116" fill="#2a7f8f" font-weight="bold">10 µg/mL</text>
    <text x="270" y="116" fill="#3a4a5a">vs</text>
    <text x="330" y="116" fill="#a8324a" font-weight="bold">10 mg/mL</text>
    <text x="930" y="116" text-anchor="end" fill="#1b2a3a" font-size="20">1000 times more</text>
    <rect x="40" y="158" width="920" height="74" rx="8" fill="#f4f7fa"/>
    <text x="70" y="204" fill="#2a7f8f" font-weight="bold">0.1 mM</text>
    <text x="270" y="204" fill="#3a4a5a">vs</text>
    <text x="330" y="204" fill="#a8324a" font-weight="bold">0.1 M</text>
    <text x="930" y="204" text-anchor="end" fill="#1b2a3a" font-size="20">1000 times more</text>
    <rect x="40" y="246" width="920" height="74" rx="8" fill="#f4f7fa"/>
    <text x="70" y="292" fill="#2a7f8f" font-weight="bold">1x buffer</text>
    <text x="270" y="292" fill="#3a4a5a">vs</text>
    <text x="330" y="292" fill="#a8324a" font-weight="bold">10x buffer</text>
    <text x="930" y="292" text-anchor="end" fill="#1b2a3a" font-size="20">ten times stronger</text>
    <rect x="40" y="334" width="920" height="74" rx="8" fill="#f4f7fa"/>
    <text x="70" y="380" fill="#2a7f8f" font-weight="bold">70 % ethanol</text>
    <text x="270" y="380" fill="#3a4a5a">vs</text>
    <text x="330" y="380" fill="#a8324a" font-weight="bold">7 % ethanol</text>
    <text x="930" y="380" text-anchor="end" fill="#1b2a3a" font-size="20">no longer disinfects</text>
  </g>
  <text x="500" y="450" text-anchor="middle" font-size="19" fill="#3a4a5a">The model writes both versions with the same confidence. Recalculate every number.</text>
</svg>
