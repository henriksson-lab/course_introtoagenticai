<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" fill="#ffffff"/>
  <g stroke="#9fb0bf" stroke-width="3">
    <line x1="500" y1="250" x2="230" y2="100"/>
    <line x1="500" y1="250" x2="770" y2="100"/>
    <line x1="500" y1="250" x2="230" y2="400"/>
    <line x1="500" y1="250" x2="770" y2="400"/>
  </g>
  <rect x="340" y="200" width="320" height="100" rx="50" fill="#1b2a3a"/>
  <text x="500" y="244" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">A legitimate task the</text>
  <text x="500" y="270" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">agent will not help with</text>
  <g font-size="18" fill="#1b2a3a">
    <rect x="30" y="40" width="400" height="120" rx="10" fill="#e6f2f4" stroke="#2a7f8f" stroke-width="2"/>
    <text x="50" y="74" font-weight="bold" fill="#2a7f8f">Biosafety officer or committee</text>
    <text x="50" y="102">What may be done here, by whom,</text>
    <text x="50" y="126">under which approval</text>
    <rect x="570" y="40" width="400" height="120" rx="10" fill="#efeaf6" stroke="#6b4fa0" stroke-width="2"/>
    <text x="590" y="74" font-weight="bold" fill="#6b4fa0">Provider access programmes</text>
    <text x="590" y="102">For verified organisations, not</text>
    <text x="590" y="126">individuals (at the time of writing)</text>
    <rect x="30" y="340" width="400" height="120" rx="10" fill="#f4f7fa" stroke="#3a4a5a" stroke-width="2"/>
    <text x="50" y="374" font-weight="bold">Literature and colleagues</text>
    <text x="50" y="402">Published methods, protocol</text>
    <text x="50" y="426">repositories, the lab next door</text>
    <rect x="570" y="340" width="400" height="120" rx="10" fill="#fbf6ea" stroke="#8a6a12" stroke-width="2"/>
    <text x="590" y="374" font-weight="bold" fill="#8a6a12">Research security, export control</text>
    <text x="590" y="402">Dual-use rules can cover technical</text>
    <text x="590" y="426">information, not only materials</text>
  </g>
</svg>
