<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#2a7f8f"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#a8324a"/></marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <rect x="330" y="170" width="340" height="120" rx="12" fill="#1b2a3a"/>
  <text x="500" y="210" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">Knowledge of how a pathogen</text>
  <text x="500" y="236" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">or toxin works, spreads</text>
  <text x="500" y="262" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">and is handled</text>
  <g font-size="19" fill="#1b2a3a">
    <rect x="20" y="40" width="240" height="56" rx="8" fill="#e6f2f4" stroke="#2a7f8f" stroke-width="2"/>
    <text x="140" y="75" text-anchor="middle">Vaccines and drugs</text>
    <rect x="20" y="130" width="240" height="56" rx="8" fill="#e6f2f4" stroke="#2a7f8f" stroke-width="2"/>
    <text x="140" y="165" text-anchor="middle">Diagnostics</text>
    <rect x="20" y="220" width="240" height="56" rx="8" fill="#e6f2f4" stroke="#2a7f8f" stroke-width="2"/>
    <text x="140" y="255" text-anchor="middle">Outbreak response</text>
    <rect x="20" y="310" width="240" height="56" rx="8" fill="#e6f2f4" stroke="#2a7f8f" stroke-width="2"/>
    <text x="140" y="345" text-anchor="middle">Teaching and biosafety</text>
  </g>
  <g stroke="#2a7f8f" stroke-width="3" fill="none">
    <line x1="330" y1="200" x2="268" y2="72" marker-end="url(#t)"/>
    <line x1="330" y1="215" x2="268" y2="160" marker-end="url(#t)"/>
    <line x1="330" y1="240" x2="268" y2="248" marker-end="url(#t)"/>
    <line x1="330" y1="265" x2="268" y2="335" marker-end="url(#t)"/>
  </g>
  <line x1="670" y1="230" x2="752" y2="230" stroke="#a8324a" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#c)"/>
  <rect x="760" y="180" width="220" height="100" rx="8" fill="#f8eef0" stroke="#a8324a" stroke-width="2"/>
  <text x="870" y="222" text-anchor="middle" font-size="19" fill="#a8324a" font-weight="bold">Misuse:</text>
  <text x="870" y="250" text-anchor="middle" font-size="19" fill="#a8324a">making harm easier</text>
  <text x="500" y="430" text-anchor="middle" font-size="20" fill="#1b2a3a" font-weight="bold">The model cannot see who is asking or why.</text>
  <text x="500" y="462" text-anchor="middle" font-size="19" fill="#3a4a5a">It judges the request, and what the answer could be used for.</text>
</svg>
