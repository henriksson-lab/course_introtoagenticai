<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="430" fill="#fff"/>
  <g font-size="18">
    <!-- three machines -->
    <rect x="20" y="20" width="300" height="250" rx="10" fill="#f5f5f5" stroke="#888"/>
    <rect x="20" y="20" width="300" height="40" rx="10" fill="#555"/>
    <text x="170" y="47" fill="#fff" text-anchor="middle" font-weight="bold">Student laptop, Windows</text>
    <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#333">
      <text x="35" y="95">&gt; python fastq_stats.py</text>
      <text x="35" y="120" fill="#a8324a">'python' is not recognized</text>
      <text x="35" y="160">&gt; conda env create</text>
      <text x="35" y="185" fill="#a8324a">Solving environment: ...</text>
      <text x="35" y="210" fill="#a8324a">(20 minutes later) failed</text>
      <text x="35" y="250" fill="#8a6a12">Docker Desktop: needs admin</text>
    </g>
    <rect x="350" y="20" width="300" height="250" rx="10" fill="#f5f5f5" stroke="#888"/>
    <rect x="350" y="20" width="300" height="40" rx="10" fill="#555"/>
    <text x="500" y="47" fill="#fff" text-anchor="middle" font-weight="bold">Laptop, Apple M-series</text>
    <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#333">
      <text x="365" y="95">$ docker run lab/qc:1.2</text>
      <text x="365" y="120" fill="#8a6a12">WARNING: image platform</text>
      <text x="365" y="145" fill="#8a6a12">linux/amd64 does not match</text>
      <text x="365" y="170" fill="#8a6a12">host linux/arm64</text>
      <text x="365" y="210" fill="#a8324a">runs under emulation:</text>
      <text x="365" y="235" fill="#a8324a">slow</text>
    </g>
    <rect x="680" y="20" width="300" height="250" rx="10" fill="#f5f5f5" stroke="#888"/>
    <rect x="680" y="20" width="300" height="40" rx="10" fill="#555"/>
    <text x="830" y="47" fill="#fff" text-anchor="middle" font-weight="bold">University HPC cluster</text>
    <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#333">
      <text x="695" y="95">$ docker run lab/qc:1.2</text>
      <text x="695" y="120" fill="#a8324a">docker: command not found</text>
      <text x="695" y="160">(convert the image to</text>
      <text x="695" y="185">Apptainer, ask support</text>
      <text x="695" y="210">about the conda module)</text>
    </g>
  </g>
  <rect x="200" y="310" width="600" height="80" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="500" y="345" font-size="20" text-anchor="middle" font-weight="bold" fill="#2a7f8f">What we want: one file per system, double-click or run</text>
  <text x="500" y="373" font-size="18" text-anchor="middle" fill="#333">no Python, no Conda, no Docker on the machine that runs it</text>
  <text x="990" y="422" font-size="13" text-anchor="end" fill="#999">illustrative</text>
</svg>
