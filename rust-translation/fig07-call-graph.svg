<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="420" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#777"/></marker></defs>
  <text x="20" y="32" font-size="19" font-weight="bold" fill="#333">Call graph from static analysis (tree-sitter + CCC)</text>
  <g stroke="#777" stroke-width="2" marker-end="url(#a)">
    <line x1="360" y1="88" x2="230" y2="140"/><line x1="400" y1="88" x2="470" y2="140"/>
    <line x1="470" y1="182" x2="350" y2="236"/><line x1="510" y1="182" x2="610" y2="236"/>
    <line x1="350" y1="278" x2="350" y2="330"/><line x1="610" y1="278" x2="610" y2="330"/>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="17" text-anchor="middle">
    <rect x="320" y="48" width="120" height="40" rx="6" fill="#f5f5f5" stroke="#888"/><text x="380" y="74">main</text>
    <rect x="140" y="142" width="170" height="40" rx="6" fill="#f5f5f5" stroke="#888"/><text x="225" y="168">parse_args</text>
    <rect x="410" y="142" width="170" height="40" rx="6" fill="#f5f5f5" stroke="#888"/><text x="495" y="168">run_align</text>
    <rect x="265" y="238" width="170" height="40" rx="6" fill="#f5f5f5" stroke="#888"/><text x="350" y="264">load_index</text>
    <rect x="525" y="238" width="170" height="40" rx="6" fill="#f5f5f5" stroke="#888"/><text x="610" y="264">align_reads</text>
    <rect x="265" y="332" width="170" height="40" rx="6" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/><text x="350" y="358">decode_hdf5</text>
    <rect x="525" y="332" width="170" height="40" rx="6" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/><text x="610" y="358">score_chain</text>
  </g>
  <g font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="265" cy="332" r="14" fill="#2a7f8f"/><text x="265" y="338">1</text>
    <circle cx="525" cy="332" r="14" fill="#2a7f8f"/><text x="525" y="338">1</text>
    <circle cx="265" cy="238" r="14" fill="#8a6a12"/><text x="265" y="244">2</text>
    <circle cx="525" cy="238" r="14" fill="#8a6a12"/><text x="525" y="244">2</text>
    <circle cx="140" cy="142" r="14" fill="#8a6a12"/><text x="140" y="148">2</text>
    <circle cx="410" cy="142" r="14" fill="#6b4fa0"/><text x="410" y="148">3</text>
    <circle cx="320" cy="48" r="14" fill="#a8324a"/><text x="320" y="54">4</text>
  </g>
  <g font-size="18" fill="#333">
    <text x="740" y="110">Translate <tspan font-weight="bold">bottom-up</tspan>:</text>
    <text x="740" y="145">1 leaves first, tested</text>
    <text x="760" y="170">on their own</text>
    <text x="740" y="205">2, 3 then the functions</text>
    <text x="760" y="230">that call them</text>
    <text x="740" y="265">4 main last</text>
    <text x="740" y="320" fill="#2a7f8f">Same-numbered pieces</text>
    <text x="740" y="345" fill="#2a7f8f">can go to parallel</text>
    <text x="740" y="370" fill="#2a7f8f">agents</text>
  </g>
  <text x="990" y="412" font-size="13" text-anchor="end" fill="#888">After Henriksson 2026, Fig. 1a, arXiv:2608.13029, CC BY 4.0</text>
</svg>
