  <text x="500" y="285" font-size="19" text-anchor="middle" fill="#333">The paper's "idealized steps". Correctness (1 to 4) comes before speed (5).</text>
  <text x="990" y="322" font-size="13" text-anchor="end" fill="#888">Steps from Henriksson 2026, arXiv:2608.13029, CC BY 4.0</text>
