  <text x="500" y="305" font-size="19" text-anchor="middle" fill="#333">Same input, different output: the bug is inside score_pair, not somewhere downstream.</text>
  <text x="500" y="332" font-size="17" text-anchor="middle" fill="#555">tracehash records a short fingerprint (hash) of what goes into and out of every function call.</text>
