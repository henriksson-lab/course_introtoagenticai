<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <g font-size="17" text-anchor="middle">
    <rect x="10" y="30" width="180" height="120" rx="10" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/><text x="100" y="65" font-weight="bold" fill="#a8324a">original</text><text x="100" y="92">locked, the</text><text x="100" y="114">specification</text>
    <rect x="210" y="30" width="180" height="120" rx="10" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/><text x="300" y="65" font-weight="bold" fill="#8a6a12">reference</text><text x="300" y="92">outputs on many</text><text x="300" y="114">inputs + edge cases</text>
    <rect x="410" y="30" width="180" height="120" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/><text x="500" y="65" font-weight="bold">scaffold</text><text x="500" y="92">map, call graph,</text><text x="500" y="114">one stub per function</text>
    <rect x="610" y="30" width="180" height="120" rx="10" fill="#fbe9ea" stroke="#a8324a" stroke-width="2"/><text x="700" y="65" font-weight="bold">translate</text><text x="700" y="92">bottom-up,</text><text x="700" y="114">faithfully</text>
    <rect x="810" y="30" width="180" height="120" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/><text x="900" y="65" font-weight="bold" fill="#2a7f8f">compare</text><text x="900" y="92">exactly, on every</text><text x="900" y="114">reference input</text>
    <rect x="810" y="210" width="180" height="110" rx="10" fill="#f5efdd" stroke="#8a6a12" stroke-width="2"/><text x="900" y="245" font-weight="bold" fill="#8a6a12">benchmark</text><text x="900" y="272">fairly: time</text><text x="900" y="294">and memory</text>
    <rect x="610" y="210" width="180" height="110" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/><text x="700" y="245" font-weight="bold" fill="#2a7f8f">release</text><text x="700" y="272">binary, README,</text><text x="700" y="294">licence, credit</text>
  </g>
  <g stroke="#555" stroke-width="2.5" marker-end="url(#a)"><line x1="192" y1="90" x2="206" y2="90"/><line x1="392" y1="90" x2="406" y2="90"/><line x1="592" y1="90" x2="606" y2="90"/><line x1="792" y1="90" x2="806" y2="90"/><line x1="900" y1="152" x2="900" y2="206"/><line x1="808" y1="265" x2="794" y2="265"/></g>
  <path d="M860,152 C820,190 740,190 712,155" fill="none" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#a)"/>
  <text x="400" y="245" font-size="18" text-anchor="middle" fill="#333">The first two boxes are the recipe from</text>
  <text x="400" y="270" font-size="18" text-anchor="middle" fill="#333">"Reading other people's code".</text>
  <text x="400" y="300" font-size="18" text-anchor="middle" fill="#a8324a">Any difference: fix the port, never the reference.</text>
</svg>
