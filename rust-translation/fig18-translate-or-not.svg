<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <g font-size="17" text-anchor="middle">
    <rect x="20" y="20" width="300" height="70" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/><text x="170" y="50">Is it slow, run often, or</text><text x="170" y="73">hard to install for others?</text>
    <rect x="20" y="130" width="300" height="70" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/><text x="170" y="160">Can you get reference</text><text x="170" y="183">outputs on real inputs?</text>
    <rect x="20" y="240" width="300" height="70" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/><text x="170" y="270">Does the licence allow a</text><text x="170" y="293">derived version? Credit planned?</text>
    <rect x="20" y="350" width="300" height="70" rx="10" fill="#f5f5f5" stroke="#888" stroke-width="2"/><text x="170" y="380">Is the original stable, or will</text><text x="170" y="403">you keep up with its changes?</text>
    <rect x="420" y="20" width="270" height="70" rx="10" fill="#fbe9ea" stroke="#a8324a"/><text x="555" y="50">Leave it. A one-off script</text><text x="555" y="73">is fine as it is.</text>
    <rect x="420" y="130" width="270" height="70" rx="10" fill="#fbe9ea" stroke="#a8324a"/><text x="555" y="160">Not yet: get reference</text><text x="555" y="183">outputs first (see last unit)</text>
    <rect x="420" y="240" width="270" height="70" rx="10" fill="#fbe9ea" stroke="#a8324a"/><text x="555" y="270">Ask the authors first;</text><text x="555" y="293">no permission, no port</text>
    <rect x="420" y="350" width="270" height="70" rx="10" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="3"/><text x="555" y="380" font-weight="bold" fill="#2a7f8f">Translate</text><text x="555" y="403" fill="#2a7f8f">with the workflow</text>
    <rect x="720" y="350" width="260" height="70" rx="10" fill="#fbe9ea" stroke="#a8324a"/><text x="850" y="380">changing fast: wait, or ask</text><text x="850" y="403">the authors to move together</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="170" y1="92" x2="170" y2="126"/><line x1="170" y1="202" x2="170" y2="236"/><line x1="170" y1="312" x2="170" y2="346"/>
    <line x1="322" y1="55" x2="416" y2="55"/><line x1="322" y1="165" x2="416" y2="165"/><line x1="322" y1="275" x2="416" y2="275"/><line x1="322" y1="385" x2="416" y2="385"/>
  </g>
  <g font-size="16" fill="#555"><text x="180" y="116">yes</text><text x="180" y="226">yes</text><text x="180" y="336">yes</text><text x="340" y="48">no</text><text x="340" y="158">no</text><text x="340" y="268">no</text><text x="340" y="378">stable</text></g>
</svg>
