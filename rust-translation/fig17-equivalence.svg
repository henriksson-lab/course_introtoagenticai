<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
  <text x="140" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#333">many inputs</text>
  <g font-size="16" text-anchor="middle">
    <rect x="30" y="45" width="220" height="50" rx="6" fill="#e3f1f3" stroke="#2a7f8f"/><text x="140" y="76">real data (several sets)</text>
    <rect x="30" y="105" width="220" height="50" rx="6" fill="#f5efdd" stroke="#8a6a12"/><text x="140" y="136">edge cases: empty, broken</text>
    <rect x="30" y="165" width="220" height="50" rx="6" fill="#efeaf7" stroke="#6b4fa0"/><text x="140" y="196">generated: 100 random files</text>
    <rect x="30" y="225" width="220" height="50" rx="6" fill="#f5f5f5" stroke="#888"/><text x="140" y="256">every option (--k 1, 5, 31)</text>
  </g>
  <rect x="340" y="60" width="200" height="70" rx="8" fill="#f6e4e8" stroke="#a8324a" stroke-width="2"/><text x="440" y="102" font-size="18" text-anchor="middle">original</text>
  <rect x="340" y="175" width="200" height="70" rx="8" fill="#fbe9ea" stroke="#a8324a" stroke-width="2"/><text x="440" y="217" font-size="18" text-anchor="middle">Rust port</text>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)"><line x1="252" y1="150" x2="336" y2="100"/><line x1="252" y1="170" x2="336" y2="208"/><line x1="542" y1="95" x2="626" y2="140"/><line x1="542" y1="210" x2="626" y2="170"/></g>
  <rect x="630" y="110" width="160" height="90" rx="8" fill="#e3f1f3" stroke="#2a7f8f" stroke-width="2"/>
  <text x="710" y="148" font-size="18" text-anchor="middle" font-weight="bold" fill="#2a7f8f">compare</text>
  <text x="710" y="175" font-size="16" text-anchor="middle">byte by byte</text>
  <g font-size="17" fill="#333"><text x="815" y="120">output</text><text x="815" y="145">error message</text><text x="815" y="170">exit code</text></g>
  <text x="500" y="320" font-size="18" text-anchor="middle" fill="#333">Golden files: saved outputs of the original, kept as the answer key.</text>
  <text x="500" y="348" font-size="18" text-anchor="middle" fill="#333">Property test: "for any generated input, both give the same answer", tried on many inputs.</text>
</svg>
