<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="440" fill="#fff"/>
  <rect x="20" y="10" width="960" height="400" rx="10" fill="#1f2430"/>
  <circle cx="45" cy="32" r="7" fill="#e06c75"/><circle cx="67" cy="32" r="7" fill="#e5c07b"/><circle cx="89" cy="32" r="7" fill="#98c379"/>
  <g font-family="Consolas, Menlo, monospace" font-size="17" fill="#d7dae0">
    <text x="45" y="72" fill="#61afef">$ python compare.py</text>
    <text x="45" y="100">PASS</text><text x="110" y="100">reads.fastq</text><text x="420" y="100">k=5, k=7</text>
    <text x="45" y="124">PASS</text><text x="110" y="124">tiny.fastq</text><text x="420" y="124">k=5, k=7</text>
    <text x="45" y="148">PASS</text><text x="110" y="148">empty.fastq</text><text x="420" y="148">k=5, k=7</text>
    <text x="45" y="172">PASS</text><text x="110" y="172">truncated.fastq</text><text x="420" y="172">exit 1, same error message</text>
    <text x="45" y="196">PASS</text><text x="110" y="196">all_n, windows_line_endings, no_final_newline</text>
    <text x="45" y="220">PASS</text><text x="110" y="220">40 generated runs (seeds 1-20, k=5 and k=7)</text>
    <text x="45" y="248" fill="#98c379">54 comparisons: 54 passed, 0 failed (stdout, stderr, exit code)</text>
    <text x="45" y="292" fill="#61afef">$ cat BENCHMARK.md   # 1,000,000 reads, median of 3 runs</text>
    <text x="45" y="320">program</text><text x="340" y="320" text-anchor="end">time</text><text x="420" y="320">peak memory</text>
    <text x="45" y="346">Python original</text><text x="340" y="346" text-anchor="end">164.6 s</text><text x="420" y="346">13 MB</text>
    <g fill="#e5c07b"><text x="45" y="372">Rust release</text><text x="340" y="372" text-anchor="end">8.8 s</text><text x="420" y="372">3 MB</text><text x="560" y="372">about 19x faster</text></g>
  </g>
  <text x="980" y="432" font-size="13" text-anchor="end" fill="#999">illustrative layout; numbers from our test run (Intel Xeon Gold 6138, Linux)</text>
</svg>
