<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="380" fill="#fff"/>
  <g font-size="16" fill="#333">
    <rect x="20" y="25" width="22" height="22" fill="#5b9bd5"/><text x="50" y="42">start program</text>
    <rect x="190" y="25" width="22" height="22" fill="#70ad47"/><text x="220" y="42">load database</text>
    <rect x="360" y="25" width="22" height="22" fill="#e0b400"/><text x="390" y="42">read input file</text>
    <rect x="530" y="25" width="22" height="22" fill="#c0392b"/><text x="560" y="42">process one cell</text>
    <rect x="720" y="25" width="22" height="22" fill="#7d4fa0"/><text x="750" y="42">write output file</text>
  </g>
  <text x="20" y="100" font-size="19" font-weight="bold" fill="#333">Tool called once per cell</text>
  <g>
    <rect x="20" y="115" width="30" height="40" fill="#5b9bd5"/><rect x="50" y="115" width="110" height="40" fill="#70ad47"/><rect x="160" y="115" width="15" height="40" fill="#e0b400"/><rect x="175" y="115" width="25" height="40" fill="#c0392b"/><rect x="200" y="115" width="12" height="40" fill="#7d4fa0"/>
    <rect x="216" y="115" width="30" height="40" fill="#5b9bd5"/><rect x="246" y="115" width="110" height="40" fill="#70ad47"/><rect x="356" y="115" width="15" height="40" fill="#e0b400"/><rect x="371" y="115" width="25" height="40" fill="#c0392b"/><rect x="396" y="115" width="12" height="40" fill="#7d4fa0"/>
    <rect x="412" y="115" width="30" height="40" fill="#5b9bd5"/><rect x="442" y="115" width="110" height="40" fill="#70ad47"/><rect x="552" y="115" width="15" height="40" fill="#e0b400"/><rect x="567" y="115" width="25" height="40" fill="#c0392b"/><rect x="592" y="115" width="12" height="40" fill="#7d4fa0"/>
  </g>
  <text x="620" y="142" font-size="18" fill="#333">… for every one of millions of cells</text>
  <text x="20" y="215" font-size="19" font-weight="bold" fill="#333">Translated tool used as a library</text>
  <g>
    <rect x="20" y="230" width="30" height="40" fill="#5b9bd5"/><rect x="50" y="230" width="110" height="40" fill="#70ad47"/>
    <rect x="160" y="230" width="25" height="40" fill="#c0392b"/><rect x="186" y="230" width="25" height="40" fill="#c0392b"/><rect x="212" y="230" width="25" height="40" fill="#c0392b"/><rect x="238" y="230" width="25" height="40" fill="#c0392b"/><rect x="264" y="230" width="25" height="40" fill="#c0392b"/>
  </g>
  <text x="310" y="257" font-size="18" fill="#333">load once, then only the work that matters, with data passed in memory</text>
  <text x="500" y="325" font-size="18" text-anchor="middle" fill="#333">The paper's arithmetic: 100 million cells x 1 s start-up each = 1,157 days of just starting programs.</text>
  <text x="990" y="370" font-size="13" text-anchor="end" fill="#888">After Henriksson 2026, Fig. 3b, arXiv:2608.13029, CC BY 4.0</text>
</svg>
