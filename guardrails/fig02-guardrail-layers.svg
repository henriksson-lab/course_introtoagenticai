<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <!-- you -->
  <rect x="20" y="200" width="110" height="80" rx="10" fill="#1b2a3a"/>
  <text x="75" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">You</text>
  <line x1="130" y1="240" x2="168" y2="240" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- harness: your computer -->
  <rect x="174" y="60" width="250" height="360" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2.5"/>
  <text x="299" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a7f8f">Agent harness</text>
  <text x="299" y="116" text-anchor="middle" font-size="16" fill="#2a7f8f">on your computer</text>
  <g font-size="17" fill="#1b2a3a">
    <text x="196" y="170">• permission prompts</text>
    <text x="196" y="204">• sandbox</text>
    <text x="196" y="238">• network on / off</text>
    <text x="196" y="272">• protected folders</text>
  </g>
  <rect x="192" y="330" width="214" height="70" rx="8" fill="#2a7f8f"/>
  <text x="299" y="360" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">You control these</text>
  <text x="299" y="384" text-anchor="middle" font-size="16" fill="#fff">(settings)</text>
  <line x1="424" y1="240" x2="462" y2="240" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- provider -->
  <rect x="468" y="20" width="512" height="440" rx="12" fill="#f4f1f9" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="724" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b4fa0">Provider's servers</text>
  <!-- classifier ring -->
  <rect x="496" y="72" width="456" height="250" rx="12" fill="#fbeef1" stroke="#a8324a" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="724" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#a8324a">Safety classifiers</text>
  <text x="724" y="126" text-anchor="middle" font-size="16" fill="#a8324a">check what goes in and what comes out</text>
  <rect x="580" y="150" width="288" height="150" rx="12" fill="#ffffff" stroke="#6b4fa0" stroke-width="2.5"/>
  <text x="724" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#6b4fa0">The model</text>
  <text x="724" y="222" text-anchor="middle" font-size="17" fill="#1b2a3a">trained to refuse, to add</text>
  <text x="724" y="246" text-anchor="middle" font-size="17" fill="#1b2a3a">caveats, or to answer</text>
  <text x="724" y="270" text-anchor="middle" font-size="17" fill="#1b2a3a">only the safe part</text>
  <!-- account -->
  <rect x="496" y="340" width="456" height="100" rx="12" fill="#fbf6e8" stroke="#8a6a12" stroke-width="2.5"/>
  <text x="724" y="376" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6a12">Account: usage policy</text>
  <text x="724" y="402" text-anchor="middle" font-size="16" fill="#1b2a3a">warnings, restricted features, suspension</text>
  <text x="724" y="424" text-anchor="middle" font-size="16" fill="#1b2a3a">for repeated violations</text>
  <!-- not guardrails -->
  <rect x="20" y="478" width="960" height="62" rx="10" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="2"/>
  <text x="500" y="506" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a4a5a">Not guardrails, but often mistaken for them:</text>
  <text x="500" y="530" text-anchor="middle" font-size="17" fill="#3a4a5a">usage and rate limits, a full context window, network errors</text>
</svg>
