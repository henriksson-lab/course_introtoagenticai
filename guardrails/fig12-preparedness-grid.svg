<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <!-- header -->
  <text x="150" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Tracked category</text>
  <rect x="300" y="14" width="330" height="70" rx="8" fill="#8a6a12"/>
  <text x="465" y="44" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">High</text>
  <text x="465" y="68" text-anchor="middle" font-size="16" fill="#fff">amplifies existing paths to severe harm</text>
  <rect x="650" y="14" width="330" height="70" rx="8" fill="#a8324a"/>
  <text x="815" y="44" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff">Critical</text>
  <text x="815" y="68" text-anchor="middle" font-size="16" fill="#fff">opens new paths to severe harm</text>
  <!-- rows -->
  <g font-size="17" fill="#1b2a3a">
    <rect x="20" y="100" width="260" height="90" rx="8" fill="#f4f7fa" stroke="#9aa5b1"/>
    <text x="40" y="140" font-weight="bold">Biological and</text>
    <text x="40" y="164" font-weight="bold">chemical</text>
    <rect x="300" y="100" width="330" height="90" rx="8" fill="#fbf6e8" stroke="#8a6a12"/>
    <text x="320" y="132">treated as reached for the most</text>
    <text x="320" y="156">capable models since 2025</text>
    <text x="320" y="180" fill="#3a4a5a" font-size="16">(precaution; bio safeguards on)</text>
    <rect x="650" y="100" width="330" height="90" rx="8" fill="#ffffff" stroke="#c9d2da"/>
    <rect x="20" y="206" width="260" height="90" rx="8" fill="#f4f7fa" stroke="#9aa5b1"/>
    <text x="40" y="256" font-weight="bold">Cybersecurity</text>
    <rect x="300" y="206" width="330" height="90" rx="8" fill="#fbf6e8" stroke="#8a6a12"/>
    <text x="320" y="246">recent models assessed at High</text>
    <rect x="650" y="206" width="330" height="90" rx="8" fill="#fbeef1" stroke="#a8324a"/>
    <text x="670" y="238">Aug 2026: "cannot rule out"</text>
    <text x="670" y="262">Critical for an upcoming model;</text>
    <text x="670" y="286">work on it partly paused</text>
    <rect x="20" y="312" width="260" height="90" rx="8" fill="#f4f7fa" stroke="#9aa5b1"/>
    <text x="40" y="352" font-weight="bold">AI self-</text>
    <text x="40" y="376" font-weight="bold">improvement</text>
    <rect x="300" y="312" width="330" height="90" rx="8" fill="#ffffff" stroke="#c9d2da"/>
    <rect x="650" y="312" width="330" height="90" rx="8" fill="#ffffff" stroke="#c9d2da"/>
  </g>
  <text x="500" y="436" text-anchor="middle" font-size="16" fill="#3a4a5a">Research categories (watched, no thresholds yet): long-range autonomy, sandbagging, autonomous replication,</text>
  <text x="500" y="458" text-anchor="middle" font-size="16" fill="#3a4a5a">undermining safeguards, nuclear and radiological.   Source: OpenAI Preparedness Framework v2 (April 2025) and OpenAI posts.</text>
</svg>
