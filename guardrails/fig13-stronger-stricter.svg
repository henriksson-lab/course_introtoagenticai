<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <!-- three columns -->
  <g>
    <text x="165" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4fa0">Most capable model</text>
    <rect x="30" y="56" width="270" height="250" rx="12" fill="#fbeef1" stroke="#a8324a" stroke-width="5"/>
    <rect x="70" y="96" width="190" height="170" rx="10" fill="#6b4fa0"/>
    <text x="165" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">strong model</text>
    <text x="165" y="200" text-anchor="middle" font-size="16" fill="#fff">+ trained refusals</text>
    <text x="165" y="80" text-anchor="middle" font-size="16" fill="#a8324a" font-weight="bold">strict classifiers</text>
  </g>
  <g>
    <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#6b4fa0">Smaller or older model</text>
    <rect x="365" y="56" width="270" height="250" rx="12" fill="#fdf6f7" stroke="#a8324a" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="425" y="116" width="150" height="130" rx="10" fill="#9b86c4"/>
    <text x="500" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">weaker</text>
    <text x="500" y="200" text-anchor="middle" font-size="16" fill="#fff">+ trained refusals</text>
    <text x="500" y="80" text-anchor="middle" font-size="16" fill="#a8324a">lighter classifiers</text>
  </g>
  <g>
    <text x="835" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2a7f8f">Open-weights model</text>
    <rect x="700" y="56" width="270" height="250" rx="12" fill="#ffffff" stroke="#c9d2da" stroke-width="2"/>
    <rect x="750" y="106" width="170" height="150" rx="10" fill="#2a7f8f"/>
    <text x="835" y="176" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">your copy</text>
    <text x="835" y="200" text-anchor="middle" font-size="16" fill="#fff">+ trained refusals</text>
    <text x="835" y="80" text-anchor="middle" font-size="16" fill="#3a4a5a">no provider around it</text>
  </g>
  <g font-size="17" fill="#1b2a3a">
    <text x="165" y="340" text-anchor="middle">may stop a request that</text>
    <text x="165" y="364" text-anchor="middle">a weaker model answers</text>
    <text x="500" y="340" text-anchor="middle">fewer false alarms,</text>
    <text x="500" y="364" text-anchor="middle">less capable answers</text>
    <text x="835" y="340" text-anchor="middle">no classifier, no account;</text>
    <text x="835" y="364" text-anchor="middle">refusals can be removed</text>
  </g>
  <text x="500" y="420" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Fewer outside guardrails shift the responsibility to you and your institution.</text>
</svg>
