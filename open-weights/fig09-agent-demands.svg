<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker></defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <!-- loop -->
  <g font-size="17" text-anchor="middle">
    <rect x="390" y="30" width="220" height="64" rx="10" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/><text x="500" y="68" fill="#1b2a3a" font-weight="bold">model decides</text>
    <rect x="660" y="170" width="220" height="64" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/><text x="770" y="208" fill="#1b2a3a" font-weight="bold">tool call</text>
    <rect x="390" y="310" width="220" height="64" rx="10" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/><text x="500" y="348" fill="#1b2a3a" font-weight="bold">result comes back</text>
    <rect x="120" y="170" width="220" height="64" rx="10" fill="#f4f7fa" stroke="#9aa8b5" stroke-width="2"/><text x="230" y="208" fill="#1b2a3a" font-weight="bold">context grows</text>
  </g>
  <path d="M612,70 C700,80 760,120 770,164" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M770,236 C760,290 690,330 616,340" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M388,340 C300,330 240,290 230,240" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230,168 C240,120 300,80 384,70" fill="none" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <!-- demands -->
  <g font-size="15" fill="#a8324a">
    <text x="640" y="40">keep the goal in mind</text><text x="640" y="60">over 50 steps</text>
    <text x="800" y="268">exact tool-call</text><text x="800" y="288">format, every time</text>
    <text x="640" y="400">read errors, change plan</text>
    <text x="30" y="140">handle long files without</text><text x="30" y="160">losing early details</text>
  </g>
  <text x="500" y="200" text-anchor="middle" font-size="16" fill="#3a4a5a">each slip</text>
  <text x="500" y="222" text-anchor="middle" font-size="16" fill="#3a4a5a">repeats every turn</text>
</svg>
