<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto"><path d="M0,0 L7.5,3.4 L0,6.8 Z" fill="#1b2a3a"/></marker></defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <!-- closed -->
  <text x="245" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#6b4fa0">Closed model</text>
  <text x="245" y="64" text-anchor="middle" font-size="16" fill="#3a4a5a">Claude, GPT, Gemini</text>
  <rect x="40" y="84" width="410" height="220" rx="12" fill="#f3f0f8" stroke="#6b4fa0" stroke-width="2"/>
  <text x="245" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b4fa0">Provider's data centre</text>
  <rect x="150" y="134" width="190" height="80" rx="8" fill="#ffffff" stroke="#6b4fa0"/>
  <text x="245" y="168" text-anchor="middle" font-size="17" fill="#1b2a3a">weights file</text>
  <text x="245" y="192" text-anchor="middle" font-size="15" fill="#6b4fa0">secret, never leaves</text>
  <text x="245" y="250" text-anchor="middle" font-size="16" fill="#1b2a3a">You send text in and</text>
  <text x="245" y="272" text-anchor="middle" font-size="16" fill="#1b2a3a">get text back (a service)</text>
  <line x1="245" y1="370" x2="245" y2="310" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="245" y="396" text-anchor="middle" font-size="17" fill="#1b2a3a">your prompt and files travel to it</text>
  <!-- open -->
  <text x="755" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#2a7f8f">Open-weights model</text>
  <text x="755" y="64" text-anchor="middle" font-size="16" fill="#3a4a5a">Llama, Qwen, Mistral, Gemma, gpt-oss</text>
  <rect x="560" y="84" width="400" height="90" rx="12" fill="#eef6f7" stroke="#2a7f8f" stroke-width="2"/>
  <text x="760" y="118" text-anchor="middle" font-size="17" fill="#1b2a3a">weights file, published for download</text>
  <text x="760" y="146" text-anchor="middle" font-size="15" fill="#2a7f8f">e.g. a 5 GB file for a small model</text>
  <g font-size="16" fill="#1b2a3a" text-anchor="middle">
    <rect x="560" y="230" width="124" height="74" rx="8" fill="#ffffff" stroke="#2a7f8f"/><text x="622" y="262">a company's</text><text x="622" y="284">cloud</text>
    <rect x="698" y="230" width="124" height="74" rx="8" fill="#ffffff" stroke="#2a7f8f"/><text x="760" y="262">your</text><text x="760" y="284">university</text>
    <rect x="836" y="230" width="124" height="74" rx="8" fill="#ffffff" stroke="#2a7f8f"/><text x="898" y="262">your own</text><text x="898" y="284">computer</text>
  </g>
  <line x1="700" y1="176" x2="630" y2="224" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="176" x2="760" y2="224" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="820" y1="176" x2="890" y2="224" stroke="#1b2a3a" stroke-width="2" marker-end="url(#a)"/>
  <text x="760" y="352" text-anchor="middle" font-size="17" fill="#1b2a3a">anyone may copy it and run it</text>
  <text x="760" y="378" text-anchor="middle" font-size="17" fill="#1b2a3a">wherever they choose</text>
  <line x1="505" y1="30" x2="505" y2="400" stroke="#c5cfd8" stroke-width="2"/>
</svg>
